repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: uv run --extra dev mypy --strict src/vibey
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: lint-imports
        name: import-linter onion contract
        entry: uv run --extra dev lint-imports
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: coverage-gates
        # Runs the whole suite ONCE and gates the four layers on that run. `test-suite`
        # used to run the same suite again beforehand without coverage: measured at 147s
        # against 147s WITH coverage, so the instrumentation was free and the second run
        # was pure duplication -- half the pre-push time, on every push of every branch,
        # for a strictly smaller measurement (12.g).
        #
        # It was kept once so a plain test failure read as itself rather than as a
        # coverage failure. That reason survives in the name rather than in a second run:
        # `&&` short-circuits, so a failing test still prints FAILED and the coverage
        # reports never run.
        name: test suite, then per-layer 100% coverage gates
        entry: bash -c 'uv run --extra dev pytest -q -p no:cacheprovider --cov=vibey --cov-branch --cov-report= && uv run --extra dev coverage report --include="src/vibey/domain/*" --fail-under=100 && uv run --extra dev coverage report --include="src/vibey/application/*" --fail-under=100 && uv run --extra dev coverage report --include="src/vibey/infrastructure/*" --fail-under=100 && uv run --extra dev coverage report --include="src/vibey/cli/*" --fail-under=100'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: bandit
        name: bandit
        entry: uv run --extra dev bandit -q -r src/vibey
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pip-audit
        name: pip-audit
        entry: uv run --extra dev pip-audit
        language: system
        pass_filenames: false
        stages: [pre-push]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
