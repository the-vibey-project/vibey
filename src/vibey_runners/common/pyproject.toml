[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibey-runners-common"
version = "0.4.0"
description = "Shared application-layer interfaces and use cases genuinely common to the claudeloop/codexloop session-runner family."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adam Matthew Steinberger", email = "adam@matthewsteinberger.com" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/the-vibey-project/claudeloop"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.10",
    "ruff>=0.6",
    "import-linter>=2.0",
    "hypothesis>=6.100",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vibey_runners"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# E501 only, and only because of the provenance header. See the sibling
# runners' pyproject.toml for the full rationale — the same fixed-width
# comment is carried here for consistency across the family.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["vibey_runners.common"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src/vibey_runners/common"]

[tool.importlinter]
# The top-level package, not `vibey_runners.common`. grimp builds its graph from a
# top-level package only; given the dotted name, it raised NotATopLevelModule and
# lint-imports exited 1 before evaluating either contract below. Neither had ever been
# checked, and nothing noticed, because nothing ran it (#263). The contracts still name
# `vibey_runners.common`, and the root just has to contain it.
root_package = "vibey_runners"
include_external_packages = true

# This package is the bottom of the onion for every runner that depends on
# it: it declares seams and orchestrates use cases against them, but it must
# never import any concrete runner's infrastructure/cli/bootstrap, or it
# would stop being shared and start being a hidden dependency on one vendor.
[[tool.importlinter.contracts]]
name = "Shared code depends on no concrete runner"
type = "forbidden"
source_modules = ["vibey_runners.common"]
forbidden_modules = [
    "claudeloop",
    "codexloop",
    "qwenloop",
]

[[tool.importlinter.contracts]]
name = "Interfaces declare seams, never consume them"
type = "forbidden"
source_modules = [
    "vibey_runners.common.application.interfaces",
    "vibey_runners.common.infrastructure.interfaces",
]
forbidden_modules = [
    "vibey_runners.common.application.usecases",
    "vibey_runners.common.infrastructure.memory_probe",
]

# The JSON-RPC 2.0 codec and peer, moved here from vibey so vibey's MCP server and ACP agent and
# the local runner's MCP client speak through one implementation (SP-LOOPS Phase 5 R1). Its
# seams may name `errors` (the vocabulary), never the classes that implement them.
[[tool.importlinter.contracts]]
name = "JSON-RPC interfaces declare seams, never consume them"
type = "forbidden"
source_modules = ["vibey_runners.common.jsonrpc.interfaces"]
forbidden_modules = [
    "vibey_runners.common.jsonrpc.codec",
    "vibey_runners.common.jsonrpc.peer",
]

# The MCP client over that peer (SP-LOOPS Phase 5 R2): its seams may name the records their
# signatures carry (`mcp_tool`, `mcp_call_result`, `http_reply`) and the trust level, never the
# classes that implement them.
[[tool.importlinter.contracts]]
name = "MCP interfaces declare seams, never consume them"
type = "forbidden"
source_modules = ["vibey_runners.common.mcp.interfaces"]
forbidden_modules = [
    "vibey_runners.common.mcp.stdio_transport",
    "vibey_runners.common.mcp.http_transport",
    "vibey_runners.common.mcp.http_opener",
    "vibey_runners.common.mcp.mcp_transport_factory",
    "vibey_runners.common.mcp.mcp_session",
    "vibey_runners.common.mcp.mcp_session_pool",
]

# The loop capability layer (SP-LOOPS): its seams may name the records their signatures
# carry (the `*_spec`, entry and catalog modules), never the classes that implement them.
[[tool.importlinter.contracts]]
name = "Capability interfaces declare seams, never consume them"
type = "forbidden"
source_modules = ["vibey_runners.common.capabilities.interfaces"]
forbidden_modules = [
    "vibey_runners.common.capabilities.bundle",
    "vibey_runners.common.capabilities.file_reader",
    "vibey_runners.common.capabilities.frontmatter",
    "vibey_runners.common.capabilities.git_folder_guard",
    "vibey_runners.common.capabilities.lock",
    "vibey_runners.common.capabilities.manifest",
    "vibey_runners.common.capabilities.path_probe",
    "vibey_runners.common.capabilities.resolver",
    "vibey_runners.common.capabilities.safe_text",
    "vibey_runners.common.capabilities.scrubbed_exec",
    "vibey_runners.common.capabilities.scrubbed_launch",
    "vibey_runners.common.capabilities.skill_index",
    "vibey_runners.common.capabilities.snapshot_copier",
    "vibey_runners.common.capabilities.snapshot_document",
    "vibey_runners.common.capabilities.snapshot_document_store",
]
