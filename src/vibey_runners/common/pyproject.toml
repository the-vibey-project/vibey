[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibey-runners-common"
version = "0.1.0"
description = "Shared application-layer interfaces and use cases genuinely common to the claudeloop/codexloop/cursorloop/agyloop session-runner family."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adam Matthew Steinberger", email = "adam@matthewsteinberger.com" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/the-vibey-project/claudeloop"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.10",
    "ruff>=0.6",
    "import-linter>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vibey_runners"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# E501 only, and only because of the provenance header. See the sibling
# runners' pyproject.toml for the full rationale — the same fixed-width
# comment is carried here for consistency across the family.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["vibey_runners.common"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src/vibey_runners/common"]

[tool.importlinter]
# The top-level package, not `vibey_runners.common`. grimp builds its graph from a
# top-level package only; given the dotted name, it raised NotATopLevelModule and
# lint-imports exited 1 before evaluating either contract below. Neither had ever been
# checked, and nothing noticed, because nothing ran it (#263). The contracts still name
# `vibey_runners.common`, and the root just has to contain it.
root_package = "vibey_runners"
include_external_packages = true

# This package is the bottom of the onion for every runner that depends on
# it: it declares seams and orchestrates use cases against them, but it must
# never import any concrete runner's infrastructure/cli/bootstrap, or it
# would stop being shared and start being a hidden dependency on one vendor.
[[tool.importlinter.contracts]]
name = "Shared code depends on no concrete runner"
type = "forbidden"
source_modules = ["vibey_runners.common"]
forbidden_modules = [
    "claudeloop",
    "codexloop",
    "cursorloop",
    "agyloop",
    "qwenloop",
]

[[tool.importlinter.contracts]]
name = "Interfaces declare seams, never consume them"
type = "forbidden"
source_modules = ["vibey_runners.common.application.interfaces"]
forbidden_modules = ["vibey_runners.common.application.usecases"]
