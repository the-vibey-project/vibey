[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qwenloop"
version = "0.2.0"
description = "Autonomous local Qwen 2.5 Coder session runner with llama.cpp and vLLM backends."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Adam Matthew Steinberger", email = "adam@matthewsteinberger.com" }]
keywords = ["ai-agent", "coding-agent", "llama-cpp", "qwen", "vllm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["typer>=0.12", "platformdirs>=4.0"]

[project.urls]
Homepage = "https://github.com/the-vibey-project/qwenloop"
Repository = "https://github.com/the-vibey-project/qwenloop"
Issues = "https://github.com/the-vibey-project/qwenloop/issues"
Changelog = "https://github.com/the-vibey-project/qwenloop/releases"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.14", "import-linter>=2.1", "bandit>=1.8"]

[project.scripts]
qwenloop = "qwenloop.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qwenloop"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# E501 only, and only because of the provenance header. `vibey-gh check` requires an
# exact 230-character comment on the first line of every source file, byte-for-byte, so it
# cannot be wrapped or annotated without failing the check that mandates it. Line width on
# real code is still enforced by ruff-format, which is why vibey-gh itself leaves E501
# unselected rather than fighting its own fingerprint.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["qwenloop"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=qwenloop --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["src/qwenloop"]

[tool.importlinter]
root_package = "qwenloop"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Onion layering"
type = "layers"
layers = ["qwenloop.cli", "qwenloop.infrastructure", "qwenloop.application", "qwenloop.domain"]

# ADR-0016's mirrored `interfaces/` packages declare seams; they never reach up into the
# code that consumes them. The onion contract above already keeps domain and application
# interfaces out of infrastructure; this adds the rule for every interfaces package,
# including infrastructure's own, against the adapters and the CLI that wire them.
[[tool.importlinter.contracts]]
name = "Interfaces declare seams, never consume them"
type = "forbidden"
source_modules = [
  "qwenloop.domain.interfaces",
  "qwenloop.application.interfaces",
  "qwenloop.infrastructure.interfaces",
]
forbidden_modules = [
  "qwenloop.cli",
  "qwenloop.infrastructure.inference",
  "qwenloop.infrastructure.settings",
  "qwenloop.infrastructure.tools",
]
