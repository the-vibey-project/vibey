[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencodeloop"
version = "0.1.0"
description = "A contract-preserving Vibey runner for the OpenCode CLI."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Adam Matthew Steinberger", email = "adam@matthewsteinberger.com" }]
keywords = ["ai-agent", "coding-agent", "opencode", "vibey"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["typer>=0.12"]

[project.urls]
Homepage = "https://github.com/the-vibey-project/vibey"
Repository = "https://github.com/the-vibey-project/vibey"
Issues = "https://github.com/the-vibey-project/vibey/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.14", "import-linter>=2.1", "bandit>=1.8"]

[project.scripts]
opencodeloop = "opencodeloop.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opencodeloop"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["opencodeloop"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=opencodeloop --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["src/opencodeloop"]

[tool.importlinter]
root_package = "opencodeloop"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Onion layering"
type = "layers"
layers = ["opencodeloop.cli", "opencodeloop.infrastructure", "opencodeloop.application", "opencodeloop.domain"]

