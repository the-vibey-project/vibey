site_name: cursorloop
site_description: Onion-architected, autonomous Cursor Agent session runner — never
  blocks on a human, distinguishes rate-limit windows from exhausted credits, and
  resumes safely across usage windows.
site_url: https://the-vibey-project.github.io/cursorloop/
repo_url: https://github.com/the-vibey-project/cursorloop
repo_name: adammatthewsteinberger/cursorloop
edit_uri: edit/develop/docs/

# ProperDocs, matching vibey-gh and vibey-skills. `theme: mkdocs` rather than Material:
# ProperDocs ships its own theme package and the Material palette/features block has no
# equivalent here, so the styling lives in stylesheets/vibey.css instead. mkdocstrings is
# dropped with it -- ProperDocs does not ship it and the API pages it generated are not
# worth a plugin dependency the release-surfaces build would have to install.
theme: mkdocs

extra_css:
  - stylesheets/vibey.css
extra_javascript:
  - javascripts/channel.js

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

exclude_docs: 'plans/**

  superpowers/**

  '
