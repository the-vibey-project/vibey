site_name: vibey-bootstrap
site_description: >-
  Production-ready Azure bootstrap library for App Configuration, Key Vault,
  and Application Insights — plus a framework-agnostic logging, resilience,
  and runtime layer.
site_author: Adam Matthew Steinberger
site_url: https://the-vibey-project.github.io/vibey-bootstrap/
copyright: Copyright &copy; 2026 The Vizius Group and Adam Matthew Steinberger — MIT licensed

repo_url: https://github.com/the-vibey-project/vibey-bootstrap
repo_name: adammatthewsteinberger/vibey-bootstrap
# Every page is generated by docs/gen_pages.py and calls set_edit_path() with a
# REPO-ROOT-relative path, so edit_uri must stop at the ref (no docs/ segment).
edit_uri: blob/main/

docs_dir: docs
site_dir: site

# .gitignore syntax. gen_pages.py is a build script, not content. USAGE.md is
# read by gen_pages.py and re-emitted as usage.md with rewritten links, so the
# raw on-disk copy must not also publish. *-PLAN.md are untracked working notes.
exclude_docs: |
  gen_pages.py
  USAGE.md
  *-PLAN.md

watch:
  - README.md
  - CHANGELOG.md
  - CONTRIBUTING.md
  - CLAUDE.md
  - MIGRATING-FROM-V1.md
  - MIGRATING-TO-V3.md
  - MIGRATING-TO-V4.md
  - NOTICE.md
  - pyproject.toml
  - vibey_bootstrap

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle: {icon: material/brightness-auto, name: Switch to light mode}
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-4, name: Switch to system preference}
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.indexes      # pairs with mkdocs-section-index
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tooltips

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      toc_depth: 3
      # NOTE: deliberately NOT overriding `slugify`. docs/gen_pages.py imports
      # markdown.extensions.toc.slugify to precompute the exact anchors it
      # rewrites links to. Changing slugify here silently desynchronises the two
      # and reintroduces broken anchors.
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          inventories:
            - https://docs.python.org/3/objects.inv
          options:
            docstring_style: google
            docstring_section_style: table
            filters: ["!^_"]
            heading_level: 2
            inherited_members: true
            merge_init_into_class: true
            members_order: source
            parameter_headings: false
            separate_signature: true
            show_bases: true
            show_if_no_docstring: false
            show_labels: true
            show_root_full_path: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: true
            show_submodules: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            summary: true
            unwrap_annotated: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Usage Guide: usage.md
  - API Reference: reference/          # trailing slash → expanded by literate-nav
  - Migration:
      - v1 → v2: MIGRATING-FROM-V1.md
      - v2 → v3: MIGRATING-TO-V3.md
      - v3 → v4: MIGRATING-TO-V4.md
  - Project:
      - Changelog: CHANGELOG.md
      - Contributing: CONTRIBUTING.md
      - Developer Context: CLAUDE.md
      - Notice: NOTICE.md

# Material's first-class GA4 integration -- renders the canonical gtag snippet on every
# page. The standalone repository also kept it in its own .vibey-gh.toml [documentation];
# that file never applied in the monorepo and was removed under vibey #189, so this is the
# only copy.
extra:
  analytics:
    provider: google
    property: G-R2BE84LHZS
