version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # vibey-gh owns the action versions used by the workflows it generates, and
    # ships them through its own releases. A bump applied here instead makes the
    # rendered file stop matching its template, which fails `vibey-gh check` and
    # makes the pre-push hook refuse every push from the branch — including the
    # promotion to main. Upgrade these by upgrading vibey-gh.
    #
    # Dependabot cannot ignore a FILE, only a dependency, so these names are the
    # actions the managed templates pin. Actions absent from this list are still
    # bumped normally wherever you use them.
    ignore:
      - dependency-name: actions/checkout
      - dependency-name: actions/configure-pages
      - dependency-name: actions/deploy-pages
      - dependency-name: actions/download-artifact
      - dependency-name: actions/setup-python
      - dependency-name: actions/upload-artifact
      - dependency-name: actions/upload-pages-artifact
      - dependency-name: anthropics/claude-code-action
      - dependency-name: astral-sh/setup-uv
      - dependency-name: github/codeql-action
      - dependency-name: oras-project/setup-oras
