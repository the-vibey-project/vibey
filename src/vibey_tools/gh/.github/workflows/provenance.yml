name: Provenance

# Server-side half of the provenance rule. The pre-push hook is the fast, local half, but
# a hook lives in a clone: it can be skipped with --no-verify, and a fresh clone that
# never ran `vibey-gh install` has no hook at all. This job is what makes the rule hold
# for everyone, so make it a REQUIRED status check on every protected branch.
#
# It runs on every branch, not just pull requests, so an unfingerprinted commit is caught
# where it is pushed rather than at merge time.
#
# The job name below — "Provenance" — is the context you add to the branch ruleset.

on:
  push:
    branches: ["**"]
  pull_request:
  # Where a repository puts this job behind a merge queue, the queue only ever sees
  # checks a `merge_group` event started; without this the gate never reports and every
  # queued pull request is ejected on timeout. On a merge group there is no
  # `pull_request` payload, so the step below falls through to the whole-repository
  # check -- the right scope, since each group member's commits were already walked on
  # its own pull request (ADR-0036).
  merge_group:

permissions:
  contents: read
  # `check --ci` surveys the repository's cloud clutter -- merged branches still on the
  # forge, draft releases -- through `gh pr list` and `gh release list`. Listing pull
  # requests needs its own scope; without it the survey cannot be made at all and the
  # check reports "not surveyed" instead of a judgement. A feature that runs nowhere it
  # was built to run is what this line exists to prevent. Read-only, like `contents`.
  pull-requests: read

concurrency:
  group: provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenance:
    name: Provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Needed to walk the commits a pull request adds.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # A repository that IS the tooling installs itself; everyone else takes the
      # published package. Self-describing, so the same template works in both places.
      - name: Install the tooling
        run: |
          set -euo pipefail
          # Where this repository keeps its own copy of the tooling, from
          # `[install] self_source` in .vibey-gh.toml -- a DECLARED path, never a search.
          # Searching the tree for a pyproject declaring `name = "vibey-gh"` would read a
          # pull request's own files: a branch that adds one anywhere gets it installed
          # here, with this job's permissions, and hands the provenance gate a tool of the
          # contributor's choosing. The path is verified below before anything runs.
          self="."
          # Verified, not assumed: a misconfigured path must fall back to the published
          # release rather than install whatever happens to sit there.
          grep -qE '^name = "vibey-gh"' "$self/pyproject.toml" 2>/dev/null || self=""
          if [ -n "$self" ]; then
            echo "this repository provides the tooling — installing from source"
            python -m pip install --quiet -e "$self"
          else
            python -m pip install --quiet vibey-gh
          fi

      # --ci skips the core.hooksPath assertion, which is per-clone local git config that
      # no runner can satisfy. The hook FILES are repository state and are still checked.
      # The base SHA goes through env: rather than into the shell, so there is no
      # injection surface even though it comes from github.event.
      - name: Check provenance
        env:
          # `gh` takes its credential from this name and no other. Without it the clutter
          # survey fails with gh's own "set the GH_TOKEN environment variable" text as the
          # reason, which `check` then reports verbatim as "not surveyed" -- a line that
          # reads like a forge outage rather than a missing token. `github.token` is this
          # job's own credential, already narrowed by `permissions:` above.
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          # The PULL REQUEST's head, not the checked-out ref. On a pull_request event
          # actions/checkout gives you `refs/pull/N/merge`, a synthetic merge whose FIRST
          # parent is the base branch -- so a first-parent walk from it goes straight into
          # the base and finds nothing. Measured on this repository: 0 commits from the
          # merge ref, 16 from the branch head. Walking `HEAD` there reports a green gate
          # having examined nothing at all.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INTEGRATION_BRANCH: develop
          RELEASE_BRANCH: main
        run: |
          set -euo pipefail
          if [ "$HEAD_REF" = "$INTEGRATION_BRANCH" ] && \
             [ "$BASE_REF" = "$RELEASE_BRANCH" ]; then
            echo "Promotion PR: checking repository provenance without rewriting or re-auditing admitted history."
            vibey-gh check --ci
          elif [ -n "${BASE_SHA:-}" ]; then
            git fetch --quiet --depth=50 origin "${BASE_SHA}" 2>/dev/null || true
            git fetch --quiet --depth=50 origin "${HEAD_SHA}" 2>/dev/null || true
            vibey-gh check --ci --commits "${BASE_SHA}..${HEAD_SHA}"
          else
            vibey-gh check --ci
          fi
