name: API drift (Cloud Agents OpenAPI)

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  parity:
    name: MCP, API, CLI, SDK, and webhook parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify five-surface capability parity
        run: |
          set -euo pipefail
          python -m pip install --quiet .
          python - <<'PY'
          from vibey_gh.surfaces import CAPABILITIES, SURFACES, parity

          expected_capabilities = tuple(CAPABILITIES)
          expected_surfaces = tuple(SURFACES)
          actual = parity()
          if tuple(actual) != expected_capabilities:
              raise SystemExit(
                  f"capability registry drift: {tuple(actual)!r} != {expected_capabilities!r}"
              )
          drift = {
              capability: surfaces
              for capability, surfaces in actual.items()
              if tuple(surfaces) != expected_surfaces
          }
          if drift:
              raise SystemExit(f"capability parity drift: {drift!r}")
          print(
              f"{len(expected_capabilities)} capabilities are exposed through "
              f"all {len(expected_surfaces)} surfaces"
          )
          PY
