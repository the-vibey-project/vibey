name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The full supported range. The 3.12 floor is the unified workspace floor; the coverage gate is 100%,
      # and a branch that only one version can reach is a branch the others cannot test —
      # which is exactly how a version-dependent gap hides.
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0        # the tests drive real git history

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install --quiet -e ".[dev]"

      - name: Test
        run: python -m pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet -e ".[dev]"
      - run: python -m black --check vibey_gh test
        # `isort` by console script, not `python -m isort`: isort 9.0.0 dropped the
        # runnable `__main__`, so `python -m` fails before reading a single file — and
        # with an unpinned floor that arrived on its own and broke every pull request at
        # once. The console script is the documented entry point and is version-stable.
      - run: isort --check-only vibey_gh test
      - run: python -m ruff check vibey_gh test
      - run: python -m mypy vibey_gh
      - name: Dogfood the managed automation
        run: |
          python - <<'PY'
          from vibey_gh.config import load_config
          from vibey_gh.install import installed

          ok, problems = installed(load_config(), local=False)
          if not ok:
              raise SystemExit("managed automation drift:\n" + "\n".join(problems))
          print("repository workflows match the configuration-rendered templates")
          PY

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet build twine
      - name: Verify the release ships its own managed automation
        run: |
          python -m pip install --quiet -e .
          python - <<'PY'
          from vibey_gh.config import load_config
          from vibey_gh.install import installed

          ok, problems = installed(load_config(), local=False)
          if not ok:
              raise SystemExit("release automation drift:\n" + "\n".join(problems))
          PY
      - run: python -m build
      - run: python -m twine check dist/*

      # The templates are the product as much as the code is: a wheel that ships without
      # them installs a CLI that cannot install anything.
      - name: Assert the templates are in the wheel
        # Everything the shell runs stays INDENTED inside this block scalar. YAML strips
        # the common indent, so the shell still sees a column-0 heredoc — but a line
        # actually written at column 0 here would end the scalar and break the parse.
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import sys
          import tomllib
          import zipfile

          # Read from the checked-out source tree rather than a hardcoded list, so a
          # template added later is asserted automatically instead of silently unchecked.
          # The release theme assets don't exist at this path pre-build: hatch's
          # force-include only maps them into the wheel at build time (pyproject.toml),
          # so read their wheel destinations from that same table instead of globbing.
          with open("pyproject.toml", "rb") as f:
              force_include = tomllib.load(f)["tool"]["hatch"]["build"]["targets"]["wheel"][
                  "force-include"
              ]
          want = sorted(
              glob.glob("vibey_gh/templates/githooks/*")
              + glob.glob("vibey_gh/templates/workflows/*.yml")
              + list(force_include.values())
          )
          names = set(zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist())
          missing = [w for w in want if w not in names]
          if missing:
              sys.exit("missing from the wheel: " + ", ".join(missing))
          print(f"all {len(want)} templates present")
          PY
