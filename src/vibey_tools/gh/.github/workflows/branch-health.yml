name: Branch health

# A red push run on a permanent branch is visible only to whoever opens the Actions tab.
# develop was red for a day and four pull requests merged over a failing `gates` before
# anybody looked. After every CI run on a push to the integration or release branch,
# `vibey-gh branch-health` judges that run by the branch's required checks and keeps ONE
# tracking issue per branch: opened or updated while red, closed once the tip is green.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop, main]

permissions:
  contents: read

# One judgement per branch at a time, never cancelled: each run judges only its own commit
# and only while that commit is still the branch's tip, so a queued run that finds itself
# stale changes nothing, and none needs to be thrown away.
concurrency:
  group: branch-health-${{ github.repository }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  alert:
    name: Track a red permanent branch
    if: >-
      true &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    # Least privilege: read the run and its jobs, write issues, nothing else.
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install vibey-gh
        run: |
          set -euo pipefail
          # Where this repository keeps its own copy of the tooling, from
          # `[install] self_source` in .vibey-gh.toml -- a DECLARED path, never a search.
          # Searching the tree for a pyproject declaring `name = "vibey-gh"` would read a
          # pull request's own files: a branch that adds one anywhere gets it installed
          # here, with this job's permissions, and hands the provenance gate a tool of the
          # contributor's choosing. The path is verified below before anything runs.
          self="."
          # Verified, not assumed: a misconfigured path must fall back to the published
          # release rather than install whatever happens to sit there. That release is
          # `vibey`: `vibey_gh` ships inside it, not as a project of its own (ADR-0037).
          grep -qE '^name = "vibey-gh"' "$self/pyproject.toml" 2>/dev/null || self=""
          if [ -n "$self" ]; then
            python -m pip install --quiet -e "$self"
          else
            python -m pip install --quiet vibey-engine
          fi
          command -v vibey-gh >/dev/null || { echo "::error::vibey-gh is not installed"; exit 1; }
      - name: Open, update or close the branch's tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          vibey-gh branch-health --run-id "$RUN_ID" | tee -a "$GITHUB_STEP_SUMMARY"
