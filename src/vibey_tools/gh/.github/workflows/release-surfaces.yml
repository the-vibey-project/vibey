          OTHER_CHANNEL: ${{ needs.context.outputs.other_channel }}
          OTHER_BRANCH: ${{ needs.context.outputs.other_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          GA_ID="G-DV1RM8BD78"
          mkdir -p "pages/${CHANNEL}" "pages/${OTHER_CHANNEL}"
          cp -R channel-site/. "pages/${CHANNEL}/"
          restored=false
          # ASK FOR THE ARTIFACT BY NAME, never for runs that might be carrying it.
          # Two earlier lookups both searched RUNS and both failed, differently:
          #
          #   1. `gh run list --limit 20` with no branch filter walked the twenty most
          #      recent runs on ANY branch. Every integration publish takes one of those
          #      slots, so after twenty merges in an afternoon the last release run fell
          #      out of the window and the artifact was simply not among them.
          #   2. Adding `--branch "$OTHER_BRANCH"` looked like the fix and is strictly
          #      worse: it never matches. A `workflow_run` run is attributed to the
          #      DEFAULT branch and a `workflow_dispatch` run to the ref it was dispatched
          #      on -- neither is ever the release branch -- so the filter found nothing
          #      every single time and published the other channel EMPTY on every publish.
          #
          # The artifacts endpoint takes the name directly, returns newest first, and says
          # which entries have expired. Branch attribution stops mattering entirely.
          while read -r other_run; do
            [ -n "$other_run" ] || continue
            if gh run download "$other_run" --name "docs-${OTHER_CHANNEL}" \
              --dir "pages/${OTHER_CHANNEL}" 2>/dev/null; then
              restored=true
              break
            fi
          done < <(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=docs-${OTHER_CHANNEL}&per_page=30" \
            --jq '.artifacts[] | select(.expired == false) | .workflow_run.id')
          if [ "$restored" != true ]; then
