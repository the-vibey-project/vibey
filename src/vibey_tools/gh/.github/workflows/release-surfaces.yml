          # what THIS deploy actually produced -- never from configuration -- so no page
          # ever links a file that was not built. Always substituted: an empty object is
          # "nothing to show", and an unreplaced placeholder would be a syntax error.
          site = pathlib.Path("channel-site")
          surfaces = {
              "paper_pdf": (site / "paper.pdf").is_file(),
              "paper_html": (site / "paper" / "index.html").is_file(),
              "book_epub": (site / "book.epub").is_file(),
              "book_pdf": (site / "book.pdf").is_file(),
              "book_print": (site / "book-print.html").is_file(),
              "governance": sorted(
                  p.parent.name
                  for p in (site / "governance").glob("*/index.html")
                  if re.fullmatch(r"[a-z0-9][a-z0-9-]*", p.parent.name)
              ),
          }
          script = site / "javascripts" / "channel.js"
          if script.is_file():
              # Substituted into a single-quoted JavaScript string: escape what could end it.
              encoded = json.dumps(surfaces).replace("\\", "\\\\").replace("'", "\\'").replace("</", "<\\/")
              script.write_text(script.read_text().replace("__DOC_SURFACES__", encoded))
          print("surfaces on this channel: " + ", ".join(k for k, v in surfaces.items() if v))
