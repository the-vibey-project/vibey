                      ("EPUB", f"{channel}/book.epub", "book.epub"),
                      ("print HTML", f"{channel}/book-print.html", "book-print.html"),
                  )
                  if (base / file).is_file()
              ]
              governance = (base / "governance" / "constitution" / "index.html").is_file()
              if not paper and not book and not governance:
                  return ""
              links = lambda items: " · ".join(f'<a href="{href}">{name}</a>' for name, href in items)
              parts = []
              if paper:
                  parts.append("<strong>Research paper</strong> " + links(paper))
              if book:
                  parts.append("<strong>The book</strong> " + links(book))
              if governance:
                  parts.append(f'<strong>Governance</strong> <a href="{channel}/governance/constitution/">the Constitution, the doctrines and the rights</a>')
              return f"<p>{label}: " + " — ".join(parts) + "</p>"

          surface_lines = [
              line
              for line in (
                  surface_line("Production", "main"),
                  surface_line("Preview", "develop"),
              )
              if line
          ]
          surfaces_html = (
              '<section class="surfaces" aria-label="Read it offline">'
              "<h2>Read it offline</h2>" + "".join(surface_lines) + "</section>"
          ) if surface_lines else ""
          values = {
              "__SURFACES_HTML__": surfaces_html,
              "__REPOSITORY_NAME__": os.environ["REPOSITORY_NAME"],
              "__REPOSITORY__": os.environ["GITHUB_REPOSITORY"],
              "__REPOSITORY_URL__": os.environ["REPOSITORY_URL"],
              "__RELEASE_BRANCH__": os.environ["RELEASE_BRANCH"],
              "__RELEASE_CHANNEL__": os.environ["RELEASE_CHANNEL"],
              "__RELEASE_SHA__": os.environ["RELEASE_SHA"],
              "__SHORT_SHA__": os.environ["RELEASE_SHA"][:12],
              "__GA_SNIPPET__": ga_snippet,
              "__PAGES_ROOT__": "https://"
              + os.environ["GITHUB_REPOSITORY"].split("/")[0]
              + ".github.io/"
              + os.environ["REPOSITORY_NAME"]
              + "/",
              # GitHub's generated OpenGraph card: always exists, stays current.
              "__OG_IMAGE__": os.environ.get("SEO_OG_IMAGE", "").strip()
              or "https://opengraph.githubassets.com/"
              + os.environ["RELEASE_SHA"]
              + "/"
              + os.environ["GITHUB_REPOSITORY"],
          }
          for old, new in values.items():
              text = text.replace(old, new)
          path.write_text(text)
          PY
          OWNER=${GITHUB_REPOSITORY%/*}
          NAME=${GITHUB_REPOSITORY#*/}
          PAGES_ROOT="https://${OWNER}.github.io/${NAME}/"
          if true; then
            cat > pages/robots.txt <<EOF
          User-agent: *
          Allow: /${NAME}/main/
          Disallow: /${NAME}/develop/
          Sitemap: ${PAGES_ROOT}sitemap.xml
          EOF
          fi
          if true; then
            cat > pages/sitemap.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <sitemapindex xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <sitemap><loc>${PAGES_ROOT}main/sitemap.xml</loc></sitemap>
            <sitemap><loc>${PAGES_ROOT}develop/sitemap.xml</loc></sitemap>
          </sitemapindex>
          EOF
          fi
          # The paper and the book on the LLM-facing index as well, only where they exist.
          SURFACE_LINES=""
          [ -f pages/main/paper.pdf ] && SURFACE_LINES="${SURFACE_LINES}- [Research paper (PDF)](${PAGES_ROOT}main/paper.pdf)"$'\n'
          [ -f pages/main/paper/index.html ] && SURFACE_LINES="${SURFACE_LINES}- [Research paper (HTML)](${PAGES_ROOT}main/paper/)"$'\n'
          [ -f pages/main/book.pdf ] && SURFACE_LINES="${SURFACE_LINES}- [The book (PDF)](${PAGES_ROOT}main/book.pdf)"$'\n'
          [ -f pages/main/book.epub ] && SURFACE_LINES="${SURFACE_LINES}- [The book (EPUB)](${PAGES_ROOT}main/book.epub)"$'\n'
          [ -f pages/main/book-print.html ] && SURFACE_LINES="${SURFACE_LINES}- [The book (print HTML)](${PAGES_ROOT}main/book-print.html)"$'\n'
          [ -f pages/main/governance/constitution/index.html ] && SURFACE_LINES="${SURFACE_LINES}- [Governance: the Constitution, the doctrines, the commandments, the bill of rights](${PAGES_ROOT}main/governance/constitution/)"$'\n'
          [ -f pages/main/corpus-index.json ] && SURFACE_LINES="${SURFACE_LINES}- [Governance corpus index](${PAGES_ROOT}main/corpus-index.json)"$'\n'
          if true; then
            cat > pages/llms.txt <<EOF
          # ${NAME}

          > $(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["description"])' 2>/dev/null || echo "Open source project documentation")

          - [Production documentation](${PAGES_ROOT}main/)
          - [Preview documentation](${PAGES_ROOT}develop/)
          - [Source repository](https://github.com/${GITHUB_REPOSITORY})
          - [Releases](https://github.com/${GITHUB_REPOSITORY}/releases)
          ${SURFACE_LINES}- Provenance: ${GITHUB_REPOSITORY}@${{ needs.context.outputs.sha }}
          EOF
          fi
          if true; then
            {
              cat pages/llms.txt
              printf '\n# Full production documentation\n\n'
              find pages/main -name '*.html' -type f -print0 | sort -z | xargs -0 sed -E 's/<[^>]+>/ /g'
            } > pages/llms-full.txt
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: pages
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  attach:
    # The paper and the book as assets on the GitHub Release for this exact version: a
    # site can be rebuilt or moved, a release asset is a permanent, versioned copy a
    # reader can still find years later from the Releases page. Only on the release
    # channel, only when GitHub Releases are on, and only when there is something to
    # attach. Its own job so `contents: write` is granted here and nowhere else.
    name: Attach the book and the paper to the GitHub Release
    needs: [context, package, docs]
    if: >-
      true &&
      (true || true) &&
      needs.context.outputs.branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-${{ needs.context.outputs.channel }}
          path: channel-site
      - name: Upload the documentation artifacts as release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          present=()
          for name in paper.pdf book.epub book.pdf book-print.html; do
            if [ -s "channel-site/$name" ]; then
              present+=("channel-site/$name")
            fi
          done
          if [ "${#present[@]}" -eq 0 ]; then
            echo "no paper or book artifact was produced on this deploy; nothing to attach"
            exit 0
          fi
          # The GitHub Release is created by its own workflow from the same successful
          # Release run; it is usually there long before the site finishes building, and
          # this waits a bounded while for it rather than assuming an order.
          for attempt in $(seq 1 20); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "::warning::no GitHub Release $TAG appeared within 10 minutes; the artifacts remain on the documentation site"
              exit 0
            fi
            sleep 30
          done
          gh release upload "$TAG" "${present[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          echo "attached to $TAG: ${present[*]}"
