            # channel is not left alone, it is published as an empty directory that the
            # chooser still links to. Observed as a 404 on every documented `main/` URL --
            # the book, the paper, the governance corpus -- after a day of merges into the
            # integration branch, with nothing red anywhere to say so.
            echo "::warning::No unexpired docs-${OTHER_CHANNEL} artifact exists; publishing ${OTHER_CHANNEL}/ empty"
