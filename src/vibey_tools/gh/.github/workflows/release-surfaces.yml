# Made with ❤️ by [Vibey](https://the-vibey-project.github.io/vibey/), Developed by [Adam Matthew Steinberger](https://vibewithadam.matthewsteinberger.com/) ([@adammatthewsteinberger](https://github.com/adammatthewsteinberger/)).
name: Release surfaces

# The package registries remain authoritative for Python installation. This workflow adds
# two companion surfaces after that release has succeeded: branch-specific ProperDocs
# sites on one GitHub Pages deployment and an OCI release bundle in GitHub Packages.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      branch:
        description: Release channel to rebuild
        required: true
        type: choice
        options: [develop, main]
      run_id:
        description: Successful Release run containing the dist artifact
        required: true
        type: string

permissions:
  contents: read

jobs:
  context:
    name: Resolve successful release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.release.outputs.branch }}
      channel: ${{ steps.release.outputs.channel }}
      other_channel: ${{ steps.release.outputs.other_channel }}
      other_branch: ${{ steps.release.outputs.other_branch }}
      run_id: ${{ steps.release.outputs.run_id }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INTEGRATION_BRANCH: develop
          RELEASE_BRANCH: main
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            branch="$INPUT_BRANCH"
            run_id="$INPUT_RUN_ID"
            conclusion=$(gh api "repos/${REPO}/actions/runs/${run_id}" --jq .conclusion)
            sha=$(gh api "repos/${REPO}/actions/runs/${run_id}" --jq .head_sha)
            run_branch=$(gh api "repos/${REPO}/actions/runs/${run_id}" --jq .head_branch)
            if [ "$conclusion" != success ]; then
              echo "Release run ${run_id} did not succeed" >&2
              exit 1
            fi
            if [ "$run_branch" != "$branch" ]; then
              echo "Release run ${run_id} belongs to ${run_branch}, not ${branch}" >&2
              exit 1
            fi
          else
            branch="$EVENT_BRANCH"
            run_id="$EVENT_RUN_ID"
            sha="$EVENT_SHA"
          fi
          case "$branch" in
            "$INTEGRATION_BRANCH")
              channel=develop
              other_channel=main
              other_branch="$RELEASE_BRANCH"
              ;;
            "$RELEASE_BRANCH")
              channel=main
              other_channel=develop
              other_branch="$INTEGRATION_BRANCH"
              ;;
            *) echo "unsupported release branch: ${branch}" >&2; exit 1 ;;
          esac
          {
            echo "branch=${branch}"
            echo "channel=${channel}"
            echo "other_channel=${other_channel}"
            echo "other_branch=${other_branch}"
            echo "run_id=${run_id}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"

  package:
    name: GitHub Package (${{ needs.context.outputs.channel }})
    needs: context
    runs-on: ubuntu-latest
    outputs:
      # The exact released version, read from the wheel's own metadata below; the
      # attach job names the GitHub Release by it.
      version: ${{ steps.metadata.outputs.version }}
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
          run-id: ${{ needs.context.outputs.run_id }}
          github-token: ${{ github.token }}
      - id: metadata
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          import zipfile

          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {len(wheels)}")
          with zipfile.ZipFile(wheels[0]) as archive:
              metadata = next(name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
              for line in archive.read(metadata).decode().splitlines():
                  if line.startswith("Version: "):
                      print("version=" + line.removeprefix("Version: "))
                      break
              else:
                  raise SystemExit("wheel metadata has no Version")
          PY
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3
      - name: Publish the exact Python distribution as an OCI package
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          CHANNEL: ${{ needs.context.outputs.channel }}
          RELEASE_SHA: ${{ needs.context.outputs.sha }}
        run: |
          set -euo pipefail
          package="ghcr.io/${GITHUB_REPOSITORY,,}/python"
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          wheel=$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)
          sdist=$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          test -n "$wheel" && test -n "$sdist"
          oras push "${package}:${VERSION}" \
            --artifact-type application/vnd.pypi.project.release.v1 \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${RELEASE_SHA}" \
            "${wheel}:application/vnd.python.wheel" \
            "${sdist}:application/gzip"
          oras tag "${package}:${VERSION}" "$CHANNEL" "sha-${RELEASE_SHA}"
          if [ "$CHANNEL" = main ]; then
            oras tag "${package}:${VERSION}" latest
          fi

  docs:
    name: ProperDocs (${{ needs.context.outputs.channel }})
    needs: context
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: release-surfaces-pages-${{ github.repository }}
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ format('https://{0}.github.io/{1}/{2}/', github.repository_owner, github.event.repository.name, needs.context.outputs.channel) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.context.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Inject social signals (sub-doctrine 4.a)
        if: false
        run: |
          set -euo pipefail
          # Self-hosting-aware: this repository IS vibey-gh when the import already
          # resolves from source; every adopter installs the pinned release.
          python - <<'PY' || python -m pip install --quiet vibey-gh
          import vibey_gh  # noqa: F401
          PY
          python - <<'PY'
          from pathlib import Path
          from vibey_gh.config import load_config
          from vibey_gh.social_signals import inject
          done = inject("channel-site", load_config(Path(".")))
          print("social signals injected" if done else
                "social signals: nothing injected (surface off or landing page missing)")
          PY
      - name: Build the channel site with ProperDocs
        env:
          CHANNEL: ${{ needs.context.outputs.channel }}
          RELEASE_BRANCH: ${{ needs.context.outputs.branch }}
          RELEASE_SHA: ${{ needs.context.outputs.sha }}
        run: |
          set -euo pipefail
          export GA_ID="G-DV1RM8BD78"
          python -m pip install --quiet \
            'properdocs==1.6.7' 'properdocs-theme-mkdocs==1.6.7'
          # LaTeX on the site: arithmatex keeps math intact through the Markdown pass.
          if [ "false" = "true" ]; then
            python -m pip install --quiet 'pymdown-extensions==12.0'
          fi
          # A site declaring plugins or markdown extensions needs them installed before
          # `--strict` will build it, and ProperDocs depends on none of them. Both hooks
          # are no-ops when unused: the list renders empty, and an absent file skips.
          if [ -n "docs/requirements.txt" ] \
            && [ -f "docs/requirements.txt" ]; then
            python -m pip install --quiet -r "docs/requirements.txt"
          fi
          if [ ! -f properdocs.yml ]; then
            mkdir -p .properdocs-source
            if [ -f README.md ]; then
              cp README.md .properdocs-source/index.md
            else
              printf '# %s\n' "$GITHUB_REPOSITORY" > .properdocs-source/index.md
            fi
            printf 'site_name: %s\ndocs_dir: .properdocs-source\n' "$GITHUB_REPOSITORY" > .properdocs-release.yml
            config=.properdocs-release.yml
          else
            config=properdocs.yml
          fi
          python - "$config" <<'PY'
          import os
          import pathlib
          import re
          import shutil
          import sys

          import yaml

          config_path = pathlib.Path(sys.argv[1])
          data = yaml.safe_load(config_path.read_text()) or {}
          docs_dir = (config_path.parent / data.get("docs_dir", "docs")).resolve()
          docs_dir.mkdir(parents=True, exist_ok=True)
          assets = pathlib.Path(".github/vibey-gh/release")
          if not assets.is_dir():
              raise SystemExit("managed release theme is missing; run `vibey-gh install`")
          css_dir = docs_dir / "stylesheets"
          js_dir = docs_dir / "javascripts"
          css_dir.mkdir(exist_ok=True)
          js_dir.mkdir(exist_ok=True)
          shutil.copyfile(assets / "vibey.css", css_dir / "vibey.css")
          script = (assets / "channel.js").read_text()
          repository = os.environ["GITHUB_REPOSITORY"]
          owner, name = repository.split("/", 1)
          sha = os.environ["RELEASE_SHA"]
          replacements = {
              "__REPOSITORY__": repository,
              "__REPOSITORY_URL__": f"{os.environ['GITHUB_SERVER_URL']}/{repository}",
              "__PAGES_ROOT__": f"https://{owner}.github.io/{name}/",
              "__PRODUCTION_LABEL__": "Production",
              "__PREVIEW_LABEL__": "Preview",
              "__RELEASE_SHA__": sha,
              "__SHORT_SHA__": sha[:12],
              "__RELEASE_BRANCH__": os.environ["RELEASE_BRANCH"],
              "__RELEASE_CHANNEL__": os.environ["CHANNEL"],
          }
          for old, new in replacements.items():
              script = script.replace(old, new)
          (js_dir / "channel.js").write_text(script)
          data.setdefault("site_name", name)
          data.setdefault("site_description", f"Release documentation for {repository}")
          data["site_url"] = f"https://{owner}.github.io/{name}/{os.environ['CHANNEL']}/"
          data.setdefault("repo_name", repository)
          data.setdefault("repo_url", replacements["__REPOSITORY_URL__"])
          data["edit_uri"] = f"edit/{os.environ['RELEASE_BRANCH']}/docs/"
          data["docs_dir"] = str(docs_dir)
          # LaTeX rendered on the page, never fetched from a CDN by the reader: MathJax 3.2.2
          # comes from the npm registry at build time, pinned by version AND checksum and
          # verified before use, and is served from this site. math.js (the managed release
          # asset) configures it and turns ```latex environments into styled blocks.
          if "false" == "true":
              import hashlib
              import io
              import tarfile
              import urllib.request

              tarball = urllib.request.urlopen(
                  "https://registry.npmjs.org/mathjax/-/mathjax-3.2.2.tgz", timeout=60
              ).read()
              digest = hashlib.sha256(tarball).hexdigest()
              if digest != "1b9c0a1c44df864e915690558e72adb9cc5203360daefd385084ced3b6c64c09":
                  raise SystemExit(f"MathJax tarball checksum mismatch: {digest}")
              with tarfile.open(fileobj=io.BytesIO(tarball)) as archive:
                  bundle = archive.extractfile("package/es5/tex-svg.js").read()
              vendor = js_dir / "vendor"
              vendor.mkdir(exist_ok=True)
              (vendor / "mathjax-tex-svg.js").write_bytes(bundle)
              shutil.copyfile(assets / "math.js", js_dir / "math.js")
              scripts = list(data.get("extra_javascript", []))
              for script_path in ("javascripts/math.js", "javascripts/vendor/mathjax-tex-svg.js"):
                  if script_path not in scripts:
                      scripts.append(script_path)
              data["extra_javascript"] = scripts
              extensions = list(data.get("markdown_extensions", []))
              if not any(
                  (entry if isinstance(entry, str) else next(iter(entry))) == "pymdownx.arithmatex"
                  for entry in extensions
              ):
                  extensions.append({"pymdownx.arithmatex": {"generic": True}})
              data["markdown_extensions"] = extensions
              print("math: MathJax 3.2.2 verified and served from the site; arithmatex enabled")
          # Governance in plain sight (sub-doctrine 7.b): the governance corpus is published
          # as its own section of every channel site -- and so as chapters of the book --
          # copied at build time from its single source, never committed twice. Constitution
          # first, as the order of authority; then the doctrines, the commandments, the bill
          # of rights, and every standing subdoctrine. A title keeps no colon, because the
          # book's nav reader ends a title at the first one.
          governance_source = ""
          if governance_source:
              source = pathlib.Path(governance_source)
              names = ["constitution.md", "doctrines.md", "commandments.md", "bill-of-rights.md"]
              # Only plainly named documents are published: the name becomes a URL path and a
              # link on every page, so nothing that could carry markup or quotes gets through.
              names += sorted(
                  p.name for p in source.glob("sd-*.md") if re.fullmatch(r"sd-[a-z0-9][a-z0-9-]*\.md", p.name)
              )
              published = docs_dir / "governance"
              entries = []
              for page in names:
                  origin = source / page
                  # A configured governance document that is missing is a broken publish,
                  # never a silent skip: the law would vanish from the site unnoticed.
                  if not origin.is_file():
                      raise SystemExit(f"governance source is missing {origin}")
                  published.mkdir(exist_ok=True)
                  shutil.copyfile(origin, published / page)
                  heading = next(
                      (line[2:].strip() for line in origin.read_text().splitlines() if line.startswith("# ")),
                      page.removesuffix(".md"),
                  )
                  entries.append({heading.replace(":", " —"): f"governance/{page}"})
              if entries:
                  data["nav"] = [*data.get("nav", []), {"Governance": entries}]
              print(f"governance: published {len(entries)} document(s) from {governance_source}")
          data.setdefault("theme", "mkdocs")
          for key, asset in (
              ("extra_css", "stylesheets/vibey.css"),
              ("extra_javascript", "javascripts/channel.js"),
          ):
              values = list(data.get(key, []))
              if asset not in values:
                  values.append(asset)
              data[key] = values
          # Unicode kept and lines never folded: the book reads chapter titles from this file line
          # by line, and an escaped "\u2014" or a folded title would become the chapter's name.
          pathlib.Path(".properdocs-channel.yml").write_text(
              yaml.safe_dump(data, sort_keys=False, allow_unicode=True, width=1_000_000)
          )
          PY
          properdocs build --strict --config-file .properdocs-channel.yml --site-dir channel-site
          # Search must demonstrably work at build time. A site can build --strict with a
          # search whose assets 404 or whose index is empty, and the failure is invisible
          # until a human types a query into a dead box — reported as exactly that.
          python - <<'SMOKE'
          import json
          import pathlib
          import sys

          site = pathlib.Path("channel-site")
          for asset in ("search/search_index.json", "search/lunr.js", "search/main.js", "search/worker.js"):
              if not (site / asset).is_file():
                  sys.exit(f"search smoke: {asset} missing from the built site")
          index = json.loads((site / "search" / "search_index.json").read_text())
          docs = index.get("docs", [])
          if not docs:
              sys.exit("search smoke: the index contains zero documents")
          print(f"search smoke: {len(docs)} documents indexed, all assets present")
          SMOKE
          # The index rides the site so the published law is searchable and
          # integrity-checkable offline. Shipped after the build, which cleans the site
          # directory first. Absent index, nothing ships; the check that enforces its
          # presence lives with the repository, not here.
          if [ -f "corpus-index.json" ]; then
            cp "corpus-index.json" channel-site/corpus-index.json
            echo "corpus index shipped with the channel site"
          else
            echo "no corpus index at corpus-index.json — nothing to ship"
          fi
          # The documentation as artifacts on the site itself: the doctrine's end
          # results are a KDP-shaped book and a journal-shaped paper, and a reader
          # should download them from the docs they mirror — not hunt a release page.
          if [ "true" = "true" ] || { [ "true" = "true" ] && [ -f docs/paper.md ]; }; then
            # This step's environment installs ProperDocs only; the exporters live in
            # vibey-gh. Observed as exit 127 on the first dogfooded deploy — the guard
            # printed its intent and the command did not exist. Self-hosting installs
            # from source, adopters install the published package.
            # Where this repository keeps its own copy of the tooling, from
            # `[install] self_source` in .vibey-gh.toml -- a DECLARED path, never a search.
            # Searching the tree for a pyproject declaring `name = "vibey-gh"` would read a
            # pull request's own files: a branch that adds one anywhere gets it installed
            # here, with this job's permissions, and hands the provenance gate a tool of the
            # contributor's choosing. The path is verified below before anything runs.
            self="."
            # Verified, not assumed: a misconfigured path must fall back to the published
            # release rather than install whatever happens to sit there.
            grep -qE '^name = "vibey-gh"' "$self/pyproject.toml" 2>/dev/null || self=""
            if [ -n "$self" ]; then
              python -m pip install --quiet -e "$self"
            else
              python -m pip install --quiet vibey-gh
            fi
          fi
          if [ "true" = "true" ]; then
            AUTHOR='Adam Matthew Steinberger'
            vibey-gh book --site-dir channel-site --config-file .properdocs-channel.yml \
              --output-dir book-out \
              --title "${GITHUB_REPOSITORY#*/} — The Documentation" \
              --author "${AUTHOR:-${GITHUB_REPOSITORY%%/*}}"
            cp book-out/book.epub channel-site/book.epub
            cp book-out/book-print.html channel-site/book-print.html
            # The KDP paperback interior wants a PDF, and the runner already carries a
            # Chromium: one headless print honours the @page 6in x 9in rules in the
            # print HTML, so the artifact is the uploadable interior itself.
            BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
            if [ -n "$BROWSER" ]; then
              "$BROWSER" --headless --disable-gpu --no-sandbox \
                --no-pdf-header-footer \
                --print-to-pdf="$PWD/book-out/book.pdf" \
                "file://$PWD/book-out/book-print.html" 2>/dev/null
              if [ -s book-out/book.pdf ]; then
                cp book-out/book.pdf channel-site/book.pdf
                echo "book: published book.pdf (KDP interior) on the channel site"
              else
                echo "::warning::book.pdf was not produced; the print HTML remains available"
              fi
            else
              echo "::warning::no Chromium on this runner; book.pdf skipped, print HTML published"
            fi
            echo "book: published book.epub and book-print.html on the channel site"
          fi
          if [ "true" = "true" ] && [ -f docs/paper.md ] \
              && vibey-gh paper --help >/dev/null 2>&1; then
            AUTHOR='Adam Matthew Steinberger'
            vibey-gh paper --author "${AUTHOR:-${GITHUB_REPOSITORY%%/*}}" \
              --output paper-out/paper.tex
            # Tectonic: one pinned, checksummed binary — a full TeX Live would cost
            # minutes per deploy for one PDF.
            curl -sL -o /tmp/tectonic.tar.gz \
              "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-unknown-linux-gnu.tar.gz"
            echo "875fbbc9ab48560d7776088c608e0beee49197b57ab4a2f6c5385b2c661c842f  /tmp/tectonic.tar.gz" | sha256sum -c -
            tar -xzf /tmp/tectonic.tar.gz -C /tmp
            (cd paper-out && /tmp/tectonic paper.tex)
            cp paper-out/paper.pdf channel-site/paper.pdf
            echo "paper: published paper.pdf on the channel site"
          fi
          printf '%s\n' "$CHANNEL" > channel-site/release-channel.txt
          CHANNEL="$CHANNEL" REPOSITORY="$GITHUB_REPOSITORY" RELEASE_SHA="$RELEASE_SHA" \
          JSON_LD=true PRODUCTION_INDEX=true \
          BOTTOM_NAV=true \
          PREVIEW_INDEX=false \
          SEO_FAVICON='⚙️' SEO_OG_IMAGE='' \
          SEO_TWITTER_SITE='' SEO_TWITTER_CREATOR='' \
          SEO_KEYWORDS='github automation,release automation,provenance,merge train,pull request gate,ci' SEO_AUTHOR='Adam Matthew Steinberger' \
          FUNDING_BITCOIN='' FUNDING_MONERO='' \
          FUNDING_ETHEREUM='' FUNDING_LABEL='Support this work' \
          SEO_THEME_COLOR='#080b14' SEO_LOCALE='en_US' \
          SEO_SITE_VERIFICATION='' \
          python - <<'PY'
          import html
          import json
          import os
          import pathlib
          import re
          import urllib.parse

          import yaml

          channel = os.environ["CHANNEL"]
          owner, name = os.environ["REPOSITORY"].split("/", 1)
          root = f"https://{owner}.github.io/{name}/"
          canonical = f"{root}{channel}/"
          indexable = os.environ["PRODUCTION_INDEX" if channel == "main" else "PREVIEW_INDEX"] == "true"
          site = yaml.safe_load(pathlib.Path(".properdocs-channel.yml").read_text()) or {}
          description = str(site.get("site_description", f"Release documentation for {owner}/{name}")).strip()
          author = os.environ.get("SEO_AUTHOR", "").strip() or owner
          locale = os.environ.get("SEO_LOCALE", "").strip() or "en_US"
          theme_color = os.environ.get("SEO_THEME_COLOR", "").strip()
          site_verification = os.environ.get("SEO_SITE_VERIFICATION", "").strip()
          # GitHub's generated OpenGraph card always exists and stays current, so an
          # unconfigured site still previews with a real image everywhere cards render.
          og_image = os.environ.get("SEO_OG_IMAGE", "").strip() or (
              f"https://opengraph.githubassets.com/{os.environ['RELEASE_SHA']}/{owner}/{name}"
          )
          twitter_site = os.environ.get("SEO_TWITTER_SITE", "").strip()
          twitter_creator = os.environ.get("SEO_TWITTER_CREATOR", "").strip()
          base_keywords = [w.strip() for w in os.environ.get("SEO_KEYWORDS", "").split(",") if w.strip()]
          keywords = base_keywords or [name, owner, "documentation", "release notes", "changelog"]

          def favicon_links() -> str:
              spec = os.environ.get("SEO_FAVICON", "").strip()
              if not spec:
                  return ""
              if spec.startswith(("http://", "https://", "/")) or "." in spec.split("/")[-1]:
                  return f'<link rel="icon" href="{html.escape(spec, quote=True)}">\n'
              # One or two emoji become a crisp zero-asset SVG favicon; the same data URI
              # serves apple-touch-icon so pinned tabs and home screens match.
              svg = (
                  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">'
                  f'<text y="0.9em" font-size="90">{html.escape(spec)}</text></svg>'
              )
              uri = "data:image/svg+xml," + urllib.parse.quote(svg)
              return (
                  f'<link rel="icon" href="{uri}">\n'
                  f'<link rel="apple-touch-icon" href="{uri}">\n'
              )

          ga_id = os.environ.get("GA_ID", "")
          ga_snippet = (
              f'<script async src="https://www.googletagmanager.com/gtag/js?id={ga_id}"></script>\n'
              "<script>\n"
              "window.dataLayer = window.dataLayer || [];\n"
              "function gtag(){dataLayer.push(arguments);}\n"
              "gtag('js', new Date());\n"
              f"gtag('config', '{ga_id}');\n"
              "</script>\n"
          ) if ga_id else ""

          title_of = re.compile(r"<title>(.*?)</title>", re.S)
          # Bottom previous/next navigation. The theme already renders rel="prev"/rel="next"
          # anchors in the page header with the correct targets and labels; on a phone that
          # header is a full page-scroll away from a reader who has just FINISHED the page.
          # Cloning those exact anchors into a bar before </body> gives the reader a way
          # onward from where they already are, without teaching this injector anything
          # about the nav tree — the theme stays the single authority on page order.
          bottom_nav = os.environ.get("BOTTOM_NAV", "") == "true"
          # Funding signage (#198): opt-in per currency, rendered VERBATIM from
          # reviewed config beside the provenance line — text with a copy affordance,
          # never a payment-processor link. Addresses were shape-validated at config
          # load; this only renders what that validation admitted.
          funding = [
              (label, os.environ.get(key, "").strip())
              for label, key in (
                  ("Bitcoin", "FUNDING_BITCOIN"),
                  ("Monero", "FUNDING_MONERO"),
                  ("Ethereum", "FUNDING_ETHEREUM"),
              )
              if os.environ.get(key, "").strip()
          ]
          funding_label = os.environ.get("FUNDING_LABEL", "Support this work").strip()
          funding_html = ""
          if funding:
              rows = "".join(
                  '<span class="vibey-funding-row"><strong>' + html.escape(c) + ":"
                  '</strong> <code>' + html.escape(a) + "</code>"
                  '<button type="button" onclick="navigator.clipboard.writeText(\'' + a + '\')"'
                  ' title="Copy the ' + html.escape(c) + ' address">copy</button></span>'
                  for c, a in funding
              )
              funding_html = (
                  '<footer class="vibey-funding" style="text-align:center;font-size:.85em;'
                  "opacity:.8;margin:2rem auto 1rem;display:flex;flex-wrap:wrap;gap:.75rem;"
                  'justify-content:center;align-items:center">'
                  "<span>" + html.escape(funding_label) + "</span>" + rows + "</footer>\n"
              )
          prev_next = re.compile(r'<a\s[^>]*rel="(?:prev|next)"[^>]*>.*?</a>', re.S)
          bottom_nav_style = (
              '<style>.vibey-bottom-nav{display:flex;justify-content:space-between;'
              'gap:1rem;margin:3rem auto 1.5rem;padding-top:1rem;'
              'border-top:1px solid rgba(128,128,128,.35)}'
              '.vibey-bottom-nav a{max-width:48%}'
              '.vibey-bottom-nav a.disabled{visibility:hidden}</style>\n'
          )
          for path in pathlib.Path("channel-site").rglob("*.html"):
              text = path.read_text()
              relative = path.relative_to("channel-site").as_posix()
              url = canonical + ("" if relative == "index.html" else relative.removesuffix("index.html"))
              found = title_of.search(text)
              page_title = html.escape(found.group(1).strip() if found else name, quote=True)
              esc_desc = html.escape(description, quote=True)
              metadata = (
                  f'<link rel="canonical" href="{url}">\n'
                  f'<meta name="robots" content="{"index,follow" if indexable else "noindex,nofollow"}">\n'
                  f'<meta name="description" content="{esc_desc}">\n'
                  f'<meta name="keywords" content="{html.escape(", ".join(keywords), quote=True)}">\n'
                  f'<meta name="author" content="{html.escape(author, quote=True)}">\n'
                  f'<meta name="generator" content="vibey-gh release-surfaces">\n'
                  + (f'<meta name="theme-color" content="{theme_color}">\n' if theme_color else "")
                  + (f'<meta name="google-site-verification" content="{site_verification}">\n' if site_verification else "")
                  + f'<meta property="og:type" content="website">\n'
                  f'<meta property="og:url" content="{url}">\n'
                  f'<meta property="og:site_name" content="{name}">\n'
                  f'<meta property="og:title" content="{page_title}">\n'
                  f'<meta property="og:description" content="{esc_desc}">\n'
                  f'<meta property="og:image" content="{html.escape(og_image, quote=True)}">\n'
                  f'<meta property="og:locale" content="{locale}">\n'
                  f'<meta name="twitter:card" content="summary_large_image">\n'
                  f'<meta name="twitter:title" content="{page_title}">\n'
                  f'<meta name="twitter:description" content="{esc_desc}">\n'
                  f'<meta name="twitter:image" content="{html.escape(og_image, quote=True)}">\n'
                  + (f'<meta name="twitter:site" content="{html.escape(twitter_site, quote=True)}">\n' if twitter_site else "")
                  + (f'<meta name="twitter:creator" content="{html.escape(twitter_creator, quote=True)}">\n' if twitter_creator else "")
                  + favicon_links()
                  + f'{ga_snippet}'
              )
              if os.environ["JSON_LD"] == "true":
                  record = {
                      "@context": "https://schema.org",
                      "@type": "SoftwareSourceCode",
                      "name": name,
                      "description": description,
                      "codeRepository": f"https://github.com/{os.environ['REPOSITORY']}",
                      "url": url,
                      "version": os.environ["RELEASE_SHA"],
                      "author": {"@type": "Person", "name": author},
                      "keywords": ", ".join(keywords),
                      "inLanguage": locale.replace("_", "-"),
                  }
                  metadata += '<script type="application/ld+json">' + json.dumps(record) + '</script>\n'
              if bottom_nav and "</body>" in text:
                  anchors = [m.group(0) for m in prev_next.finditer(text)]
                  if anchors:
                      metadata += bottom_nav_style
                      bar = (
                          '<nav class="vibey-bottom-nav" aria-label="page navigation">'
                          + "".join(anchors[:2])
                          + "</nav>\n"
                      )
                      text = text.replace("</body>", bar + "</body>")
