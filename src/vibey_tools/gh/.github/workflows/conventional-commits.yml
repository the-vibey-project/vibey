name: Conventional Commits

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: conventional-commits-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enforce:
    # Promotion PRs carry the protected integration branch itself. Its history was
    # already admitted commit-by-commit and must never be rewritten by this job.
    if: >-
      github.event.pull_request.head.ref != 'develop' &&
      github.event.pull_request.head.ref != 'main' &&
      github.event.pull_request.head.ref != 'develop' &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Reject unsafe or stale targets
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INTEGRATION_BRANCH: develop
          RELEASE_BRANCH: main
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$HEAD_REPO" = "$REPO" || { echo "fork history is never rewritten"; exit 1; }
          case "$HEAD_REF" in
            "$INTEGRATION_BRANCH"|"$RELEASE_BRANCH"|develop|main)
              echo "permanent branch history is never rewritten"
              exit 1
              ;;
          esac
          actual=$(gh pr view "${{ github.event.pull_request.number }}" --repo "$REPO" --json headRefOid --jq .headRefOid)
          test "$actual" = "$HEAD_SHA"
      - name: Check out trusted automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: automation
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: "3.12" }
      # A repository that IS the tooling installs itself; everyone else takes the
      # published package. Never assume `pip install .` on the adopting repo's own
      # source happens to yield the vibey-gh CLI.
      - name: Install the tooling
        working-directory: automation
        run: |
          set -euo pipefail
          # Where this repository keeps its own copy of the tooling, from
          # `[install] self_source` in .vibey-gh.toml -- a DECLARED path, never a search.
          # Searching the tree for a pyproject declaring `name = "vibey-gh"` would read a
          # pull request's own files: a branch that adds one anywhere gets it installed
          # here, with this job's permissions, and hands the provenance gate a tool of the
          # contributor's choosing. The path is verified below before anything runs.
          self="."
          # Verified, not assumed: a misconfigured path must fall back to the published
          # release rather than install whatever happens to sit there. That release is
          # `vibey`: `vibey_gh` ships inside it, not as a project of its own (ADR-0037).
          grep -qE '^name = "vibey-gh"' "$self/pyproject.toml" 2>/dev/null || self=""
          if [ -n "$self" ]; then
            echo "this repository provides the tooling — installing from source"
            python -m pip install --quiet -e "$self"
          else
            python -m pip install --quiet vibey
          fi
      - name: Check out exact topic head without executing it
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: target
          fetch-depth: 0
          token: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
      # Checking and REWRITING are separate steps, because they are separate decisions.
      # The check is the point of the job and always runs; the rewrite is a convenience a
      # repository opts into with `[pr_automation] normalise_commit_subjects`.
      - name: Check every commit subject
        id: subjects
        working-directory: target
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          command -v vibey-gh >/dev/null || {
            echo "::error::vibey-gh is not on PATH; cannot check or normalize commit subjects" >&2
            exit 1
          }
          # Reported, not failed, here: whether a nonconforming subject is an error or
          # something to repair is the next two steps' business, and exactly one of them
          # runs. Failing here would make the choice for both.
          if vibey-gh conventional-check --commits "${BASE_SHA}..${HEAD_SHA}"; then
            echo "Every commit already conforms."
            echo "conforms=true" >> "$GITHUB_OUTPUT"
          else
            echo "conforms=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize every nonconforming commit message
        if: steps.subjects.outputs.conforms == 'false' && true
        working-directory: target
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-list --merges --count "${BASE_SHA}..${HEAD_SHA}")" = 0 || {
            echo "Refusing automatic rewrite of merge commits"
            exit 1
          }
          git switch -C "$HEAD_REF" "$HEAD_SHA"
          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f \
            --msg-filter 'vibey-gh conventional-message' "${BASE_SHA}..${HEAD_REF}"
          current=$(git ls-remote origin "refs/heads/${HEAD_REF}" | cut -f1)
          test "$current" = "$HEAD_SHA"
          git push --force-with-lease="refs/heads/${HEAD_REF}:${HEAD_SHA}" \
            origin "HEAD:refs/heads/${HEAD_REF}"

      - name: Refuse a nonconforming commit subject
        if: steps.subjects.outputs.conforms == 'false' && !true
        working-directory: target
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The offenders by name, so the author can act without re-running anything
          # locally. `conventional-check` already printed them; this repeats them under
          # the annotation that fails the job.
          vibey-gh conventional-check --commits "${BASE_SHA}..${HEAD_SHA}" || true
          echo "::error::A commit on this branch has a subject that is not a Conventional Commit. This repository does not rewrite them automatically: the automatic form is 'chore: <your subject>', which conforms without choosing a type, and a fix filed as a chore is a wrong label rather than a missing one. Amend the subject yourself, with the type the change actually has."
          exit 1
