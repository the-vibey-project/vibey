name: Docs

on:
  pull_request:
  push:
    branches: [__VIBEY_GH_INTEGRATION_BRANCH__, __VIBEY_GH_RELEASE_BRANCH__]
  workflow_dispatch:
    inputs:
      repair:
        description: Create or update a documentation repair PR
        type: boolean
        default: true
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

jobs:
  contract:
    name: Documentation contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify every required documentation surface
        run: |
          python -m pip install --quiet -e .
          vibey-gh check --ci

  maintain:
    name: AI documentation maintenance
    if: >-
      __VIBEY_GH_DOCUMENTATION_AI__ &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Check out the trusted integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: __VIBEY_GH_INTEGRATION_BRANCH__
          fetch-depth: 0
          token: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
      - name: Create a guarded maintenance branch
        id: branch
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="vibey-gh/docs/refresh-${RUN_ID}"
          git switch -c "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
      - name: Comprehensively author and repair project documentation
        id: claude
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1.0.210
        # __VIBEY_GH_AI_ENV__
        with:
          anthropic_api_key: ${{ secrets.__VIBEY_GH_AI_AUTH_SECRET__ }}
          plugin_marketplaces: |
            __VIBEY_GH_PLUGIN_MARKETPLACES__
          plugins: |
            __VIBEY_GH_PLUGINS__
          claude_args: |
            --model __VIBEY_GH_DOCUMENTATION_MODEL__
            --max-turns 180
            --allowedTools Read,Glob,Grep,Edit,Write
            --json-schema '{"type":"object","properties":{"complete":{"type":"boolean"},"files_changed":{"type":"array","items":{"type":"string"}},"gaps_remaining":{"type":"array","items":{"type":"string"}},"summary":{"type":"string"}},"required":["complete","files_changed","gaps_remaining","summary"]}'
          prompt: |
            Act as the repository's comprehensive FOSS documentation maintainer. Inspect
            all source, configuration, tests, workflows, public interfaces, packaging,
            release behavior, security boundaries, and existing documentation. Create
            missing documentation and update every stale statement. This is an authoring
            task that MUST create and maintain docs/project.mmd as a comprehensive Mermaid
            diagram of every module, API, SDK, CLI, MCP, webhook, workflow, data flow,
            security boundary, branch, package, documentation, and release channel.
            and repair task, not a read-only review.

            The required contract is: __VIBEY_GH_DOCUMENTATION_FILES__.
            Also maintain architecture, CLI/API reference, configuration, installation,
            operations, troubleshooting, testing, release, provenance, threat model,
            dependency policy, accessibility, governance, roadmap, and decision records
            under docs/. Maintain accurate cross-agent guidance and reusable skills for
            Claude, Cursor, Codex/Agents, Gemini, and generic agents without contradicting
            repository policy. Maintain robots.txt, sitemap discovery, llms.txt,
            llms-full.txt, canonical metadata, JSON-LD, social metadata, and provenance.

            Never change application behavior, tests, coverage floors, security policy,
            release policy, or branch protections merely to make documentation agree.
            Never execute repository code, package managers, tests, builds, scripts, or
            binaries in this privileged job. Do not commit, push, merge, force-push,
            rename, or delete branches. Edit documentation and documentation configuration
            only. Do not invent capabilities: mark unknowns explicitly and derive claims
            from code and tests. Return complete=false if any material gap remains.
      - name: Require a complete semantic maintenance result
        if: steps.claude.outputs.structured_output != ''
        env:
          STRUCTURED: ${{ steps.claude.outputs.structured_output }}
        run: |
          set -euo pipefail
          jq -e '.complete == true and ((.gaps_remaining // []) | length == 0)' \
            <<<"$STRUCTURED" >/dev/null || {
            echo "::error::Documentation maintenance reported unresolved gaps"
            jq . <<<"$STRUCTURED"
            exit 1
          }
      - name: Publish one guarded documentation commit and PR
        if: steps.claude.outputs.structured_output != ''
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          STRUCTURED: ${{ steps.claude.outputs.structured_output }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "Documentation is already current"
            exit 0
          fi
          git config user.name 'vibey[bot]'
          git config user.email 'adam@matthewsteinberger.com'
          git add -- . ':!vibey_gh/**' ':!test/**'
          git commit -m 'Refresh comprehensive project documentation' \
            -m 'Made-With: Made with ❤️ by [Vibey](https://the-vibey-project.github.io/vibey/), Developed by [Adam Matthew Steinberger](https://vibewithadam.matthewsteinberger.com/) ([@adammatthewsteinberger](https://github.com/adammatthewsteinberger/)).'
          git push origin "HEAD:refs/heads/${BRANCH}"
          body=$(jq -r '.summary + "\n\nRemaining gaps:\n" + ((.gaps_remaining // []) | map("- " + .) | join("\n"))' <<<"$STRUCTURED")
          gh pr create --repo "$REPO" --base __VIBEY_GH_INTEGRATION_BRANCH__ \
            --head "$BRANCH" --title 'docs: comprehensive automated refresh' \
            --body "$body"
      - name: Say why the model call failed
        # The action reports only "did not return structured_output", which names the
        # symptom and not the cause, and the gate then tells an operator to read a log
        # that does not contain it. The execution record does: an immediate `is_error`
        # with zero cost and an empty `modelUsage` is the API refusing the call — credit,
        # credentials, availability — rather than a model that answered badly. Without
        # this the difference is only inferable, and every diagnosis starts from scratch.
        #
        # `-s` normalises the three shapes this file has been seen to take (a JSON array,
        # a bare object, or JSONL) into one list before the last result is picked out.
        if: failure() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          if [ ! -f "$EXECUTION_FILE" ]; then
            echo "no execution record was written: the action failed before running" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          normalise='[.[] | if type=="array" then .[] else . end]
            | map(select(.type=="result")) | last'
          facts=$(jq -rs "$normalise"' as $r
            | "is_error=\($r.is_error // "unknown") subtype=\($r.subtype // "unknown")
               turns=\($r.num_turns // 0) cost_usd=\($r.total_cost_usd // 0)
               model_calls=\(($r.modelUsage // {}) | length)"' "$EXECUTION_FILE" 2>/dev/null \
            | tr -s '[:space:]' ' ') || facts="execution record unreadable"
          # Bounded, and fenced rather than interpolated: this text is model output and
          # may quote the pull request, so it is reported as data and never as markup.
          reason=$(jq -rs "$normalise"' | (.result // .error // "") | tostring' \
            "$EXECUTION_FILE" 2>/dev/null | head -c 2000) || reason=""
          {
            echo "### The model call did not complete"
            echo
            echo "\`$facts\`"
            echo
            if [ -n "$reason" ]; then
              echo "What the run reported:"
              echo '```'
              echo "$reason"
              echo '```'
            fi
            if [ "${facts#*model_calls=0}" != "$facts" ] \
              && [ "${facts#*cost_usd=0 }" != "$facts" ]; then
              echo
              echo "Zero model calls at zero cost: the request was refused before any"
              echo "model ran. Check API credit balance, credentials, and model"
              echo "availability — this is not a defect in the pull request."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Archive the documentation-maintenance record
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-maintenance-${{ github.run_id }}
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 90
