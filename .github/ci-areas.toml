# The CI area map, one source (SP1-B). `vibey-gh ci-areas` reads this file and
# .github/ci-matrices.toml and turns a diff into the areas it touches, a tier and matrices.
#
# FAIL SAFE. A skipped required check counts as passing on GitHub, so a doubt is never a
# skip. A changed path that matches an `[areas.*]` glob narrows the work; a path that matches
# `[full]` forces the full tier; a path that matches NEITHER forces the full tier too and is
# named in the reasons. The test `test_the_repository_config_covers_every_tracked_file` runs
# against `git ls-files`, so an unmapped file is a defect that test finds, not a runtime
# surprise: add the path to an area (it affects only that area) or to `[full]` (it affects
# everything), and say why when it goes to `[full]`.
#
# Globs: `*` matches anything but `/`, `**` crosses `/`, `?` is one character but `/`, and a
# pattern must match the WHOLE path. A bare `*.md` therefore matches a root file only, which
# is why the root markdown is listed by exact name.

# Which events decide the tier by themselves, whatever the diff says.
[events]
# The merge queue, a dispatch and a schedule always run everything.
full = ["merge_group", "workflow_dispatch", "schedule"]
# These two are decided by the diff -- unless they target a branch in `full_base_refs`.
diff = ["pull_request", "push"]
# A pull request into the release branch (promotion) and a push to it run everything.
full_base_refs = ["main"]

[areas.python]
paths = ["src/vibey/**", "tests/**"]

[areas.tools]
paths = ["src/vibey_tools/**", "src/vibey_runners/**"]

[areas.vscode]
# A change to the shared core affects both of its consumers, the extension and the app. The
# gh tenant source is here too: the extension and the app jobs (and `vibey-core`) run
# `pip install -e src/vibey_tools/gh && vibey-gh advisory-check`.
paths = ["clients/vscode/**", "packages/vibey-core/**", "src/vibey_tools/gh/**"]

[areas.app]
paths = ["clients/app/**", "packages/vibey-core/**", "src/vibey_tools/gh/**"]

[areas.krypton_app]
paths = ["clients/krypton-app/**"]

[areas.desktop]
# tests/cli/golden/vibey-loops.json is a python-tree file that clients/desktop/tests/meson.build reads.
paths = ["clients/desktop/**", "tests/cli/golden/vibey-loops.json"]

[areas.deploy]
paths = ["deploy/**"]

[areas.docs]
paths = [
  "docs/**",
  "docs-src/**",
  "docs-theme/**",
  "properdocs.yml",
  # The root markdown by exact name: a bare `*.md` matches root files only, and a new root
  # file should be a decision, so each is listed.
  # DECIDED (SP1-B Task 3): README.md is copied into the container image
  # (deploy/docker/Dockerfile), and a docs change still does NOT trigger the `image` job. An
  # edit to its text cannot break the build. A deletion or rename would; the root gates, which
  # run on every diff, fail on it (tests/meta/test_ci_tiers_keep_every_row.py asserts that
  # every file the Dockerfile COPYs exists). test_container_context.py is a different check:
  # it only pins that those files are not dockerignored.
  "README.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "SUPPORT.md",
  "CHANGELOG.md",
  "CLAUDE.md",
  "AGENTS.md",
  "GEMINI.md",
]

[full]
# The classifier and its maps are here: the plan job runs the PULL REQUEST's own copy of
# vibey_gh, so a change to them must not be able to choose its own tier. `.github/**` already
# covers both TOMLs. The classifier registration in vibey_gh/cli.py is not separable from the
# rest of the CLI and is not listed. Running the classifier from the BASE revision instead is
# the open follow-up.
#
# A change to any of these runs the full tier: each one can change what EVERY job does, or is
# read by a test of the root suite, which runs on every diff.
paths = [
  # --- the pipeline and its own inputs
  ".github/**",                # workflows, this map and the matrices, actions, templates
  "scripts/**",                # 65 root test files read it; it drives the gates themselves
  "pyproject.toml",
  "uv.lock",
  ".node-version",
  "package.json",
  "package-lock.json",
  ".importlinter",
  ".python-version",
  ".vibey-gh.toml",
  # --- trees whose consumers are everywhere
  "design/**",
  "research/**",
  "changelog.d/**",
  # --- the classifier itself, and what pins its rows
  "src/vibey_tools/gh/vibey_gh/ci_areas.py",
  "src/vibey_tools/gh/vibey_gh/interfaces/ci_areas_interface.py",
  "src/vibey_tools/gh/test/test_ci_areas.py",
  "tests/meta/ci_matrix_snapshot.json",
  # --- the agent surfaces: skills, rules and hooks that a test and a gate both read
  ".claude/**",
  ".agent*/**",                # .agent/ and .agents/
  ".cursor/**",
  ".githooks/**",
  ".vibey/**",
  # --- beyond the list the plan named: tracked files no area owns. Each can reach a job, so
  # --- each is full rather than skippable
  ".gitignore",                # read by the provisioning code and its tests
  ".dockerignore",             # test_container_context.py pins it; it shapes the image build
  ".pre-commit-config.yaml",   # the commit hooks; tests/meta pins what the framework reaches
  "LICENSE",                   # packaged into the sdist and the image, injected into the docs
  "CITATION.cff",              # the paper-publishability gate reads it
  "skills-lock.json",          # pins the agent skills; nothing proves no job reads it
  "screenshots/**",            # generated by a script, shipped in the docs and budgeted in the sdist
  ".claude-plugin/**",         # the plugin marketplace manifest, copied into the image and checked in CI
  "googleebf918639d02415d.html",  # the search-console verification file, published by release-surfaces.yml
  "CODE_OF_CONDUCT.md",        # a root markdown that is not on the docs list; linked from the PR template
]

# Which areas select which area-skippable job of ci.yml. The workflow's `if:` expressions are
# held to this table by tests/meta/test_ci_tiers_keep_every_row.py (a typo such as 'vscod' in
# an `if:` fails there). For the three matrix jobs it must equal what .github/ci-matrices.toml
# selects on (`areas` plus `select_on`), which a test also pins.
[jobs]
noloss = ["python"]
postgres-compatibility = ["python", "deploy"]
tools = ["tools", "docs"]
tools-lint = ["tools", "python"]
image = ["python", "tools", "deploy"]
cluster-smoke = ["python", "tools", "deploy"]
chart = ["python", "tools", "deploy"]
krypton-app = ["krypton_app"]
vibey-core = ["vscode", "app"]
app = ["vscode", "app"]
vscode-extension-ubuntu = ["vscode"]
vscode-extension-macos = ["vscode"]
desktop = ["desktop"]
