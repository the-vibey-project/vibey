name: Chat

# vibey's own agent, inside GitHub (docs/continuation/chat.md, ADR-0081). A trusted person
# writes `/vibey <request>` in an issue or pull-request comment, or runs this workflow from
# the Actions tab; an open-weights model on a GitHub runner answers in the same thread.
#
# Three jobs, so no job that runs the model can write anything:
#   gate  -- answers only the people [chat] trusted names (12.j), never a bot; gathers the
#            thread as text from develop, never a pull request's own code.
#   think -- runs the model with no write permission and no secret; hands over its reply and
#            its patch.
#   reply -- on a fresh runner, always: posts the defused reply (or the reason there is none)
#            and, for `/vibey act`, applies the patch only through the shared guard, as a draft.
# Every value a person wrote reaches a shell through `env:`, never `${{ }}` interpolation.
# `scripts/continuation_prompts.py check` fails on every pull request if this lane loses a guard.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      message:
        description: "What to ask vibey"
        required: true
        type: string
      number:
        description: "Issue or pull request to answer in (blank: the run summary)"
        required: false
        type: string
      mode:
        description: "answer, or act (may open a draft pull request)"
        required: false
        default: answer
        type: choice
        options: [answer, act]

permissions:
  contents: read

concurrency:
  group: chat-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  gate:
    name: Decide whether to answer
    # A cheap literal filter first, so an ordinary comment starts no runner work.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.comment.body, '/vibey') && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      go: ${{ steps.decide.outputs.go }}
      mode: ${{ steps.decide.outputs.mode }}
      number: ${{ steps.decide.outputs.number }}
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          persist-credentials: false
      - name: Decide, from the declared trust list
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BODY: ${{ github.event.comment.body }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          INPUT_MESSAGE: ${{ inputs.message }}
          INPUT_NUMBER: ${{ inputs.number }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/turn"
          python3 - <<'PY'
          import os, re, tomllib, pathlib
          chat = tomllib.loads(pathlib.Path("scripts/continuation_prompts.toml").read_text())["chat"]
          out = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          turn = pathlib.Path(os.environ["RUNNER_TEMP"]) / "turn"
          trigger = chat["trigger"]
          if os.environ["EVENT"] == "workflow_dispatch":
              go, text = True, os.environ["INPUT_MESSAGE"]
              mode = os.environ.get("INPUT_MODE") or "answer"
              number = os.environ.get("INPUT_NUMBER", "").strip()
          else:
              body = os.environ["BODY"]
              # Only the declared trusted associations are answered (12.j).
              go = os.environ["ASSOCIATION"] in chat["trusted"] and body.startswith(trigger)
              text = body[len(trigger):].strip()
              mode = "act" if re.match(r"act\b", text) else "answer"
              if mode == "act":
                  text = text[3:].strip()
              number = os.environ["ISSUE_NUMBER"]
          if not re.fullmatch(r"\d*", number):
              go, number = False, ""
          (turn / "request.txt").write_text(text)
          with out.open("a") as f:
              f.write(f"go={'true' if go and text else 'false'}\nmode={mode}\nnumber={number}\n")
          print(f"go={go} mode={mode} number={number or '(run summary)'}")
          PY
      - name: Acknowledge, and gather the conversation as text
        if: steps.decide.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ steps.decide.outputs.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          thread="$RUNNER_TEMP/turn/thread.txt"
          : > "$thread"
          if [ "$EVENT" = "issue_comment" ]; then
            gh api -X POST "repos/$GH_REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes >/dev/null || true
          elif [ "$EVENT" = "pull_request_review_comment" ]; then
            gh api -X POST "repos/$GH_REPO/pulls/comments/$COMMENT_ID/reactions" -f content=eyes >/dev/null || true
          fi
          if [ -n "$NUMBER" ]; then
            # Read as text through the API; a pull request's code is never checked out here.
            gh issue view "$NUMBER" --comments >> "$thread" 2>/dev/null || true
            if gh pr view "$NUMBER" --json number >/dev/null 2>&1; then
              { echo; echo "--- the pull request's diff, as text ---"; gh pr diff "$NUMBER"; } >> "$thread" 2>/dev/null || true
            fi
          fi
          wc -c "$thread"
      - name: Hand the turn over
        if: steps.decide.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chat-turn
          path: ${{ runner.temp }}/turn/
          retention-days: 7

  think:
    name: Think (open weights, no write access)
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          persist-credentials: false
      - name: Take the turn
        uses: actions/download-artifact@v4
        with:
          name: chat-turn
          path: ${{ runner.temp }}/turn/
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install vibey (the runner and its tools)
        run: python -m pip install --quiet -e . -e src/vibey_tools/gh
      - name: Start an open-weights model, with every declared fallback
        id: model
        run: |
          set -uo pipefail
          # Ollama's installer first; its own GitHub release if the installer is unreachable.
          if ! curl -fsSL https://ollama.com/install.sh | sh; then
            echo "::warning::the Ollama installer failed; installing Ollama's GitHub release instead"
            url=$(curl -fsSL https://api.github.com/repos/ollama/ollama/releases/latest \
              | python3 -c "import json,sys; print(next(a['browser_download_url'] for a in json.load(sys.stdin)['assets'] if a['name']=='ollama-linux-arm64.tar.zst'))")
            curl -fsSL "$url" | sudo tar --zstd -x -C /usr/local
          fi
          (ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &)
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:11434/api/version >/dev/null && break; sleep 2; done
          for m in $(python scripts/continuation_prompts.py models); do
            if ollama pull "$m"; then echo "model=$m" >> "$GITHUB_OUTPUT"; echo "using $m"; exit 0; fi
            echo "::warning::could not pull $m; trying the next declared model"
          done
          echo "::error::no declared model could be pulled"
          exit 1
      - name: Think
        id: agent
        env:
          GPTOSSLOOP_MODEL: ${{ steps.model.outputs.model }}
          MODE: ${{ needs.gate.outputs.mode }}
        run: |
          set -uo pipefail
          python scripts/continuation_prompts.py chat "$MODE" "$RUNNER_TEMP/turn/request.txt" "$RUNNER_TEMP/turn/thread.txt" > "$RUNNER_TEMP/plan.md"
          turns=$(python3 -c "import tomllib;print(tomllib.load(open('scripts/continuation_prompts.toml','rb'))['chat']['max_turns'])")
          minutes=$(python3 -c "import tomllib;print(tomllib.load(open('scripts/continuation_prompts.toml','rb'))['chat']['timeout_minutes'])")
          timeout "${minutes}m" gptossloop run "$RUNNER_TEMP/plan.md" --cwd . --max-turns "$turns" > "$RUNNER_TEMP/agent.log" 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Hand over the reply and the patch
        if: always()
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          reply=$(python3 -c "import tomllib;print(tomllib.load(open('scripts/continuation_prompts.toml','rb'))['chat']['reply_file'])")
          [ -f "$reply" ] && mv "$reply" "$out/reply.md"
          echo "${{ steps.agent.outputs.code }}" > "$out/code"
          echo "${{ steps.model.outputs.model }}" > "$out/model"
          tail -c 4000 "$RUNNER_TEMP/agent.log" > "$out/agent-tail.log" 2>/dev/null || true
          git add -A && git diff --cached --binary > "$out/change.patch"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-answer
          path: ${{ runner.temp }}/out/
          retention-days: 7

  reply:
    name: Reply (fresh runner, always)
    needs: [gate, think]
    if: always() && needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out a clean copy, where no model ran
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          persist-credentials: false
      - name: Take the answer
        id: take
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: chat-answer
          path: ${{ runner.temp }}/out/
      - name: Act — apply the patch through the shared guard, as a draft
        id: act
        if: needs.gate.outputs.mode == 'act' && steps.take.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ needs.gate.outputs.number }}
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/out/change.patch"
          if [ ! -s "$patch" ]; then echo "no change"; exit 0; fi
          if ! python3 scripts/continuation_prompts.py guard "$patch"; then
            echo "refused=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git apply --index "$patch"
          gh auth setup-git
          branch="chat/${NUMBER:-run}-${{ github.run_id }}"
          git switch --create "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(chat): change asked for in #${NUMBER:-a chat run}" \
            -m "Made-With: Made with ❤️ by [Vibey](https://the-vibey-project.github.io/vibey/), Developed by [Adam Matthew Steinberger](https://vibewithadam.matthewsteinberger.com/) ([@adammatthewsteinberger](https://github.com/adammatthewsteinberger/))."
          git push origin "HEAD:$branch"
          url=$(gh pr create --draft --base develop --head "$branch" \
            --title "chore(chat): change asked for in #${NUMBER:-a chat run}" \
            --body "Opened by vibey's chat (docs/continuation/chat.md) from run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Written by an open-weights model on a GitHub runner; a draft for a person to review.")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Reply, with the answer or the reason there is none
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ needs.gate.outputs.number }}
          THINK: ${{ needs.think.result }}
          PR_URL: ${{ steps.act.outputs.url }}
          REFUSED: ${{ steps.act.outputs.refused }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"; draft="$RUNNER_TEMP/draft.md"; body="$RUNNER_TEMP/body.md"
          # Every file in $out was written on the model's runner, so all of it is untrusted:
          # the whole comment is defused below, not only the reply.
          model=$(head -c 80 "$out/model" 2>/dev/null || echo "no model")
          code=$(head -c 12 "$out/code" 2>/dev/null || echo unknown)
          if [ -s "$out/reply.md" ]; then
            cat "$out/reply.md" > "$draft"
          else
            {
              echo "I could not answer this time: the model job ended **$THINK** (exit $code) without writing a reply."
              echo
              echo "The run's log is at [this run]($RUN_URL). Ask again, or a person can pick it up."
            } > "$draft"
          fi
          {
            echo
            if [ -n "$PR_URL" ]; then echo "A draft pull request with the change: $PR_URL"; fi
            if [ "$REFUSED" = "yes" ]; then echo "The change touched a path an automated run may not change (workflows, the canon, the declared state), so it was refused whole and no pull request was opened."; fi
            echo
            echo "<sub>vibey chat · $model on a GitHub runner · [run]($RUN_URL) · answers are model output; check before relying on them</sub>"
          } >> "$draft"
          python3 scripts/continuation_prompts.py defuse "$draft" > "$body"
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body-file "$body"
          else
            cat "$body" >> "$GITHUB_STEP_SUMMARY"
          fi
