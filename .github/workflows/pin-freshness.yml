name: Pin freshness

# A commit pin never moves by itself, and Dependabot cannot take the hand-written workflows
# over (its ignore list protects the managed templates and is by dependency, not by file), so
# a pin written once would go stale silently. Once a week `vibey-gh pin-actions --check-stale`
# re-resolves every pin's `# <ref>` comment and keeps ONE tracking issue open while any pin is
# stale or cannot be checked, closing it when none is. The issue names the one command that
# moves them (`pin-actions --refresh`) and the change lands as an ordinary pull request: a
# moved pin changes what runs in the pipeline, so a person reads the diff. Nothing here pushes.
# `[pin_actions]` in .vibey-gh.toml holds actions back and labels the issue.
on:
  schedule:
    # Tuesday 05:37 UTC: clear of the weekend, the Sabbath and the other weekly lanes.
    - cron: "37 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pin-freshness-${{ github.repository }}
  cancel-in-progress: false

jobs:
  freshness:
    name: Keep one issue open while a pin is stale
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read the tree, write one issue, nothing else.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the repository-owned tooling
        run: python -m pip install --quiet -e src/vibey_tools/gh

      - name: Open, update or close the stale-pin issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          vibey-gh pin-actions --check-stale --tracking-issue | tee -a "$GITHUB_STEP_SUMMARY"
