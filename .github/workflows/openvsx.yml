name: Open VSX

# Publishes the VS Code extension (clients/vscode) to Open VSX after a SUCCESSFUL Release on
# main -- its own workflow, so this optional channel can never decide what `Release` concluded.
# It used to be a job of vibey-engine.yml: with no OVSX_PAT it failed, the whole Release run
# failed with it, and github-release.yml and release-surfaces.yml, which follow only a
# successful Release, never ran. 3.0.0 reached PyPI with no tag, no GitHub Release and no
# documentation, for want of a credential on a channel nothing else depends on.
#
# Declared only (ADR-0059, #290): the token needs the operator's Open VSX account. Without
# it this says so as a warning and keeps ONE tracking issue open until a token exists
# (`vibey-gh tracking-issue`); with it, a publish that fails fails THIS workflow, loudly.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]
  # Recovery: re-publish main's tip by hand. Dispatched from any other branch it does nothing.
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time and never a half-cancelled upload; `--skip-duplicate` makes a
# repeat of the same version a no-op.
concurrency:
  group: openvsx-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the VS Code extension to Open VSX
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write              # the one tracking issue for a missing token
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The released commit, which is main's: a Release run is only ever for a push to (or
      # a dispatch on) a permanent branch, and the `if:` above admits main alone.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the tree's own vibey-gh
        run: python -m pip install --quiet -e src/vibey_tools/gh

      - name: Without a token, say so and keep it tracked
        if: env.OVSX_PAT == ''
        run: |
          set -euo pipefail
          echo "::warning::OVSX_PAT is not set, so the VS Code extension was NOT published to Open VSX. The release itself is unaffected."
          echo "The VS Code extension was **not published** to Open VSX: \`OVSX_PAT\` is not set." >> "$GITHUB_STEP_SUMMARY"
          vibey-gh tracking-issue raise \
            --key openvsx-token \
            --title "Open VSX: the VS Code extension is not being published (OVSX_PAT is not set)" \
            --body "Every release on \`main\` skips the Open VSX channel because the repository has no \`OVSX_PAT\` secret (ADR-0059, #290). Creating the token needs the operator's Open VSX account. This issue closes itself after the first successful publish (openvsx.yml)."

      - uses: actions/setup-node@v7
        if: env.OVSX_PAT != ''
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build and package
        if: env.OVSX_PAT != ''
        working-directory: clients/vscode
        run: |
          set -euo pipefail
          npm ci --prefix ../..
          npm run compile
          npx vsce package --no-dependencies --out krypton.vsix
      # Open VSX publishes only into a namespace that exists, and nothing ever created this
      # one: the first publish of `the-vibey-project.krypton` would fail on that alone. The
      # namespace is the manifest's `publisher`, never a second spelling of it. Creating it
      # is idempotent here: "already exists" is the one refusal that means the work is done;
      # any other failure (a bad token, a network fault) fails this step and the publish never
      # runs. A namespace someone else already holds also reads "already exists"; the publish
      # below then fails loudly on access rights, which is the right place to learn it.
      - name: Make sure the publisher's namespace exists
        if: env.OVSX_PAT != ''
        working-directory: clients/vscode
        run: |
          set -euo pipefail
          namespace=$(node -p "require('./package.json').publisher")
          if said=$(npx ovsx create-namespace "$namespace" --pat "$OVSX_PAT" 2>&1); then
            echo "Created the Open VSX namespace $namespace."
          elif grep -qi 'already exists' <<<"$said"; then
            echo "The Open VSX namespace $namespace already exists."
          else
            echo "$said" >&2
            echo "::error::Could not create the Open VSX namespace $namespace."
            exit 1
          fi
      - name: Publish, once per version
        if: env.OVSX_PAT != ''
        working-directory: clients/vscode
        run: npx ovsx publish krypton.vsix --pat "$OVSX_PAT" --skip-duplicate
      - name: Close the missing-token issue, if one is open
        if: env.OVSX_PAT != ''
        run: |
          set -euo pipefail
          vibey-gh tracking-issue resolve \
            --key openvsx-token \
            --comment "Published to Open VSX from ${GITHUB_SHA}; OVSX_PAT is set. Closing."
