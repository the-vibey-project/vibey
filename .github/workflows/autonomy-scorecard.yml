name: Autonomy scorecard

# How far vibey is from full autonomy is a measurement, repeated weekly, never a paragraph
# written once (docs/reference/autonomy.md). Once a week, and by hand, the forge and the
# review canary and the queue are observed on GitHub-hosted runners, read only
# (`scripts/autonomy_scorecard.py observe`); the queue only where a reachable read-only DSN
# is declared as the `VIBEY_AUTONOMY_QUEUE_DSN` secret, and unknown otherwise. The publish job
# folds what each handed over into one new line of the append-only record (`record`): a
# source that handed nothing over keeps its last values, marked stale with their date, and
# shows as unknown after `max_stale_days`. The page, the README's summary, the landing page
# and the paper's table are re-rendered from that line, `check` runs, and the result lands
# as a pull request through the normal merge train; nothing here pushes to develop.
on:
  schedule:
    # Thursday 07:13 UTC: the day after the review canary's Wednesday measurement, so the
    # trust stage reads a fresh one, and clear of minimum-specs.yml (Monday) and the Sabbath.
    - cron: "13 7 * * 4"
  workflow_dispatch:

permissions:
  contents: read

# One refresh at a time: each appends to the same record, so two must never race to it.
# A queued run waits rather than cancels one in flight.
concurrency:
  group: autonomy-scorecard-${{ github.repository }}
  cancel-in-progress: false

jobs:
  forge:
    name: Observe the forge, the review canary and the code
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Read-only: merged pull requests and their reviews, check runs, rulesets and workflow
    # runs. The token never writes from this job.
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # The scorecard's record goes through vibey-gh's ledger, and the trust stage is the
      # canary's own `review-canary status`: the tree's vibey-gh answers both.
      - name: Install the repository-owned tooling
        run: python -m pip install --quiet -e src/vibey_tools/gh

      - name: Observe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p observed
          python scripts/autonomy_scorecard.py observe --sources forge,canary,repo \
            --out observed/forge.json

      - name: Hand the observation over
        uses: actions/upload-artifact@v4
        with:
          name: autonomy-observed-forge
          path: observed/forge.json
          if-no-files-found: error
          retention-days: 14

  queue:
    name: Observe the local queue (read only)
    # A GitHub-hosted runner, like every job in CI (the operator's decision, 2026-10-03). The
    # queue's DSN is the `VIBEY_AUTONOMY_QUEUE_DSN` secret: a read-only role on a queue this
    # runner can reach. Unset -- the case until such a queue is declared -- every queue figure
    # is recorded unknown with that reason and carried forward, never observed as zero from
    # an empty database. The session the scorecard opens has `default_transaction_read_only=on`.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7

      - name: Observe
        env:
          VIBEY_AUTONOMY_QUEUE_DSN: ${{ secrets.VIBEY_AUTONOMY_QUEUE_DSN }}
        run: |
          set -euo pipefail
          mkdir -p observed
          uv run --no-project --python 3.12 --with ./src/vibey_tools/gh \
            python scripts/autonomy_scorecard.py observe --sources queue --out observed/queue.json

      - name: Hand the observation over
        uses: actions/upload-artifact@v4
        with:
          name: autonomy-observed-queue
          path: observed/queue.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Open the scorecard pull request
    needs: [forge, queue]
    # Either observation may have failed, and what did not report is carried forward as
    # stale by `record`, so this runs unless the run was cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Take the observations
        uses: actions/download-artifact@v4
        with:
          pattern: autonomy-observed-*
          path: observed
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the repository-owned tooling
        run: python -m pip install --quiet -e src/vibey_tools/gh

      # With no observation at all, `record` refuses (sub-doctrine 10.f: no record is
      # better than a record of nothing), and this job fails out loud.
      - name: Record and render
        run: |
          set -euo pipefail
          shopt -s nullglob
          python scripts/autonomy_scorecard.py record observed/*.json
          {
            echo "## Autonomy scorecard"
            sed -n '/BEGIN GENERATED autonomy:summary/,/END GENERATED autonomy:summary/p' README.md
          } >> "$GITHUB_STEP_SUMMARY"

      # The same check CI runs: the chain holds, the verdicts follow from the figures, and
      # every generated block shows the latest line.
      - name: Check the record against the documents
        run: python scripts/autonomy_scorecard.py check

      - name: Commit and open the pull request
        # The Actions token may not open pull requests here, so the pull request is opened
        # with the token every other workflow uses for that, falling back to the Actions
        # token where the secret is not set (a fork) so the push still lands.
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="chore/autonomy-scorecard-$(date -u +%Y-%m-%d)"
          git switch --force-create "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/evidence/autonomy-scorecard.jsonl \
            docs/reference/autonomy.md README.md docs/index.md docs/paper.md
          if git diff --cached --quiet; then
            echo "the autonomy scorecard is unchanged"
            exit 0
          fi
          git commit -m "chore(autonomy): refresh the autonomy scorecard" \
            -m "Made-With: Made with ❤️ by [Vibey](https://the-vibey-project.github.io/vibey/), Developed by [Adam Matthew Steinberger](https://vibewithadam.matthewsteinberger.com/) ([@adammatthewsteinberger](https://github.com/adammatthewsteinberger/))."
          git push --force-with-lease="refs/heads/$branch" origin "HEAD:$branch"
          pr_number="$(gh pr list --repo "$GH_REPO" --head "$branch" --base develop --state open --json number --jq '.[0].number')"
          if [ -n "$pr_number" ]; then
            echo "updated the existing autonomy-scorecard pull request #$pr_number"
          else
            gh pr create \
              --repo "$GH_REPO" \
              --base develop \
              --head "$branch" \
              --title "chore(autonomy): refresh the autonomy scorecard" \
              --body "Weekly measurement of how far vibey is from full autonomy (\`scripts/autonomy_scorecard.py\`): the forge and the review canary observed on a GitHub-hosted runner, the local queue on the self-hosted runner, read only. One line is appended to the append-only record, and docs/reference/autonomy.md, the README's and the landing page's summaries and the paper's table are re-rendered from it. A source that could not be read keeps its last values, marked stale with their date. Merge through the repository's normal train after the checks pass."
          fi
