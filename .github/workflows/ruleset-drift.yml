name: Ruleset drift

# Read-only: `vibey-gh rulesets --check` compares every live repository ruleset with what
# .vibey-gh.toml renders and fails on any difference -- a declared ruleset that drifted,
# a rule nobody declared, and any undeclared ruleset with its bypass actors named. It
# never creates, updates or deletes one; `repository-profile.yml` reconciles, this audits.
# A read-only audit found a hand-made ruleset beside the declared one, with a bypass actor
# the declaration does not grant, and nothing had said so.
on:
  schedule:
    - cron: "41 6 * * *"
  # A change to the declaration is drift until somebody reconciles it -- say so at once.
  push:
    branches: [develop, main]
    paths: [".vibey-gh.toml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 12.g-whole-state: every run compares the WHOLE live rule set with the whole
  # declaration, so a cancelled run is subsumed by the next and loses nothing.
  group: ruleset-drift-${{ github.repository }}
  cancel-in-progress: true

jobs:
  check:
    name: Live rulesets match the declaration
    if: true
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install vibey-gh
        run: |
          set -euo pipefail
          # Where this repository keeps its own copy of the tooling, from
          # `[install] self_source` in .vibey-gh.toml -- a DECLARED path, never a search.
          # Searching the tree for a pyproject declaring `name = "vibey-gh"` would read a
          # pull request's own files: a branch that adds one anywhere gets it installed
          # here, with this job's permissions, and hands the provenance gate a tool of the
          # contributor's choosing. The path is verified below before anything runs.
          self="src/vibey_tools/gh"
          # Verified, not assumed: a misconfigured path must fall back to the published
          # release rather than install whatever happens to sit there. That release is
          # `vibey`: `vibey_gh` ships inside it, not as a project of its own (ADR-0037).
          grep -qE '^name = "vibey-gh"' "$self/pyproject.toml" 2>/dev/null || self=""
          if [ -n "$self" ]; then
            python -m pip install --quiet -e "$self"
          else
            python -m pip install --quiet "vibey-engine==4.3.0"
          fi
          command -v vibey-gh >/dev/null || { echo "::error::vibey-gh is not installed"; exit 1; }
      - name: Compare the live rulesets with the declaration
        env:
          # The forge hides a ruleset's bypass actors from a token without repository-admin
          # authority, and an audit that cannot see them cannot clear them. Without the
          # secret this says, as a warning, that nothing was checked -- never that it passed.
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::ruleset drift NOT checked: AUTOMERGE_TOKEN is not configured, and the rulesets API withholds bypass actors from a token without repository-admin authority"
            echo "Ruleset drift was **not checked**: no repository-admin token." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          vibey-gh rulesets --check | tee -a "$GITHUB_STEP_SUMMARY"
