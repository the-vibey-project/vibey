name: Delivery estimate

# Once an hour, and by hand -- never per event (the operator, 2026-09-24). Every push, pull
# request and issue event used to start a run, and each publish opened or updated the
# estimate pull request, so the ledger moved many times an hour while each move went
# unchecked behind `[skip ci]`. Now the estimate refreshes hourly, and its pull request runs
# every CI gate, like any other change to develop.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

# One run at a time, keyed on the repository: the publish job commits the ledger, so two
# refreshes must never overlap. With only the hourly schedule and manual dispatch left, no
# unrelated lane shares the slot any more (the pull-request lane of ADR-0050 is gone).
concurrency:
  # 12.g-whole-state: every run recomputes the estimate from the whole tracker rather than
  # advancing a cursor, so a cancelled run leaves no gap -- the next one derives the same
  # answer from scratch. That is why `cancel-in-progress` is true.
  group: delivery-estimate-${{ github.repository }}-ledger
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh delivery estimate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the repository-owned estimator
        run: python -m pip install --quiet -e src/vibey_tools/gh

      - name: Refresh the estimate and job summary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          vibey-gh forecast

  publish:
    name: Publish changed estimate ledger and report
    # Only repository-controlled automation may receive contents: write. In particular,
    # an issue can be opened by anyone, so an `issues` event may refresh a read-only
    # estimate but must never reach the commit-and-push job.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the repository-owned estimator
        run: python -m pip install --quiet -e src/vibey_tools/gh

      - name: Refresh the integration estimate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          vibey-gh forecast
          # The paper's forecast figure is generated from the ledger `forecast` just
          # appended to, so the pull request carries both or neither (sub-doctrine 12.e).
          # Without this, #1125 merged a new record and every branch's pre-push failed
          # tests/meta/test_paper_figures.py on develop. The history figures stay pinned
          # to the revision in the paper's markers; only the forecast block moves.
          python scripts/paper_figures.py

      - name: Publish the changed estimate ledger and report
        # The Actions token may not open pull requests here ("GitHub Actions is not
        # permitted to create or approve pull requests"), so the pull request is opened
        # with the same token every other workflow uses for that, falling back to the
        # Actions token where the secret is not set (a fork) so the push still lands.
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          ESTIMATE_BRANCH: automation/delivery-estimate
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$ESTIMATE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$ESTIMATE_BRANCH"
          fi
          git fetch origin develop
          git switch --force-create "$ESTIMATE_BRANCH" origin/develop
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .vibey/delivery-estimates.jsonl docs/estimate.md docs/paper.md
          if git diff --cached --quiet; then
            echo "delivery estimate is unchanged"
            exit 0
          fi
          git commit -m "chore(estimate): refresh delivery forecast" \
            -m "Made-With: Made with ❤️ by [Vibey](https://the-vibey-project.github.io/vibey/), Developed by [Adam Matthew Steinberger](https://vibewithadam.matthewsteinberger.com/) ([@adammatthewsteinberger](https://github.com/adammatthewsteinberger/))."
          git push --force-with-lease="refs/heads/$ESTIMATE_BRANCH" origin "HEAD:$ESTIMATE_BRANCH"
          pr_number="$(gh pr list --repo "$GH_REPO" --head "$ESTIMATE_BRANCH" --base develop --state open --json number --jq '.[0].number')"
          if [ -n "$pr_number" ]; then
            echo "updated the existing delivery-estimate pull request"
          else
            gh pr create \
              --repo "$GH_REPO" \
              --base develop \
              --head "$ESTIMATE_BRANCH" \
              --title "chore(estimate): refresh delivery forecast" \
              --body "Automated refresh of the append-only delivery estimate ledger and report. Merge through the repository's normal train after the generated diff passes its checks."
          fi
