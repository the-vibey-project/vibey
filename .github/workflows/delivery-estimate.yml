name: Delivery estimate

on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, closed, reopened, synchronize, labeled, unlabeled]
  issues:
    types: [opened, closed, reopened, labeled, unlabeled, milestoned, demilestoned]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

# One repository-wide group was the right mutex for the wrong set of runs. Every event
# shared it, so a pull request's estimate check cancelled an unrelated pull request's, and
# either one cancelled the integration branch's ledger refresh. Measured over the hundred
# runs before this was written: 72 cancelled, 50 of them `pull_request` -- fifty pull
# requests whose estimate was computed far enough to spend a runner and never far enough
# to report (sub-doctrine 12.g, ADR-0050).
#
# What the two lanes actually contend for is different, so they are keyed differently:
#
#   - A `pull_request` run checks out that pull request's head and runs `forecast
#     --no-record --no-report`. It writes nothing and shares nothing, so it contends only
#     with its own older run, which a newer commit should still supersede.
#   - Every other event refreshes the published ledger on the integration branch and the
#     `publish` job commits it. Those genuinely must not overlap, so they keep the single
#     repository-wide group they always had, unchanged.
#
# `cancel-in-progress` stays true for both: an estimate is a whole-state recompute, so the
# newer run subsumes the older rather than continuing it, and nothing is lost by stopping.
concurrency:
  # 12.g-whole-state: every event here recomputes the estimate from the whole tracker
  # rather than advancing a cursor, so a cancelled run leaves no gap -- the next one
  # derives the same answer from scratch. That is why `cancel-in-progress` is true for
  # the ledger lane as well as the read-only one.
  # Written on one line on purpose: a folded scalar keeps the newlines of its
  # more-indented lines, which would put literal newlines inside the group name.
  group: delivery-estimate-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'ledger' }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh delivery estimate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # PR validation must execute the exact proposed head.  Every other
          # event refreshes the integration branch's continuously published
          # estimate.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'develop' }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the repository-owned estimator
        run: python -m pip install --quiet -e src/vibey_tools/gh

      - name: Refresh the estimate and job summary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            vibey-gh forecast --no-record --no-report
          else
            vibey-gh forecast
          fi

  publish:
    name: Publish changed estimate ledger and report
    # Only repository-controlled automation may receive contents: write. In particular,
    # an issue can be opened by anyone, so an `issues` event may refresh a read-only
    # estimate but must never reach the commit-and-push job.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the repository-owned estimator
        run: python -m pip install --quiet -e src/vibey_tools/gh

      - name: Refresh the integration estimate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          vibey-gh forecast

      - name: Publish the changed estimate ledger and report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ESTIMATE_BRANCH: automation/delivery-estimate
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$ESTIMATE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$ESTIMATE_BRANCH"
          fi
          git fetch origin develop
          git switch --force-create "$ESTIMATE_BRANCH" origin/develop
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .vibey/delivery-estimates.jsonl docs/estimate.md
          if git diff --cached --quiet; then
            echo "delivery estimate is unchanged"
            exit 0
          fi
          git commit -m "chore(estimate): refresh delivery forecast [skip ci]" \
            -m "Made-With: Made with ❤️ by [Vibey](https://the-vibey-project.github.io/vibey/), Developed by [Adam Matthew Steinberger](https://vibewithadam.matthewsteinberger.com/) ([@adammatthewsteinberger](https://github.com/adammatthewsteinberger/))."
          git push --force-with-lease="refs/heads/$ESTIMATE_BRANCH" origin "HEAD:$ESTIMATE_BRANCH"
          pr_number="$(gh pr list --repo "$GH_REPO" --head "$ESTIMATE_BRANCH" --base develop --state open --json number --jq '.[0].number')"
          if [ -n "$pr_number" ]; then
            echo "updated the existing delivery-estimate pull request"
          else
            gh pr create \
              --repo "$GH_REPO" \
              --base develop \
              --head "$ESTIMATE_BRANCH" \
              --title "chore(estimate): refresh delivery forecast" \
              --body "Automated refresh of the append-only delivery estimate ledger and report. Merge through the repository's normal train after the generated diff passes its checks."
          fi
