name: GitHub Release

# Package publication owns artifact verification. This workflow reacts only after that
# release succeeds on the configured release branch, then creates an immutable tag and
# an idempotent GitHub Release for the exact released commit.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: "Exact release commit SHA (blank uses the selected ref)"
        required: false
        type: string

# Read-only by default; only the publish job, after the proof, may write.
permissions:
  contents: read

concurrency:
  group: github-release-${{ inputs.target || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    # Read-only. Proves the commit is one this workflow may release BEFORE anything with
    # write access runs. A `workflow_run` event already carries that proof: GitHub only
    # delivers it for a completed run of the release workflow, and the gate below requires
    # success on the release branch. A manual dispatch carries none -- its target is
    # whatever SHA the dispatcher typed -- so the proof is re-established from the API:
    # the SHA must be contained in the release branch AND a successful run of the release
    # workflow must exist for exactly that commit on that branch.
    name: Prove the release commit
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      target: ${{ steps.prove.outputs.target }}
    steps:
      - id: prove
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TARGET: ${{ inputs.target }}
          SELECTED_SHA: ${{ github.sha }}
          RELEASE_BRANCH: main
          RELEASE_WORKFLOW: Release
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "target=$RUN_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          target="${INPUT_TARGET:-$SELECTED_SHA}"
          if ! printf '%s' "$target" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::target must be a full 40-character commit SHA, got '$target'"
            exit 1
          fi
          # Contained in the release branch: comparing the target to the branch tip is
          # 'identical' or 'ahead' only when the tip descends from the target.
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${target}...${RELEASE_BRANCH}" --jq .status)
          case "$status" in
            identical|ahead) ;;
            *)
              echo "::error::$target is not on $RELEASE_BRANCH (compare status: $status); refusing to release it"
              exit 1
              ;;
          esac
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$RELEASE_WORKFLOW" \
            --branch "$RELEASE_BRANCH" --commit "$target" --status success \
            --json databaseId --jq 'length')
          if [ "$runs" -lt 1 ]; then
            echo "::error::no successful '$RELEASE_WORKFLOW' run exists for $target on $RELEASE_BRANCH; refusing to release it"
            exit 1
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"

  publish:
    name: Tag and publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The tooling that runs with write access comes from the tip of the protected
      # release branch, never from the target checkout: the target is read as data (its
      # version file and configuration), and none of its code is installed or executed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: tooling
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.target }}
          path: target
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install trusted release tooling
        working-directory: tooling
        run: |
          set -euo pipefail
          # Where this repository keeps its own copy of the tooling, from
          # `[install] self_source` in .vibey-gh.toml -- a DECLARED path, never a search.
          # Searching the tree for a pyproject declaring `name = "vibey-gh"` would read a
          # pull request's own files: a branch that adds one anywhere gets it installed
          # here, with this job's permissions, and hands the provenance gate a tool of the
          # contributor's choosing. The path is verified below before anything runs.
          self="src/vibey_tools/gh"
          # Verified, not assumed: a misconfigured path must fall back to the published
          # release rather than install whatever happens to sit there. That release is
          # `vibey`: `vibey_gh` ships inside it, not as a project of its own (ADR-0037).
          grep -qE '^name = "vibey-gh"' "$self/pyproject.toml" 2>/dev/null || self=""
          if [ -n "$self" ]; then
            python -m pip install --quiet -e "$self"
          else
            python -m pip install --quiet "vibey==1.3.0"
          fi
      - name: Create immutable tag and GitHub Release
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ needs.verify.outputs.target }}
        run: vibey-gh github-release --target "$TARGET"
