name: Minimum specs

# vibey's minimum system requirements are a measurement, repeated weekly, never a list
# written once (docs/reference/system-requirements.md). Once a week, and by hand, the
# self-hosted sovereign runner re-measures what is cheap and deterministic enough -- the
# Python floor, cold installs and their downloads, PostgreSQL against the declared floor on a
# scratch database, the model's memory against context and its throughput (idle-gated) --
# re-derives the requirements and re-renders the page and the paper's table. The result
# lands as a pull request through the normal merge train; nothing here pushes to develop.
# A figure that could not be measured keeps its last value, marked stale, in the tables.
on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# One measurement at a time: two would contend for the one model slot and the GPU, and the
# idle gate would record each other as foreign load. A queued run waits rather than cancels
# a long measurement in flight.
concurrency:
  group: minimum-specs-${{ github.repository }}
  cancel-in-progress: false

jobs:
  measure:
    name: Measure on the sovereign runner
    runs-on: [self-hosted, vibey-local-vibey]
    timeout-minutes: 150
    # No write token on the self-hosted runner: it measures and hands the files over as an
    # artifact. Committing and opening the pull request happen on a hosted runner below.
    permissions:
      contents: read
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7

      - name: Measure, derive and render
        env:
          # A DSN that may create and drop the scratch database: from the repository secret
          # when one is set, otherwise from the runner's own environment. Unset, the
          # PostgreSQL figures are recorded as not measured and kept stale.
          SPECS_PG_ADMIN_URL_SECRET: ${{ secrets.VIBEY_SPECS_PG_ADMIN_URL }}
        run: |
          set -euo pipefail
          export VIBEY_SPECS_PG_ADMIN_URL="${SPECS_PG_ADMIN_URL_SECRET:-${VIBEY_SPECS_PG_ADMIN_URL:-}}"
          # The script is stdlib only; uv pins the interpreter so the host's own python3
          # (whatever version it is) never runs it.
          specs() { uv run --no-project --python 3.12 python scripts/minimum_specs.py "$@"; }
          specs measure
          specs render
          specs check
          {
            echo "## Minimum specs"
            sed -n '/BEGIN GENERATED specs:status/,/END GENERATED specs:status/p' \
              docs/reference/system-requirements.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hand the measured files over
        uses: actions/upload-artifact@v4
        with:
          name: minimum-specs
          path: |
            docs/architecture/evidence/minimum-specs.json
            docs/reference/system-requirements.md
            docs/paper.md
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Open the remeasure pull request
    needs: measure
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Take the measured files
        uses: actions/download-artifact@v4
        with:
          name: minimum-specs
          path: .

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # The same check CI runs: the record's derivations and every generated table agree.
      # A handed-over file that disagrees stops here instead of reaching a pull request.
      - name: Check the record against the tables
        run: python scripts/minimum_specs.py check

      - name: Commit and open the pull request
        # The Actions token may not open pull requests here, so the pull request is opened
        # with the token every other workflow uses for that, falling back to the Actions
        # token where the secret is not set (a fork) so the push still lands.
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="chore/minimum-specs-$(date -u +%Y-%m-%d)"
          git switch --force-create "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/evidence/minimum-specs.json \
            docs/reference/system-requirements.md docs/paper.md
          if git diff --cached --quiet; then
            echo "the minimum-specs record is unchanged"
            exit 0
          fi
          git commit -m "chore(specs): remeasure minimum requirements" \
            -m "Made-With: Made with ❤️ by [Vibey](https://the-vibey-project.github.io/vibey/), Developed by [Adam Matthew Steinberger](https://vibewithadam.matthewsteinberger.com/) ([@adammatthewsteinberger](https://github.com/adammatthewsteinberger/))."
          git push --force-with-lease="refs/heads/$branch" origin "HEAD:$branch"
          pr_number="$(gh pr list --repo "$GH_REPO" --head "$branch" --base develop --state open --json number --jq '.[0].number')"
          if [ -n "$pr_number" ]; then
            echo "updated the existing minimum-specs pull request #$pr_number"
          else
            gh pr create \
              --repo "$GH_REPO" \
              --base develop \
              --head "$branch" \
              --title "chore(specs): remeasure minimum requirements" \
              --body "Weekly remeasurement of vibey's minimum system requirements on the self-hosted runner (\`scripts/minimum_specs.py\`). The record, docs/reference/system-requirements.md and the paper's table are regenerated together. Figures that could not be measured this week are kept and shown as stale, with the reason. Merge through the repository's normal train after the checks pass."
          fi
