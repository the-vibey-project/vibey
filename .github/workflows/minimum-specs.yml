name: Minimum specs

# vibey's minimum system requirements are a measurement, repeated weekly, never a list
# written once (docs/reference/system-requirements.md). Once a week, and by hand, a
# GitHub-hosted runner re-measures what is cheap and deterministic enough -- the Python
# floor, cold installs and their downloads, PostgreSQL at the declared floor on a scratch
# database, the model's memory against context and its throughput (idle-gated) -- re-derives
# the requirements and re-renders the page and the paper's table. The result lands as a pull
# request through the normal merge train; nothing here pushes to develop. A figure that could
# not be measured keeps its last value, marked stale, in the tables.
#
# Every job runs on GitHub-hosted runners only (operator, 2026-10-03). The measuring host is
# `[minimum_specs.host] runner` (GitHub's arm64 Ubuntu runner: 4 vCPU, 16 GB, no GPU), so the
# page describes that runner. What the operator's machine used to provide, the job provides
# itself: Ollama, installed and serving with its log where the probe reads it, and the
# declared model pulled; PostgreSQL at the declared floor as a service container; the
# interpreters through uv; and the host label naming the hosted runner, never the old host.
#
# Beside it, the Linux matrix: every distribution `scripts/minimum_specs.toml` declares, on
# every architecture it declares, each cell in that distribution's own container on a native
# GitHub-hosted runner of that architecture (`minimum_specs.py cell`). The cells hand their
# partial records over as artifacts and the publish job folds them in (`merge --complete`):
# a cell whose job handed nothing over is marked stale with that reason, never dropped.
on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# One measurement at a time: two runs would race to open the same remeasure pull request. A
# queued run waits rather than cancels a long measurement in flight.
concurrency:
  group: minimum-specs-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the measurement
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cells: ${{ steps.cells.outputs.cells }}
      runner: ${{ steps.host.outputs.runner }}
      model: ${{ steps.host.outputs.model }}
      postgres_floor: ${{ steps.host.outputs.postgres_floor }}
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # The matrix is the configuration's, not this file's: a distribution or an
      # architecture added to the TOML is measured from the next run on.
      - id: cells
        run: echo "cells=$(python scripts/minimum_specs.py cells --json)" >> "$GITHUB_OUTPUT"

      # The measuring runner, the model and the PostgreSQL floor are declared once, in the
      # TOML and in the code; this file restates none of them.
      - id: host
        run: python scripts/minimum_specs.py host --github-output >> "$GITHUB_OUTPUT"

  linux:
    name: Linux cell (${{ matrix.distro }}, ${{ matrix.arch }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.cells) }}
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7

      # A cell with no image for this architecture is recorded as skipped, with the
      # configuration's reason, without starting a container.
      - name: Measure the cell in its distribution's container
        env:
          DISTRO: ${{ matrix.distro }}
          ARCH: ${{ matrix.arch }}
          # Not RUNNER_NAME: GitHub sets that one itself, to the machine's own name
          # ("GitHub Actions 1000073941"), which then labelled every cell.
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          set -euo pipefail
          uv run --no-project --python 3.12 python scripts/minimum_specs.py cell \
            --distro "$DISTRO" --arch "$ARCH" --out "cells/$DISTRO-$ARCH.json" \
            --runner-label "GitHub-hosted $RUNNER_LABEL"

      - name: Hand the cell's record over
        uses: actions/upload-artifact@v4
        with:
          name: minimum-specs-cell-${{ matrix.distro }}-${{ matrix.arch }}
          path: cells/
          if-no-files-found: error
          retention-days: 14

  measure:
    name: Measure on the GitHub-hosted runner
    needs: plan
    runs-on: ${{ needs.plan.outputs.runner }}
    # Within GitHub's 360-minute ceiling for a hosted job. The model runs on four CPU cores
    # and no GPU here, so the bench (the 24k-token depth prompt above all) takes hours, not
    # the minutes it took on a GPU host.
    timeout-minutes: 340
    # No write token where the measurement runs: it measures and hands the files over as an
    # artifact. Committing and opening the pull request happen in the publish job below.
    permissions:
      contents: read
    # The scratch database's server, at the floor vibey declares (POSTGRES_MIN_MAJOR), so the
    # migrations are measured on the oldest server vibey accepts. scram-sha-256 everywhere, as
    # in ci.yml (sub-doctrine 10.j, ADR-0061); the password only ever meets this container.
    services:
      postgres:
        image: postgres:${{ needs.plan.outputs.postgres_floor }}
        env:
          POSTGRES_USER: vibey
          POSTGRES_PASSWORD: vibey
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7

      # psql drives the scratch database; GNU time samples the commands' peak memory
      # (`/usr/bin/time -v`); zstd unpacks Ollama's release if its installer is unreachable.
      - name: Install the measuring tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-client time zstd

      # Ollama's installer first; its own GitHub release if the installer is unreachable. The
      # installer starts a systemd service that logs to the journal, so it is stopped and the
      # server runs as this user instead, logging to `[minimum_specs.ollama] server_log`,
      # where the probe reads llama-server's memory accounting and the idle gate reads other
      # clients' requests. Only the declared model is pulled: the bench measures that one, and
      # a substitute would measure something else. If it cannot be pulled the model figures
      # are recorded as not measured and kept stale, and the rest is still measured.
      - name: Start Ollama with the declared model
        env:
          MODEL: ${{ needs.plan.outputs.model }}
        run: |
          set -uo pipefail
          if ! curl -fsSL https://ollama.com/install.sh | sh; then
            echo "::warning::the Ollama installer failed; installing Ollama's GitHub release instead"
            case "$(uname -m)" in aarch64|arm64) goarch=arm64 ;; *) goarch=amd64 ;; esac
            url=$(curl -fsSL https://api.github.com/repos/ollama/ollama/releases/latest \
              | python3 -c "import json,sys; print(next(a['browser_download_url'] for a in json.load(sys.stdin)['assets'] if a['name']=='ollama-linux-$goarch.tar.zst'))")
            curl -fsSL "$url" | sudo tar --zstd -x -C /usr/local
          fi
          sudo systemctl disable --now ollama 2>/dev/null || true
          log="$(python3 scripts/minimum_specs.py host | awk -F '\t' '$1 == "server_log" { print $2 }')"
          mkdir -p "$(dirname "$log")"
          (ollama serve >> "$log" 2>&1 &)
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:11434/api/version >/dev/null && break; sleep 2; done
          if ! curl -sf http://127.0.0.1:11434/api/version; then
            echo "::warning::Ollama did not start; the model figures will be kept stale"
            exit 0
          fi
          ollama pull "$MODEL" || echo "::warning::could not pull $MODEL; the model figures will be kept stale"

      - name: Measure, derive and render
        env:
          # The service container above: its superuser may create and drop the scratch
          # database, and the probe never touches any database it did not create.
          VIBEY_SPECS_PG_ADMIN_URL: postgresql://vibey:vibey@127.0.0.1:5432/postgres
          # The hosted runner, by its label: the tables say where the figures came from, and
          # the record keeps its chip, cores, memory and OS beside the label.
          VIBEY_SPECS_HOST_LABEL: GitHub-hosted ${{ needs.plan.outputs.runner }}
        run: |
          set -euo pipefail
          # The script is stdlib only; uv pins the interpreter so the runner's own python3
          # (whatever version it is) never runs it.
          specs() { uv run --no-project --python 3.12 python scripts/minimum_specs.py "$@"; }
          specs measure
          specs render
          specs check
          {
            echo "## Minimum specs"
            sed -n '/BEGIN GENERATED specs:status/,/END GENERATED specs:status/p' \
              docs/reference/system-requirements.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hand the measured files over
        uses: actions/upload-artifact@v4
        with:
          name: minimum-specs
          path: |
            docs/architecture/evidence/minimum-specs.json
            docs/reference/system-requirements.md
            docs/paper.md
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Open the remeasure pull request
    needs: [measure, linux]
    # The host's measurement and the Linux cells land together; either may have failed, and
    # what did not report is marked stale by the merge, so this runs unless cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          fetch-depth: 0

      # upload-artifact stores files relative to the deepest directory all its paths share,
      # here `docs/`, so the download goes back under `docs/`. Downloaded to `.`, the files
      # landed beside the tracked ones and the first remeasure folded the Linux cells onto
      # develop's stale macOS figures (tests/meta/test_workflow_artifacts.py).
      - name: Take the measured files
        if: ${{ needs.measure.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: minimum-specs
          path: docs

      - name: Take the Linux cells' records
        uses: actions/download-artifact@v4
        with:
          pattern: minimum-specs-cell-*
          path: cells
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Every declared cell is expected: one whose job handed nothing over is marked stale
      # with that reason (sub-doctrine 10.g: an unreadable source is reported, not skipped).
      - name: Fold the Linux cells into the record
        run: |
          set -euo pipefail
          shopt -s nullglob
          python scripts/minimum_specs.py merge --complete cells/*.json
          python scripts/minimum_specs.py render
          # The host-health page cites this record's minimums, so it moves with every remeasure.
          python scripts/host_health.py render

      # The same check CI runs: the record's derivations and every generated table agree.
      # A handed-over file that disagrees stops here instead of reaching a pull request.
      - name: Check the record against the tables
        run: |
          set -euo pipefail
          python scripts/minimum_specs.py check
          python scripts/host_health.py check

      - name: Commit and open the pull request
        # The Actions token may not open pull requests here, so the pull request is opened
        # with the token every other workflow uses for that, falling back to the Actions
        # token where the secret is not set (a fork) so the push still lands.
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          MEASURED: ${{ needs.measure.result }}
        run: |
          set -euo pipefail
          branch="chore/minimum-specs-$(date -u +%Y-%m-%d)"
          git switch --force-create "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/evidence/minimum-specs.json \
            docs/reference/system-requirements.md docs/paper.md docs/reference/host-health.md
          # A host measurement always rewrites the record, so when it succeeded an unchanged
          # record means the handover never reached the tracked files: say so and fail
          # (sub-doctrine 12.e). Without it, only the Linux cells can change the record.
          if git diff --cached --quiet; then
            if [ "$MEASURED" = "success" ]; then
              echo "::error::the host measurement left the tracked record unchanged; the handed-over files did not land where they are committed from"
              exit 1
            fi
            echo "the minimum-specs record is unchanged"
            exit 0
          fi
          git commit -m "chore(specs): remeasure minimum requirements" \
            -m "Made-With: Made with ❤️ by [Vibey](https://the-vibey-project.github.io/vibey/), Developed by [Adam Matthew Steinberger](https://vibewithadam.matthewsteinberger.com/) ([@adammatthewsteinberger](https://github.com/adammatthewsteinberger/))."
          git push --force-with-lease="refs/heads/$branch" origin "HEAD:$branch"
          pr_number="$(gh pr list --repo "$GH_REPO" --head "$branch" --base develop --state open --json number --jq '.[0].number')"
          if [ -n "$pr_number" ]; then
            echo "updated the existing minimum-specs pull request #$pr_number"
          else
            gh pr create \
              --repo "$GH_REPO" \
              --base develop \
              --head "$branch" \
              --title "chore(specs): remeasure minimum requirements" \
              --body "Weekly remeasurement of vibey's minimum system requirements on a GitHub-hosted runner and of the Linux matrix on native GitHub-hosted runners (\`scripts/minimum_specs.py\`). The record, docs/reference/system-requirements.md and the paper's tables are regenerated together. Figures that could not be measured this week are kept and shown as stale, with the reason. Merge through the repository's normal train after the checks pass."
          fi
