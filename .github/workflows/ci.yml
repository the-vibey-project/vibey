# Made with ❤️ by [Vibey](https://the-vibey-project.github.io/vibey/), Developed by [Adam Matthew Steinberger](https://vibewithadam.matthewsteinberger.com/) ([@adammatthewsteinberger](https://github.com/adammatthewsteinberger/)).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  uv-lock:
    name: uv.lock is in sync with pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - run: uv lock --check

  gates:
    needs: [uv-lock]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vibey
          POSTGRES_PASSWORD: vibey
          POSTGRES_DB: vibey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VIBEY_TEST_DATABASE_URL: postgresql://vibey:vibey@localhost:5432/vibey_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Gate 1 - ruff check
        run: uv run ruff check .

      - name: Gate 2 - ruff format --check
        run: uv run ruff format --check .

      - name: Gate 3 - mypy --strict
        run: uv run mypy --strict src/vibey

      - name: Run test suite with coverage
        run: uv run pytest -q -p no:cacheprovider --cov=vibey --cov-branch --cov-report=

      - name: Gate 4a - pytest domain layer (100% coverage)
        run: uv run coverage report --include='src/vibey/domain/*' --fail-under=100

      - name: Gate 4b - pytest application layer (100% coverage)
        run: uv run coverage report --include='src/vibey/application/*' --fail-under=100

      - name: Gate 4c - pytest infrastructure layer (100% coverage)
        run: uv run coverage report --include='src/vibey/infrastructure/*' --fail-under=100

      - name: Gate 4d - pytest CLI layer (100% coverage)
        run: uv run coverage report --include='src/vibey/cli/*' --fail-under=100

      - name: Gate 5 - lint-imports (onion contract)
        run: uv run lint-imports

      - name: Gate 6 - bandit
        run: uv run bandit -q -r src/vibey

      - name: Gate 7 - pip-audit
        run: uv run pip-audit

  tools:
    name: ${{ matrix.package }} on ${{ matrix.python }}
    needs: [uv-lock]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Plain pip and setup-python, NOT `uv sync --package`. The workspace lock
          # resolves at requires-python >=3.12 -- the intersection of every member -- so a
          # uv environment cannot exercise the 3.10 and 3.11 floors these wheels publish.
          # A floor nothing runs on is a claim, not a contract.
          #
          # Each command is the repository's own, ported verbatim. Absorbing a package
          # must not quietly lower what it was already held to: vibey-gh carries a 100%
          # BRANCH floor over 984 tests and vibey-bootstrap a 100% LINE floor over 1057,
          # and both are enforced by their own pyproject addopts, not by anything here.
          - {package: vibey-gh, dir: src/vibey_tools/gh, python: "3.11",
             install: 'pip install -e ".[dev]"', test: 'python -m pytest -q'}
          - {package: vibey-gh, dir: src/vibey_tools/gh, python: "3.12",
             install: 'pip install -e ".[dev]"', test: 'python -m pytest -q'}
          - {package: vibey-gh, dir: src/vibey_tools/gh, python: "3.13",
             install: 'pip install -e ".[dev]"', test: 'python -m pytest -q'}
          - {package: vibey-skills, dir: src/vibey_tools/skills, python: "3.10",
             install: 'pip install -e .',
             test: 'python3 tools/validate_manifests.py && python3 tools/check_links.py && PYTHONPATH=src python3 -m unittest discover -s tests'}
          - {package: vibey-skills, dir: src/vibey_tools/skills, python: "3.12",
             install: 'pip install -e .',
             test: 'python3 tools/validate_manifests.py && python3 tools/check_links.py && PYTHONPATH=src python3 -m unittest discover -s tests'}
          - {package: vibey-bootstrap, dir: src/vibey_tools/bootstrap, python: "3.11",
             install: 'pip install -e ".[test,all]"',
             test: 'pytest test/ -m "not integration" --cov=vibey_bootstrap --cov-report=term'}
          - {package: vibey-bootstrap, dir: src/vibey_tools/bootstrap, python: "3.12",
             install: 'pip install -e ".[test,all]"',
             test: 'pytest test/ -m "not integration" --cov=vibey_bootstrap --cov-report=term'}
          #
          # The five session runners (ADR-0021 absorbed them; ADR-0022 says they keep every
          # gate they arrived with). Their floors are NOT in their addopts the way vibey-gh's
          # and vibey-bootstrap's are: each of them deliberately leaves --cov= and
          # --cov-fail-under out of pytest's addopts, because pytest-cov UNIONS every --cov=
          # it sees and one baked in there would silently widen the explicitly-scoped
          # per-layer runs back out to the whole package. Their four 100% floors live in
          # their own .github/workflows/ci.yml instead -- inert here, like every other nested
          # workflow -- so for these packages the command below IS the floor, ported from
          # that workflow rather than re-derived. qwenloop is the exception: its floor is a
          # single whole-package --cov-fail-under=100 in its addopts, so `pytest -q` carries
          # it, exactly as its own CI relied on.
          #
          # claudeloop and codexloop depend on vibey-runners-common, which is a workspace
          # member and is published nowhere: `pip install -e ".[dev]"` alone would go looking
          # for it on PyPI and fail. It is installed from the tree first, which is the same
          # resolution the workspace gives them -- not a substitution.
          #
          # Interpreters are each runner's own matrix. claudeloop publishes a 3.10 floor and
          # is the only member of this tree that does; per ADR-0022 a floor nothing runs on
          # is a claim, so all four of its interpreters run.
          #
          # Known, deliberately unfixed here: claudeloop's [dev] extra pins
          # `vibey-gh==1.58.0; python_version >= '3.11'`, so these rows resolve vibey-gh from
          # PyPI while this tree ships 1.73.0 at src/vibey_tools/gh as a workspace member --
          # ADR-0017's "use ours" read literally. It is not fixable from this file: an `==`
          # requirement wins over anything installed first, so `pip install -e
          # ../../vibey_tools/gh` before or after would simply be undone. The fix is claudeloop's
          # own pyproject, which changes a runner's declared dependencies and needs that
          # runner's suite to validate. Nothing in claudeloop's tests imports vibey_gh -- it is
          # release and provenance tooling -- so these rows' verdicts are unaffected either way.
          - package: claudeloop
            dir: src/vibey_runners/claude
            python: "3.10"
            install: 'pip install -e ../common && pip install -e ".[dev]"'
            test: >-
              pytest tests/domain --cov=claudeloop.domain --cov-branch --cov-report=term-missing --cov-fail-under=100 &&
              pytest tests/application --cov=claudeloop.application --cov-branch --cov-report=term-missing --cov-fail-under=100 &&
              pytest tests/infrastructure -n auto --maxprocesses=8 --cov=claudeloop.infrastructure --cov-branch --cov-report=term-missing --cov-fail-under=100 &&
              pytest tests/cli -n auto --maxprocesses=8 --cov=claudeloop.cli --cov-branch --cov-report=term-missing --cov-fail-under=100
          - package: claudeloop
            dir: src/vibey_runners/claude
            python: "3.11"
            install: 'pip install -e ../common && pip install -e ".[dev]"'
            test: >-
              pytest tests/domain --cov=claudeloop.domain --cov-branch --cov-report=term-missing --cov-fail-under=100 &&
              pytest tests/application --cov=claudeloop.application --cov-branch --cov-report=term-missing --cov-fail-under=100 &&
              pytest tests/infrastructure -n auto --maxprocesses=8 --cov=claudeloop.infrastructure --cov-branch --cov-report=term-missing --cov-fail-under=100 &&
              pytest tests/cli -n auto --maxprocesses=8 --cov=claudeloop.cli --cov-branch --cov-report=term-missing --cov-fail-under=100
          - package: claudeloop
            dir: src/vibey_runners/claude
            python: "3.12"
            install: 'pip install -e ../common && pip install -e ".[dev]"'
            test: >-
              pytest tests/domain --cov=claudeloop.domain --cov-branch --cov-report=term-missing --cov-fail-under=100 &&
              pytest tests/application --cov=claudeloop.application --cov-branch --cov-report=term-missing --cov-fail-under=100 &&
              pytest tests/infrastructure -n auto --maxprocesses=8 --cov=claudeloop.infrastructure --cov-branch --cov-report=term-missing --cov-fail-under=100 &&
              pytest tests/cli -n auto --maxprocesses=8 --cov=claudeloop.cli --cov-branch --cov-report=term-missing --cov-fail-under=100
          - package: claudeloop
            dir: src/vibey_runners/claude
            python: "3.13"
            install: 'pip install -e ../common && pip install -e ".[dev]"'
            test: >-
              pytest tests/domain --cov=claudeloop.domain --cov-branch --cov-report=term-missing --cov-fail-under=100 &&
              pytest tests/application --cov=claudeloop.application --cov-branch --cov-report=term-missing --cov-fail-under=100 &&
              pytest tests/infrastructure -n auto --maxprocesses=8 --cov=claudeloop.infrastructure --cov-branch --cov-report=term-missing --cov-fail-under=100 &&
              pytest tests/cli -n auto --maxprocesses=8 --cov=claudeloop.cli --cov-branch --cov-report=term-missing --cov-fail-under=100
          # codexloop, cursorloop and agyloop each replaced four instrumented runs with one,
          # then filtered the single data file per layer -- `coverage report --include` keeps
          # each floor's verdict independent, so this is their command, not a cheaper one.
          # codexloop's own matrix also covered macos-latest; this job is ubuntu-only, so
          # that half is still ungated here (see the follow-up on the commit).
          - package: codexloop
            dir: src/vibey_runners/codex
            python: "3.12"
            install: 'pip install -e ../common && pip install -e ".[dev]"'
            test: >-
              pytest -q --cov=codexloop --cov-branch --cov-report= &&
              coverage report --include='src/codexloop/domain/*' --fail-under=100 &&
              coverage report --include='src/codexloop/application/*' --fail-under=100 &&
              coverage report --include='src/codexloop/infrastructure/*' --fail-under=100 &&
              coverage report --include='src/codexloop/cli/*' --fail-under=100
          - package: codexloop
            dir: src/vibey_runners/codex
            python: "3.13"
            install: 'pip install -e ../common && pip install -e ".[dev]"'
            test: >-
              pytest -q --cov=codexloop --cov-branch --cov-report= &&
              coverage report --include='src/codexloop/domain/*' --fail-under=100 &&
              coverage report --include='src/codexloop/application/*' --fail-under=100 &&
              coverage report --include='src/codexloop/infrastructure/*' --fail-under=100 &&
              coverage report --include='src/codexloop/cli/*' --fail-under=100
          - package: cursorloop
            dir: src/vibey_runners/cursor
            python: "3.12"
            install: 'pip install -e ".[dev]"'
            test: >-
              pytest tests --cov=cursorloop --cov-branch --cov-report= &&
              coverage report --include='src/cursorloop/domain/*' --fail-under=100 &&
              coverage report --include='src/cursorloop/application/*' --fail-under=100 &&
              coverage report --include='src/cursorloop/infrastructure/*' --fail-under=100 &&
              coverage report --include='src/cursorloop/cli/*' --fail-under=100
          - package: cursorloop
            dir: src/vibey_runners/cursor
            python: "3.13"
            install: 'pip install -e ".[dev]"'
            test: >-
              pytest tests --cov=cursorloop --cov-branch --cov-report= &&
              coverage report --include='src/cursorloop/domain/*' --fail-under=100 &&
              coverage report --include='src/cursorloop/application/*' --fail-under=100 &&
              coverage report --include='src/cursorloop/infrastructure/*' --fail-under=100 &&
              coverage report --include='src/cursorloop/cli/*' --fail-under=100
          # agyloop's suite ends with its deterministic system harness -- scripted agent over
          # real FS/git/CLI adapters, no account and no network. Its own CI ran it on every
          # interpreter in the matrix, and `-m system` on the command line overrides the
          # `not system` in addopts, which is how that deselection is meant to be undone.
          - package: agyloop
            dir: src/vibey_runners/agy
            python: "3.12"
            install: 'pip install -e ".[dev]"'
            test: >-
              pytest tests --cov=agyloop --cov-branch --cov-report= &&
              coverage report --include='src/agyloop/domain/*' --fail-under=100 &&
              coverage report --include='src/agyloop/application/*' --fail-under=100 &&
              coverage report --include='src/agyloop/infrastructure/*' --fail-under=100 &&
              coverage report --include='src/agyloop/cli/*' --fail-under=100 &&
              pytest -m system
          - package: agyloop
            dir: src/vibey_runners/agy
            python: "3.13"
            install: 'pip install -e ".[dev]"'
            test: >-
              pytest tests --cov=agyloop --cov-branch --cov-report= &&
              coverage report --include='src/agyloop/domain/*' --fail-under=100 &&
              coverage report --include='src/agyloop/application/*' --fail-under=100 &&
              coverage report --include='src/agyloop/infrastructure/*' --fail-under=100 &&
              coverage report --include='src/agyloop/cli/*' --fail-under=100 &&
              pytest -m system
          # qwenloop is the standby runner (ADR-0015) and the only one whose floor is already
          # in its addopts: --cov=qwenloop --cov-branch --cov-fail-under=100, whole package,
          # so a bare `pytest -q` is the entire gate. Its own CI drove that through `uv run`;
          # pip and setup-python are what let 3.14 -- which it publishes and the workspace
          # lock cannot reach -- actually run.
          # qwenloop's own CI reached 3.14 through astral-sh/setup-uv instead; setup-python@v5
          # is used here for the same reason every other row uses it, and its manifest has
          # carried 3.14 on ubuntu since the 3.14.0 release in October 2025. pytest, pytest-cov
          # and pytest-asyncio all publish py3-none-any wheels, so there is no wheel gap either.
          - package: qwenloop
            dir: src/vibey_runners/qwen
            python: "3.12"
            install: 'pip install -e ".[dev]"'
            test: 'python -m pytest -q'
          - package: qwenloop
            dir: src/vibey_runners/qwen
            python: "3.13"
            install: 'pip install -e ".[dev]"'
            test: 'python -m pytest -q'
          - package: qwenloop
            dir: src/vibey_runners/qwen
            python: "3.14"
            install: 'pip install -e ".[dev]"'
            test: 'python -m pytest -q'
    steps:
      - uses: actions/checkout@v4
        with:
          # vibey-gh's suite drives real git history.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # vibey-gh's suite shells out to `uv` where it verifies that bumping a version also
      # re-locks: `test_bumping_a_toml_relocks_uv_when_a_lockfile_is_present` fails with
      # FileNotFoundError without it. That is the test doing its job -- the behaviour it
      # covers is a real `uv lock` -- so the binary is provided rather than the test
      # weakened. Its own repository's CI never needed this because nothing there ran the
      # suite on a runner without uv already present.
      - uses: astral-sh/setup-uv@v3
      - name: Install
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.install }}
      - name: Its own suite, unchanged
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.test }}

  tools-lint:
    name: Absorbed tools - their own linters
    needs: [uv-lock]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: vibey-gh - black, isort, mypy
        working-directory: src/vibey_tools/gh
        run: |
          python -m pip install --quiet -e ".[dev]"
          python -m black --check vibey_gh test
          isort --check-only vibey_gh test
          python -m mypy vibey_gh
      - name: vibey-gh - it installs its own managed automation without drift
        working-directory: src/vibey_tools/gh
        run: |
          python - <<'PY'
          from vibey_gh.config import load_config
          from vibey_gh.install import installed
          ok, problems = installed(load_config(), local=False)
          raise SystemExit("managed automation drift: " + "; ".join(problems) if not ok else 0)
          PY

  image:
    name: Container image (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 is built under emulation. Slower than a native runner, but
      # the alternative is discovering on a customer's Graviton node that
      # the image was never built for it.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: vibey:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Dockerfile makes three claims in prose. Prose does not survive
      # a refactor, so each one is asserted here: collapse the two stages
      # or drop the USER line and this job fails instead of shipping.
      - name: Image contract - entrypoint runs
        run: |
          out=$(docker run --rm vibey:ci --version)
          echo "$out"
          case "$out" in
            "vibey "*) ;;
            *) echo "::error::unexpected --version output: $out"; exit 1 ;;
          esac

      - name: Image contract - runs as non-root uid 10001
        run: |
          uid=$(docker run --rm --entrypoint id vibey:ci -u)
          echo "uid=$uid"
          test "$uid" = "10001"

      # apt-get is deliberately absent from this list: it installs git in
      # the runtime stage and needs root to do anything, while the chart
      # runs the pod non-root with allowPrivilegeEscalation false. pip is
      # the one that mattered -- uid 10001 owns a writable $HOME, so
      # `pip install --user` would have worked until it was removed.
      - name: Image contract - no compiler, no uv, no pip
        run: |
          docker run --rm --entrypoint sh vibey:ci -c '
            status=0
            for tool in uv pip pip3 gcc cc; do
              if command -v "$tool" >/dev/null 2>&1; then
                echo "$tool present in runtime layer"; status=1
              fi
            done
            exit $status
          '

      - name: Image contract - migrations ship in the image
        run: |
          count=$(docker run --rm --entrypoint sh vibey:ci -c 'ls /app/migrations/*.sql | wc -l')
          echo "migrations=$count"
          test "$count" -gt 0

      # Built last: under emulation this is the slow half, and there is no
      # point paying for it when the amd64 contracts already failed.
      - name: Build arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/arm64
          push: false
          tags: vibey:ci-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cluster-smoke:
    name: Helm install on minikube
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: medyagh/setup-minikube@latest

      - uses: azure/setup-helm@v5

      - name: Build the image into minikube's daemon
        # BuildKit's default docker-container driver pulls a separate
        # moby/buildkit image and then inspects it -- that inspect step
        # 404s against minikube's containerd-backed docker-env shim
        # (medyagh/setup-minikube's own docs flag this as experimental).
        # The classic builder needs no such image, so it isn't affected.
        env:
          DOCKER_BUILDKIT: "0"
        run: |
          eval $(minikube docker-env)
          docker build -f deploy/docker/Dockerfile -t vibey:dev .

      - name: helm install
        run: |
          helm install vibey deploy/helm/vibey \
            -n vibey --create-namespace --wait --timeout 8m

      # A fresh install into an empty namespace has no project. The worker
      # must park and poll, not exit -- exiting is a restart loop that ends
      # only when a human shows up, and the crash counter makes a healthy
      # deployment look broken.
      - name: Contract - a projectless worker parks instead of crash-looping
        run: |
          kubectl wait --for=condition=available \
            deployment/vibey-vibey-worker -n vibey --timeout=5m
          for _ in $(seq 1 20); do
            kubectl logs -n vibey deployment/vibey-vibey-worker > /tmp/log 2>&1 || true
            grep -q "no project yet; polling" /tmp/log && break
            sleep 5
          done
          cat /tmp/log
          grep -q "no project yet; polling" /tmp/log
          restarts=$(kubectl get pods -n vibey -l app.kubernetes.io/component=worker \
            -o jsonpath='{.items[0].status.containerStatuses[0].restartCount}')
          echo "restarts=$restarts"
          test "$restarts" = "0"

      - name: Contract - the worker picks up a project created in-cluster
        run: |
          kubectl exec -n vibey deploy/vibey-vibey-worker -- \
            vibey new demo --repo /work/demo --max-cycles 1
          for _ in $(seq 1 24); do
            kubectl logs -n vibey deployment/vibey-vibey-worker > /tmp/log 2>&1 || true
            grep -q "worker started: project=demo" /tmp/log && break
            sleep 5
          done
          cat /tmp/log
          grep -q "worker started: project=demo" /tmp/log

      # KEDA's operator runs in its own namespace and dials Postgres
      # itself, so it is the only thing here that exercises the DSN from
      # outside the release namespace. An unqualified DSN passes every
      # other check in this file and fails this one -- which is exactly
      # how it once shipped unnoticed.
      - name: Contract - the ScaledObject reconciles against real Postgres
        run: |
          helm repo add kedacore https://kedacore.github.io/charts
          helm install keda kedacore/keda -n keda --create-namespace --wait --timeout 5m
          helm upgrade vibey deploy/helm/vibey -n vibey \
            --set keda.enabled=true --wait --timeout 5m
          ready=""
          for _ in $(seq 1 24); do
            ready=$(kubectl get scaledobject vibey-vibey-worker -n vibey \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
            [ "$ready" = "True" ] && break
            sleep 5
          done
          kubectl get scaledobject -n vibey
          test "$ready" = "True"

      # terminationGracePeriodSeconds is 7200. Without the SIGTERM drain a
      # scaled-in pod sits there for all of it, still holding connections
      # and still claiming jobs, while kubectl reports it gone. 60s is a
      # generous ceiling for an idle worker that genuinely drains.
      - name: Contract - a worker drains promptly on SIGTERM
        run: |
          helm upgrade vibey deploy/helm/vibey -n vibey \
            --set keda.enabled=false --wait --timeout 5m
          pod=$(kubectl get pods -n vibey -l app.kubernetes.io/component=worker \
            -o custom-columns=NAME:.metadata.name,DEL:.metadata.deletionTimestamp --no-headers \
            | awk '$2 == "<none>" {print $1}' | head -n 1)
          # How old is it? A pod deleted moments after its container started is testing
          # the startup race (SIGTERM discarded while PID 1 still had SIG_DFL), not the
          # steady-state drain. Both must pass; only one of them is obvious from a log.
          started=$(kubectl get pod "$pod" -n vibey \
            -o jsonpath='{.status.containerStatuses[0].state.running.startedAt}' || true)
          echo "deleting $pod (container started at ${started:-unknown})"
          # By the time a failing test reaches the diagnostics step below,
          # the Deployment has already replaced this pod -- `kubectl logs
          # deployment/...` would then show the REPLACEMENT's fresh startup
          # log, not this pod's. Name it explicitly so diagnostics can still
          # find it once it's no longer the Deployment's current pod.
          echo "SIGTERM_TEST_POD=$pod" >> "$GITHUB_ENV"
          start=$(date +%s)
          kubectl delete pod "$pod" -n vibey --wait=true --timeout=5m
          elapsed=$(( $(date +%s) - start ))
          echo "terminated in ${elapsed}s (grace period allows 7200s)"
          test "$elapsed" -lt 60

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get all -n vibey || true
          kubectl describe pods -n vibey || true
          if [ -n "${SIGTERM_TEST_POD:-}" ]; then
            echo "--- logs: the specific pod the SIGTERM test deleted ($SIGTERM_TEST_POD) ---"
            # --timestamps, because the question this log has to answer is *when* the
            # drain flag was observed relative to the delete -- and without them every
            # line carries the collection time instead.
            kubectl logs -n vibey "pod/$SIGTERM_TEST_POD" --timestamps --tail=300 || true
            echo "--- describe: same pod, for phase/conditions/events ---"
            kubectl describe "pod/$SIGTERM_TEST_POD" -n vibey || true
          fi
          kubectl logs -n vibey deployment/vibey-vibey-worker --tail=100 || true
          kubectl logs -n keda deployment/keda-operator --tail=50 || true
