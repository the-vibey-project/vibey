# Made with ❤️ by [Vibey](https://the-vibey-project.github.io/vibey/), Developed by [Adam Matthew Steinberger](https://vibewithadam.matthewsteinberger.com/) ([@adammatthewsteinberger](https://github.com/adammatthewsteinberger/)).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # A merge queue asks these same checks about the MERGED group, not about any one
  # branch, and it only ever sees checks that a `merge_group` event starts. Without this
  # line every queued pull request waits for `gates` to report on a run that was never
  # triggered, times out after `check_response_timeout_minutes`, and is ejected -- a
  # queue that rejects everything, for a reason nothing in the pull request explains
  # (ADR-0036).
  merge_group:

# A superseded pull-request run is measurement nobody will ever read. Over the hundred CI
# runs before this line was written, thirteen kept going after a newer commit replaced
# them -- 181 minutes of wall clock, every one of it spent deciding something about a
# commit that no longer existed. The cost is not only the machine: a dead run holds
# concurrency slots, so the live run queues behind work that has already been abandoned,
# and the person waiting pays for both (sub-doctrine 12.g, ADR-0050).
#
# What must never be cancelled is named here rather than left to a default, because 12.g's
# bound is that speed is never bought with what a check measures:
#
#   - `push` (main, develop): every push to develop is a distinct pull request the merge
#     train just landed, and it publishes its own dev build. Cancel one and a merged
#     commit carries no green CI at all -- the check did not get faster, it stopped
#     existing. Those 27 runs are not waste; they are the record.
#   - `merge_group`: a cancelled queue run is a check that never reports, which ADR-0036
#     records as the thing that ejects a pull request from the queue.
#
# Measured, not assumed: all thirteen superseded runs were `pull_request` events, so this
# condition covers the whole of what was found and provably reaches nothing else.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  uv-lock:
    name: uv.lock is in sync with pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - run: uv lock --check

  gates:
    needs: [uv-lock]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vibey
          POSTGRES_PASSWORD: vibey
          POSTGRES_DB: vibey_test
          # scram-sha-256 for every connection, local and remote -- never trust,
          # never md5 (sub-doctrine 10.j, ADR-0061).
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VIBEY_TEST_DATABASE_URL: postgresql://vibey:vibey@localhost:5432/vibey_test
    steps:
      - uses: actions/checkout@v4
        with:
          # The paper's history figures are recomputed from the full log at their pinned
          # revision (tests/meta/test_paper_figures.py); a shallow clone cannot check them.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Gate 1 - ruff check
        run: uv run ruff check .

      - name: Gate 2 - ruff format --check
        run: uv run ruff format --check .

      - name: Gate 3 - mypy --strict
        run: uv run mypy --strict src/vibey

      - name: Run test suite with coverage
        run: uv run pytest -q -p no:cacheprovider --cov=vibey --cov-branch --cov-report=

      - name: Gate 4a - pytest domain layer (100% coverage)
        run: uv run coverage report --include='src/vibey/domain/*' --fail-under=100

      - name: Gate 4b - pytest application layer (100% coverage)
        run: uv run coverage report --include='src/vibey/application/*' --fail-under=100

      - name: Gate 4c - pytest infrastructure layer (100% coverage)
        run: uv run coverage report --include='src/vibey/infrastructure/*' --fail-under=100

      - name: Gate 4d - pytest CLI layer (100% coverage)
        run: uv run coverage report --include='src/vibey/cli/*' --fail-under=100

      - name: Gate 5 - lint-imports (onion contract)
        run: uv run lint-imports

      - name: Gate 6 - bandit
        run: uv run bandit -q -r src/vibey

      - name: Gate 7 - pip-audit
        run: uv run pip-audit

  # The definition of done says "No-loss property suite green over 10,000 adversarial
  # examples" (docs/plans/implementation-plan.md); `gates` runs the same tests at
  # Hypothesis' default 100. This job runs only the `noloss`-marked suite, at the `noloss`
  # profile registered in tests/conftest.py, and prints Hypothesis' statistics so every run
  # shows the examples it actually generated rather than asserting them. Its check name is
  # a required check on both branches (`[rulesets.*] required_checks` in .vibey-gh.toml), so
  # renaming it here means renaming it there. Postgres because tests/conftest.py clones the
  # test template at session start, for every session, whatever it selects.
  noloss:
    name: No-loss property suite (10,000 examples)
    needs: [uv-lock]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vibey
          POSTGRES_PASSWORD: vibey
          POSTGRES_DB: vibey_test
          # scram-sha-256 for every connection, local and remote -- never trust,
          # never md5 (sub-doctrine 10.j, ADR-0061).
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VIBEY_TEST_DATABASE_URL: postgresql://vibey:vibey@localhost:5432/vibey_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: No-loss property suite at 10,000 examples per property
        run: uv run pytest -m noloss --hypothesis-profile=noloss --hypothesis-show-statistics -p no:cacheprovider

  postgres-compatibility:
    name: PostgreSQL ${{ matrix.postgres }} compatibility
    needs: [uv-lock]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PostgreSQL 14 is the SQL/runtime floor. The upstream-supported stable
        # majors are exercised explicitly; a future major is accepted by the
        # runtime version check once it becomes stable and is added here.
        postgres: [14, 15, 16, 17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: vibey
          POSTGRES_PASSWORD: vibey
          POSTGRES_DB: vibey_test
          # scram-sha-256 for every connection, local and remote -- never trust,
          # never md5 (sub-doctrine 10.j, ADR-0061).
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VIBEY_TEST_DATABASE_URL: postgresql://vibey:vibey@localhost:5432/vibey_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Assert PostgreSQL support floor
        run: |
          supported=$(psql "$VIBEY_TEST_DATABASE_URL" -Atqc \
            "SELECT current_setting('server_version_num')::integer >= 140000")
          test "$supported" = t

      - name: Run PostgreSQL compatibility suite
        run: >-
          uv run pytest -q -p no:cacheprovider
          tests/infrastructure/db
          tests/infrastructure/test_cluster_preflight.py
          tests/cli/test_main_integration.py

  tools:
    # A row runs on ubuntu unless it names another `os`; only a row that does gets the
    # suffix, so every ubuntu row keeps the check name it already had.
    name: ${{ matrix.package }} on ${{ matrix.python }}${{ matrix.os && format(' ({0})', matrix.os) || '' }}
    needs: [uv-lock]
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Plain pip and setup-python, NOT `uv sync --package`. The workspace lock
          # resolves at requires-python >=3.12 -- the common floor of every library --
          # and the tenant rows below exercise that common range through Python 3.14.
          #
          # ADR-0037 retired the per-tenant distributions; the tenants themselves stay
          # exactly as ADR-0021 and ADR-0022 left them, each with its own pyproject,
          # suite and Python floor. So these rows are now the ONLY thing that runs a
          # tenant on its own floor -- every library publishes at >=3.12.
          #
          # And the other half of ADR-0037: no family package exists on any index any
          # more, so a plain-pip row that names one in its dependencies cannot install at
          # all. Every family package a tenant needs is installed from the tree first,
          # below -- the same resolution the workspace gives it, not a substitution --
          # and the step after the install proves nothing came from an index.
          #
          # Each command is the repository's own, ported verbatim. Absorbing a package
          # must not quietly lower what it was already held to: vibey-gh carries a 100%
          # BRANCH floor over 984 tests and vibey-bootstrap a 100% LINE floor over 1057,
          # and both are enforced by their own pyproject addopts, not by anything here.
          #
          # `static` is the other half of what a tenant arrived with: its own mypy,
          # lint-imports and bandit, from its own directory against its own configuration.
          # The root gates never reach this code -- their mypy, bandit and .importlinter are
          # scoped to src/vibey -- and the tenants' nested workflows, the only place these
          # ever ran, never fired in this repository (#263). A tenant's `static` runs once,
          # on its floor row: every tenant pins `[tool.mypy] python_version`, so another
          # interpreter repeats the same verdict. codexloop is the exception, because its
          # own CI ran these on every cell, macOS included, and a `sys.platform` branch
          # type-checks differently per OS. vibey-gh's full formatting/import checks stay in
          # `tools-lint`, while its mypy gate also runs on the declared 3.12 floor below.
          # vibey-skills declares no static gates, being stdlib-only with no type or import config.
          - {package: vibey-gh, dir: src/vibey_tools/gh, python: "3.12",
             install: 'pip install -e ".[dev]"',
             static: 'python -m mypy vibey_gh', test: 'python -m pytest -q',
             network_test: 'python -m pytest -q -m network --no-cov'}
          - {package: vibey-gh, dir: src/vibey_tools/gh, python: "3.13",
             install: 'pip install -e ".[dev]"', test: 'python -m pytest -q'}
          - {package: vibey-gh, dir: src/vibey_tools/gh, python: "3.14",
             install: 'pip install -e ".[dev]"', test: 'python -m pytest -q'}
          - package: vibey-skills
            dir: src/vibey_tools/skills
            python: "3.12"
            install: 'pip install -e .'
            test: 'python3 tools/validate_manifests.py && python3 tools/check_links.py && PYTHONPATH=src python3 -m unittest discover -s tests'
            # Its own `docs` job, verbatim: --strict is what makes 700-odd generated pages
            # trustworthy, and the counts prove every plugin and skill produced one.
            docs: |
              pip install -e ".[docs]"
              mkdocs build --strict
              plugins=$(python3 -c "import json;print(len(json.load(open('.claude-plugin/marketplace.json'))['plugins']))")
              skills=$(find plugins -name SKILL.md | wc -l | tr -d ' ')
              built_plugins=$(find site/reference -mindepth 2 -maxdepth 2 -name index.html | wc -l | tr -d ' ')
              built_skills=$(find site/reference -mindepth 3 -maxdepth 3 -name index.html | wc -l | tr -d ' ')
              echo "plugins $plugins -> $built_plugins ; skills $skills -> $built_skills"
              test "$plugins" = "$built_plugins"
              test "$skills" = "$built_skills"
          - package: vibey-skills
            dir: src/vibey_tools/skills
            python: "3.13"
            install: 'pip install -e .'
            test: 'python3 tools/validate_manifests.py && python3 tools/check_links.py && PYTHONPATH=src python3 -m unittest discover -s tests'
          - package: vibey-skills
            dir: src/vibey_tools/skills
            python: "3.14"
            install: 'pip install -e .'
            test: 'python3 tools/validate_manifests.py && python3 tools/check_links.py && PYTHONPATH=src python3 -m unittest discover -s tests'
          # vibey-bootstrap's nested CI never ran a static gate at all. Its own pre-commit
          # hook did, and these are that hook's commands, verbatim: its configured
          # (non-strict) mypy, and bandit at medium severity and up. `dev` joins the floor
          # row's install because that is where the hook's tools are declared. The hook's
          # black and isort are not ported: root `ruff format --check .` already owns this
          # tree's formatting, and holding one file to two formatters is the trap vibey-gh
          # already lives with.
          - {package: vibey-bootstrap, dir: src/vibey_tools/bootstrap, python: "3.12",
             install: 'pip install -e ../gh && pip install -e ".[test,all,dev]"',
             static: 'python -m mypy vibey_bootstrap/ && python -m bandit -r vibey_bootstrap/ -ll -q',
             test: 'pytest test/ -m "not integration" --cov=vibey_bootstrap --cov-report=term'}
          - {package: vibey-bootstrap, dir: src/vibey_tools/bootstrap, python: "3.13",
             install: 'pip install -e ../gh && pip install -e ".[test,all]"',
             test: 'pytest test/ -m "not integration" --cov=vibey_bootstrap --cov-report=term'}
          - {package: vibey-bootstrap, dir: src/vibey_tools/bootstrap, python: "3.14",
             install: 'pip install -e ../gh && pip install -e ".[test,all]"',
             test: 'pytest test/ -m "not integration" --cov=vibey_bootstrap --cov-report=term'}
          #
          # The five session runners (ADR-0021 absorbed them; ADR-0022 says they keep every
          # gate they arrived with). Their floors are NOT in their addopts the way vibey-gh's
          # and vibey-bootstrap's are: each of them deliberately leaves --cov= and
          # --cov-fail-under out of pytest's addopts, because pytest-cov UNIONS every --cov=
          # it sees and one baked in there would silently widen the explicitly-scoped
          # per-layer runs back out to the whole package. Their four 100% floors lived in
          # each runner's own nested .github/workflows/ci.yml, which never fired in this
          # repository (ADR-0022) and was removed with the rest of the tenants' inert
          # automation under #189 (`git show 4e9adf18:src/vibey_runners/<r>/.github/workflows/ci.yml`)
          # -- so for these packages the command below IS the floor, ported from that
          # workflow rather than re-derived. Those files also ran each runner's own mypy,
          # lint-imports and bandit, which are NOT ported: the root gates' mypy, bandit and
          # .importlinter scope is src/vibey, so that half is still an open ADR-0022 gap.
          # qwenloop is the exception: its floor is a single whole-package
          # --cov-fail-under=100 in its addopts, so `pytest -q` carries it, exactly as its
          # own CI relied on.
          #
          # claudeloop and codexloop import vibey_runners.common, so `../common` is
          # installed from the tree before their own install: plain pip knows nothing
          # about `[tool.uv.sources] workspace = true` and would otherwise go to an index
          # for a distribution that no longer exists. vibey-bootstrap gets `../gh` the
          # same way, for the same reason -- vibey_bootstrap.gh re-exports vibey_gh and
          # its suite asserts the two are the same objects. An already-installed local
          # package satisfies the requirement, so pip never reaches the index.
          #
          # Every absorbed library now shares the >=3.12 floor, so each tenant below runs
          # on the common supported range: Python 3.12, 3.13, and 3.14.
          #
          # vibey-runners-common ships no suite, so it has no `test` and the suite step
          # skips it (tests/meta/test_tools_matrix_covers_every_package.py counts only rows
          # that do carry one). Its row exists for `static`: it declares a strict mypy and
          # two import contracts, and until this row nothing had ever run either.
          - package: vibey-runners-common
            dir: src/vibey_runners/common
            python: "3.12"
            install: 'pip install -e ".[dev]"'
            static: 'mypy --strict src/vibey_runners/common && lint-imports'
          - package: vibey-runners-common
            dir: src/vibey_runners/common
            python: "3.13"
            install: 'pip install -e ".[dev]"'
            static: 'mypy --strict src/vibey_runners/common && lint-imports'
          - package: vibey-runners-common
            dir: src/vibey_runners/common
            python: "3.14"
            install: 'pip install -e ".[dev]"'
            static: 'mypy --strict src/vibey_runners/common && lint-imports'
          # claudeloop's own CI ran these on 3.12; that is now the common library floor. The
          # frontmatter check was its `skills` job: Claude Code loads a malformed SKILL.md
          # silently, so nothing else would notice.
          - package: claudeloop
            dir: src/vibey_runners/claude
            python: "3.12"
            install: 'pip install -e ../common && pip install -e ".[dev]"'
            static: >-
              mypy --strict src/claudeloop &&
              lint-imports &&
              bandit -q -r src/claudeloop &&
              python scripts/check_skill_frontmatter.py
            test: >-
              pytest tests/domain --cov=claudeloop.domain --cov-branch --cov-report=term-missing --cov-fail-under=100 &&
              pytest tests/application --cov=claudeloop.application --cov-branch --cov-report=term-missing --cov-fail-under=100 &&
              pytest tests/infrastructure -n auto --maxprocesses=8 --cov=claudeloop.infrastructure --cov-branch --cov-report=term-missing --cov-fail-under=100 &&
              pytest tests/cli -n auto --maxprocesses=8 --cov=claudeloop.cli --cov-branch --cov-report=term-missing --cov-fail-under=100
          - package: claudeloop
            dir: src/vibey_runners/claude
            python: "3.13"
            install: 'pip install -e ../common && pip install -e ".[dev]"'
            test: >-
              pytest tests/domain --cov=claudeloop.domain --cov-branch --cov-report=term-missing --cov-fail-under=100 &&
              pytest tests/application --cov=claudeloop.application --cov-branch --cov-report=term-missing --cov-fail-under=100 &&
              pytest tests/infrastructure -n auto --maxprocesses=8 --cov=claudeloop.infrastructure --cov-branch --cov-report=term-missing --cov-fail-under=100 &&
              pytest tests/cli -n auto --maxprocesses=8 --cov=claudeloop.cli --cov-branch --cov-report=term-missing --cov-fail-under=100
          - package: claudeloop
            dir: src/vibey_runners/claude
            python: "3.14"
            install: 'pip install -e ../common && pip install -e ".[dev]"'
            test: >-
              pytest tests/domain --cov=claudeloop.domain --cov-branch --cov-report=term-missing --cov-fail-under=100 &&
              pytest tests/application --cov=claudeloop.application --cov-branch --cov-report=term-missing --cov-fail-under=100 &&
              pytest tests/infrastructure -n auto --maxprocesses=8 --cov=claudeloop.infrastructure --cov-branch --cov-report=term-missing --cov-fail-under=100 &&
              pytest tests/cli -n auto --maxprocesses=8 --cov=claudeloop.cli --cov-branch --cov-report=term-missing --cov-fail-under=100
          # codexloop, cursorloop and agyloop each replaced four instrumented runs with one,
          # then filtered the single data file per layer -- `coverage report --include` keeps
          # each floor's verdict independent, so this is their command, not a cheaper one.
          # codexloop's own matrix was {ubuntu, macos} x {3.12, 3.13}, with every gate in every
          # cell, so all four cells are here. The macOS pair was dropped at the absorption and
          # restored under #263; Python 3.14 is now included on both operating systems.
          - package: codexloop
            dir: src/vibey_runners/codex
            python: "3.12"
            install: 'pip install -e ../common && pip install -e ".[dev]"'
            static: 'mypy --strict src/codexloop && lint-imports && bandit -q -r src/codexloop'
            docs: "pip install 'properdocs==1.6.7' 'properdocs-theme-mkdocs==1.6.7' && properdocs build --strict"
            test: >-
              pytest -q --cov=codexloop --cov-branch --cov-report= &&
              coverage report --include='src/codexloop/domain/*' --fail-under=100 &&
              coverage report --include='src/codexloop/application/*' --fail-under=100 &&
              coverage report --include='src/codexloop/infrastructure/*' --fail-under=100 &&
              coverage report --include='src/codexloop/cli/*' --fail-under=100
          - package: codexloop
            dir: src/vibey_runners/codex
            python: "3.13"
            install: 'pip install -e ../common && pip install -e ".[dev]"'
            static: 'mypy --strict src/codexloop && lint-imports && bandit -q -r src/codexloop'
            test: >-
              pytest -q --cov=codexloop --cov-branch --cov-report= &&
              coverage report --include='src/codexloop/domain/*' --fail-under=100 &&
              coverage report --include='src/codexloop/application/*' --fail-under=100 &&
              coverage report --include='src/codexloop/infrastructure/*' --fail-under=100 &&
              coverage report --include='src/codexloop/cli/*' --fail-under=100
          - package: codexloop
            dir: src/vibey_runners/codex
            python: "3.14"
            install: 'pip install -e ../common && pip install -e ".[dev]"'
            test: >-
              pytest -q --cov=codexloop --cov-branch --cov-report= &&
              coverage report --include='src/codexloop/domain/*' --fail-under=100 &&
              coverage report --include='src/codexloop/application/*' --fail-under=100 &&
              coverage report --include='src/codexloop/infrastructure/*' --fail-under=100 &&
              coverage report --include='src/codexloop/cli/*' --fail-under=100
          - package: codexloop
            dir: src/vibey_runners/codex
            python: "3.12"
            os: macos-latest
            install: 'pip install -e ../common && pip install -e ".[dev]"'
            static: 'mypy --strict src/codexloop && lint-imports && bandit -q -r src/codexloop'
            test: >-
              pytest -q --cov=codexloop --cov-branch --cov-report= &&
              coverage report --include='src/codexloop/domain/*' --fail-under=100 &&
              coverage report --include='src/codexloop/application/*' --fail-under=100 &&
              coverage report --include='src/codexloop/infrastructure/*' --fail-under=100 &&
              coverage report --include='src/codexloop/cli/*' --fail-under=100
          - package: codexloop
            dir: src/vibey_runners/codex
            python: "3.13"
            os: macos-latest
            install: 'pip install -e ../common && pip install -e ".[dev]"'
            static: 'mypy --strict src/codexloop && lint-imports && bandit -q -r src/codexloop'
            test: >-
              pytest -q --cov=codexloop --cov-branch --cov-report= &&
              coverage report --include='src/codexloop/domain/*' --fail-under=100 &&
              coverage report --include='src/codexloop/application/*' --fail-under=100 &&
              coverage report --include='src/codexloop/infrastructure/*' --fail-under=100 &&
              coverage report --include='src/codexloop/cli/*' --fail-under=100
          - package: codexloop
            dir: src/vibey_runners/codex
            python: "3.14"
            os: macos-latest
            install: 'pip install -e ../common && pip install -e ".[dev]"'
            static: 'mypy --strict src/codexloop && lint-imports && bandit -q -r src/codexloop'
            test: >-
              pytest -q --cov=codexloop --cov-branch --cov-report= &&
              coverage report --include='src/codexloop/domain/*' --fail-under=100 &&
              coverage report --include='src/codexloop/application/*' --fail-under=100 &&
              coverage report --include='src/codexloop/infrastructure/*' --fail-under=100 &&
              coverage report --include='src/codexloop/cli/*' --fail-under=100
          - package: cursorloop
            dir: src/vibey_runners/cursor
            python: "3.12"
            install: 'pip install -e ".[dev]"'
            static: 'mypy --strict src/cursorloop && lint-imports && bandit -q -r src/cursorloop'
            test: >-
              pytest tests --cov=cursorloop --cov-branch --cov-report= &&
              coverage report --include='src/cursorloop/domain/*' --fail-under=100 &&
              coverage report --include='src/cursorloop/application/*' --fail-under=100 &&
              coverage report --include='src/cursorloop/infrastructure/*' --fail-under=100 &&
              coverage report --include='src/cursorloop/cli/*' --fail-under=100
          - package: cursorloop
            dir: src/vibey_runners/cursor
            python: "3.13"
            install: 'pip install -e ".[dev]"'
            test: >-
              pytest tests --cov=cursorloop --cov-branch --cov-report= &&
              coverage report --include='src/cursorloop/domain/*' --fail-under=100 &&
              coverage report --include='src/cursorloop/application/*' --fail-under=100 &&
              coverage report --include='src/cursorloop/infrastructure/*' --fail-under=100 &&
              coverage report --include='src/cursorloop/cli/*' --fail-under=100
          - package: cursorloop
            dir: src/vibey_runners/cursor
            python: "3.14"
            install: 'pip install -e ".[dev]"'
            test: >-
              pytest tests --cov=cursorloop --cov-branch --cov-report= &&
              coverage report --include='src/cursorloop/domain/*' --fail-under=100 &&
              coverage report --include='src/cursorloop/application/*' --fail-under=100 &&
              coverage report --include='src/cursorloop/infrastructure/*' --fail-under=100 &&
              coverage report --include='src/cursorloop/cli/*' --fail-under=100
          # agyloop's suite ends with its deterministic system harness -- scripted agent over
          # real FS/git/CLI adapters, no account and no network. Its own CI ran it on every
          # interpreter in the matrix, and `-m system` on the command line overrides the
          # `not system` in addopts, which is how that deselection is meant to be undone.
          # The grep in `static` was agyloop's own, in the same job as its lint-imports: a
          # second net under the "No Anthropic" contract that needs no import graph.
          - package: agyloop
            dir: src/vibey_runners/agy
            python: "3.12"
            install: 'pip install -e ".[dev]"'
            static: >-
              mypy --strict src/agyloop &&
              lint-imports &&
              bandit -q -r src/agyloop &&
              ! grep -R -E '(^|[[:space:]])(from|import)[[:space:]]+(anthropic|claude_agent_sdk)' src
            docs: "pip install 'properdocs==1.6.7' 'properdocs-theme-mkdocs==1.6.7' && properdocs build --strict"
            test: >-
              pytest tests --cov=agyloop --cov-branch --cov-report= &&
              coverage report --include='src/agyloop/domain/*' --fail-under=100 &&
              coverage report --include='src/agyloop/application/*' --fail-under=100 &&
              coverage report --include='src/agyloop/infrastructure/*' --fail-under=100 &&
              coverage report --include='src/agyloop/cli/*' --fail-under=100 &&
              pytest -m system
          - package: agyloop
            dir: src/vibey_runners/agy
            python: "3.13"
            install: 'pip install -e ".[dev]"'
            test: >-
              pytest tests --cov=agyloop --cov-branch --cov-report= &&
              coverage report --include='src/agyloop/domain/*' --fail-under=100 &&
              coverage report --include='src/agyloop/application/*' --fail-under=100 &&
              coverage report --include='src/agyloop/infrastructure/*' --fail-under=100 &&
              coverage report --include='src/agyloop/cli/*' --fail-under=100 &&
              pytest -m system
          - package: agyloop
            dir: src/vibey_runners/agy
            python: "3.14"
            install: 'pip install -e ".[dev]"'
            test: >-
              pytest tests --cov=agyloop --cov-branch --cov-report= &&
              coverage report --include='src/agyloop/domain/*' --fail-under=100 &&
              coverage report --include='src/agyloop/application/*' --fail-under=100 &&
              coverage report --include='src/agyloop/infrastructure/*' --fail-under=100 &&
              coverage report --include='src/agyloop/cli/*' --fail-under=100 &&
              pytest -m system
          # qwenloop is the standby runner (ADR-0015) and the only one whose floor is already
          # in its addopts: --cov=qwenloop --cov-branch --cov-fail-under=100, whole package,
          # so a bare `pytest -q` is the entire gate. Its own CI drove that through `uv run`;
          # pip and setup-python are what let 3.14 -- which it publishes and the workspace
          # lock cannot reach -- actually run.
          # qwenloop's own CI reached 3.14 through astral-sh/setup-uv instead; setup-python@v5
          # is used here for the same reason every other row uses it, and its manifest has
          # carried 3.14 on ubuntu since the 3.14.0 release in October 2025. pytest, pytest-cov
          # and pytest-asyncio all publish py3-none-any wheels, so there is no wheel gap either.
          - package: qwenloop
            dir: src/vibey_runners/qwen
            python: "3.12"
            install: 'pip install -e ".[dev]"'
            static: 'mypy --strict src/qwenloop && lint-imports && bandit -q -r src/qwenloop'
            test: 'python -m pytest -q'
          - package: qwenloop
            dir: src/vibey_runners/qwen
            python: "3.13"
            install: 'pip install -e ".[dev]"'
            test: 'python -m pytest -q'
          - package: qwenloop
            dir: src/vibey_runners/qwen
            python: "3.14"
            install: 'pip install -e ".[dev]"'
            test: 'python -m pytest -q'
    steps:
      - uses: actions/checkout@v4
        with:
          # vibey-gh's suite drives real git history.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Only the network step below drives a real `uv`, in the one test that verifies a
      # version bump also re-locks: `test_a_real_uv_lock_rewrites_the_pinned_version`. That
      # test is marked `network`, so the offline step needs no binary -- measured, not
      # assumed: with `uv` off PATH entirely the suite is 1019 passed, 4 skipped, 100%
      # branch. So the install is scoped to the row that actually asks for it, instead of
      # being paid by all seven.
      - uses: astral-sh/setup-uv@v3
        if: matrix.network_test
      - name: Install
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.install }}
      # The contract the rows above are shaped around, asserted instead of assumed.
      # ADR-0037 leaves one published distribution, so a family package that arrived
      # from an index is not this tree's code: a stale wheel, a squatted name, or a
      # resurrection nobody voted for. pip records where every distribution came from
      # in direct_url.json -- present with a file:// url for an install from a path,
      # absent for one resolved from an index -- which is the difference, exactly.
      #
      # The names are read from the tenants' own pyprojects rather than listed here: a
      # hard-coded list is the same defect one layer up (ADR-0018), and the tenant added
      # next month would be the one nobody remembered to add.
      - name: Every family package came from this tree, not from an index
        run: |
          python - <<'PY'
          import json
          import re
          import sys
          from importlib.metadata import PackageNotFoundError, distribution
          from pathlib import Path

          root = Path.cwd().resolve()


          def declared_name(pyproject):
              if not pyproject.is_file():
                  return None
              for table in re.split(r"^\[", pyproject.read_text(encoding="utf-8"), flags=re.M):
                  if table.startswith("project]"):
                      found = re.search(r'^name\s*=\s*"([^"]+)"', table, re.M)
                      return found.group(1) if found else None
              return None


          manifests = [root / "pyproject.toml", *sorted(root.glob("src/vibey_*/*/pyproject.toml"))]
          family = {name for name in map(declared_name, manifests) if name}
          # A check that cannot fail is worse than no check: if the layout moves and the
          # glob stops matching, this step would pass forever while proving nothing.
          if len(family) < 2:
              raise SystemExit(f"::error::read {sorted(family)} from {len(manifests)} manifests")
          print(f"{len(family)} family distributions declared in this tree")

          strays = []
          for name in sorted(family):
              try:
                  dist = distribution(name)
              except PackageNotFoundError:
                  continue
              recorded = dist.read_text("direct_url.json") or ""
              url = json.loads(recorded).get("url", "") if recorded else ""
              where = Path(url[len("file://") :]).resolve() if url.startswith("file://") else None
              if where is None or not (where == root or root in where.parents):
                  strays.append(f"{name} {dist.version} <- {url or 'an index'}")
              else:
                  print(f"{name} {dist.version} <- {where}")
          if strays:
              print("::error::family packages not installed from this tree:")
              print(*strays, sep="\n")
              sys.exit(1)
          PY
      # A row's own mypy, lint-imports and bandit, run before its suite because they fail
      # in seconds. Keyed like `network_test`, so a row without `static` skips the step.
      # tests/meta/test_tools_matrix_covers_every_package.py derives from each tenant's
      # own pyproject which of these it configures, and fails if no row runs one.
      - name: Its own static gates
        if: matrix.static
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.static }}
      # VIBEY_GH_NETWORK_TESTS is unset here, so every `network` test is skipped and the
      # package's own --cov-fail-under=100 is enforced on what remains. That makes this
      # step the gate on a property the package would otherwise only assert: its 100%
      # branch floor is reachable with no index, no remote and no socket. Put a branch
      # behind a network-only test again and this fails, which is the whole point.
      #
      # Conditional only so that a static-only row (vibey-runners-common, which ships no
      # suite) can exist. A tenant that has a suite and no row carrying `test` fails the
      # membership test in tests/meta, so the condition cannot quietly drop one.
      - name: Its own suite, unchanged
        if: matrix.test
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.test }}
      # A tenant's own strict docs build, for the three whose CI had one: agyloop and
      # codexloop (properdocs, pinned as they pinned it) and vibey-skills (mkdocs). It runs
      # after the suite and installs its own toolchain, so the suite's environment is the
      # row's `install` and nothing else. One row per tenant, on ubuntu 3.12, as theirs did.
      - name: Its own docs build
        if: matrix.docs
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.docs }}
      # And the other half: the tests that DO leave the machine. These observe the world
      # rather than this repository -- that PyPI still has no yank API, that a real `uv
      # lock` still rewrites the pin -- so a failure here is news about someone else's
      # service, and nothing a pull request author can fix. `continue-on-error` keeps that
      # news visible without letting a PyPI outage or a rate-limit block an unrelated
      # merge; the floor above is the gate, and this is the report.
      #
      # Declared as a row's own command, like `install` and `test`, so any tenant can opt
      # in by adding the key -- and scoped to one row, because this posts unauthenticated
      # to a third party's upload endpoint and running it on all three Python rows tripled
      # that for no extra signal.
      #
      # Coverage is off because this selection is partial by construction; asking a subset
      # to meet the floor would only teach us to lower it.
      - name: The tests that leave the machine
        if: matrix.network_test
        continue-on-error: true
        working-directory: ${{ matrix.dir }}
        env:
          VIBEY_GH_NETWORK_TESTS: "1"
        run: ${{ matrix.network_test }}

  tools-lint:
    name: Absorbed tools - their own linters
    needs: [uv-lock]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: vibey-gh - black, isort, mypy
        working-directory: src/vibey_tools/gh
        run: |
          python -m pip install --quiet -e ".[dev]"
          python -m black --check vibey_gh test
          isort --check-only vibey_gh test
          python -m mypy vibey_gh
      # Both deployed copies, not one. This repository CONTAINS vibey-gh and also
      # ADOPTS it, so there are two rendered sets: gh's own, and the repository root's.
      # Only gh's was checked, which left root drift able to ship silently -- and the
      # root's rendered pin now moves with every release (`[install] pin_version` pins
      # the fallback to this repository's own `[project] version`), so the one copy CI
      # never looked at is the one most likely to lag. Everything-as-code, ADR-0018.
      - name: vibey-gh - it installs its own managed automation without drift
        working-directory: src/vibey_tools/gh
        run: |
          python - <<'PY'
          from vibey_gh.config import load_config
          from vibey_gh.install import installed
          ok, problems = installed(load_config(), local=False)
          raise SystemExit("managed automation drift: " + "; ".join(problems) if not ok else 0)
          PY
      - name: The repository root - its own rendered automation has no drift
        run: |
          python - <<'PY'
          from vibey_gh.config import load_config
          from vibey_gh.install import installed
          ok, problems = installed(load_config(), local=False)
          raise SystemExit("root automation drift: " + "; ".join(problems) if not ok else 0)
          PY

  krypton-app:
    # krypton-app (clients/krypton-app, sub-doctrine 9.e, ADR-0069): the apps' package. It is
    # outside the uv workspace and publishes from krypton-app.yml; this job runs its suite and
    # static checks on every change, as every client and package here is run by CI.
    name: krypton-app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/krypton-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the checkers
        run: python -m pip install --quiet pytest ruff mypy
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check
        run: mypy src
      - name: Unit tests
        run: PYTHONPATH=src python -m pytest -q tests

  vibey-core:
    # @vibey/core (packages/vibey-core, ADR-0067): the pure TypeScript every krypton client
    # shares. It is built with no platform types at all, and held to 100% of lines, branches,
    # functions and statements, as the extension's core was before it moved there.
    name: "@vibey/core"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vibey-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the npm workspace from its one lockfile
        working-directory: .
        run: npm ci
      - name: No known high-severity advisory in any dependency
        working-directory: .
        run: npm audit --audit-level=high
      - name: Build with no platform types, and type-check the tests
        run: |
          npm run build
          npm run typecheck
      - name: Unit tests, at 100% of lines, branches, functions and statements
        run: npm run coverage

  vscode-extension:
    # The VS Code extension (clients/vscode, ADR-0059): its own Node toolchain and checks. It
    # has no runtime dependency, and none of it enters the image: @vibey/core travels inside
    # the .vsix, copied into out/node_modules at compile (ADR-0067). Not a required check yet: it
    # becomes one once it has run green on develop (#290).
    name: VS Code extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: clients/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the npm workspace from its one lockfile
        working-directory: .
        run: npm ci
      - name: No known high-severity advisory in any dependency
        working-directory: .
        run: npm audit --audit-level=high
      - name: Type-check the extension and its tests
        run: npm run typecheck
      - name: Compile, and package.json still agrees with the one command table
        run: |
          npm run compile
          git diff --exit-code -- package.json
      - name: Unit tests, with the core at 100% of lines, branches, functions and statements
        run: npm run coverage
      - name: Smoke test in a real VS Code (Linux, on a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke
      - name: Smoke test in a real VS Code
        if: runner.os != 'Linux'
        run: npm run smoke
      - name: Package the .vsix, and it carries @vibey/core
        run: |
          npx vsce package --no-dependencies --out vibey-${{ matrix.os }}.vsix
          unzip -l vibey-${{ matrix.os }}.vsix | grep -q 'extension/out/node_modules/@vibey/core/dist/packages/vibey-core/src/index.js'
      - uses: actions/upload-artifact@v4
        with:
          name: vibey-vscode-${{ matrix.os }}
          path: clients/vscode/vibey-${{ matrix.os }}.vsix
          if-no-files-found: error

  desktop:
    # Krypton desktop (clients/desktop): C17 on GTK 4 + libadwaita, built with Meson. The
    # pure-C core (libkryptondesktop) is tested with GLib's test framework under ASan and
    # UBSan, and its coverage is gated with gcovr; the GTK views are compiled with
    # -Werror on every distribution here. Not a required check yet: it becomes one once it
    # has run green on develop (the same rule as vscode-extension).
    name: Krypton desktop (${{ matrix.distro }})
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            container: ''
          - distro: arch
            container: archlinux:latest
    defaults:
      run:
        working-directory: clients/desktop
    steps:
      - name: Toolchain and libraries (Ubuntu)
        if: matrix.distro == 'ubuntu'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build gcovr pkg-config \
            libglib2.0-dev libjson-glib-dev libsoup-3.0-dev libgtk-4-dev libadwaita-1-dev \
            libavahi-client-dev libavahi-glib-dev desktop-file-utils appstream
      - name: Toolchain and libraries (Arch)
        if: matrix.distro == 'arch'
        working-directory: /
        run: |
          pacman -Syu --noconfirm --needed base-devel git meson ninja pkgconf glib2 json-glib \
            libsoup3 gtk4 libadwaita avahi desktop-file-utils appstream
      - uses: actions/checkout@v4
      - name: Build everything under ASan and UBSan, warnings as errors
        run: |
          meson setup build -Db_sanitize=address,undefined -Dgui=enabled \
            -Dhub_transport=enabled -Ddiscovery=enabled
          meson compile -C build
      - name: The core's GLib tests, under the sanitizers
        env:
          # LeakSanitizer needs ptrace, which a container job does not get.
          ASAN_OPTIONS: detect_leaks=${{ matrix.distro == 'ubuntu' && '1' || '0' }}:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: meson test -C build --print-errorlogs
      - name: The nightly channel builds beside stable, under its own app id
        run: |
          meson setup build-nightly -Dchannel=nightly -Dgui=enabled
          meson compile -C build-nightly
          grep -q 'io.github.the_vibey_project.Krypton.Nightly' build-nightly/src/app/*.desktop
      - name: The desktop entry and AppStream metadata validate
        run: |
          desktop-file-validate build/src/app/io.github.the_vibey_project.Krypton.desktop
          appstreamcli validate --no-net --explain build/src/app/io.github.the_vibey_project.Krypton.metainfo.xml
      - name: Core coverage, gated (gcovr)
        if: matrix.distro == 'ubuntu'
        run: |
          meson setup build-coverage -Db_coverage=true -Dbuildtype=debug -Dgui=disabled \
            -Dhub_transport=enabled -Ddiscovery=enabled
          meson test -C build-coverage --print-errorlogs
          # The mDNS backends need a daemon a runner does not have: they are compiled and
          # warning-free above, and left out of the measured core.
          gcovr --root . --filter 'src/core/' --exclude 'src/core/kr-discovery-(avahi|dnssd)\.c' \
            --fail-under-line 95 --fail-under-branch 80 --print-summary build-coverage

  image:
    name: Container image (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 is built under emulation. Slower than a native runner, but
      # the alternative is discovering on a customer's Graviton node that
      # the image was never built for it.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: vibey:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Every claim the Dockerfile makes in prose is asserted here, one
      # `Image contract - ...` step each. Prose does not survive a refactor:
      # collapse the two stages or drop the USER line and this job fails
      # instead of shipping. The docs name these steps rather than count
      # them, so adding one cannot leave a stale number behind.
      - name: Image contract - entrypoint runs
        run: |
          out=$(docker run --rm vibey:ci --version)
          echo "$out"
          case "$out" in
            "vibey "*) ;;
            *) echo "::error::unexpected --version output: $out"; exit 1 ;;
          esac

      - name: Image contract - runs as non-root uid 10001
        run: |
          uid=$(docker run --rm --entrypoint id vibey:ci -u)
          echo "uid=$uid"
          test "$uid" = "10001"

      # apt-get is deliberately absent from this list: it installs git in
      # the runtime stage and needs root to do anything, while the chart
      # runs the pod non-root with allowPrivilegeEscalation false. pip is
      # the one that mattered -- uid 10001 owns a writable $HOME, so
      # `pip install --user` would have worked until it was removed.
      # node and npm are listed because codex ships in the image: its npm
      # package would have brought both, and the static binary exists so
      # that neither does.
      - name: Image contract - no compiler, no uv, no pip, no node/npm
        run: |
          docker run --rm --entrypoint sh vibey:ci -c '
            status=0
            for tool in uv pip pip3 gcc cc node npm npx; do
              if command -v "$tool" >/dev/null 2>&1; then
                echo "$tool present in runtime layer"; status=1
              fi
            done
            exit $status
          '

      - name: Image contract - migrations ship in the image
        run: |
          count=$(docker run --rm --entrypoint sh vibey:ci -c 'ls /app/migrations/*.sql | wc -l')
          echo "migrations=$count"
          test "$count" -gt 0

      # codexloop drives the codex CLI, so the image carries upstream's static
      # musl build (see the Dockerfile's build stage). The version is read from
      # the Dockerfile's own pin rather than repeated here, so a bump changes
      # one line and this check follows it.
      - name: Image contract - codex runs and is the pinned build
        run: |
          want=$(sed -n 's/^ARG CODEX_VERSION=//p' deploy/docker/Dockerfile)
          test -n "$want"
          out=$(docker run --rm --entrypoint codex vibey:ci --version)
          echo "$out (pinned: $want)"
          case "$out" in
            *"$want"*) ;;
            *) echo "::error::codex --version printed '$out'; the Dockerfile pins $want"; exit 1 ;;
          esac

      # One distribution, twelve console scripts (ADR-0037, ADR-0064). That is the new product
      # contract, and it is the one the Dockerfile's COPY list can break silently: a
      # package root that never reaches the build context does not fail the build, it
      # just is not there. tests/meta/test_shipped_trees_are_reachable.py catches the
      # omission in the manifest; this catches it in the artifact.
      - name: Image contract - every console script is on PATH
        run: |
          docker run --rm --entrypoint sh vibey:ci -c '
            status=0
            for tool in vibey vibey-gh vibey-skills vibe-skills vibey-bootstrap \
                        azbootstrap claudeloop codexloop cursorloop agyloop gptossloop qwenloop; do
              if command -v "$tool" >/dev/null 2>&1; then
                echo "ok      $tool"
              else
                echo "MISSING $tool"; status=1
              fi
            done
            exit $status
          '

      # Built last: under emulation this is the slow half, and there is no
      # point paying for it when the amd64 contracts already failed.
      - name: Build arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/arm64
          push: false
          tags: vibey:ci-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Render-only, so it needs neither a cluster nor the image: it lints the chart
  # and compares its render under every profile in deploy/helm/golden/render.sh
  # with the committed goldens. cluster-smoke installs only the defaults; this
  # is what looks at everything else (the in-cluster Ollama, the worker wiring
  # it adds, the KEDA query's project scoping) before any of it meets a cluster.
  chart:
    name: Helm chart lint and golden render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, unlike cluster-smoke's: a golden is a byte comparison, and a
      # different helm may format the same manifest differently. Bump the pin
      # and regenerate the goldens together.
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - name: Chart - lint and render every profile against its golden
        run: deploy/helm/golden/render.sh

  cluster-smoke:
    name: Helm install on minikube
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: medyagh/setup-minikube@latest
        with:
          cpus: 4
          memory: 10240m

      - uses: azure/setup-helm@v5

      - name: Build the image into minikube's daemon
        # BuildKit's default docker-container driver pulls a separate
        # moby/buildkit image and then inspects it -- that inspect step
        # 404s against minikube's containerd-backed docker-env shim
        # (medyagh/setup-minikube's own docs flag this as experimental).
        # The classic builder needs no such image, so it isn't affected.
        env:
          DOCKER_BUILDKIT: "0"
        run: |
          eval $(minikube docker-env)
          docker build -f deploy/docker/Dockerfile -t vibey:dev .

      - name: helm install
        run: |
          helm install vibey deploy/helm/vibey \
            -n vibey --create-namespace --wait --timeout 20m

      # Every sovereign operational surface deployed by the chart must become
      # Available. A degraded or crash-looping surface is a broken install.
      - name: Contract - all sovereign surface deployments become Available
        run: |
          for dep in \
            vibey-vibey-plane-api \
            vibey-vibey-plane-worker \
            vibey-vibey-plane-beat \
            vibey-vibey-plane-web \
            vibey-vibey-bookstack-mariadb \
            vibey-vibey-bookstack \
            vibey-vibey-openbao \
            vibey-vibey-nextcloud \
            vibey-vibey-postfix \
            vibey-vibey-kannel \
            vibey-vibey-synapse \
            vibey-vibey-infisical \
            vibey-vibey-redis \
            vibey-vibey-rabbitmq \
            vibey-vibey-garage \
            vibey-vibey-wazuh-indexer \
            vibey-vibey-wazuh-manager \
            vibey-vibey-wazuh-dashboard \
            vibey-vibey-gitea \
            vibey-vibey-registry \
            vibey-vibey-keycloak \
            vibey-vibey-loki \
            vibey-vibey-uptime-kuma \
            vibey-vibey-prometheus \
            vibey-vibey-grafana; do
            echo "asserting deployment/$dep is available..."
            kubectl wait --for=condition=available "deployment/$dep" -n vibey --timeout=5m
          done

      # A fresh install into an empty namespace has no project. The worker
      # must park and poll, not exit -- exiting is a restart loop that ends
      # only when a human shows up, and the crash counter makes a healthy
      # deployment look broken.
      - name: Contract - a projectless worker parks instead of crash-looping
        run: |
          kubectl wait --for=condition=available \
            deployment/vibey-vibey-worker -n vibey --timeout=5m
          for _ in $(seq 1 20); do
            kubectl logs -n vibey deployment/vibey-vibey-worker > /tmp/log 2>&1 || true
            grep -q "no project yet; polling" /tmp/log && break
            sleep 5
          done
          cat /tmp/log
          grep -q "no project yet; polling" /tmp/log
          restarts=$(kubectl get pods -n vibey -l app.kubernetes.io/component=worker \
            -o jsonpath='{.items[0].status.containerStatuses[0].restartCount}')
          echo "restarts=$restarts"
          test "$restarts" = "0"

      - name: Contract - the worker picks up a project created in-cluster
        run: |
          kubectl exec -n vibey deploy/vibey-vibey-worker -- \
            vibey new demo --repo /work/demo --max-cycles 1
          for _ in $(seq 1 24); do
            kubectl logs -n vibey deployment/vibey-vibey-worker > /tmp/log 2>&1 || true
            grep -q "worker started: project=demo" /tmp/log && break
            sleep 5
          done
          cat /tmp/log
          grep -q "worker started: project=demo" /tmp/log

      # ADR-0055: the ledger is append-only by the database. The `migrate` init
      # container ran as the owner and reported the guard in force; the role every
      # workload connects as is refused any rewrite by privilege; the owner itself is
      # refused by the triggers; and the worker's own doctor agrees.
      - name: Contract - the worker's role cannot rewrite the ledger
        run: |
          kubectl logs -n vibey deployment/vibey-vibey-worker -c migrate > /tmp/migrate.log 2>&1 || true
          cat /tmp/migrate.log
          grep -q "ledger guard in force: vibey_app" /tmp/migrate.log
          # Local connections authenticate with scram-sha-256 too (sub-doctrine 10.j,
          # ADR-0061), so psql inside the pod needs a password. The smoke install uses the
          # chart's dev defaults, where each role's password is its own name.
          as() {
            kubectl exec -n vibey statefulset/vibey-vibey-postgres -- \
              env PGPASSWORD="$1" psql -U "$1" -d vibey -v ON_ERROR_STOP=1 -c "$2" 2>&1 || true
          }
          test "$(as vibey 'SELECT count(*) > 0 FROM event' | grep -c ' t$')" = "1"
          for sql in "UPDATE event SET digest = 'forged'" "DELETE FROM event" "TRUNCATE event"; do
            as vibey_app "$sql" | tee /tmp/app.out
            grep -q "permission denied" /tmp/app.out
            as vibey "$sql" | tee /tmp/owner.out
            grep -q "the ledger is append-only" /tmp/owner.out
          done
          as vibey_app "ALTER TABLE event DISABLE TRIGGER event_append_only" | tee /tmp/ddl.out
          grep -q "must be owner" /tmp/ddl.out
          kubectl exec -n vibey deploy/vibey-vibey-worker -- vibey doctor --cluster > /tmp/doctor 2>&1 || true
          cat /tmp/doctor
          grep -q "PASS ledger-guard" /tmp/doctor
          grep -Eq "(PASS|FAIL|UNKNOWN) local-auth" /tmp/doctor

      # ADR-0056. The broker enforces the consumer_timeout the chart declares -- read back
      # from the running node, never assumed from the file -- and the queue reaper, run
      # in the worker pod with only the environment the chart gives it, reconciles its
      # policy onto the broker and reads it back. That write is also the check that the
      # pinned image accepts the `consumer-timeout` and `delivery-limit` policy keys.
      - name: Contract - the broker enforces the declared consumer timeout and the reaper's policy
        run: |
          set -euo pipefail
          got=$(kubectl exec -n vibey deploy/vibey-vibey-rabbitmq -- \
            rabbitmqctl eval 'application:get_env(rabbit, consumer_timeout).' | tr -d '[:space:]')
          echo "consumer_timeout on the running node: $got"
          test "$got" = "{ok,1800000}"
          kubectl exec -n vibey deploy/vibey-vibey-worker -- vibey queue reap --json > /tmp/reap.json
          cat /tmp/reap.json
          python3 -c 'import json; r = json.load(open("/tmp/reap.json")); assert r["ok"] and r["policy"]["verified"], r'
          kubectl exec -n vibey deploy/vibey-vibey-rabbitmq -- \
            rabbitmqctl list_policies -p / --formatter json > /tmp/policies.json
          cat /tmp/policies.json
          grep -q '"vibey-reap"' /tmp/policies.json

      # KEDA's operator runs in its own namespace and dials Postgres
      # itself, so it is the only thing here that exercises the DSN from
      # outside the release namespace. An unqualified DSN passes every
      # other check in this file and fails this one -- which is exactly
      # how it once shipped unnoticed.
      - name: Contract - the ScaledObject reconciles against real Postgres
        run: |
          helm repo add kedacore https://kedacore.github.io/charts
          helm install keda kedacore/keda -n keda --create-namespace --wait --timeout 5m
          helm upgrade vibey deploy/helm/vibey -n vibey \
            --set keda.enabled=true --wait --timeout 5m
          ready=""
          for _ in $(seq 1 24); do
            ready=$(kubectl get scaledobject vibey-vibey-worker -n vibey \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
            [ "$ready" = "True" ] && break
            sleep 5
          done
          kubectl get scaledobject -n vibey
          test "$ready" = "True"

      # terminationGracePeriodSeconds is 7200. Without the SIGTERM drain a
      # scaled-in pod sits there for all of it, still holding connections
      # and still claiming jobs, while kubectl reports it gone. 60s is a
      # generous ceiling for an idle worker that genuinely drains.
      - name: Contract - a worker drains promptly on SIGTERM
        run: |
          helm upgrade vibey deploy/helm/vibey -n vibey \
            --set keda.enabled=false --wait --timeout 5m
          pod=$(kubectl get pods -n vibey -l app.kubernetes.io/component=worker \
            -o custom-columns=NAME:.metadata.name,DEL:.metadata.deletionTimestamp --no-headers \
            | awk '$2 == "<none>" {print $1}' | head -n 1)
          # How old is it? A pod deleted moments after its container started is testing
          # the startup race (SIGTERM discarded while PID 1 still had SIG_DFL), not the
          # steady-state drain. Both must pass; only one of them is obvious from a log.
          started=$(kubectl get pod "$pod" -n vibey \
            -o jsonpath='{.status.containerStatuses[0].state.running.startedAt}' || true)
          echo "deleting $pod (container started at ${started:-unknown})"
          # By the time a failing test reaches the diagnostics step below,
          # the Deployment has already replaced this pod -- `kubectl logs
          # deployment/...` would then show the REPLACEMENT's fresh startup
          # log, not this pod's. Name it explicitly so diagnostics can still
          # find it once it's no longer the Deployment's current pod.
          echo "SIGTERM_TEST_POD=$pod" >> "$GITHUB_ENV"
          start=$(date +%s)
          kubectl delete pod "$pod" -n vibey --wait=true --timeout=5m
          elapsed=$(( $(date +%s) - start ))
          echo "terminated in ${elapsed}s (grace period allows 7200s)"
          test "$elapsed" -lt 60

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get all -n vibey || true
          kubectl describe pods -n vibey || true
          if [ -n "${SIGTERM_TEST_POD:-}" ]; then
            echo "--- logs: the specific pod the SIGTERM test deleted ($SIGTERM_TEST_POD) ---"
            # --timestamps, because the question this log has to answer is *when* the
            # drain flag was observed relative to the delete -- and without them every
            # line carries the collection time instead.
            kubectl logs -n vibey "pod/$SIGTERM_TEST_POD" --timestamps --tail=300 || true
            echo "--- describe: same pod, for phase/conditions/events ---"
            kubectl describe "pod/$SIGTERM_TEST_POD" -n vibey || true
          fi
          kubectl logs -n vibey deployment/vibey-vibey-worker --tail=100 || true
          kubectl logs -n keda deployment/keda-operator --tail=50 || true
