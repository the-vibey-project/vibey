name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please search [existing issues](https://github.com/the-vibey-project/vibey/issues)
        and skim the [docs](https://the-vibey-project.github.io/vibey/)
        before proposing something that may already exist. Design discussion
        that is not yet a concrete request belongs in
        [Discussions](https://github.com/the-vibey-project/vibey/discussions).

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation where the current behavior falls short.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen? A rough CLI/API shape is welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: additional
    attributes:
      label: Anything else?
