#
# Declared exceptions to the dependency-advisory gate (`vibey-gh advisory-check`, run by CI in
# place of `npm audit --audit-level=high`; `[advisories]` in .vibey-gh.toml).
#
# An entry here ACCEPTS A KNOWN RISK until its `expires` date. It is a decision, not a skip,
# so every entry must carry the evidence a reviewer needs to make it:
#
# - `advisory`, `package`, `workspace`: exactly what is excepted -- one GitHub advisory, in
#   one package, in one npm workspace (a repository-relative directory holding a
#   package-lock.json). Nothing broader.
# - `reason`: why the vulnerable code is not reached by anything we ship or run, with the
#   evidence -- not "low risk".
# - `added`, `expires`: unquoted TOML dates. `expires` is at most `max_exception_days` after
#   `added`; the exception stops being honoured ON that date. Renewing is a new decision:
#   fresh evidence, a new `added`, a new `expires`.
# - `retire_when`: the condition that ends it early; `upstream`: where that is tracked.
# - `fix_unreachable` (optional): lets the entry stand although a patched release EXISTS, because
#   no package that depends on this one accepts it. Say who pins the vulnerable range and what
#   it is, and what was tried. The check verifies one thing itself, that the package is
#   dev-only in the workspace's lockfile, and refuses the key for a package that ships. It
#   cannot verify that no dependent accepts the fix, so a reviewer must; the expiry makes
#   someone look again.
#
# The check prints every exception it honours on every run, and fails when one has expired,
# no longer matches anything (delete it), or its package has a patched release (take the fix
# and delete it). This file is a protected path (.github/CODEOWNERS, `[merge_train]
# protected_paths`): accepting a risk needs the code owner's approval and a human merge, and
# the merge train never lands a change to it unattended.

# No exception is declared. GHSA-xcx6-jx8p-x3h5 (@azure/msal-node, here 6.0.1) was excepted
# from 2026-10-23 until its own retire_when condition held: @azure/identity 4.14.1 accepts
# @azure/msal-node 7.x, the lockfile now resolves 7.2.2 (past the fixed 7.1.0), and the check
# reports the exception as matching nothing. Deleted rather than renewed, as the check asks.

# picomatch, GHSA-fc5q-39xc-vjpf (high, CVSS 7.5): the advisory was widened to "through 4.0.7"
# on 2026-11-17 and no patched release exists (4.0.7 is the latest on npm), so the only ways to
# keep the gate are an exception or removing the dependents. Two entries, one per workspace,
# because the evidence differs: one is measured, the other is by inspection.

[[exception]]
advisory = "GHSA-fc5q-39xc-vjpf"
package = "picomatch"
workspace = "clients/app"
added = 2026-11-17
expires = 2026-12-17
reason = """
Same advisory and same mechanism as the root workspace entry above (a crafted extglob pattern
blocks the event loop). Both lines are affected here: picomatch 4.0.7 (under @expo/cli,
@expo/metro-config and tinyglobby) and 2.3.2 (the hoisted copy, under anymatch, micromatch and
jest-util). Evidence, from the lockfile and the source tree on 2026-11-17 -- what was checked,
and what was not:

1. UNLIKE the root workspace, `npm ls picomatch --package-lock-only --omit=dev` is not empty
   here: Expo's own tooling is declared under `dependencies` (this lockfile marks no package
   `dev`), so picomatch IS in the declared production tree. The chains are expo -> @expo/cli;
   expo -> @expo/metro-config; expo -> @expo/metro -> metro-file-map -> micromatch;
   react-native -> tinyglobby; and expo-router -> @testing-library/react-native -> jest ->
   anymatch / jest-util. Every one is the Expo CLI, the Metro bundler or the jest test runner,
   which run on a developer's machine or in CI to build or test the app.
2. None of the app's 82 own source files (.ts, .tsx, .js, .jsx outside node_modules) imports
   picomatch, micromatch, anymatch, tinyglobby or fdir, and metro.config.js sets only
   `resolver.extraNodeModules` and `resolver.nodeModulesPaths`: no glob pattern is configured.
3. The patterns Expo and Metro match come from their configuration and from the project's file
   layout, written by developers; they are not derived from a network client.

NOT checked: the contents of an exported bundle (`expo export`), so that no picomatch code is
inlined into what ships, was not inspected; whether the Expo or Metro development server passes
any request-derived string to picomatch was not read from their source. This repository does not
run either server in production. The case therefore rests on points 1 to 3, reachability by
inspection, which is weaker than the root workspace's measurement.
"""
retire_when = "picomatch publishes a release above 4.0.7 that the advisory lists as patched and the 2.x line is fixed or its dependents (anymatch, micromatch, jest-util) move to a patched release (this check then fails on its own; refresh clients/app/package-lock.json and delete this entry), or Expo and Metro stop depending on it"
upstream = [
  "https://github.com/advisories/GHSA-fc5q-39xc-vjpf",
  "https://github.com/micromatch/picomatch",
]
