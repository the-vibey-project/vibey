[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibey"
version = "0.8.0"
description = "A queue-based, six-phase conductor with optional visual design and Azure deployment."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.15",
    "asyncpg>=0.30",
    "structlog>=24.4",
    "textual>=0.86",
    "tomli-w>=1.1",
]

[project.urls]
# Shown in the PyPI sidebar. The paper and the book are the documentation's two
# downloadable forms, published beside it on the production channel.
Homepage = "https://the-vibey-project.github.io/vibey/"
Documentation = "https://the-vibey-project.github.io/vibey/main/"
"Research paper" = "https://the-vibey-project.github.io/vibey/main/paper.pdf"
Book = "https://the-vibey-project.github.io/vibey/main/book.pdf"
Source = "https://github.com/the-vibey-project/vibey"
Issues = "https://github.com/the-vibey-project/vibey/issues"
Changelog = "https://github.com/the-vibey-project/vibey/blob/main/CHANGELOG.md"

[project.scripts]
vibey = "vibey.cli.main:app"

[project.optional-dependencies]
# kopf pulls the whole Kubernetes client stack. Nobody running `vibey
# worker` on a laptop needs it, so the operator is an extra rather than a
# base dependency: `pip install vibey[operator]`.
operator = [
    "kopf>=1.37",
    "kubernetes>=31.0",
]
skills = [
    # The versioned wheel this pin was waiting for exists now: 2.18.0 shipped the context
    # engine and 2.19.x carries the index/packet CLI. The git source pin it replaces was
    # also what broke publishing outright -- PyPI refuses uploads whose metadata carries a
    # direct URL dependency ("400 Can't have direct dependency"), so the package could not
    # be released at all while this extra pointed at a commit.
    "vibey-skills>=2.18,<3",
]
dev = [
    # Release automation and the provenance guardrails, shared by every repo
    # in the family. Stdlib-only by design, so adopting it in five places
    # does not multiply anyone's dependency tree.
    "vibey-gh>=1.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.5",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
    # The operator ships in the same package and carries the same 100%
    # branch-coverage floor, so its dependencies must be present to test.
    "kopf>=1.37",
    "kubernetes>=31.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vibey"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.workspace]
# Two grouping directories, two globs. Both are globs so a new member registers itself,
# which is why `common` needed no wiring when it was added after the runner import.
members = ["src/vibey_runners/*", "src/vibey_tools/*"]

[tool.uv.sources]
# This repository is now the source of truth for both, so the workspace resolves them from
# the tree rather than from PyPI. This is NOT a direct reference: `tool.uv.sources` is uv
# metadata, stripped at build time, and the requirement strings in the published METADATA
# stay exactly as `[project.optional-dependencies]` declares them below. That distinction
# is the whole difference from the git pin that once broke publishing outright with PyPI's
# "400 Can't have direct dependency".
vibey-gh = { workspace = true }
vibey-skills = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not paid' -n auto --maxprocesses=8"
markers = [
    "integration: requires a running Postgres reachable via VIBEY_TEST_DATABASE_URL",
    "slow: takes more than a couple seconds to run",
    "system: delivery-stage-set end-to-end system test",
    "live: tests against real loop binaries (faked mode — scripted agents)",
    "paid: tests against real models (requires API keys, costs money)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501 only, and only because of the provenance header: an exact 234-character line
# compared byte-for-byte, unwrappable without failing the check that mandates it. Width on
# real code is still enforced by the formatter.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# E402 (import not at top of file) for exactly one file, for exactly one statement.
# `vibey/cli/main.py` arms the SIGTERM latch BEFORE importing typer and the rest of the
# tree, because Linux discards a signal sent to PID 1 while its disposition is still
# SIG_DFL -- every import below that line is time in which a Kubernetes scale-in would be
# thrown away. The placement IS the fix; moving those imports up would undo it.
"src/vibey/cli/main.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["vibey"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["vibey"]
branch = true
parallel = true
