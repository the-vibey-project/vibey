# The storm's model (2026-09-22): GPT-OSS 20B through the local Ollama. Measured 2.5x faster
# than Qwen2.5-Coder-14B on llama.cpp for the same session (bench/results.jsonl). One loop
# instance per deployment (8.c): Ollama is that one instance.
backend = "openai-compat"
base_url = "http://127.0.0.1:11434/v1"
model = "gpt-oss:20b"
# 131072 -> 65536 (2026-09-22 evening), measured rather than guessed: bench/host-tuning.toml.
# Across 838 recorded turns the largest single turn was 49,118 tokens (p50 20,070; p90 32,026;
# p99 42,979) and not one exceeded 64k, so this covers every turn ever observed with 33%
# headroom. The reserved KV cache is what a context window costs in memory, and at 131072
# llama-server held 14.9 GB RSS of this 24 GB machine with swap 95% full, 4,569 pages free and
# 10.6M swapouts: the machine was thrashing to reserve a context no lane has used half of.
# Raise it only against a measurement showing a turn that needs it (8.g, always measured).
context_window = 65536
# 40 -> 60 (2026-09-22 evening). At 40 the cap, not the model, was the binding constraint:
# installer-catalogue #469 wrote its domain module, its ADR-0016 interface and its test file,
# got 9 of its own 13 tests passing, and hit exactly 40 turns on all three attempts with four
# AttributeErrors left. Earlier lanes spent ~half their turns on tools that do not exist
# (46-56%); once EDITING-RULES.md named the four real ones that fell to 8-12%, which is what
# made the cap the limit rather than the waste. Raised by half, not doubled: a lane that is
# flailing should still stop, and every extra turn is trimmed transcript against the 131k
# window.
max_turns = 60
# One empty model reply (no tool call, no text) no longer ends a run (2026-09-23). Across the
# 82 runs on disk, 27 of 60 failed runs (45%) ended on the first such turn (23 of the 27 after
# 11-12 output tokens), and the only retry was a whole new attempt. Each retry here is a new model
# call that spends a turn of max_turns, so a lane that only ever answers with nothing still
# stops. The turn.empty event records what each empty reply was (finish_reason, tokens, the
# reasoning field's length); raise this only against that evidence.
max_empty_reply_retries = 2
