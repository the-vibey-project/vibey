#
# The releases the research paper counts. `scripts/paper_figures.py` draws its release-cadence
# figure from this file and from nothing a forge holds: deleting, moving or recreating a release
# tag changes no figure and turns no check red, because a tag is only ever read once, by
# `python scripts/paper_releases.py sync`, to propose an entry here. Review the entry like any
# other change.
#
# Adding a release: the Release workflow cuts the tag on `main`, so the entry can only follow it.
# The daily documentation updater runs `sync` and puts the entry in its refresh pull request. By
# hand, once the tag is in your clone:
#
#     python scripts/paper_releases.py sync
#
# `sync` only appends and never rewrites an entry. `python scripts/paper_releases.py check` fails,
# naming the version, when the release branch ships one this file lacks.
#
# A release is selected for a figure by its `released` instant, and left out when its `commit`
# holds the revision the figure is pinned at (tests/meta/test_paper_releases.py).

# Each release family: the package it names, the prefix its tags carry (the same prefix
# `[github_release] tag_prefix` sets in .vibey-gh.toml, held equal by a test) and the file whose
# `[project] version` the release branch ships. The absorbed packages tagged their own releases
# in repositories that were removed (claudeloop-v*, agyloop-v*, cursorloop-v*, codexloop's bare
# v*); those were never carried into this repository, so only this family has entries. Add a
# family here, and its entries with `sync`, to restore a lane per package.
[[family]]
package = "vibey"
tag_prefix = "vibey-v"
version_file = "pyproject.toml"

[[release]]
package = "vibey"
version = "0.1.0"
tag = "vibey-v0.1.0"
