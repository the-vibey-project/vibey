[[cases.edits]]
find = '''
    async def open_all(self) -> tuple[HumanGateRecord, ...]:
        async with self._pool.acquire() as conn:
            rows = await conn.fetch(
                """
                SELECT * FROM human_gate
                WHERE answered_at IS NULL
                ORDER BY raised_at ASC, gate_id ASC
                """
            )
            return tuple(_row_to_record(r) for r in rows)
'''
replace = '''
    async def open_all(self, kind: str | None = None) -> tuple[HumanGateRecord, ...]:
        """Every open gate, oldest first; only gates of `kind` when one is named."""
        where = "answered_at IS NULL"
        if kind is not None:
            where += f" AND kind = '{kind}'"
        async with self._pool.acquire() as conn:
            rows = await conn.fetch(
                f"""
                SELECT * FROM human_gate
                WHERE {where}
                ORDER BY raised_at ASC, gate_id ASC
                """
            )
            return tuple(_row_to_record(r) for r in rows)
'''
planted = "where += f\" AND kind = '{kind}'\""

