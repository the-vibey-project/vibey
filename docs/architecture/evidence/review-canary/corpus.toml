# The review canary's corpus: pull-request diffs against THIS repository's own code, each
# carrying exactly one planted defect of a declared class, beside clean controls.
#
# `vibey-gh review-canary` turns every case into a unified diff and hands it to the sovereign
# review exactly as `pr-review.yml` would hand a pull request -- the same `local-review` entry
# point, the same model, think level, window, documents and reference sources -- then scores
# whether the verdict blocked the planted defect for the right reason (see the matching rule
# in vibey-gh's docs/configuration.md, `[pr_automation.review_canary]`).
#
# How every case is built, so each one can be checked by hand:
#
#   1. Take the file at `path` exactly as it stands at `pin` (`git show <pin>:<path>`).
#   2. Apply each `[[cases.edits]]` in order: `find` must occur exactly once in the text so
#      far, and is replaced by `replace`. Nothing else changes.
#   3. The diff is `difflib.unified_diff` of the two texts, three lines of context, under a
#      `diff --git a/<path> b/<path>` header. The post-change text is what the review is
#      shown as the file's reference source.
#   4. A defect's location is the lines of the post-change text spanned by `planted`, which
#      must occur within the replacement of the edit that declares it. `anchors` are exact
#      strings a finding about that location would plausibly quote; `class` names the
#      defect's class, whose `keywords` a finding about it would plausibly use.
#
# Every defect contradicts something the same file states -- a docstring, a comment, or the
# code beside it -- so it is a defect, not a design choice a reviewer could defend. Every
# control preserves behaviour: renames are complete, refactors are equivalent, and two of
# them (`ctl-gate-open-all-kind-param`, `ctl-worktree-base-ternary`) are the correct forms
# of two defects, to test that the review is not just flagging whatever changed there.
#
# The pin is an ancestor of origin/develop, so `git show` resolves it in any full clone.
# Re-pinned 2026-10-03 from 2b17eb7 to 0f88412, the same tree: realigning develop onto
# main's rebased copies gave #1319 a new commit and left 2b17eb7 in no clone's history.
# The ledger's earlier rows name 2b17eb7 and stay as recorded.
#
# The class keywords are a lexical heuristic, and every finding's words are kept in the
# ledger so a match can be re-adjudicated by hand. They were widened once, before the first
# recorded measurement: a smoke run's finding on `obo-protected-listing-one-short` quoted the
# planted `listed + 1 < total` and said it "allows a single missing file", which the first
# off-by-one list did not recognise. "by one", "single", "extra" and the +/-1 spellings were
# added to `off_by_one`, and "error" and "fail" to `wrong_error_return`; nothing since.

schema = "vibey-gh/review-canary-corpus/1"
pin = "0f88412d508364fbc42c6c9a413235899e7859cd"

[classes.off_by_one]
summary = "a bound, count or starting value one away from what the code beside it requires"
keywords = [
  "off-by-one", "off by one", "boundary", "fencepost", "one fewer", "one more", "one less",
  "one too", "zero", "non-negative", "negative", "inclusive", "exclusive", "starts at 0",
  "start at 0", "short by one", "one short", "one missing", "miscount", "by one", "single",
  "extra", "+ 1", "- 1", "+1", "-1",
]

[classes.inverted_condition]
summary = "a condition negated, or joined with the wrong boolean operator"
keywords = [
  "invert", "negat", "opposite", "reverse", "backward", "flipped", "condition", "logic",
  "boolean", "instead of and", "instead of `and`", "instead of or", "instead of `or`",
  "wrong branch",
]

[classes.swallowed_exception]
summary = "an error caught and dropped, so a failure the file says must be reported is not"
keywords = [
  "swallow", "silently", "ignore", "suppress", "hide", "hidden", "mask", "without logging",
  "not logged", "not reported", "no longer reported", "catch-all", "catches all",
  "broad except", "bare except", "discard", "lost",
]

[classes.missing_await]
summary = "a coroutine called without `await`, so the work it does never happens"
keywords = [
  "await", "coroutine", "never awaited", "not awaited", "never runs", "never executed",
  "never executes", "asynchronous",
]

[classes.sql_injection]
summary = "SQL built by string formatting from a value a caller supplies"
keywords = [
  "sql injection", "injection", "inject", "interpolat", "f-string", "string formatting",
  "concatenat", "unsanitized", "unsanitised", "parameteriz", "parameteris", "placeholder",
  "bind parameter", "untrusted", "escap",
]

[classes.removed_guard]
summary = "a check the file relies on for safety or authorization, removed"
keywords = [
  "guard", "check", "verif", "authoriz", "authoris", "permission", "ownership", "trust",
  "provenance", "validat", "bypass", "no longer", "skip", "removed", "without checking",
]

[classes.resource_leak]
summary = "a connection, file or handle acquired and never released"
keywords = [
  "leak", "never closed", "not closed", "close", "release", "context manager",
  "with statement", "`with`", "handle", "connection", "exhaust", "dangling",
]

[classes.wrong_error_return]
summary = "an error path that returns the success value, so a failure reads as a pass"
keywords = [
  "error path", "on failure", "on error", "error", "fail", "instead of raising", "should raise",
  "raise", "returns none", "return none", "empty", "treated as success", "success",
  "fail open", "fail-open", "fail closed", "fail-closed", "false pass", "refus", "unknown",
]

[classes.shared_state_race]
summary = "shared state read and written across an await or a thread without its lock"
keywords = [
  "race", "concurren", "parallel", "lock", "thread", "atomic", "simultaneous", "interleav",
  "twice", "synchroniz", "synchronis", "toctou", "check-then-act", "shared state",
]

