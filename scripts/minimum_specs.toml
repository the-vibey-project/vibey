# Made with ❤️ by [Vibey](https://the-vibey-project.github.io/vibey/), Developed by [Adam Matthew Steinberger](https://vibewithadam.matthewsteinberger.com/) ([@adammatthewsteinberger](https://github.com/adammatthewsteinberger/)).
#
# The one declared source for scripts/minimum_specs.py (ADR-0051: configuration is declared
# in TOML, never written into a source file). Every path, threshold, context size, model,
# assumption and idle rule the weekly measurement uses is here, with the reason beside it.
# Change a value here and run `python scripts/minimum_specs.py derive` then `render`: the
# derived figures and every generated table follow, and `check` fails until they do.

[minimum_specs]
# The committed evidence record, and the two documents whose GENERATED blocks it feeds.
record = "docs/architecture/evidence/minimum-specs.json"
docs_page = "docs/reference/system-requirements.md"
paper = "docs/paper.md"

[minimum_specs.install]
# Interpreters the Python floor probe tries, oldest first. A version below the declared
# floor is expected to be refused; the probe records that as a measurement, not an error.
python_candidates = ["3.11", "3.12", "3.13", "3.14"]
# May uv download a CPython the host lacks (about 25 MB each)? "automatic" lets it, so
# every candidate is tried; "never" keeps the probe to the interpreters the host has, and
# a missing one is then recorded as skipped with that reason, never guessed.
python_downloads = "automatic"
# The interpreter the footprint installs run on (the CI gates run 3.12).
footprint_python = "3.12"
# The distributions built from this checkout and measured cold (fresh uv cache).
engine_project = "."
krypton_project = "clients/krypton-app"
# Extras measured as their own install targets beside the base engine.
engine_extras = ["hub"]
install_timeout_s = 900

[minimum_specs.postgres]
# The environment variable holding a DSN that may CREATE and DROP a scratch database.
# The probe creates `scratch_database`, migrates it, measures it and drops it. It never
# drops a database it did not create, and it never touches any other database.
admin_url_env = "VIBEY_SPECS_PG_ADMIN_URL"
scratch_database = "vibey_specs_scratch"
# Where the floor is declared in code; read, never duplicated here.
floor_source = "src/vibey/infrastructure/postgres.py"
floor_constant = "POSTGRES_MIN_MAJOR"

[minimum_specs.ollama]
url_env = "VIBEY_OLLAMA_URL"
default_url = "http://127.0.0.1:11434"
server_log = "~/.ollama/logs/server.log"
registry = "https://registry.ollama.ai"
sovereign_model = "gpt-oss:20b"
optional_models = ["qwen3:14b"]
# The Ollama.app bundle whose size the disk estimate counts (macOS); absent elsewhere.
app_path = "/Applications/Ollama.app"

[minimum_specs.bench]
# Contexts the memory sweep loads the model at: the conductor's floor and ceiling, the
# runner's default window, and the model's maximum (what `/v1` gets from a default-maxed
# Ollama). The derivations read 8192, 32768 and 131072, so keep those three.
contexts = [4096, 8192, 32768, 131072]
# Throughput with the prompt filled to `fill` of the window (the runner's worst turn).
depth_contexts = [32768]
fill = 0.75
# CPU only (`num_gpu` 0): the conductor's ceiling.
cpu_contexts = [8192]
prompt_tokens = 2000
num_predict = 256
runs = 3
seed = 42
chars_per_token = 4.83
request_timeout_s = 3600

[minimum_specs.idle]
# The model measurements run only on an idle host: load1 at or below `max_load1`, no
# inference request in the Ollama log for `quiet_window_s`, and `busy_command` (a shell
# command; any output means busy) silent. Waits at most `max_wait_s`, then records the
# model figures as skipped with the reason, and the previous values are kept as stale.
max_load1 = 3.0
quiet_window_s = 120
max_wait_s = 1800
poll_s = 30
busy_command = ""

[minimum_specs.processes]
# The hub and launcher are started on these loopback ports, idle for `idle_s`, and sampled.
serve_port = 18775
krypton_port = 18776
idle_s = 20
startup_timeout_s = 90
command_timeout_s = 300

[minimum_specs.declared]
# Where the client floors are declared; the probe reads them, it never restates them.
vscode_manifest = "clients/vscode/package.json"
app_manifest = "clients/app/package.json"
desktop_meson = "clients/desktop/meson.build"
engine_pyproject = "pyproject.toml"
# The Node version the repository pins for development: the clients' recommended Node.
node_version_file = ".node-version"
# vibey's own limits the throughput thresholds are held against, read from the code.
conductor_source = "src/vibey/infrastructure/engines/ollama_chat.py"
runner_config_source = "src/vibey_runners/qwen/src/qwenloop/domain/config.py"

[minimum_specs.assumptions]
# Assumptions, not measurements. Each derived figure that uses one names it as an input.
# macOS wired floor seen with no model loaded was 2.84-4.28 GiB on the measured host; a
# headless Linux box probably needs less (not verified).
os_headroom_gib = 3.5
# An IDE, a browser or containers beside vibey, for the recommended size only.
apps_headroom_gib = 4.0
# The vibey side (worker + hub + Postgres) is rounded up to this step.
vibey_side_step_gib = 0.5
# Memory configurations a need is rounded up to (unified memory, GB as sold).
memory_sizes_gb = [16, 24, 32, 48, 64, 96, 128]
# Discrete-GPU memory sizes a device need is rounded up to (not verified on CUDA).
vram_sizes_gb = [8, 12, 16, 24, 32, 48, 80]
# The throughput thresholds held against vibey's per-request timeout. The derivation
# computes the worst-case turn time at each and fails loudly if it no longer fits.
minimum_gen_tok_s = 10
minimum_prompt_tok_s = 100
recommended_gen_tok_s = 25
recommended_prompt_tok_s = 500
# Disk: worktrees counted into the minimum and the recommended free space, and the
# Postgres data allowance (max_wal_size's default is 1 GB).
minimum_worktrees = 10
recommended_worktrees = 50
postgres_data_allowance_gb = 1.0
# The idle-gated CPU scaling sweep: generation on the CPU alone (`num_gpu` 0) at each thread
# count, the data Amdahl's law is fitted to (scripts/requirements_math.py). Short runs, since
# one thread is slow: the rate, not the reply, is what is measured. A count above the host's
# cores is recorded as skipped with that reason.
[minimum_specs.bench.cpu_scaling]
threads = [1, 2, 4, 6, 8, 10]
context = 8192
prompt_tokens = 256
num_predict = 64
runs = 2

[minimum_specs.growth]
# The ledger is append-only (it is never pruned), so its disk grows with every job. The
# per-job bytes are measured (the database after `vibey new` and one `worker --once`, minus
# the empty migrated database); the rate and the horizon are planning figures, not
# measurements. Bytes after H days = integral from 0 to H of b*(r0 + r1*t) dt.
# r0: about one storm (40 lanes) a day with retries; a planning figure.
jobs_per_day = 50
# r1: jobs/day added per day. 0 is a steady workload; set it above 0 to model growth.
jobs_per_day_growth = 0
# H: a year of ledger kept on the host.
horizon_days = 365

[minimum_specs.linux]
# The Linux side of the requirements: a matrix of every distribution below on every
# architecture below, each cell measured in that distribution's own container image
# (`python scripts/minimum_specs.py cell`), on a native runner of that architecture in CI
# (.github/workflows/minimum-specs.yml). A cell run on another architecture is emulated:
# its sizes and versions stand (bytes are bytes), its timings are refused. A cell that
# cannot run is recorded as skipped with the reason, never left out.
docker = "docker"
container_timeout_s = 7200
# Fetches uv into the container; the measurement then runs on the distribution's python3.
uv_install = "curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin UV_NO_MODIFY_PATH=1 sh"
# The install targets measured per cell (the hub extra adds little over the base engine).
install_targets = ["vibey-engine", "krypton-app"]
# Ollama's Linux bundle is the same for every distribution on an architecture, so it is
# measured once per architecture, by this distribution's cell, on the host (not in the
# container): its download (HTTP Content-Length) and its unpacked size (bytes out of the
# decompressor, a tar stream, so headers and padding are included).
ollama_bundle_distro = "ubuntu-24.04"
ollama_bundle_url = "https://ollama.com/download/ollama-linux-{goarch}.tar.zst"
ollama_bundle_unpacked = "curl -fsSL {url} | zstd -dc | wc -c"
# Memory planning margin over the fitted model memory M(c): allocator slack and the page
# cache the memory-mapped weights compete with. A planning factor, not a measurement.
memory_headroom_factor = 1.1
# The memory size the "largest context that fits" figure is solved for (GB, as sold).
probe_memory_gb = 16
# The knee of Amdahl's curve: an added core is worth having while it adds at least this
# much generation (tokens/s). 0.25 is 1 % of the recommended generation rate (25 tok/s).
cpu_knee_tok_s_per_core = 0.25

[minimum_specs.linux.arches.x86_64]
goarch = "amd64"
runner = "ubuntu-24.04"

[minimum_specs.linux.arches.aarch64]
goarch = "arm64"
runner = "ubuntu-24.04-arm"

# How each package manager is driven. `installed` lists package names; `sizes` lists name
# and installed size (`size_format` says how to read it); `version` asks the repositories
# for a package's version without installing it, and the highest match is taken.
[minimum_specs.linux.package_managers.apt]
env = { DEBIAN_FRONTEND = "noninteractive" }
refresh = "apt-get update -qq"
install = "apt-get install -y -qq --no-install-recommends {packages}"
installed = ["dpkg-query", "-W", "-f=${Package}\\n"]
sizes = ["dpkg-query", "-W", "-f=${Package}\\t${Installed-Size}\\n"]
size_format = "name-tab-kib"
version = ["apt-cache", "policy", "{package}"]
version_pattern = 'Candidate:\s*(\S+)'

[minimum_specs.linux.package_managers.pacman]
env = {}
# pacman's download sandbox needs seccomp, which an emulated (QEMU) container lacks; a
# throwaway container loses nothing without it.
refresh = "pacman -Syu --noconfirm --disable-sandbox"
install = "pacman -S --noconfirm --needed --disable-sandbox {packages}"
installed = ["pacman", "-Qq"]
sizes = ["pacman", "-Qi"]
size_format = "pacman-qi"
version = ["pacman", "-Si", "{package}"]
version_pattern = '(?m)^Version\s*:\s*(\S+)'

[minimum_specs.linux.package_managers.dnf]
env = {}
refresh = "dnf -y -q makecache"
install = "dnf install -y -q --setopt=install_weak_deps=False {packages}"
installed = ["rpm", "-qa", "--qf", "%{NAME}\\n"]
sizes = ["rpm", "-qa", "--qf", "%{NAME}\\t%{SIZE}\\n"]
size_format = "name-tab-bytes"
version = ["dnf", "-q", "info", "{package}"]
version_pattern = '(?m)^Version\s*:\s*(\S+)'

# The supported distributions, and where each one's support is claimed. `base` is what
# vibey needs from the distribution (python3 runs the measurement and can serve uv; git
# makes the worktrees; curl fetches uv); `sets` are measured as the closure each adds on
# top; `versions` names the package whose repository version is each floor's evidence.
[minimum_specs.linux.distros."ubuntu-24.04"]
name = "Ubuntu 24.04 LTS"
support = "CI `desktop` job (ci.yml, ubuntu-latest); .deb planned (clients/desktop/PACKAGING.md)"
package_manager = "apt"
images = { x86_64 = "ubuntu:24.04", aarch64 = "ubuntu:24.04" }
unavailable = {}
base = ["python3", "git", "ca-certificates", "curl"]
sets = { postgres = ["postgresql"], desktop = ["libgtk-4-1", "libadwaita-1-0", "libjson-glib-1.0-0", "libsoup-3.0-0"] }
versions = { kernel = "linux-image-generic", python = "python3", postgres = "postgresql", glib = "libglib2.0-0t64", json_glib = "libjson-glib-1.0-0", gtk4 = "libgtk-4-1", libadwaita = "libadwaita-1-0" }

[minimum_specs.linux.distros."ubuntu-26.04"]
name = "Ubuntu 26.04 LTS"
support = "planned (#1116; clients/desktop/PACKAGING.md builds the .deb for 24.04 and 26.04)"
package_manager = "apt"
images = { x86_64 = "ubuntu:26.04", aarch64 = "ubuntu:26.04" }
unavailable = {}
base = ["python3", "git", "ca-certificates", "curl"]
sets = { postgres = ["postgresql"], desktop = ["libgtk-4-1", "libadwaita-1-0", "libjson-glib-1.0-0", "libsoup-3.0-0"] }
versions = { kernel = "linux-image-generic", python = "python3", postgres = "postgresql", glib = "libglib2.0-0t64", json_glib = "libjson-glib-1.0-0", gtk4 = "libgtk-4-1", libadwaita = "libadwaita-1-0" }

[minimum_specs.linux.distros.arch]
name = "Arch Linux"
support = "CI `desktop` job (ci.yml, archlinux:latest); PKGBUILD (clients/desktop/packaging/arch)"
package_manager = "pacman"
images = { x86_64 = "archlinux:latest", aarch64 = "" }
unavailable = { aarch64 = "no official Arch Linux image for arm64: archlinux:latest is amd64 only, and Arch Linux ARM is a separate project, not Arch" }
base = ["python", "git", "ca-certificates", "curl"]
sets = { postgres = ["postgresql"], desktop = ["gtk4", "libadwaita", "json-glib", "libsoup3"] }
versions = { kernel = "linux", python = "python", postgres = "postgresql", glib = "glib2", json_glib = "json-glib", gtk4 = "gtk4", libadwaita = "libadwaita" }

[minimum_specs.linux.distros.fedora]
name = "Fedora (current release)"
support = "named by the operator (2026-10-01); a Fedora COPR channel is in ADR-0019; no CI job yet"
package_manager = "dnf"
images = { x86_64 = "fedora:latest", aarch64 = "fedora:latest" }
unavailable = {}
base = ["python3", "git-core", "ca-certificates", "curl"]
sets = { postgres = ["postgresql-server"], desktop = ["gtk4", "libadwaita", "json-glib", "libsoup3"] }
versions = { kernel = "kernel-core", python = "python3", postgres = "postgresql-server", glib = "glib2", json_glib = "json-glib", gtk4 = "gtk4", libadwaita = "libadwaita" }
