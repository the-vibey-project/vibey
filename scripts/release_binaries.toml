# Made with ❤️ by [Vibey](https://the-vibey-project.github.io/vibey/), Developed by [Adam Matthew Steinberger](https://vibewithadam.matthewsteinberger.com/) ([@adammatthewsteinberger](https://github.com/adammatthewsteinberger/)).
#
# The one declared source for scripts/release_binaries.py and for the release workflow's
# matrix (ADR-0051: configuration is declared in TOML, never written into a source file or
# a workflow). Every user interface, on every platform the project supports, is one target
# here, and each target says what it is:
#
#   build        built from the released commit on every release and attached to the
#                GitHub Release, with SHA-256 checksums and a build-provenance attestation;
#   credential   built by a release only while a credential is set: a release run without
#                it names what is missing and keeps ONE tracking issue open, and the release
#                itself is unaffected (the lesson openvsx.yml's header records);
#   unsupported  not built, with the reason, so the downloads page says so out loud.
#
# `python scripts/release_binaries.py plan` turns this into the workflow's matrix at run
# time, so a target added here is built from the next release on. `check` fails when the
# workflow, or the downloads page, no longer agrees with this file (sub-doctrine 12.e).
# Windows is not a supported platform (#1097, after 3.0.0), so no target names it.

[release_binaries]
# The workflow this file drives, and the page whose GENERATED block lists the downloads.
workflow = ".github/workflows/release-binaries.yml"
downloads_page = "docs/guides/downloads.md"
# The GitHub Release the files attach to is the one github-release.yml creates. Its tag is
# computed exactly as `vibey-gh github-release` computes it, by vibey-gh's own loader:
# `[github_release] tag_prefix` from this configuration, then the version its `[version]`
# files carry. Read, never repeated here.
gh_config = ".vibey-gh.toml"
# The Linux architectures, and the native GitHub-hosted runner of each, are the ones the
# requirements matrix declares: read from there, never repeated here, so an architecture
# added to the supported set is built from the next release on.
linux_arches_source = "scripts/minimum_specs.toml"
linux_arches_table = "minimum_specs.linux.arches"
# The checksum file attached beside the binaries (`sha256sum --check` reads it).
checksums_asset = "SHA256SUMS"
# The workflow's jobs that are not builders: plan, gather and checksum, attach.
infrastructure_jobs = ["plan", "collect", "attach", "nightly"]
# github-release.yml runs beside this workflow, after the same Release run; the attach job
# waits this long for the GitHub Release to exist before it fails, polling every `poll_s`.
release_wait_s = 1800
poll_s = 20
# The Python distributions are the bytes PyPI serves. krypton-app publishes from its own
# workflow, which may finish after this one starts: wait this long for the version to show.
pypi_wait_s = 1800
pypi_json_url = "https://pypi.org/pypi/{project}/{version}/json"

# The rolling nightly of every interface (ADR-0084): rebuilt daily from the integration branch
# when anything under `paths` changed since the commit the nightly tag names, and published as
# ONE prerelease whose tag moves to that commit. Never "latest", never a store, PyPI or Open
# VSX: the versioned Release above stays the only release a person is pointed to by default.
[release_binaries.nightly]
tag = "krypton-nightly"
title = "krypton nightly"
paths = [
  "clients/",
  "packages/vibey-core/",
  "package.json",
  "package-lock.json",
  "scripts/release_binaries.",
  "scripts/macos_app_bundle.",
]

# --------------------------------------------------------------------------- interfaces
# Each user interface, where its version is read (a file and a pattern whose first group is
# the version), and what it is in one line. An asset's name carries its interface's own
# version, so a file name never claims a version its contents do not have.

[release_binaries.uis.desktop]
name = "krypton desktop"
summary = "The desktop app: C17 on GTK 4 and libadwaita."
version_file = "clients/desktop/meson.build"
version_pattern = "version:\\s*'([^']+)'"

[release_binaries.uis.app]
name = "krypton app"
summary = "The mobile and web app: one Expo / React Native app over the vibey hub (ADR-0068)."
version_file = "clients/app/app.config.ts"
version_pattern = "version:\\s*'([^']+)'"

[release_binaries.uis.vscode]
name = "krypton for VS Code"
summary = "The VS Code extension (ADR-0059)."
version_file = "clients/vscode/package.json"
version_pattern = '"version":\s*"([^"]+)"'

[release_binaries.uis.krypton-app]
name = "krypton launcher"
summary = "The `krypton` command (krypton-app): starts the local hub and opens it."
version_file = "clients/krypton-app/pyproject.toml"
version_pattern = '(?m)^version = "([^"]+)"$'

[release_binaries.uis.vibey]
name = "vibey CLI and TUI"
summary = "The `vibey` command and its terminal UI, with the whole engine family (vibey-engine)."
version_file = "pyproject.toml"
version_pattern = '(?m)^version = "([^"]+)"$'

# ------------------------------------------------------------------------------ targets
# `per_linux_arch = true` makes one target per architecture above: `{arch}` in its id and
# asset names becomes the architecture, and its runner is that architecture's own. `with`
# is handed to the builder's matrix row as it stands. `signing` says what a person can rely
# on: `unsigned`; `debug-key` (signed with the public Android debug key: installable by
# sideloading, never a store build); `pypi` (the very bytes PyPI serves, digest-checked);
# `apple-ad-hoc` (ad-hoc code signature, not notarised); `apple-app-store` (signed with an
# Apple Distribution certificate and an App Store provisioning profile: it reaches a phone
# through TestFlight or the App Store, never by opening the file). A built target whose signing can
# be raised by a credential the repository lacks names it in `signing_credentials`, with a
# `signing_tracking_key` and `signing_needs`: it is built either way, and without the
# credential the release says so and keeps one tracking issue open, as a `credential`
# target does.

[[release_binaries.targets]]
id = "desktop-flatpak-{arch}"
ui = "desktop"
builder = "desktop-flatpak"
status = "build"
platform = "Linux: any distribution with Flatpak (Ubuntu, Arch, Fedora)"
per_linux_arch = true
assets = ["krypton-desktop-{version}-linux-{arch}.flatpak"]
signing = "unsigned"
install = "flatpak install --user krypton-desktop-{version}-linux-{arch}.flatpak"
note = "A single-file Flatpak bundle of the declared manifest (clients/desktop/packaging/flatpak), built from the released commit. It needs the GNOME runtime from Flathub, which `flatpak install` fetches. The GNOME runtime carries no Avahi, so this build cannot find hubs on the network by itself: pair by pasting the vibey-pair:// address the host shows beside its code (`vibey hub pair` prints it), which names the hub and the certificate to trust."
# The declared manifest, the module built from the released checkout, the app id the bundle
# exports, and the remote the runtime and SDK come from.
with = { manifest = "clients/desktop/packaging/flatpak/io.github.the_vibey_project.krypton.yml", module = "krypton-desktop", app_id = "io.github.the_vibey_project.krypton", remote = "https://dl.flathub.org/repo/flathub.flatpakrepo" }

[[release_binaries.targets]]
id = "desktop-tarball-{arch}"
ui = "desktop"
builder = "desktop-tarball"
status = "build"
platform = "Linux: Ubuntu 24.04 LTS and newer"
per_linux_arch = true
assets = ["krypton-desktop-{version}-linux-{arch}.tar.gz"]
signing = "unsigned"
install = "sudo tar -xzf krypton-desktop-{version}-linux-{arch}.tar.gz -C /"
note = "`meson install` of the app into /usr, built on Ubuntu 24.04. It links against the system's GTK 4, libadwaita, libsoup 3, json-glib and Avahi, so it needs those installed; on another distribution, prefer the Flatpak."

# macOS: built on a runner of the architecture, against Homebrew's GTK 4, then bundled with
# that runtime by scripts/macos_app_bundle.py (its TOML declares what goes in). The runner's
# macOS sets the oldest macOS the app runs on, because Homebrew's bottles for it are built
# for it: macos-15 makes it macOS 15, and the app's Info.plist states the exact minimum the
# bundler read from the libraries. It is ad-hoc signed until the Developer ID credentials
# exist; then it is signed, notarised and stapled (`signing_credentials`), and until then
# the release keeps one tracking issue open.
[[release_binaries.targets]]
id = "desktop-macos-arm64"
ui = "desktop"
builder = "desktop-macos"
status = "build"
platform = "macOS 15 Sequoia and newer, Apple silicon"
arch = "arm64"
runner = "macos-15"
assets = ["krypton-desktop-{version}-macos-arm64.dmg"]
signing = "apple-ad-hoc"
install = "xattr -dr com.apple.quarantine /Applications/krypton.app"
note = "An app bundle that carries its own GTK 4, libadwaita and every library they load, so it needs nothing else installed (no Homebrew). Open the .dmg and drag krypton to Applications. It is not notarised yet, so macOS refuses the first launch: open it once, then choose Open Anyway in System Settings, Privacy & Security; or clear the download's quarantine flag with the command here. It finds hubs on the network over Bonjour, and macOS asks once for permission to look on the local network."
signing_credentials = [
  "MACOS_SIGNING_CERTIFICATE_P12",
  "MACOS_SIGNING_CERTIFICATE_PASSWORD",
  "APPLE_TEAM_ID",
  "APPLE_NOTARY_API_KEY_P8",
  "APPLE_NOTARY_API_KEY_ID",
  "APPLE_NOTARY_API_ISSUER_ID",
  "APPLE_NOTARY_APPLE_ID",
  "APPLE_NOTARY_APP_PASSWORD",
]
signing_tracking_key = "release-binaries-macos-signing"
signing_needs = "Signing it with a Developer ID and having Apple notarise it needs an Apple Developer Program membership and these repository secrets: `MACOS_SIGNING_CERTIFICATE_P12` (the Developer ID Application certificate and its key, as a base64 .p12), `MACOS_SIGNING_CERTIFICATE_PASSWORD` and `APPLE_TEAM_ID`; and, for notarytool, either an App Store Connect API key (`APPLE_NOTARY_API_KEY_P8`, `APPLE_NOTARY_API_KEY_ID`, `APPLE_NOTARY_API_ISSUER_ID`) or an Apple ID with an app-specific password (`APPLE_NOTARY_APPLE_ID`, `APPLE_NOTARY_APP_PASSWORD`). Until every one of them is set, it is ad-hoc signed, and the release itself is unaffected."
# The channel the app is built as (clients/desktop/meson_options.txt).
with = { channel = "stable" }

[[release_binaries.targets]]
id = "desktop-macos-x86_64"
ui = "desktop"
builder = "desktop-macos"
status = "unsupported"
platform = "macOS, Intel"
arch = "x86_64"
assets = []
signing = "unsigned"
reason = "Homebrew no longer publishes Intel macOS bottles of the GTK 4 stack: gtk4 4.24, glib 2.90, libadwaita 1.10, librsvg, cairo and pango offer Apple-silicon bottles only. An Intel build would compile all of it from source, on a platform Homebrew no longer supports, and GitHub's last Intel macOS runner (`macos-15-intel`) retires in August 2027. Apple-silicon Macs run the arm64 build; Intel Macs cannot, because Rosetta translates Intel code to Apple silicon and not the other way."

[[release_binaries.targets]]
id = "app-web"
ui = "app"
builder = "app-web"
status = "build"
platform = "Web: any current browser, served as static files"
runner = "ubuntu-24.04"
assets = ["krypton-web-{version}.tar.gz"]
signing = "unsigned"
install = "mkdir krypton-web && tar -xzf krypton-web-{version}.tar.gz -C krypton-web && python3 -m http.server -d krypton-web"
note = "The `expo export --platform web` bundle (react-native-web), the same build CI proves bundles: static files any web server can serve."

[[release_binaries.targets]]
id = "app-android"
ui = "app"
builder = "app-android"
status = "build"
platform = "Android"
runner = "ubuntu-24.04"
assets = ["krypton-android-{version}.apk"]
signing = "debug-key"
install = "adb install krypton-android-{version}.apk"
note = "`expo prebuild` and Gradle `assembleRelease`, signed with the Android debug key because the repository holds no release keystore: for sideloading and testing, not a Play Store build. On the device itself, allow installs from unknown sources and open the file."
with = { java = "17" }

[[release_binaries.targets]]
id = "app-ios"
ui = "app"
builder = "app-ios"
status = "credential"
platform = "iOS"
runner = "macos-latest"
assets = ["krypton-ios-{version}.ipa"]
signing = "apple-app-store"
credentials = ["EXPO_TOKEN"]
tracking_key = "release-binaries-ios"
note = "Built on the runner by EAS (`eas build --local`, the `stable` profile) and signed with the project's Apple Distribution certificate and an App Store provisioning profile, which EAS holds. It is the file App Store Connect takes for TestFlight and the App Store; it does not install on a phone by opening it, and the release workflow does not submit it anywhere."
# The EAS CLI, pinned, and the eas.json profile a release builds (stable, from main).
with = { eas_cli = "24.8.0", profile = "stable" }
needs = "An iOS build that installs on a device must be signed by an Apple Developer Program member. It needs the `EXPO_TOKEN` repository secret, the project registered with EAS (its id is in clients/app/src/core/identities.json, owned by the Expo organisation `the-vibey-project`), and the Apple signing credentials stored in EAS (`npx eas-cli credentials`). EAS keeps the build number (`appVersionSource: \"remote\"` in clients/app/eas.json). An unsigned simulator build would run on nobody's phone, so none is produced."

[[release_binaries.targets]]
id = "vscode"
ui = "vscode"
builder = "vscode"
status = "build"
platform = "VS Code 1.90 or newer, on Linux and macOS"
runner = "ubuntu-24.04"
assets = ["krypton-vscode-{version}.vsix"]
signing = "unsigned"
install = "code --install-extension krypton-vscode-{version}.vsix"
note = "The same `vsce package` CI builds and smoke-tests in a real VS Code."

[[release_binaries.targets]]
id = "krypton-app"
ui = "krypton-app"
builder = "python-dists"
status = "build"
platform = "Linux and macOS, any architecture (Python 3.12+)"
runner = "ubuntu-24.04"
assets = ["krypton_app-{version}-py3-none-any.whl", "krypton_app-{version}.tar.gz"]
signing = "pypi"
install = "uv tool install ./krypton_app-{version}-py3-none-any.whl"
note = "The wheel and sdist PyPI serves, fetched and checked against PyPI's own SHA-256 digests. A pure-Python package: one wheel is every platform."
with = { project = "krypton-app", source = "clients/krypton-app" }

[[release_binaries.targets]]
id = "vibey-engine"
ui = "vibey"
builder = "python-dists"
status = "build"
platform = "Linux and macOS, any architecture (Python 3.12+)"
runner = "ubuntu-24.04"
assets = ["vibey_engine-{version}-py3-none-any.whl", "vibey_engine-{version}.tar.gz"]
signing = "pypi"
install = "uv tool install ./vibey_engine-{version}-py3-none-any.whl"
note = "The wheel and sdist PyPI serves, fetched and checked against PyPI's own SHA-256 digests. `vibey` and its TUI, every engine and every tool are in this one wheel (ADR-0037)."
with = { project = "vibey-engine", source = "." }
