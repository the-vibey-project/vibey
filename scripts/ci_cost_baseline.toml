#
# The one declared source for scripts/ci_cost_baseline.py (ADR-0051: configuration is declared
# in TOML, never written into a source file). The script measures what CI costs over a window,
# from read-only `gh api` GET calls, so a later saving can be evidenced instead of assumed.
# Change a value here and run `python scripts/ci_cost_baseline.py collect`.

[ci_cost_baseline]
# The repository whose Actions are measured (owner/name).
repo = "the-vibey-project/vibey"
# How far back the window reaches from the moment of collection. Fourteen days spans two
# weekly cadences (the weekly scheduled workflows run twice) and the PR traffic of two weeks.
window_days = 14
# The most runs read per workflow, newest first. Job minutes are measured on these runs only
# and are reported as a sample, with the in-window run count beside it, never extrapolated
# silently. Twenty keeps the whole collection to a few hundred read-only calls.
sample_size = 20
# Page size of the runs and jobs listings (the API maximum is 100).
per_page = 100
# Seconds one `gh api` call may take before it is recorded as unreadable.
timeout_seconds = 60.0
# How many runs have their timing object read, to observe the billable milliseconds the API
# reports. Billed dollars are 0 for a public repository on standard runners; this observes it.
timing_probe_runs = 3
# Where `collect` writes the record.
output = "docs/architecture/evidence/ci-cost-baseline-2026-11-10.json"
