    - main [ref=e40]:
      - heading "vibey" [level=1] [ref=e41]
      - paragraph [ref=e42]:
        - strong [ref=e43]: You've used an AI coding agent. Then you babysat it
        - text: — re-prompting when it lost the thread, re-explaining everything after a crash, copying results between tools, watching a run die at 2am because one vendor's credits ran out. The agent was autonomous; the
        - emphasis [ref=e44]: delivery
        - text: was you.
      - paragraph [ref=e45]:
        - strong [ref=e46]: Vibey is the layer that does the babysitting.
        - text: "It's an orchestrator that wraps AI coding agents so you're not managing sessions or threads by hand: you describe what you want, it interviews you until the spec is sharp, builds unattended across a pool of engines, brings you back only for the decisions that are genuinely yours, and survives crashes and credit exhaustion without losing a single open question."
      - paragraph [ref=e47]:
        - strong [ref=e48]: Never written code?
        - text: You can still read this.
        - emphasis [ref=e49]: Code
        - text: is text files of instructions computers run; an
        - emphasis [ref=e50]: AI coding agent
        - text: is a program that writes and edits that code from plain-English requests;
        - emphasis [ref=e51]: deploying
        - text: means putting the finished software somewhere people can use it. Vibey's job is to manage a team of those agents from your first description to deployed software, the way a project manager runs a team — asking you questions up front, checking the work, and only interrupting you when a decision is truly yours.
      - paragraph [ref=e52]:
        - strong [ref=e53]: "Read it first:"
        - text: the design is a research paper —
        - link "PDF" [ref=e54] [cursor=pointer]:
          - /url: https://the-vibey-project.github.io/vibey/main/paper.pdf
        - text: ·
        - link "HTML" [ref=e55] [cursor=pointer]:
          - /url: paper/
        - text: — and the whole documentation is a book —
        - link "PDF" [ref=e56] [cursor=pointer]:
          - /url: https://the-vibey-project.github.io/vibey/main/book.pdf
        - text: ·
        - link "EPUB" [ref=e57] [cursor=pointer]:
          - /url: https://the-vibey-project.github.io/vibey/main/book.epub
        - text: ·
        - link "print" [ref=e58] [cursor=pointer]:
          - /url: https://the-vibey-project.github.io/vibey/main/book-print.html
        - text: .
      - paragraph [ref=e59]:
        - text: "For the precise version: a queue-based, six-phase conductor for autonomous software delivery — with an optional visual-design interstitial and opt-in Azure deployment — built on top of the"
        - link [ref=e60] [cursor=pointer]:
          - /url: https://github.com/the-vibey-project/vibey/tree/develop/src/vibey_runners/
          - code [ref=e61]: "*loop"
          - text: autonomous session runners
        - text: ", which live in this repository as uv workspace members (ADR-0021)."
      - heading "What problem this solves" [level=2] [ref=e62]
      - paragraph [ref=e63]:
        - text: An autonomous coding session is not autonomous software delivery. A single
        - code [ref=e64]: claudeloop
        - text: run can finish a task, but it cannot interview you until the spec is sharp, split the work into parallel items, verify each one against gates it cannot game, survive its own credit exhaustion by handing off to a different vendor's engine
        - emphasis [ref=e65]: without losing a single open question
        - text: ", or know that a review finding should reopen design rather than vanish into a transcript."
      - paragraph [ref=e66]: Vibey conducts all of that. You describe what you want; it interviews you until the spec is sharp, builds unattended across a pool of engines with real budget caps, reviews the result with you, and (only if you opt in) deploys. Every choice, finding, and handoff lives in an append-only PostgreSQL ledger — never in one vendor's chat session.
