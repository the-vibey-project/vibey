      - heading "Install" [level=2] [ref=e112]
      - paragraph [ref=e113]:
        - text: Requires
        - strong [ref=e114]: Python 3.12+
        - text: and
        - strong [ref=e115]: PostgreSQL
        - text: . Windows is not a supported target. Every database-backed command reads the connection string from
        - code [ref=e116]: VIBEY_PG_URL
        - text: ; vibey never guesses a database and exits with
        - code [ref=e117]: VIBEY_PG_URL is not set
        - text: when it is missing.
      - paragraph [ref=e118]:
        - text: "One install is the whole family:"
        - code [ref=e119]: vibey
        - text: ", all five"
        - code [ref=e120]: "*loop"
        - text: engines, and the tools (
        - code [ref=e121]: vibey-gh
        - text: ","
        - code [ref=e122]: vibey-skills
        - text: ","
        - code [ref=e123]: vibey-bootstrap
        - text: ) ship in the one
        - code [ref=e124]: vibey
        - text: distribution and land on
        - code [ref=e125]: PATH
        - text: together (
        - link "ADR-0037" [ref=e126] [cursor=pointer]:
          - /url: architecture/decisions/0037-one-distribution-one-version/
        - text: ). What each engine still needs separately is its own vendor CLI and credentials — which is what
        - code [ref=e127]: vibey doctor
        - text: checks.
      - generic [ref=e128]:
        - text: ● ● ●
        - code [ref=e129]: "uv tool install vibey # or: pipx install vibey / pip install vibey export VIBEY_PG_URL=postgresql://vibey_app:change-me@localhost:5432/vibey # the application # The owner's DSN is given to `vibey migrate` alone, for that one command -- never exported, # so no worker, engine session or gate command ever holds it: VIBEY_PG_MIGRATE_URL=postgresql://user@localhost:5432/vibey vibey migrate vibey doctor # pre-flight: engines, and whether the ledger is guarded"
      - paragraph [ref=e130]:
        - text: Two DSNs, because the ledger is append-only by the database (
        - link "ADR-0055" [ref=e131] [cursor=pointer]:
          - /url: architecture/decisions/0055-the-ledger-is-append-only-by-the-database/
        - text: "): the application connects as a role that can read and append to the ledger and nothing more. One DSN still works, but"
        - code [ref=e132]: vibey doctor
        - text: fails its
        - code [ref=e133]: ledger-guard
        - text: check until the roles are split (
        - link "database roles" [ref=e134] [cursor=pointer]:
          - /url: reference/configuration/#database-roles
        - text: ).
      - paragraph [ref=e135]:
        - code [ref=e136]: vibey doctor
        - text: alone checks only the engines.
        - code [ref=e137]: "--record"
        - text: also writes the result to the database for a project, and
        - code [ref=e138]: "--cluster"
        - text: runs the in-cluster preflight (DSN, workspace, secrets, database, migrations) instead.
      - paragraph [ref=e139]:
        - code [ref=e140]: qwenloop
        - text: installs with everything else; what is opt-in is the
        - emphasis [ref=e141]: feature
        - text: ", not the install. Two local engines have a switch each:"
        - code [ref=e142]: VIBEY_FEATURE_QWENLOOP=1
        - text: and
        - code [ref=e143]: VIBEY_FEATURE_CLAUDELOOP_LOCAL=1
        - text: (claudeloop on a local backend profile). A switched-on local engine is
        - strong [ref=e144]: preferred first
        - text: for BUILD — a paid engine runs only when no local one is eligible — and
        - code [ref=e145]: vibey doctor
        - text: lists it;
        - code [ref=e146]: vibey doctor
        - text: also honours
        - code [ref=e147]: "[features] qwenloop = true"
        - text: /
        - code [ref=e148]: claudeloop_local = true
        - text: in a
        - code [ref=e149]: ./vibey.toml
        - text: . With a local engine on and no
        - code [ref=e150]: "--provider"
        - text: ","
        - code [ref=e151]: vibey work
        - text: and
        - code [ref=e152]: vibey worker
        - text: run DESIGN and DECOMPOSE on the sovereign providers too (ADR-0038).
        - code [ref=e153]: VIBEY_OLLAMA_URL
        - text: is the one endpoint setting; the
        - link "local models guide" [ref=e154] [cursor=pointer]:
          - /url: guides/local-models-ollama/
        - text: has the Ollama recipe.
      - paragraph [ref=e155]:
        - text: To add deterministic, budgeted context packets from the
        - code [ref=e156]: vibey-skills
        - text: marketplace, enable it per project —
        - code [ref=e157]: vibey-skills
        - text: "ships in the same distribution, so there is nothing extra to install:"
      - generic [ref=e158]:
        - text: ● ● ●
        - code [ref=e159]: vibey new my-app --repo ~/src/my-app \ --skills-context-mode shadow --skills-context-budget 6000
      - paragraph [ref=e160]:
        - code [ref=e161]: shadow
        - text: builds and records packet provenance without changing agent prompts. After observing results, switch the project config to
        - code [ref=e162]: inject
        - text: to append successful packets to BUILD prompts. Missing tools, timeouts, low-confidence retrieval, and insufficient budgets all fall back to the original prompt. The feature is off by default, and wind-down prompts are never modified (ADR-0031).
      - paragraph [ref=e163]: "The same tree is a Claude Code plugin marketplace — every plugin in the family, the 135 skills plugins and vibey-gh's four, from one address and nothing else:"
      - generic [ref=e164]:
        - text: ● ● ●
        - code [ref=e165]: "/plugin marketplace add the-vibey-project/vibey /plugin install security-principles@vibey /plugin # browse all 139"
      - paragraph [ref=e166]:
        - text: The root manifest is rendered from the workspace members by
        - code [ref=e167]: vibey-gh marketplace
        - text: and held to them by
        - code [ref=e168]: vibey-gh check
        - text: (
        - link "ADR-0034" [ref=e169] [cursor=pointer]:
          - /url: architecture/decisions/0034-one-marketplace-at-the-root/
        - text: ); it is never edited by hand. Since the family ships as one distribution (
        - link "ADR-0037" [ref=e170] [cursor=pointer]:
          - /url: architecture/decisions/0037-one-distribution-one-version/
        - text: ) this root manifest is the only marketplace there is.
      - heading "Quickstart" [level=2] [ref=e171]
      - generic [ref=e172]:
        - text: ● ● ●
        - code [ref=e173]: "export VIBEY_PG_URL=postgresql://user@localhost:5432/vibey vibey new my-app --repo ~/src/my-app \\ --max-cycle-dollars 15 # real budget brake, enforced from the ledger vibey doctor --conformance --record # verify each engine's contract, persist health for the latest project vibey worker --provider claudeloop \\ --engines claudeloop,agyloop -j 2 # live DESIGN provider; unattended build across the pool # When vibey parks for your input (design gates, review, budget grants): vibey gates # each open gate, its prompt, and the command that answers it vibey answer <gate-id> --defaults # accept the interview defaults, or: vibey answer <gate-id> --raw '{\"max_dollars\": 25}' # raise a tripped budget cap vibey design accept <project-id> --no-visual vibey answer <gate-id> --verdict accept # review demo vibey answer <gate-id> --choice local_only # decline deployment → DONE (local)"
      - paragraph [ref=e174]:
        - code [ref=e175]: vibey doctor --record
        - text: needs a project to record against, so run it after
        - code [ref=e176]: vibey new
        - text: .
        - code [ref=e177]: vibey worker
        - text: defaults to
        - code [ref=e178]: "--provider scripted"
        - text: ", a test double — or to"
        - code [ref=e179]: "--provider qwenloop"
        - text: when a local engine is switched on; pass
        - code [ref=e180]: "--provider claudeloop"
        - text: for a live, paid DESIGN interview and BUILD decomposition, or
        - code [ref=e181]: "--provider qwenloop"
        - text: for the same on a local model.
        - code [ref=e182]: vibey gates
        - text: lists every open gate with its id, its prompt, and the exact
        - code [ref=e183]: vibey answer
        - text: command that answers it (
        - code [ref=e184]: vibey gates <project-id>
        - text: for one project);
        - code [ref=e185]: vibey projects
        - text: lists your projects, their ids, and how many gates each is waiting on. Both take
        - code [ref=e186]: "--json"
        - text: .
