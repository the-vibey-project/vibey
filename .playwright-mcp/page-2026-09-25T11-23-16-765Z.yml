      - heading "Telemetry" [level=2] [ref=e310]
      - paragraph [ref=e311]:
        - code [ref=e312]: infrastructure/otel.py
        - text: implements
        - code [ref=e313]: TelemetryTracer
        - text: (span tracing for jobs, turns, and handoffs) and
        - code [ref=e314]: TelemetryMetrics
        - text: (engine-selection, queue-latency, phase-duration, handoff-failure, and cost-spend counters), plus
        - code [ref=e315]: calculate_rotation_fairness()
        - text: for measuring rotation fairness against declared engine weights. It is covered by unit tests and constructed by
        - code [ref=e316]: build_app()
        - text: . The worker records queue latency, phase duration, and job spans; BUILD records engine turns, selections, handoffs, and cost spend. Set
        - code [ref=e317]: "[telemetry] enabled = false"
        - text: to disable those runtime calls for a project.
      - heading "The shape of it" [level=2] [ref=e318]
      - generic [ref=e319]:
        - text: ● ● ●
        - code [ref=e320]: "DELIVERY STAGE SET INTAKE → ① DESIGN ──┬─ no ───────────────→ ② BUILD ⇄ ③ REVIEW ▲ │ autonomous / interactive │ └─ yes → [VISUAL DESIGN] │ interactive, media generation + confirmation │ │ visual-ready │ └──────────────→ ② BUILD │ └─ loop-back from ② BUILD or ③ REVIEW: a finding needs clarification ③ REVIEW ── no deployment ─────────────────────────────→ DONE (local) │ opt in ▼ DEPLOYMENT STAGE SET ④ DEPLOY DESIGN → ⑤ DEPLOY EXECUTE → ⑥ DEPLOY REVIEW → DONE (deployed) interactive autonomous interactive ▲ ▲ │ └─────────────────┴────────────────────┘ ⑥ can also route a defect back to ①, ②, or ③"
      - paragraph [ref=e321]:
        - strong [ref=e322]: The six phases
        - text: — ① Design · ② Build · ③ Review · ④ Deploy Design · ⑤ Deploy Execute · ⑥ Deploy Review. The circled numbers above are these;
        - strong [ref=e323]: bold
        - text: below means the phase talks to you.
      - paragraph [ref=e324]:
        - strong [ref=e325]: ① Design
        - text: → ② Build →
        - strong [ref=e326]: ③ Review
        - text: →
        - strong [ref=e327]: ④ Deploy Design
        - text: → ⑤ Deploy Execute →
        - strong [ref=e328]: ⑥ Deploy Review
      - paragraph [ref=e329]: Phases 1, 3, 4, and 6 talk to you. The optional Visual Design stage also talks to you and cannot hand work to BUILD until every planned visual is accepted or you explicitly waive the stage. Phases 2 and 5 run unattended, survive rate-limit windows and credit exhaustion, and rotate eligible engines/providers when one runs dry. Phase 3 asks whether to deploy; "no" is a successful local completion. Phase 6 accepts a successful deployment, requests changed deployment details in Phase 4, retries an unambiguous deployment in Phase 5, or routes an application defect back to the appropriate delivery phase.
      - heading "Why it isn't just another agent framework" [level=2] [ref=e330]
      - paragraph [ref=e331]:
        - text: The hard part is not calling an LLM in a loop —
        - code [ref=e332]: claudeloop
        - text: "and its siblings already solve that, including the distinction between a waitable rate-limit window and exhausted credits that no amount of waiting will fix. Vibey adds the things those runners deliberately do not do:"
      - list [ref=e333]:
        - listitem [ref=e334]:
          - strong [ref=e335]: A phase machine with loop-backs
          - text: ", so a review finding becomes a new design conversation rather than a lost note."
        - listitem [ref=e336]:
          - strong [ref=e337]: Round-robin engine rotation with lossless handoff
          - text: — the conversation is an append-only event ledger, not a chat transcript locked inside one vendor's session, so any engine can pick up where any other left off. A handoff that would lose an open question, decision, assumption, or finding is rejected by a pure, deterministic no-loss gate — never silently accepted.
        - listitem [ref=e338]:
          - strong [ref=e339]: A durable queue
          - text: ", so work survives a laptop lid closing, a crash, or a provider outage, and so multiple work items build in parallel in isolated git worktrees."
        - listitem [ref=e340]:
          - strong [ref=e341]: Real money brakes
          - text: — per-cycle dollar and turn caps summed from the ledger's own cost events, with parks that tell you the exact command to grant more.
