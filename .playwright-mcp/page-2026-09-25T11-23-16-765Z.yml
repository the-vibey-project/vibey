      - heading "Upgrading" [level=2] [ref=e524]
      - paragraph [ref=e525]:
        - text: "From 1.0.0 vibey follows semantic versioning: a change that breaks"
        - code [ref=e526]: vibey.toml
        - text: "fields, ledger event shapes, or CLI flags takes a major version. Before upgrading:"
      - list [ref=e527]:
        - listitem [ref=e528]:
          - text: Read the
          - link "changelog" [ref=e529] [cursor=pointer]:
            - /url: https://github.com/the-vibey-project/vibey/blob/main/CHANGELOG.md
          - text: for the versions between your current version and the target.
        - listitem [ref=e530]:
          - text: Re-run
          - code [ref=e531]: vibey doctor --conformance --record
          - text: afterward — engine contracts and conformance checks can gain new checks between releases.
        - listitem [ref=e532]:
          - text: The database schema migrates automatically (
          - code [ref=e533]: infrastructure/db/migrator.py
          - text: ); no manual migration step is needed.
      - paragraph [ref=e534]:
        - text: Every push to
        - code [ref=e535]: develop
        - text: publishes a uniquely versioned dev build (
        - code [ref=e536]: X.Y.Z.devN
        - text: ) to TestPyPI as
        - code [ref=e537]: vibey-dev
        - text: ; every push to
        - code [ref=e538]: main
        - text: publishes
        - code [ref=e539]: vibey
        - text: to PyPI. After a successful
        - code [ref=e540]: main
        - text: release,
        - code [ref=e541]: github-release.yml
        - text: tags that exact commit and creates the matching GitHub Release. Versioning and release are owned by the in-tree
        - code [ref=e542]: vibey-gh
        - text: ; release-please is retired (ADR-0028).
        - code [ref=e543]: uv tool install vibey
        - text: (or
        - code [ref=e544]: pipx install vibey
        - text: /
        - code [ref=e545]: pip install vibey
        - text: ) tracks stable releases — and it is the family's only install instruction (
        - link "ADR-0037" [ref=e546] [cursor=pointer]:
          - /url: architecture/decisions/0037-one-distribution-one-version/
        - text: ).
      - heading "Formal notes" [level=2] [ref=e547]
      - paragraph [ref=e548]:
        - text: For the reader who wants the theory under the phases. Work items form a queue $Q$ in PostgreSQL; workers claim with
        - code [ref=e549]: SELECT ... FOR UPDATE SKIP LOCKED
        - text: ", so claims serialize per item without global locks: for any item $w$, at most one worker holds $w$ at any instant, while throughput scales with $\\min(|Q|, \\text{workers})$. The conductor is a six-phase state machine $\\Sigma = \\langle D, B, R, D_d, D_e, D_r \\rangle$ (design, build, review, deploy-design, deploy-execute, deploy-review) with human gates exactly at ${D, R, D_d, D_r}$ — interactive phases are the fixed points where the ledger's open questions must drain to zero before the transition fires. Crash recovery follows from two invariants: every decision, finding, and handoff is a row in an append-only ledger"
        - emphasis [ref=e550]: before
        - text: "it takes effect (write-ahead intent), and engine handoff re-derives session context from the ledger alone — so vendor credit exhaustion is a scheduling event, not a loss of state: $\\text{state}(t) = f(\\text{ledger}_{\\leq t})$, independent of any vendor session. The full treatment — with the queue-fairness argument and the gate-soundness proof sketch — is the research paper,"
        - emphasis [ref=e551]: "Ledger-Mediated Orchestration: Vendor-Independent Autonomous Software Delivery over a Pool of Coding Agents"
        - text: ":"
        - link "read it online" [ref=e552] [cursor=pointer]:
          - /url: https://the-vibey-project.github.io/vibey/main/paper/
        - text: or
        - link "download the PDF" [ref=e553] [cursor=pointer]:
          - /url: https://the-vibey-project.github.io/vibey/main/paper.pdf
        - text: "(source:"
        - link [ref=e554] [cursor=pointer]:
          - /url: paper/
          - code [ref=e555]: paper.md
        - text: "). The complete documentation is also a book:"
        - link "PDF" [ref=e556] [cursor=pointer]:
          - /url: https://the-vibey-project.github.io/vibey/main/book.pdf
        - text: ·
        - link "EPUB" [ref=e557] [cursor=pointer]:
          - /url: https://the-vibey-project.github.io/vibey/main/book.epub
        - text: ·
        - link "print HTML" [ref=e558] [cursor=pointer]:
          - /url: https://the-vibey-project.github.io/vibey/main/book-print.html
        - text: .
