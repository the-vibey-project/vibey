    - heading "Sound events" [level=2] [ref=f8e2916]
    - paragraph [ref=f8e2917]: Names and length budgets are tokens now; the cues arrive in Lane J.
    - list [ref=f8e2918]:
      - listitem [ref=f8e2919]: "gate-needs-you · ≤ 700 ms — A human gate is waiting: a rising two-note chime, warm, never alarming."
      - listitem [ref=f8e2920]: "run-finished · ≤ 900 ms — A run or phase finished: a bright resolving triad."
      - listitem [ref=f8e2921]: "ultra-pass-finished · ≤ 950 ms — An ULTRA improvement pass completed and the next begins: a shimmering upward arpeggio."
      - listitem [ref=f8e2922]: "failed · ≤ 700 ms — A job failed or was parked: a soft falling minor third."
      - listitem [ref=f8e2923]: "parked · ≤ 450 ms — A job parked for later: a single muted pluck."
      - listitem [ref=f8e2924]: "budget-step · ≤ 500 ms — A budget threshold was crossed: two even ticks."
      - listitem [ref=f8e2925]: "unlimited-spend-reminder · ≤ 800 ms — The unlimited-budget reminder: a low, patient pulse."
      - listitem [ref=f8e2926]: "device-paired · ≤ 600 ms — A device paired: a quick two-tone handshake."
      - listitem [ref=f8e2927]: "tap · ≤ 90 ms — A UI acknowledgement, used sparingly: a near-silent click."
