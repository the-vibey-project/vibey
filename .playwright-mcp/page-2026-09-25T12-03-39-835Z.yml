    - heading "Sound events" [level=2] [ref=f7e1654]
    - paragraph [ref=f7e1655]: Names and length budgets are tokens now; the cues arrive in Lane J.
    - list [ref=f7e1656]:
      - listitem [ref=f7e1657]: "gate-needs-you · ≤ 700 ms — A human gate is waiting: a rising two-note chime, warm, never alarming."
      - listitem [ref=f7e1658]: "run-finished · ≤ 900 ms — A run or phase finished: a bright resolving triad."
      - listitem [ref=f7e1659]: "ultra-pass-finished · ≤ 950 ms — An ULTRA improvement pass completed and the next begins: a shimmering upward arpeggio."
      - listitem [ref=f7e1660]: "failed · ≤ 700 ms — A job failed or was parked: a soft falling minor third."
      - listitem [ref=f7e1661]: "parked · ≤ 450 ms — A job parked for later: a single muted pluck."
      - listitem [ref=f7e1662]: "budget-step · ≤ 500 ms — A budget threshold was crossed: two even ticks."
      - listitem [ref=f7e1663]: "unlimited-spend-reminder · ≤ 800 ms — The unlimited-budget reminder: a low, patient pulse."
      - listitem [ref=f7e1664]: "device-paired · ≤ 600 ms — A device paired: a quick two-tone handshake."
      - listitem [ref=f7e1665]: "tap · ≤ 90 ms — A UI acknowledgement, used sparingly: a near-silent click."
