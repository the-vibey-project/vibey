    - heading "Sound events" [level=2] [ref=f4e1290]
    - paragraph [ref=f4e1291]: Names and length budgets are tokens now; the cues arrive in Lane J.
    - list [ref=f4e1292]:
      - listitem [ref=f4e1293]: "gate-needs-you Â· â‰¤ 700 ms â€” A human gate is waiting: a rising two-note chime, warm, never alarming."
      - listitem [ref=f4e1294]: "run-finished Â· â‰¤ 900 ms â€” A run or phase finished: a bright resolving triad."
      - listitem [ref=f4e1295]: "ultra-pass-finished Â· â‰¤ 950 ms â€” An ULTRA improvement pass completed and the next begins: a shimmering upward arpeggio."
      - listitem [ref=f4e1296]: "failed Â· â‰¤ 700 ms â€” A job failed or was parked: a soft falling minor third."
      - listitem [ref=f4e1297]: "parked Â· â‰¤ 450 ms â€” A job parked for later: a single muted pluck."
      - listitem [ref=f4e1298]: "budget-step Â· â‰¤ 500 ms â€” A budget threshold was crossed: two even ticks."
      - listitem [ref=f4e1299]: "unlimited-spend-reminder Â· â‰¤ 800 ms â€” The unlimited-budget reminder: a low, patient pulse."
      - listitem [ref=f4e1300]: "device-paired Â· â‰¤ 600 ms â€” A device paired: a quick two-tone handshake."
      - listitem [ref=f4e1301]: "tap Â· â‰¤ 90 ms â€” A UI acknowledgement, used sparingly: a near-silent click."
