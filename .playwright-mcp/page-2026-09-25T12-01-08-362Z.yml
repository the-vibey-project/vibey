    - heading "Sound events" [level=2] [ref=f6e1293]
    - paragraph [ref=f6e1294]: Names and length budgets are tokens now; the cues arrive in Lane J.
    - list [ref=f6e1295]:
      - listitem [ref=f6e1296]: "gate-needs-you · ≤ 700 ms — A human gate is waiting: a rising two-note chime, warm, never alarming."
      - listitem [ref=f6e1297]: "run-finished · ≤ 900 ms — A run or phase finished: a bright resolving triad."
      - listitem [ref=f6e1298]: "ultra-pass-finished · ≤ 950 ms — An ULTRA improvement pass completed and the next begins: a shimmering upward arpeggio."
      - listitem [ref=f6e1299]: "failed · ≤ 700 ms — A job failed or was parked: a soft falling minor third."
      - listitem [ref=f6e1300]: "parked · ≤ 450 ms — A job parked for later: a single muted pluck."
      - listitem [ref=f6e1301]: "budget-step · ≤ 500 ms — A budget threshold was crossed: two even ticks."
      - listitem [ref=f6e1302]: "unlimited-spend-reminder · ≤ 800 ms — The unlimited-budget reminder: a low, patient pulse."
      - listitem [ref=f6e1303]: "device-paired · ≤ 600 ms — A device paired: a quick two-tone handshake."
      - listitem [ref=f6e1304]: "tap · ≤ 90 ms — A UI acknowledgement, used sparingly: a near-silent click."
