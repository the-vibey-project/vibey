# vibey-gh owns provenance and release automation for this repository — the same tooling the
# *loop runners and vibey-skills used as standalone repositories before they were absorbed into
# this workspace (src/vibey_runners/*, src/vibey_tools/*; ADR-0021). The checklist that shaped
# this file is the one those adoptions debugged the hard way.

[fingerprint]
sources = [
  "src/**/*.py",
  "tests/**/*.py",
  "scripts/**/*.py",
  ".github/workflows/*.yml",
]

# This repository lives on GitHub. Since vibey-gh ADR 0002 the forge default is the sovereign
# `forgejo`, and `github` is declared-only -- so the kind is written here rather than
# inherited. An empty host keeps the `gh` client's own github.com: no `gh` call's argv or
# environment changes.
[platform]
kind = "github"

# One distribution ships every tenant now (ADR-0037), so `content_paths` is the list of
# prefixes whose content reaches an installed user -- which is every `packages` root and
# every `force-include` source in the root pyproject's `[tool.hatch.build.targets.wheel]`.
# The invariant is one sentence, and `tests/meta/test_version_paths_cover_every_shipped_tree.py`
# enforces it: every path that ships must be reachable by some prefix here. Left narrow,
# a change to claudeloop or vibey_gh derives "nothing to release" and `vibey-engine.yml`
# republishes the current version into `skip-existing` -- a green run that publishes
# nothing.
#
# Per-tenant `src/` and package-dir prefixes rather than a bare `src/vibey_runners/`,
# because each tenant keeps its own docs/ and tests/ and those reach nobody. `startswith`
# cannot express a glob, which is why this is fourteen literal prefixes rather than a
# pattern; teaching `content_paths` to accept globs is the more generic answer and is
# noted as such in ADR-0037.
#
# `pyproject.toml` is in `code_paths` because the root manifest now decides what ships --
# which packages, which console scripts, which extras -- so a change confined to it must
# still reach a release. Precedent: vibey-bootstrap's own standalone .vibey-gh.toml, inert
# here and removed under #189 (`git show 4e9adf18:src/vibey_tools/bootstrap/.vibey-gh.toml`).
[version]
# CITATION.cff is here because GitHub renders it as "Cite this repository" and citation
# managers read it directly, so it is the most visible number the project has -- and it
# sat at 0.6.0 through two releases because nothing managed it. `apply_version` bumps the
# top-level `version:` only, never `cff-version:`, which is the FORMAT version.
files         = ["pyproject.toml", "src/vibey/__init__.py", "CITATION.cff"]
content_paths = [
  "src/vibey/",
  "src/vibey_runners/claude/src/",
  "src/vibey_runners/codex/src/",
  "src/vibey_runners/cursor/src/",
  "src/vibey_runners/agy/src/",
  "src/vibey_runners/qwen/src/",
  "src/vibey_runners/common/src/",
  "src/vibey_tools/gh/vibey_gh/",
  "src/vibey_tools/gh/docs/stylesheets/",
  "src/vibey_tools/gh/docs/javascripts/",
  "src/vibey_tools/bootstrap/vibey_bootstrap/",
  "src/vibey_tools/skills/src/",
  "src/vibey_tools/skills/plugins/",
  "src/vibey_tools/skills/.claude-plugin/marketplace.json",
]
code_paths    = ["src/vibey/", "pyproject.toml"]

[branches]
integration = "develop"
release     = "main"

[merge_train]
owner           = "adammatthewsteinberger"
# Whose pull requests the train may merge unattended once every gate is green. A pull
# request from anyone else, or one carrying the external-repair label, is held for a
# human merge whatever its gates say, approved or not (ADR-0053).
#
# This is not the same list as `[unattended_approval] authors` below, which is whose
# work a delegated approver may vouch for while no human is watching. The two lists
# answer different questions and differ on purpose: the bots are trusted to land work
# that passed every gate, never to have their work approved on the operator's behalf.
# Do not merge the lists or derive one from the other.
trusted_authors = ["adammatthewsteinberger", "claude[bot]", "github-actions[bot]", "vibey[bot]"]
# The protected paths (#213): the tests that prove vibey works, which a build must never
# weaken on its own say-so (docs/plans/implementation-plan.md, "Bootstrapping"). A pull
# request touching one is reported "needs a human merge" and never merged by the train.
# The train never falls back to `--admin` unattended; only a person's own run with
# `--admin-fallback` can, and that would bypass the code-owner review that
# `require_code_owner_review` below asks GitHub for, so these paths are refused before
# any merge is attempted. The same list, anchored with `/`, is
# .github/CODEOWNERS; tests/meta/test_protected_paths_agree.py keeps the two identical.
protected_paths = [
  "tests/domain/test_noloss*.py",
  "tests/domain/test_briefing.py",
  "tests/infrastructure/db/test_chaos.py",
  "tests/system/test_delivery_stage_set.py",
  "tests/live/**",
  ".github/CODEOWNERS",
]

[install]
# This repository vendors the tooling at src/vibey_tools/gh. Declared rather than
# discovered: a workflow that searched the tree for a pyproject declaring
# `name = "vibey-gh"` would read a pull request's own files and install what it found.
self_source = "src/vibey_tools/gh"
# Pin every rendered template to the version that rendered it. Unpinned, a runner adopts
# whatever is newest -- the failure mode that took vibey-skills' CI red for two days.
pin_version = true
# github-release.yml: the immutable tag and GitHub Release for every version promoted to
# main. Releases stopped at v0.1.2 when release-please was retired (#77) and nothing took
# over the tagging; the book and the paper are attached to each Release from here on.
# conventional-commits.yml: the pre-commit hook enforces the Conventional subject and the
# `Made-With:` trailer, but a commit made in the GitHub web UI never runs a hook, so those
# land unchecked and only `Provenance` catches them -- at merge time, when a history
# rewrite and a force-push are the only remedy. Four commits across #171-#174 arrived that
# way in one day. This job normalises them on push instead, while the branch is still the
# author's own. It refuses to rewrite a branch that already carries merge commits and
# fails loudly there rather than guessing, which is the right trade: an automated rewrite
# of somebody's merge is not a tidy-up.
workflows = ["merge-train.yml", "promote-to-main.yml", "provenance.yml", "release-surfaces.yml", "pr-evaluate.yml", "pr-review.yml", "automation-bootstrap.yml", "github-release.yml", "conventional-commits.yml"]

# Declared here rather than clicked, per ADR-0018. `vibey-gh` has reconciled both of these
# from configuration since 1.x and vibey-skills has used them for months; this repository,
# which now CONTAINS vibey-gh, had neither -- its branch protection and its profile were
# settings-page state with no history, no review and no way to restore them.
#
# These values are the live configuration as it stood on 2026-09-15, transcribed rather
# than invented. Reconciling them is therefore a no-op; the point is that from here a
# change to them is a pull request.
[repository_profile]
description = "A queue-based, six-phase conductor for autonomous software delivery on top of the *loop runners — spec interview → design → build → review → deploy. PostgreSQL-backed."
topics = [
  "agents", "ai-agents", "autonomous-agents", "claude", "claude-code", "cli",
  "delivery-automation", "devtools", "gemini", "gpt", "llm", "mit-license",
  "orchestration", "postgresql", "python",
]

[rulesets]
enabled = true

# `gates` is the whole 7-gate sweep in one job, which is why one check covers it. Bypass is
# OrganizationAdmin plus RepositoryRole:5 (admin): the merge train needs a seat that can
# land a green PR, and a ruleset the automation cannot satisfy is a ruleset somebody
# switches off.
#
# The no-loss lane is the second check: ci.yml's job of that exact name runs the no-loss
# property suite at the 10,000 examples the definition of done asks for (#213). `gates`
# runs the same tests at Hypothesis' default 100, which is a smoke test, not the claim.
# This list also renders into automation-bootstrap.yml, so re-run `vibey-gh install`
# after changing it.
[rulesets.integration]
required_checks  = ["gates", "No-loss property suite (10,000 examples)"]
required_approvals = 1
# The owner in .github/CODEOWNERS must approve a change to a protected path.
require_code_owner_review = true
bypass_actors    = ["OrganizationAdmin", "RepositoryRole:5"]

# The queue exists because a green pull request is not a green merge: its checks ran
# against the base as it stood then, and nothing between that base and develop's tip was
# ever built with it. `strict_required_status_checks_policy` already refuses to merge a
# stale branch, so without a queue that proof is bought by hand, one rebase at a time,
# with the base moving underneath -- which is how twelve open pull requests came to have
# ten unmergeable. SQUASH because feature pull requests squash into develop (ADR-0028);
# ALLGREEN because a group that merges on its head alone can land a member that was never
# green. Takes effect when the operator runs `vibey-gh reconcile` (ADR-0036).
[rulesets.integration.merge_queue]
enabled = true

# main additionally pins the lock: every other CI job `needs` the uv-lock job, so a release
# branch that drifts there is a release branch whose gates never ran.
[rulesets.release]
required_checks  = [
  "gates", "No-loss property suite (10,000 examples)", "uv.lock is in sync with pyproject.toml",
]
required_approvals = 1
require_code_owner_review = true
bypass_actors    = ["OrganizationAdmin", "RepositoryRole:5"]

# Declared and off, rather than absent. Promotion is one controlled rebase of develop into
# main, so a queue here would batch a group of one and add its wait to every release for
# no proof it does not already have. Written down so the next person sees a decision
# rather than an oversight, and so turning it on is one word. REBASE is the default here
# because that is how promotion merges -- wrong the moment `enabled` flips, if left unsaid.
[rulesets.release.merge_queue]
enabled = false

[pr_automation]
# The review, repair and conflict jobs load this tree's own vibey-skills marketplace, read
# from the trusted default-branch checkout. It used to be cloned from
# github.com/the-vibey-project/vibey-skills, which the monorepo absorption retired; that
# clone 404'd and failed every review with no verdict (ADR-0017: the family's own copy).
plugin_marketplaces = ["src/vibey_tools/skills"]
plugins = [
  "quality-engineering@vibey-skills",
  "security-principles@vibey-skills",
  "engineering-process@vibey-skills",
  "software-architecture@vibey-skills",
]
# This repository's real PR-triggered workflows. The default set names "Docs", which
# nothing here answers to -- a gate waiting on a scan that can never complete never posts.
# "Conventional Commits" is here because it is now a gating check, and this list renders
# into `pr-evaluate.yml`'s `workflow_run` trigger. A gating workflow absent from it
# completes and announces nothing, so the last scan fires the final evaluation, this one
# settles after it, and no run ever looks again -- the pull request then sits blocked with
# every check green and nothing to rerun. That deadlock has happened here before; the two
# lines move together.
scan_workflows = ["CI", "Provenance", "Conventional Commits"]
# Rewrite a nonconforming subject rather than only reporting it. The operator's call, and
# the trade is worth stating because it is not free: the automatic form is
# `chore: <the original subject>` -- measured, not assumed -- which conforms without
# choosing a type, so a normalised bug fix is filed as a chore in a changelog whose
# sections are derived from that type. What it buys is that a commit made in the GitHub
# web UI, which runs no hook, never reaches the merge gate needing a history rewrite; four
# did in one day, and three branches were force-pushed by hand to clear them. A label an
# author can amend before merge is cheaper than a rewrite they cannot avoid after it.
normalise_commit_subjects = true
# No paid review is declared here, so none runs (sub-doctrine 8.b: reaching for a paid
# counterparty is the move that must be declared aloud, by a human, in the repository).
# The operator's instruction, 2026-09-24: "Wire this up so that it uses the sovereign lanes
# instead of ANTHROPIC_API_KEY", and "make this honest". With this false the sovereign lane
# on `vibey-local-vibey` answers the WHOLE exact-head review -- both halves of the review
# contract -- for a trusted author whose head is in this repository, the paid `review` job
# never runs, and nothing on that path reads ANTHROPIC_API_KEY. Every other pull request --
# an outside author, a fork, or one arriving while the sovereign runner has no fresh
# heartbeat -- gets no automated pass and is told plainly that it needs a human review.
# Setting it true is the declaration: the two-lane review returns exactly as it was.
paid_review = false
# Repair and conflict resolution call the paid model too, so they are declared the same way,
# and by the same instruction are not: undeclared, neither job is scheduled, and a failing
# scan or a merge conflict is reported as needing a human.
paid_repair = false
paid_conflict_resolution = false

# How many runs of one local model run at once on a device (sub-doctrines 8.c and 8.j,
# ADR-0058). Declared here, checked by `vibey-gh slots allowed` against THAT device's own
# calibration evidence, and read by the storm runner (storm-queue.sh) in place of the
# host-wide "is any lane running?" it used to hard-code. `1` is 8.c as written: one run at
# a time, no evidence needed, nothing probed. `"measured"` would take whatever the
# device's evidence supports; a number above one runs only where the device measured it
# inside every bound. The model and context are the storm's (qwen-storm.toml), so the
# calibration measures the runs this repository actually makes. The bounds keep their
# defaults (vibey-gh docs/configuration.md#local_models-and-vibey-gh-slots).
[local_models]
concurrent_runs = 1
model = "gpt-oss:20b"
context_window = 65536

# The delivery forecast is a repository-owned, append-only projection.  The workflow
# refreshes it on integration changes, issue/PR changes and a schedule; these paths and
# the four phi constants are still keys so another adopter can keep the same calculator
# while choosing a different archive or empirical dilation.
[estimate.forecast]
ledger = ".vibey/delivery-estimates.jsonl"
report = "docs/estimate.md"
billing_ledger = ".vibey/billing-ledger.jsonl"
phi_floor = 0.1
phi_epsilon = 0.01
phi_exponent = 1.0
unknown_factor = 1.0
size_weights = { xs = 0.5, s = 1.0, m = 3.0, l = 6.0, xl = 12.0 }

[pr_automation.fallback]
# Reviews with a local model when the paid path returns NO VERDICT AT ALL. It never
# overrides a review that ran, `trusted_only` keeps fork PRs off the self-hosted runner,
# and the verdict is labelled as the degraded path.
enabled = true
runner_label = "vibey-local-vibey"
trusted_only = true

[runners]
# The machine that serves the sovereign lane above, declared (12.c): `vibey-gh runner install`
# renders its LaunchAgent and supervisor from this table, `runner check` reconciles the host
# against it, and `runner cleanup` unloads agents under the prefix that the tree no longer
# declares. The label is [pr_automation.fallback] runner_label; the credential is the
# runner's own file-based gh login in `gh_config_dir` (default ~/.config/gh-runner). Steps:
# docs/runbooks/sovereign-review-runner.md.
repository = "the-vibey-project/vibey"
# The prefix the operator's existing agents already carry, so an install replaces
# `<prefix>-vibey` in place and cleanup finds the agents of the absorbed repositories.
unit_prefix = "com.adammatthewsteinberger.vibey-runner"
# The interpreter the heartbeat timer runs, and the one its clone's pre-push gate asks for
# the scope decision (ADR-0060): the tool install `uv tool install --force --from . vibey`
# makes, outside every checkout. Declared rather than defaulted so the runbook's
# `uv run vibey-gh runner install` -- whose own interpreter is this checkout's .venv, which
# the timer refuses -- installs the heartbeat with it. Re-run that tool install after pulling
# a vibey-gh change, or `heartbeat status` reports the gate refusing a heartbeat.
heartbeat_python = "~/.local/share/uv/tools/vibey/bin/python"

[issue_automation]
# The issue path's counterpart, sharing the fallback runner and model: an exhausted API
# key degrades to one bounded triage comment instead of silence.
fallback_enabled = true

# The tag every promoted version is published under. Declared rather than defaulted: the
# default is a bare `v`, and this repository absorbed sibling repositories whose own history
# already carries `v0.1.0`, `v0.2.0`, `v0.3.0` and `v0.3.1` tags (ADR-0021). A bare prefix
# would therefore collide with somebody else's release on 0.2.0 and 0.3.0 — and because
# `require_new_version` is false, the collision is SILENT: `github-release` finds the existing
# tag, sees it points somewhere else, and returns without creating anything. The three
# Releases that already exist here are `vibey-v0.1.0` through `vibey-v0.1.2`, so this is the
# convention being restated, not a new one.
[github_release]
tag_prefix = "vibey-v"

[marketplace]
# The one Claude Code marketplace `/plugin marketplace add the-vibey-project/vibey` reads.
# Rendered by `vibey-gh marketplace` from the workspace members' own manifests (ADR-0034);
# `check` reports drift. The name is the root's own — `<plugin>@vibey` — because Claude
# Code registers one marketplace per name per user and the PyPI-packaged vibey-skills
# still ships its manifest as `vibey-skills`.
name = "vibey"
members = ["src/vibey_tools/skills", "src/vibey_tools/gh"]

[documentation]
# Governance in plain sight (sub-doctrine 7.b): the canon is published on every channel site,
# in the book, and linked from every page, from its single source in the absorbed vibey-gh.
governance_source = "src/vibey_tools/gh/docs"
corpus_index = "src/vibey_tools/gh/corpus-index.json"
# The research paper and the architecture pages carry LaTeX; render it on the site.
math = true
# The named author of the published paper, the book and every page's metadata. Unset, the
# exporters fall back to the GitHub owner and the paper's byline reads "the-vibey-project".
author = "Adam Matthew Steinberger"
# The paper's corresponding author, stated in its byline and first-page provenance note
# beside the revision it was rendered from and the time it was rendered.
author_email = "adam@matthewsteinberger.com"
author_affiliation = "The Vibey Project"
# The living-roadmap doctrine (Doctrine 11, src/vibey_tools/gh/docs/doctrines.md) defaults
# require_roadmap to true.
# The operator has twice declined roadmap drafts for this repository and owns the decision on its shape; the check stays off until they write the roadmap they want.
# The exact-head review still judges roadmap liveness on every head.
require_roadmap = false
# The doctrine's end results, published on the docs site itself.
generate_book = true
generate_paper = true

# The full documentation contract is a separate project; off until it is satisfied.
enabled = false
# GA4 measurement id for the published docs site, rendered into release-surfaces.yml as
# GA_ID. Public by nature -- it ships in the page source of every site using it.
google_analytics_id = "G-DMYG7PHCQP"

# ---------------------------------------------------------------------------------------
# The operator's grant to a delegated approver (sub-doctrine 12.f, ADR-0049).
#
# 12.f puts the judgement here: the operator exercises it ONCE, by fixing what may be
# approved and what never may, and an approver applies a standard it did not choose and
# cannot alter. This table is that standard. Changing it is changing who may approve, which
# is why `.vibey-gh.toml` appears in its own forbidden list -- the grant may never approve a
# change to the grant.
#
# This is the DECLARED half (12.c: declared in the repository, reviewed in a pull request).
# The live half is the repository variable VIBEY_UNATTENDED_APPROVAL, which must read
# exactly "on". Absence, "off", empty, malformed or UNREADABLE are all refusal -- an
# approver that cannot read its own authorization has already lost it. Withdrawal needs no
# merge and no reason:
#
#     gh variable set VIBEY_UNATTENDED_APPROVAL --body off
#
[unattended_approval]
enabled = true

# The operator chose the widest branch scope, so the two lists below carry the whole bound
# between an approver and any change in the repository. Every forbidden path answers one
# question: could a change here alter WHAT A GATE MEASURES, WHO MAY APPROVE, or WHAT AN
# AGENT MAY DO? Where the answer is yes, it is forbidden, and a change touching one is
# refused WHOLE -- an approver does not approve the safe subset of a pull request.
branches = ["*"]

# Whose pull requests an approver may act on. A branch glob says nothing about who pushed
# to it, so with the widest branch scope above this is the other half of the bound. Of the
# last 200 merged pull requests, 195 were authored by `adammatthewsteinberger` and 5 by
# `app/dependabot`. Dependabot is deliberately left out: a dependency bump landing
# unreviewed overnight is exactly the supply-chain case a human should see. `@codeowners`
# expands to whoever .github/CODEOWNERS names, so this list and the owners of the protected
# paths cannot drift apart by one of them being edited alone.
#
# This is not `[merge_train] trusted_authors` above. That list decides whose pull requests
# the train may merge once every gate is green; this one decides whose work an approver may
# vouch for with no human watching, which is a narrower grant. The bots appear there and not
# here on purpose. Do not merge the lists or derive one from the other.
authors = ["adammatthewsteinberger", "@codeowners"]

# Every deterministic gate must already be green. A delegated approval is added to the
# gates and never substituted for one (12.f).
require_all_gates = true

forbidden_paths = [
  # The governance corpus, and the index that proves it has not been altered.
  "src/vibey_tools/gh/docs/**",
  "src/vibey_tools/gh/corpus-index.json",

  # This grant. An approver may not widen its own mandate.
  ".vibey-gh.toml",

  # What any agent may do, anywhere in the tree.
  ".claude/settings.json",
  ".claude/settings.local.json",
  "**/.claude/settings.json",
  "**/.claude/settings.local.json",

  # The approver's own definition, and every other agent definition.
  ".claude/agents/**",
  "**/.claude/agents/**",

  # The gates as they RUN.
  ".github/**",
  "**/.github/**",

  # The gates as they are WRITTEN. `.github/workflows/**` is generated from these templates,
  # so forbidding only the rendered copy leaves the gate editable through its source -- the
  # same rendering relationship that made the merge-train trigger fix non-autonomous.
  "src/vibey_tools/gh/vibey_gh/templates/**",

  # The machinery that decides what a gate means: what the train requires, what a review
  # must answer, how this very grant is parsed, and what provenance is checked.
  "src/vibey_tools/gh/vibey_gh/merge_train.py",
  "src/vibey_tools/gh/vibey_gh/review_contract.py",
  "src/vibey_tools/gh/vibey_gh/config.py",
  "src/vibey_tools/gh/vibey_gh/fingerprints.py",

  # The approver's own enforcement: everything that can execute when the approver runs
  # `python -m vibey_gh.approval_check` -- the check and the TRANSITIVE closure of the
  # vibey_gh modules it imports, interfaces and package `__init__`s included. A change to
  # any of them could make the check say yes to what this grant refuses, then weaken every
  # check after it. test_approve_check.py computes that closure from the entry point and
  # fails if any module in it is not forbidden here, so this list cannot drift. (config.py,
  # merge_train.py, review_contract.py and fingerprints.py are in the closure too, and are
  # listed above.) `cli.py` is deliberately NOT here: the approver never runs through it,
  # and the closure test also asserts the entry point does not reach it.
  "src/vibey_tools/gh/vibey_gh/__init__.py",
  "src/vibey_tools/gh/vibey_gh/approval_check.py",
  "src/vibey_tools/gh/vibey_gh/automation_bootstrap.py",
  "src/vibey_tools/gh/vibey_gh/debugging.py",
  "src/vibey_tools/gh/vibey_gh/dependabot.py",
  "src/vibey_tools/gh/vibey_gh/estimation.py",
  "src/vibey_tools/gh/vibey_gh/fallback_pin.py",
  "src/vibey_tools/gh/vibey_gh/feasibility.py",
  "src/vibey_tools/gh/vibey_gh/fit.py",
  "src/vibey_tools/gh/vibey_gh/flatten.py",
  "src/vibey_tools/gh/vibey_gh/forge.py",
  "src/vibey_tools/gh/vibey_gh/gh_transport.py",
  "src/vibey_tools/gh/vibey_gh/github_state.py",
  "src/vibey_tools/gh/vibey_gh/install.py",
  "src/vibey_tools/gh/vibey_gh/issue_automation.py",
  "src/vibey_tools/gh/vibey_gh/pr_automation.py",
  "src/vibey_tools/gh/vibey_gh/protected_paths.py",
  "src/vibey_tools/gh/vibey_gh/reconcile.py",
  "src/vibey_tools/gh/vibey_gh/versioning.py",
  "src/vibey_tools/gh/vibey_gh/interfaces/**",

  # The local gates, and the hooks that invoke them.
  ".pre-commit-config.yaml",
  ".githooks/**",
  "**/.githooks/**",

  # Test and coverage configuration. The per-layer 100% floors and pytest's addopts live in
  # pyproject.toml, so a one-line edit there is a gate change wearing a dependency's clothes.
  "pyproject.toml",
  "**/pyproject.toml",
  ".importlinter",

  # The tests that guard the repository's own invariants -- ADR counts, agent-tree parity,
  # the doc meta-tests. A change here changes what "green" means.
  "tests/meta/**",

  # The storm's own tooling decides whether a lane passes at all. An approved change to
  # lane-publish.py alters every future verdict, which is a gate by another name.
  "docs/plans/*/tools/**",

  # The four agent-surface trees. They are instructions to whatever reads them next.
  ".claude/skills/**",
  ".agents/skills/**",
  ".cursor/rules/**",
  ".agent/rules/**",

  # Who must review, wherever GitHub looks for it.
