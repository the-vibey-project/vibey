# vibey-gh owns provenance and release automation for this repository — the same tooling the
# *loop runners and vibey-skills used as standalone repositories before they were absorbed into
# this workspace (src/vibey_runners/*, src/vibey_tools/*; ADR-0021). The checklist that shaped
# this file is the one those adoptions debugged the hard way.

[fingerprint]
sources = [
  "src/**/*.py",
  "tests/**/*.py",
  "scripts/**/*.py",
  ".github/workflows/*.yml",
]

# This repository lives on GitHub. Since vibey-gh ADR 0002 the forge default is the sovereign
# `forgejo`, and `github` is declared-only -- so the kind is written here rather than
# inherited. An empty host keeps the `gh` client's own github.com: no `gh` call's argv or
# environment changes.
[platform]
kind = "github"

# One distribution ships every tenant now (ADR-0037), so `content_paths` is the list of
# prefixes whose content reaches an installed user -- which is every `packages` root and
# every `force-include` source in the root pyproject's `[tool.hatch.build.targets.wheel]`.
# The invariant is one sentence, and `tests/meta/test_version_paths_cover_every_shipped_tree.py`
# enforces it: every path that ships must be reachable by some prefix here. Left narrow,
# a change to claudeloop or vibey_gh derives "nothing to release" and `vibey-engine.yml`
# republishes the current version into `skip-existing` -- a green run that publishes
# nothing.
#
# Per-tenant `src/` and package-dir prefixes rather than a bare `src/vibey_runners/`,
# because each tenant keeps its own docs/ and tests/ and those reach nobody. `startswith`
# cannot express a glob, which is why this is fourteen literal prefixes rather than a
# pattern; teaching `content_paths` to accept globs is the more generic answer and is
# noted as such in ADR-0037.
#
# `pyproject.toml` is in `code_paths` because the root manifest now decides what ships --
# which packages, which console scripts, which extras -- so a change confined to it must
# still reach a release. Precedent: vibey-bootstrap's own standalone .vibey-gh.toml, inert
# here and removed under #189 (`git show 4e9adf18:src/vibey_tools/bootstrap/.vibey-gh.toml`).
[version]
# CITATION.cff is here because GitHub renders it as "Cite this repository" and citation
# managers read it directly, so it is the most visible number the project has -- and it
# sat at 0.6.0 through two releases because nothing managed it. `apply_version` bumps the
# top-level `version:` only, never `cff-version:`, which is the FORMAT version.
files         = ["pyproject.toml", "src/vibey/__init__.py", "CITATION.cff"]
content_paths = [
  "src/vibey/",
  "src/vibey_runners/claude/src/",
  "src/vibey_runners/codex/src/",
  "src/vibey_runners/qwen/src/",
  "src/vibey_runners/common/src/",
  "src/vibey_tools/gh/vibey_gh/",
  "src/vibey_tools/gh/docs/stylesheets/",
  "src/vibey_tools/gh/docs/javascripts/",
  "src/vibey_tools/bootstrap/vibey_bootstrap/",
  "src/vibey_tools/skills/src/",
  "src/vibey_tools/skills/plugins/",
  "src/vibey_tools/skills/.claude-plugin/marketplace.json",
]
# clients/: since #1317 every release attaches the client apps' binaries (desktop, mobile, web,
# VS Code), so a client change is releasable content. Without it a client-only change derived
# "nothing to release" -- no bump, no Release run, no binaries (found preparing 3.4.0).
code_paths    = ["src/vibey/", "pyproject.toml", "clients/"]
# Files that embed the version and are re-derived in the release commit itself. The
# continuation prompts' state blocks name the version they were rendered at, and 4.1.0's
# release commit left them at 4.0.0: CI's meta-test failed on that commit and on every
# pull request after it until someone re-rendered by hand (2026-10-05). stdlib-only, so
# the promotion job's bare Python runs it.
regenerate    = [["python", "scripts/continuation_prompts.py", "render"]]

[branches]
integration = "develop"
release     = "main"

# Promotion follows every successful merge train; these are the clocks it also keeps. The
# weekly one is the backstop for a week the train has nothing to merge. The monthly one
# guarantees develop reaches main on the 1st of every month. A run with nothing new is a
# no-op: develop and main compare by content, and an open promotion PR is reused.
[promotion]
schedules = ["17 8 * * 1", "17 8 1 * *"]

# Sub-doctrine 8.i (ADR-0070): the merge train, the promotion and the heartbeat stand down
# from sundown Friday to sundown Saturday where the machine running them stands. A hosted
# runner's clock is UTC and it has no location service, so this repository names the zone
# its operator keeps; the location then resolves to that zone's reference city, which is
# coarse, and the window widens toward rest by `coarse_margin_minutes`. No coordinates are
# ever committed here: a host's own go in `local_config` (default
# ~/.config/vibey/sabbath.toml) or VIBEY_SABBATH_LATITUDE/VIBEY_SABBATH_LONGITUDE.
[sabbath]
timezone              = "America/New_York"
coarse_margin_minutes = 90
enabled               = false

[merge_train]
owner           = "adammatthewsteinberger"
# Whose pull requests the train may merge unattended once every gate is green. A pull
# request from anyone else, or one carrying the external-repair label, is held for a
# human merge whatever its gates say, approved or not (ADR-0053).
#
# This is not the same list as `[unattended_approval] authors` below, which is whose
# work a delegated approver may vouch for while no human is watching. The two lists
# answer different questions and differ on purpose: the bots are trusted to land work
# that passed every gate, never to have their work approved on the operator's behalf.
# Do not merge the lists or derive one from the other.
trusted_authors = ["adammatthewsteinberger", "claude[bot]", "github-actions[bot]", "vibey[bot]"]
# The protected paths (#213): the tests that prove vibey works, which a build must never
# weaken on its own say-so (docs/plans/implementation-plan.md, "Bootstrapping"). A pull
# request touching one is reported "needs a human merge" and never merged by the train.
# The train never falls back to `--admin` unattended; only a person's own run with
# `--admin-fallback` can, and that would bypass the code-owner review that
# `require_code_owner_review` below asks GitHub for, so these paths are refused before
# any merge is attempted. The same list, anchored with `/`, is
# .github/CODEOWNERS; tests/meta/test_protected_paths_agree.py keeps the two identical.
protected_paths = [
  "tests/domain/test_noloss*.py",
  "tests/domain/test_briefing.py",
  "tests/infrastructure/db/test_chaos.py",
  "tests/system/test_delivery_stage_set.py",
  "tests/live/**",
  ".github/CODEOWNERS",
  # Each entry accepts a known security risk until it expires; see [advisories].
  ".github/advisory-exceptions.toml",
]

[install]
# This repository vendors the tooling at src/vibey_tools/gh. Declared rather than
# discovered: a workflow that searched the tree for a pyproject declaring
# `name = "vibey-gh"` would read a pull request's own files and install what it found.
self_source = "src/vibey_tools/gh"
# Pin every rendered template to the version that rendered it. Unpinned, a runner adopts
# whatever is newest -- the failure mode that took vibey-skills' CI red for two days.
pin_version = true
# github-release.yml: the immutable tag and GitHub Release for every version promoted to
# main. Releases stopped at v0.1.2 when release-please was retired (#77) and nothing took
# over the tagging; the book and the paper are attached to each Release from here on.
# conventional-commits.yml: the pre-commit hook enforces the Conventional subject and the
# `Made-With:` trailer, but a commit made in the GitHub web UI never runs a hook, so those
# land unchecked and only `Provenance` catches them -- at merge time, when a history
# rewrite and a force-push are the only remedy. Four commits across #171-#174 arrived that
# way in one day. This job normalises them on push instead, while the branch is still the
# author's own. It refuses to rewrite a branch that already carries merge commits and
# fails loudly there rather than guessing, which is the right trade: an automated rewrite
# of somebody's merge is not a tidy-up.
# skip-markers.yml, branch-health.yml and ruleset-drift.yml are the release-path guards the
# 3.0.0 release was missing: a skip-ci marker in a hand-made squash body switched off every
# push workflow on main, develop sat red for a day with nothing saying so, and a hand-made
# ruleset stood beside the declared one unremarked. See [skip_markers] and [branch_health].
# changelog.yml: `vibey-gh changelog check` on every pull request into develop. See
# [changelog].
workflows = ["merge-train.yml", "promote-to-main.yml", "provenance.yml", "release-surfaces.yml", "repository-profile.yml", "pr-evaluate.yml", "pr-review.yml", "automation-bootstrap.yml", "github-release.yml", "conventional-commits.yml", "skip-markers.yml", "branch-health.yml", "ruleset-drift.yml", "changelog.yml"]
# No path merges with the `union` driver. The changelog it existed for is written as
# fragments now ([changelog]), and the driver never helped where it mattered: GitHub's
# mergeability does not run it, so a pull request showed CONFLICTING while a local merge was
# clean, and where it did run it could keep both sides of a heading and duplicate it.
union_merge_paths = []

# Declared here rather than clicked, per ADR-0018. `vibey-gh` has reconciled both of these
# from configuration since 1.x and vibey-skills has used them for months; this repository,
# which now CONTAINS vibey-gh, had neither -- its branch protection and its profile were
# settings-page state with no history, no review and no way to restore them.
#
# These values are the live configuration as it stood on 2026-09-15, transcribed rather
# than invented. Reconciling them is therefore a no-op; the point is that from here a
# change to them is a pull request.
[repository_profile]
# What GitHub shows under the repository name and in search results, and the topics people
# browse by: the words a stranger would search for, each true of the project (sub-doctrine
# 7.d, ADR-0076). GitHub allows twenty topics. Reconciled by repository-profile.yml after a
# release, never set by hand.
description = "Open-source orchestrator for AI coding agents: a spec interview, unattended builds on local (Ollama) or paid agents, human-gated review, and an append-only PostgreSQL ledger so a crashed agent's work is picked up, not lost."
topics = [
  "ai-agents", "coding-agents", "agent-orchestration", "autonomous-agents",
  "autonomous-software-delivery", "llm", "local-llm", "ollama", "sovereign-ai",
  "human-in-the-loop", "event-sourcing", "audit-log", "postgresql", "job-queue",
  "workload-identity", "supply-chain-security", "devsecops", "claude-code",
  "developer-tools", "cli",
]
# What a squash merge proposes as its commit. GitHub's default concatenates every commit
# message in the pull request into the body, and that is how the hand-squashed 3.0.0
# promotion (#1244) carried a quoted skip-ci marker onto main and ran no push workflow
# there at all. The pull request's own title and body cannot carry a commit subject nobody
# read, and `skip-markers.yml` checks both before they are merged.
squash_merge_commit_title   = "PR_TITLE"
squash_merge_commit_message = "PR_BODY"

[rulesets]
enabled = true

# `gates` is the whole 7-gate sweep in one job, which is why one check covers it. Bypass is
# OrganizationAdmin plus RepositoryRole:5 (admin): the merge train needs a seat that can
# land a green PR, and a ruleset the automation cannot satisfy is a ruleset somebody
# switches off.
#
# The no-loss lane is the second check: ci.yml's job of that exact name runs the no-loss
# property suite at the 10,000 examples the definition of done asks for (#213). `gates`
# runs the same tests at Hypothesis' default 100, which is a smoke test, not the claim.
# This list also renders into automation-bootstrap.yml, so re-run `vibey-gh install`
# after changing it.
[rulesets.integration]
# The two VS Code extension jobs joined once they had run green on develop (0823cdfd),
# as ADR-0059 owed: a krypton client that breaks is a failed merge, not a later surprise.
# "No skip markers" is skip-markers.yml's job: a skip-ci marker in a commit, or in the title
# or body a squash merge commits, never reaches a permanent branch unrefused.
required_checks  = [
  "gates", "No-loss property suite (10,000 examples)",
  "VS Code extension (ubuntu-latest)", "VS Code extension (macos-latest)",
  "No skip markers",
]
required_approvals = 1
# The owner in .github/CODEOWNERS must approve a change to a protected path.
require_code_owner_review = true
bypass_actors    = ["OrganizationAdmin", "RepositoryRole:5"]
# The 100% coverage floor used to live only in the hand-made rulesets "develop" and "main"
# (created 2026-08-15), beside these declared ones. Declared here it moves into the rulesets
# vibey-gh reconciles, so those two can be deleted by the operator without losing it.
# `max_coverage_drop` stays unset: the forge holds it as null, and vibey-gh leaves it out
# of the payload, because the rulesets API refuses a null threshold on input (422).
minimum_coverage = 100

# The queue exists because a green pull request is not a green merge: its checks ran
# against the base as it stood then, and nothing between that base and develop's tip was
# ever built with it. `strict_required_status_checks_policy` already refuses to merge a
# stale branch, so without a queue that proof is bought by hand, one rebase at a time,
# with the base moving underneath -- which is how twelve open pull requests came to have
# ten unmergeable. SQUASH because feature pull requests squash into develop (ADR-0028);
# ALLGREEN because a group that merges on its head alone can land a member that was never
# green. Takes effect when the operator runs `vibey-gh reconcile` (ADR-0036).
[rulesets.integration.merge_queue]
enabled = true

# main additionally pins the lock: every other CI job `needs` the uv-lock job, so a release
# branch that drifts there is a release branch whose gates never ran.
[rulesets.release]
required_checks  = [
  "gates", "No-loss property suite (10,000 examples)", "uv.lock is in sync with pyproject.toml",
  "VS Code extension (ubuntu-latest)", "VS Code extension (macos-latest)",
  "No skip markers",
]
required_approvals = 1
require_code_owner_review = true
bypass_actors    = ["OrganizationAdmin", "RepositoryRole:5"]
# The same floor the hand-made "main" ruleset carries, moved into the declared one so that
# ruleset can be deleted without losing it (see [rulesets.integration]).
minimum_coverage = 100
# Promotion is a rebase (`vibey-gh promote`, ADR-0028), and nothing else may merge into main:
# the one squash of a promotion (#1244) concatenated 221 commit messages into one body, a
# quoted skip-ci marker among them, and main then ran no push workflow at all.
allowed_merge_methods = ["rebase"]

# Declared and off, rather than absent. Promotion is one controlled rebase of develop into
# main, so a queue here would batch a group of one and add its wait to every release for
# no proof it does not already have. Written down so the next person sees a decision
# rather than an oversight, and so turning it on is one word. REBASE is the default here
# because that is how promotion merges -- wrong the moment `enabled` flips, if left unsaid.
[rulesets.release.merge_queue]
enabled = false

# A GitHub skip marker (the bracketed skip-ci spellings, or a `skip-checks: true` trailer)
# is refused in every commit of a pull request into develop or main and in its title and
# body, by skip-markers.yml, which gates the PR automation ("Skip markers" in scan_workflows)
# and the merge queue ("No skip markers" in required_checks).
#
# Nothing is exempt. The one automation that ever wrote the marker on purpose,
# delivery-estimate.yml, stopped on 2026-09-24: its commits now go through a pull request
# and every CI gate like any other change. Should an automation need it again, name its
# commit author here -- exactly, name or e-mail -- and the exemption covers that author's
# own commit messages into develop, never a title or body, and never a pull request into main.
[skip_markers]
enabled = true
exempt_authors = []

# CI's dependency-advisory gate is `vibey-gh advisory-check`, run in place of
# `npm audit --audit-level=high` for every npm lockfile (the root workspace, clients/app):
# it fails on every advisory at `audit_level` or worse, exactly as npm audit does, except one
# declared in `exceptions_file`. An exception is a reviewed, expiring decision that the
# vulnerable code is not reached -- never a silent skip. Every run prints each exception it
# honours and until when, and fails on one that has expired, matches nothing any more, or
# whose package has a patched release. `max_exception_days` bounds how long one may be
# declared for; `warn_days` before it expires the check says so. The exceptions file is a
# protected path ([merge_train] protected_paths above, .github/CODEOWNERS), so accepting a
# risk always takes the code owner's approval and a human merge.
[advisories]
audit_level = "high"
exceptions_file = ".github/advisory-exceptions.toml"
max_exception_days = 30
warn_days = 7

# The changelog is written as fragments: one new file per change, `<slug>.<type>.md` in the
# `changelog.d/` beside the changelog it belongs to, holding the entry exactly as it should
# read. Every pull request used to edit the same `## [Unreleased]` lines, so concurrent
# pull requests conflicted on every merge -- #1295, #1297, #1298 and #1299 were re-merged
# over and over on 2026-10-01 -- and the `merge=union` attribute meant to absorb it does
# nothing on GitHub, whose mergeability never runs a custom driver. A new file cannot
# conflict. `vibey-gh promote` folds the fragments in under their types' headings in the
# release commit and cuts the version's section; changelog.yml ("Changelog fragment")
# refuses a pull request into develop that changes a `require_for` path with no fragment
# (unless labelled `no-changelog`), adds a malformed one, or edits an unreleased section by
# hand. It gates through the PR automation ("Changelog" in scan_workflows).
#
# `require_for` is what reaches an installed user: the `[version] content_paths` above, as
# globs, and the root manifest. Docs, tests and workflows alone need no entry.
[changelog]
enabled = true
skip_label = "no-changelog"
require_for = [
  "src/vibey/*",
  "src/vibey_runners/claude/src/*",
  "src/vibey_runners/codex/src/*",
  "src/vibey_runners/qwen/src/*",
  "src/vibey_runners/common/src/*",
  "src/vibey_tools/gh/vibey_gh/*",
  "src/vibey_tools/bootstrap/vibey_bootstrap/*",
  "src/vibey_tools/skills/src/*",
  "src/vibey_tools/skills/plugins/*",
  "src/vibey_tools/skills/.claude-plugin/marketplace.json",
  "pyproject.toml",
]

# The engine's changelog: a section per version, cut by the release.
[[changelog.files]]
changelog = "CHANGELOG.md"

# vibey-gh's own: everything is recorded under `## Unreleased`, and the releases are the
# GitHub Releases it links to, so a release folds fragments in and cuts nothing.
[[changelog.files]]
changelog = "src/vibey_tools/gh/CHANGELOG.md"
unreleased = "Unreleased"
versioned = false

# One tracking issue per permanent branch while its CI push run is red, closed when the tip
# is green again (branch-health.yml). The watched checks are each branch's required_checks
# above -- the definition of green this file already makes -- so no list is repeated here.
[branch_health]
enabled = true

[pr_automation]
# The review, repair and conflict jobs load this tree's own vibey-skills marketplace, read
# from the trusted default-branch checkout. It used to be cloned from
# github.com/the-vibey-project/vibey-skills, which the monorepo absorption retired; that
# clone 404'd and failed every review with no verdict (ADR-0017: the family's own copy).
plugin_marketplaces = ["src/vibey_tools/skills"]
plugins = [
  "quality-engineering@vibey-skills",
  "security-principles@vibey-skills",
  "engineering-process@vibey-skills",
  "software-architecture@vibey-skills",
]
# This repository's real PR-triggered workflows. The default set names "Docs", which
# nothing here answers to -- a gate waiting on a scan that can never complete never posts.
# "Conventional Commits" is here because it is now a gating check, and this list renders
# into `pr-evaluate.yml`'s `workflow_run` trigger. A gating workflow absent from it
# completes and announces nothing, so the last scan fires the final evaluation, this one
# settles after it, and no run ever looks again -- the pull request then sits blocked with
# every check green and nothing to rerun. That deadlock has happened here before; the two
# lines move together. "Skip markers" is here for the same reason (see [skip_markers]).
scan_workflows = ["CI", "Provenance", "Conventional Commits", "Skip markers", "Changelog"]
# Rewrite a nonconforming subject rather than only reporting it. The operator's call, and
# the trade is worth stating because it is not free: the automatic form is
# `chore: <the original subject>` -- measured, not assumed -- which conforms without
# choosing a type, so a normalised bug fix is filed as a chore in a changelog whose
# sections are derived from that type. What it buys is that a commit made in the GitHub
# web UI, which runs no hook, never reaches the merge gate needing a history rewrite; four
# did in one day, and three branches were force-pushed by hand to clear them. A label an
# author can amend before merge is cheaper than a rewrite they cannot avoid after it.
normalise_commit_subjects = true
# No paid review is declared here, so none runs (sub-doctrine 8.b: reaching for a paid
# counterparty is the move that must be declared aloud, by a human, in the repository).
# The operator's instruction, 2026-09-24: "Wire this up so that it uses the sovereign lanes
# instead of ANTHROPIC_API_KEY", and "make this honest". With this false the sovereign lane
# on `vibey-local-vibey` answers the WHOLE exact-head review -- both halves of the review
# contract -- for a trusted author whose head is in this repository, the paid `review` job
# never runs, and nothing on that path reads ANTHROPIC_API_KEY. Every other pull request --
# an outside author, a fork, or one arriving while the sovereign runner has no fresh
# heartbeat -- gets no automated pass and is told plainly that it needs a human review.
# Setting it true is the declaration: the two-lane review returns exactly as it was.
paid_review = false
# Repair and conflict resolution call the paid model too, so they are declared the same way,
# and by the same instruction are not: undeclared, neither job is scheduled, and a failing
# scan or a merge conflict is reported as needing a human.
paid_repair = false
paid_conflict_resolution = false

# How many runs of one local model run at once on a device (sub-doctrines 8.c and 8.j,
# ADR-0058). Declared here, checked by `vibey-gh slots allowed` against THAT device's own
# calibration evidence, and read by the storm runner (storm-queue.sh) in place of the
# host-wide "is any lane running?" it used to hard-code. `1` is 8.c as written: one run at
# a time, no evidence needed, nothing probed. `"measured"` would take whatever the
# device's evidence supports; a number above one runs only where the device measured it
# inside every bound. The model and context are the storm's (qwen-storm.toml), so the
# calibration measures the runs this repository actually makes. The bounds keep their
# defaults (vibey-gh docs/configuration.md#local_models-and-vibey-gh-slots).
[local_models]
# Let the sovereign storm launcher use the highest concurrency this device's
# calibration proves safe for GPT-OSS 20B. Until evidence exists, the slot gate
# conservatively falls back to one run and requests calibration.
concurrent_runs = "measured"
model = "gpt-oss:20b"
context_window = 65536

# The delivery forecast is a repository-owned, append-only projection.  The workflow
# refreshes it on integration changes, issue/PR changes and a schedule; these paths and
# the four phi constants are still keys so another adopter can keep the same calculator
# while choosing a different archive or empirical dilation.
[estimate.forecast]
ledger = ".vibey/delivery-estimates.jsonl"
report = "docs/estimate.md"
billing_ledger = ".vibey/billing-ledger.jsonl"
phi_floor = 0.1
phi_epsilon = 0.01
phi_exponent = 1.0
unknown_factor = 1.0
size_weights = { xs = 0.5, s = 1.0, m = 3.0, l = 6.0, xl = 12.0 }

[pr_automation.fallback]
# Reviews with a local model when the paid path returns NO VERDICT AT ALL. It never
# overrides a review that ran, `trusted_only` keeps fork PRs off the self-hosted runner,
# and the verdict is labelled as the degraded path.
enabled = true
runner_label = "vibey-local-vibey"
# Every CI job on a GitHub-hosted runner (the operator's decision, 2026-10-03): the review
# pulls the model onto a hosted arm runner (4 vCPU, 16 GB; gpt-oss:20b is ~13 GB) instead of
# using the operator's machine, so it no longer waits on a heartbeat. `runner_label` stays
# for the heartbeat tools and any self-hosted fallback the operator declares later.
runs_on = "ubuntu-24.04-arm"
# Deadline rates for that CPU, replacing the M5's 200/20 tokens a second, which would expire
# every large request there. The closest measurement on record is gpt-oss:20b on CPU in
# Docker on the M5 (docs/architecture/evidence/minimum-specs.json): 44.5 tok/s reading,
# 2.94 tok/s generating at 4 threads -- and the hosted runner has 4 vCPUs, slower per core.
# Replace these with what `minimum-specs.yml` measures on the hosted runner itself. A slower
# deadline costs time; one too fast costs the verdict. At 2 tok/s a request that writes the
# whole 16,384-token reasoning reserve takes over two hours.
prompt_tokens_per_second = 40
output_tokens_per_second = 2
trusted_only = true
# Hand the sovereign review the full head text of the files the diff changes, as reference
# only. Measured 2026-10-01: 5 of 5 "blocking" findings checked were false positives about
# unchanged code just outside the diff -- an import a few lines above a hunk, a log line the
# worker already prints -- that the model could not see. The bounds keep their defaults
# (vibey-gh docs/configuration.md, `source_context`).
source_context = true

# Whether the review above catches real defects, measured (`vibey-gh review-canary run`,
# weekly by review-canary.yml on GitHub-hosted runners): 27 planted defects in nine classes and 14
# controls, diffs against this repository's own code, each reviewed through `local-review`
# with every setting above. The 2026-09-30 audit found `think = "low"` passing every pull
# request the gate had blocked, and no study so far carried a known-true defect, so recall
# was never measured. The ledger is append-only; the runbook shows the latest measurement.
#
# The floor is what `vibey-gh review-canary status` holds the latest measurement to, for
# the approver that will lean on a passing review (not wired to approve anything yet):
# - recall's Wilson lower bound >= 0.5 -- 95% confident the review blocks more than half
#   of planted defects for the right reason. A rubber stamp scores 0; with 27 defects it
#   takes 19 caught. A bar this corpus can show, raised once a larger one can show more.
# - the false-positive rate's Wilson upper bound <= 0.5 -- a blocked correct change goes to
#   a human, so this bound is about cost, not safety; it is here so a gate that blocks
#   everything cannot buy its recall that way (14 of 14 blocked fails; 3 of 14 passes).
# - measured within 14 days (a weekly run and one missed week), on the whole corpus, under
#   the settings in force -- a measurement under another model or think level vouches for
#   nothing.
[pr_automation.review_canary]
corpus = "docs/architecture/evidence/review-canary/corpus.toml"
ledger = "docs/architecture/evidence/review-canary/ledger.jsonl"
report = "docs/runbooks/sovereign-review-runner.md"
min_recall_lower_bound = 0.5
max_false_positive_upper_bound = 0.5
max_age_days = 14
# Where it runs (operator, 2026-10-03: every CI workflow on GitHub-hosted runners only):
# review-canary.yml measures on `ubuntu-24.04-arm` (4 vCPU, 16 GB), serving the model on
# CPU, cut into `shards` jobs that `vibey-gh review-canary merge` joins into one ledger line.
# - The deadline rates are that runner's, not the M5's 200/20 the review's deadlines use:
#   gpt-oss:20b read 44.5 tokens/s and generated 2.8 there
#   (docs/architecture/evidence/minimum-specs.json), rounded down as the review's were. They
#   let a hosted review reason as far as the M5's deadline lets the real one; the review's
#   own settings in [pr_automation.fallback] are unchanged.
# - 21 shards leave at most two of the 41 cases to a job. A request's deadline here is at
#   most ~157 minutes (a full 49,152-token prompt at 40/s, then the 16,384-token reasoning
#   reserve at 2/s), so two cases fit the 355-minute job even if both run to it; typically a
#   case takes ~10-30 minutes and a job under an hour.
shards = 21
prompt_tokens_per_second = 40
output_tokens_per_second = 2

# A review that fails on findings is corrected, not left for a person (#1400; the
# operator's choice, 2026-10-03: sovereign gptossloop, not a paid repair). gptossloop on a
# GitHub-hosted runner, with the open-weights model below, edits the branch from the
# review's findings; the patch is published by the guarded repair step, CI and the
# exact-head review run again, and each patch spends one of `max_repair_attempts`. A local
# model's finding can be wrong (the large-diff study measured 11-56% false positives per
# part), so the plan tells the agent to change nothing for a finding it judges wrong and
# say why; a spent budget, or a patch that cannot apply, labels the PR for a person.
[pr_automation.sovereign_repair]
enabled = true
runs_on = "ubuntu-24.04-arm"
models = ["gpt-oss:20b", "qwen3:4b"]
max_turns = 30
timeout_minutes = 150

[runners]
# The machine that serves the sovereign lane above, declared (12.c): `vibey-gh runner install`
# renders its LaunchAgent and supervisor from this table, `runner check` reconciles the host
# against it, and `runner cleanup` unloads agents under the prefix that the tree no longer
# declares. The label is [pr_automation.fallback] runner_label; the credential is the
# runner's own file-based gh login in `gh_config_dir` (default ~/.config/gh-runner). Steps:
# docs/runbooks/sovereign-review-runner.md.
repository = "the-vibey-project/vibey"
# The prefix the operator's existing agents already carry, so an install replaces
# `<prefix>-vibey` in place and cleanup finds the agents of the absorbed repositories.
unit_prefix = "com.adammatthewsteinberger.vibey-runner"
# The interpreter the heartbeat timer runs, and the one its clone's pre-push gate asks for
# the scope decision (ADR-0060): the tool install `uv tool install --force --from . vibey-engine`
# makes, outside every checkout. Declared rather than defaulted so the runbook's
# `uv run vibey-gh runner install` -- whose own interpreter is this checkout's .venv, which
# the timer refuses -- installs the heartbeat with it. Re-run that tool install after pulling
# a vibey-gh change, or `heartbeat status` reports the gate refusing a heartbeat.
heartbeat_python = "~/.local/share/uv/tools/vibey-engine/bin/python"

[issue_automation]
# The issue path's counterpart, sharing the fallback runner and model: an exhausted API
# key degrades to one bounded triage comment instead of silence.
fallback_enabled = true

# The tag every promoted version is published under. Declared rather than defaulted: the
# default is a bare `v`, and this repository absorbed sibling repositories whose own history
# already carries `v0.1.0`, `v0.2.0`, `v0.3.0` and `v0.3.1` tags (ADR-0021). A bare prefix
# would therefore collide with somebody else's release on 0.2.0 and 0.3.0 — and because
# `require_new_version` is false, the collision is SILENT: `github-release` finds the existing
# tag, sees it points somewhere else, and returns without creating anything. The three
# Releases that already exist here are `vibey-v0.1.0` through `vibey-v0.1.2`, so this is the
# convention being restated, not a new one.
[github_release]
tag_prefix = "vibey-v"

[marketplace]
# The one Claude Code marketplace `/plugin marketplace add the-vibey-project/vibey` reads.
# Rendered by `vibey-gh marketplace` from the workspace members' own manifests (ADR-0034);
# `check` reports drift. The name is the root's own — `<plugin>@vibey` — because Claude
# Code registers one marketplace per name per user and the PyPI-packaged vibey-skills
# still ships its manifest as `vibey-skills`.
name = "vibey"
members = ["src/vibey_tools/skills", "src/vibey_tools/gh"]

[documentation]
# Governance in plain sight (sub-doctrine 7.b): the canon is published on every channel site,
# in the book, and linked from every page, from its single source in the absorbed vibey-gh.
governance_source = "src/vibey_tools/gh/docs"
corpus_index = "src/vibey_tools/gh/corpus-index.json"
# The research paper and the architecture pages carry LaTeX; render it on the site.
math = true
# The named author of the published paper, the book and every page's metadata. Unset, the
# exporters fall back to the GitHub owner and the paper's byline reads "the-vibey-project".
author = "Adam Matthew Steinberger"
# The paper's corresponding author, stated in its byline and first-page provenance note
# beside the revision it was rendered from and the time it was rendered.
author_email = "adam@matthewsteinberger.com"
author_affiliation = "The Vibey Project"
# The living-roadmap doctrine (Doctrine 11, src/vibey_tools/gh/docs/doctrines.md) defaults
# require_roadmap to true.
# The operator has twice declined roadmap drafts for this repository and owns the decision on its shape; the check stays off until they write the roadmap they want.
# The exact-head review still judges roadmap liveness on every head.
require_roadmap = false
# The doctrine's end results, published on the docs site itself.
generate_book = true
generate_paper = true

# The full documentation contract is a separate project; off until it is satisfied.
enabled = false
# GA4 measurement id for the published docs site, rendered into release-surfaces.yml as
# GA_ID. Public by nature -- it ships in the page source of every site using it.
google_analytics_id = "G-R673ZXZDFT"
# Consent Mode defaults plus an accept/decline banner while the ID above is set, so no
# analytics cookie is set before the reader accepts. Explicitly on: the default, stated.
cookie_consent = true
# Search Console "HTML file" verification: copied by basename into the Pages root on
# every release-surfaces deploy, so verification survives the rebuild that wipes a
# hand-uploaded file. The committed file is the one Search Console issued.
site_root_files = ["googleebf918639d02415d.html"]
# The words a stranger would search for this project by, not its own vocabulary (sub-doctrine
# 7.d, ADR-0076). They reach every page's keywords and the structured data. Ten, each true of
# the project, and no more: a longer list is keyword stuffing, which 7.d forbids.
keywords = [
  "vibey", "AI coding agents", "agent orchestration", "autonomous software delivery",
  "local LLM", "Ollama", "human in the loop", "append-only ledger", "PostgreSQL job queue",
  "open source",
]

# ---------------------------------------------------------------------------------------
# The operator's grant to a delegated approver (sub-doctrine 12.f, ADR-0049).
#
# 12.f puts the judgement here: the operator exercises it ONCE, by fixing what may be
# approved and what never may, and an approver applies a standard it did not choose and
# cannot alter. This table is that standard. Changing it is changing who may approve, which
# is why `.vibey-gh.toml` appears in its own forbidden list -- the grant may never approve a
# change to the grant.
#
# This table IS the grant (12.c: declared in the repository, reviewed in a pull request):
# `enabled = true` with `live_switch_required = false` turns delegated approval on, as the
# operator asked on 2026-09-29. The repository variable VIBEY_UNATTENDED_APPROVAL keeps the
# one power 12.f says must never need a merge: withdrawal. Unset, or "on", leaves the grant
# standing; any other value withdraws it from that moment, with no merge and no reason:
#
#     gh variable set VIBEY_UNATTENDED_APPROVAL --body off
#
# A variable that cannot be read still refuses -- "not withdrawn" has to be seen.
[unattended_approval]
enabled = true
live_switch_required = false

# The operator chose the widest branch scope, so the two lists below carry the whole bound
# between an approver and any change in the repository. Every forbidden path answers one
# question: could a change here alter WHAT A GATE MEASURES, WHO MAY APPROVE, or WHAT AN
# AGENT MAY DO? Where the answer is yes, it is forbidden, and a change touching one is
# refused WHOLE -- an approver does not approve the safe subset of a pull request.
branches = ["*"]

# Whose pull requests an approver may act on. A branch glob says nothing about who pushed
# to it, so with the widest branch scope above this is the other half of the bound. Of the
# last 200 merged pull requests, 195 were authored by `adammatthewsteinberger` and 5 by
# `app/dependabot`. Dependabot is deliberately left out: a dependency bump landing
# unreviewed overnight is exactly the supply-chain case a human should see. `@codeowners`
# expands to whoever .github/CODEOWNERS names, so this list and the owners of the protected
# paths cannot drift apart by one of them being edited alone.
#
# This is not `[merge_train] trusted_authors` above. That list decides whose pull requests
# the train may merge once every gate is green; this one decides whose work an approver may
# vouch for with no human watching, which is a narrower grant. The bots appear there and not
# here on purpose. Do not merge the lists or derive one from the other.
authors = ["adammatthewsteinberger", "@codeowners"]

# Every deterministic gate must already be green. A delegated approval is added to the
# gates and never substituted for one (12.f).
require_all_gates = true

forbidden_paths = [
  # The governance corpus, and the index that proves it has not been altered.
  "src/vibey_tools/gh/docs/**",
  "src/vibey_tools/gh/corpus-index.json",

  # This grant. An approver may not widen its own mandate.
  ".vibey-gh.toml",

  # What any agent may do, anywhere in the tree.
  ".claude/settings.json",
  ".claude/settings.local.json",
  "**/.claude/settings.json",
  "**/.claude/settings.local.json",

  # The approver's own definition, and every other agent definition.
  ".claude/agents/**",
  "**/.claude/agents/**",

  # The gates as they RUN.
  ".github/**",
  "**/.github/**",

  # The gates as they are WRITTEN. `.github/workflows/**` is generated from these templates,
  # so forbidding only the rendered copy leaves the gate editable through its source -- the
  # same rendering relationship that made the merge-train trigger fix non-autonomous.
  "src/vibey_tools/gh/vibey_gh/templates/**",

  # The machinery that decides what a gate means: what the train requires, what a review
  # must answer, how this very grant is parsed, and what provenance is checked.
  "src/vibey_tools/gh/vibey_gh/merge_train.py",
  "src/vibey_tools/gh/vibey_gh/review_contract.py",
  "src/vibey_tools/gh/vibey_gh/config.py",
  "src/vibey_tools/gh/vibey_gh/fingerprints.py",

  # The approver's own enforcement: everything that can execute when the approver runs
  # `python -m vibey_gh.approval_check` -- the check and the TRANSITIVE closure of the
  # vibey_gh modules it imports, interfaces and package `__init__`s included. A change to
  # any of them could make the check say yes to what this grant refuses, then weaken every
  # check after it. test_approve_check.py computes that closure from the entry point and
  # fails if any module in it is not forbidden here, so this list cannot drift. (config.py,
  # merge_train.py, review_contract.py and fingerprints.py are in the closure too, and are
  # listed above.) `cli.py` is deliberately NOT here: the approver never runs through it,
  # and the closure test also asserts the entry point does not reach it.
  "src/vibey_tools/gh/vibey_gh/__init__.py",
  "src/vibey_tools/gh/vibey_gh/approval_check.py",
  "src/vibey_tools/gh/vibey_gh/automation_bootstrap.py",
  "src/vibey_tools/gh/vibey_gh/debugging.py",
  "src/vibey_tools/gh/vibey_gh/dependabot.py",
  "src/vibey_tools/gh/vibey_gh/estimation.py",
  "src/vibey_tools/gh/vibey_gh/fallback_pin.py",
  "src/vibey_tools/gh/vibey_gh/feasibility.py",
  "src/vibey_tools/gh/vibey_gh/fit.py",
  "src/vibey_tools/gh/vibey_gh/flatten.py",
  "src/vibey_tools/gh/vibey_gh/forge.py",
  "src/vibey_tools/gh/vibey_gh/gh_transport.py",
  "src/vibey_tools/gh/vibey_gh/github_state.py",
  "src/vibey_tools/gh/vibey_gh/install.py",
  "src/vibey_tools/gh/vibey_gh/issue_automation.py",
  "src/vibey_tools/gh/vibey_gh/pr_automation.py",
  "src/vibey_tools/gh/vibey_gh/protected_paths.py",
  "src/vibey_tools/gh/vibey_gh/reconcile.py",
  "src/vibey_tools/gh/vibey_gh/versioning.py",
  "src/vibey_tools/gh/vibey_gh/interfaces/**",

  # The local gates, and the hooks that invoke them.
  ".pre-commit-config.yaml",
  ".githooks/**",
  "**/.githooks/**",

  # Test and coverage configuration. The per-layer 100% floors and pytest's addopts live in
  # pyproject.toml, so a one-line edit there is a gate change wearing a dependency's clothes.
  "pyproject.toml",
  "**/pyproject.toml",
  ".importlinter",

  # The tests that guard the repository's own invariants -- ADR counts, agent-tree parity,
  # the doc meta-tests. A change here changes what "green" means.
  "tests/meta/**",

  # The storm's own tooling decides whether a lane passes at all. An approved change to
  # lane-publish.py alters every future verdict, which is a gate by another name.
  "docs/plans/*/tools/**",

  # The four agent-surface trees. They are instructions to whatever reads them next.
  ".claude/skills/**",
  ".agents/skills/**",
  ".cursor/rules/**",
  ".agent/rules/**",

  # Who must review, wherever GitHub looks for it.
  "CODEOWNERS",
  ".github/CODEOWNERS",
  "docs/CODEOWNERS",

  # What the REVIEW GATE MEASURES (added 2026-10-01, before the approver runs unattended):
  # the sovereign lane's reviewer, how its verdict is composed and recorded, and the
  # heartbeat that decides whether the lane is offered at all. A change here changes the
  # verdict every later approval rests on, so it is a gate by another name.
  "src/vibey_tools/gh/vibey_gh/local_review.py",
  "src/vibey_tools/gh/vibey_gh/review_composition.py",
  "src/vibey_tools/gh/vibey_gh/review_outcome.py",
  "src/vibey_tools/gh/vibey_gh/sovereign_runner.py",
  "src/vibey_tools/gh/vibey_gh/heartbeat_clone.py",
  "src/vibey_tools/gh/vibey_gh/heartbeat_timer.py",

  # WHAT AN AGENT MAY DO: what an engine session or a gate command sees of the worker's
  # environment and credentials (the 2026-09-30 safety scan's top gap), and claudeloop's
  # own permission defaults.
  "src/vibey/infrastructure/process/child_environment.py",
  "src/vibey/infrastructure/engines/engine_environment.py",
  "src/vibey_runners/claude/src/claudeloop/infrastructure/config.py",

  # The non-negotiables the code holds, and the tests that prove them: the ledger's
  # append-only triggers and the credits CHECK live in the migrations; the ledger guard;
  # credits-never-have-a-deadline; the no-loss gate and the brief that must pass it; the
  # spend caps. A green pull request that weakened one of these together with its test is
  # exactly what an unattended approver must never land.
  "src/vibey/infrastructure/db/migrations/**",
  "src/vibey/infrastructure/db/ledger_guard.py",
  "src/vibey/domain/capacity.py",
  "src/vibey/domain/noloss.py",
  "src/vibey/domain/briefing.py",
  "src/vibey/application/budget_source.py",
  "tests/domain/test_capacity.py",
  "tests/domain/test_circuit.py",
  "tests/domain/test_noloss*.py",
  "tests/domain/test_briefing.py",
  "tests/infrastructure/db/test_chaos.py",
  "tests/infrastructure/engines/test_engine_environment.py",
]

# The continuation lane (sub-doctrine 10.l, ADR-0080): the pull requests the weekly lane opens
# from an agent's work, as drafts. The operator asked on 2026-10-05 that another job may approve
# them autonomously, under the operator's authority and inside a bound declared here, not one
# judged at the time (12.f).
#
# What this adds is narrower than the grant above, never wider: `forbidden_paths` is still the
# floor, and author, green gates and the approving account's independence still hold. A lane
# lets the approver approve a DRAFT, and only when every changed file sits in a tier below and
# each tier's own demands are met. Tiers are first-match-wins, so they run from the most
# sensitive path to the least; a file in no tier refuses the whole pull request. A tier's
# `max_files` bounds how much of that kind of path one pull request may change (0 is no
# limit); `paired_tests` says a change there lands only with a test somewhere in the same
# pull request. Withdrawal is the repository variable above: it withdraws this too.
[[unattended_approval.lanes]]
name = "continuation"
branch = "continuation/*"
accept_draft = true

[[unattended_approval.lanes.tiers]]
name = "engine"
paths = ["src/vibey/**", "src/vibey_runners/**"]
max_files = 5
paired_tests = ["tests/**", "src/vibey_runners/*/tests/**"]

[[unattended_approval.lanes.tiers]]
name = "tools"
paths = ["src/vibey_tools/**"]
max_files = 5
paired_tests = ["tests/**", "src/vibey_tools/*/test/**", "src/vibey_tools/*/tests/**"]

[[unattended_approval.lanes.tiers]]
name = "scripts-and-clients"
paths = ["scripts/**", "clients/**"]
max_files = 5
paired_tests = ["tests/**", "clients/**/*test*", "clients/**/*spec*"]

[[unattended_approval.lanes.tiers]]
name = "tests"
paths = ["tests/**"]
max_files = 20

[[unattended_approval.lanes.tiers]]
name = "docs"
paths = ["docs/**", "research/**", "changelog.d/**"]
max_files = 30

# Everything else, last: a root file or a path no tier above names. Three files at most, and a
# test beside them, so a scratch file at the root can never ride through (#1416).
[[unattended_approval.lanes.tiers]]
name = "everything-else"
paths = ["**"]
max_files = 3
paired_tests = ["tests/**", "src/vibey_tools/*/test/**"]

# The operator's standing grant, given 2026-09-30 and ratified by the operator's merge of the
# pull request that carries it (this file is on the approver's forbidden list above, so no
# automation can land or widen it). In the operator's words: "do all of it fully
# autonomously ... moving forward I am only here to keep pushing things along ... if it would
# naturally require human intervention add a toml gate so that the human gate is overridden
# for the sake of science so we can prove that it is possible to fully automate software
# engineering forever."
#
# Agents read this table as the operator's standing instruction; CLAUDE.md, AGENTS.md and
# GEMINI.md point here. It widens what an agent does without checking in. It does not move
# the floor: SD-01 section 6 (no harm, no lawbreaking, no irreversible act without explicit
# human approval) is above every rule below it, and `never` restates where that floor and
# 12.d meet this work. Withdrawing the grant is a one-line change to `standing_grant`.
[autonomy]
standing_grant = true
operator_role = "pushes things along; does not hand-hold"
scope = [
  "build, test, open pull requests and land them through the merge train",
  "replace a step that needs a person with a declared TOML gate, recorded on the ledger",
  "run studies and keep the queue moving without checking in",
]
never = [
  "--admin, --no-verify, force-push, or direct writes to develop/main",
  "approving its own pull request (approval comes from independent gates, 12.f)",
  "an irreversible real-world act without a person (real cloud deploys, paid spend, deleting data)",
  "ratifying a change to the governance corpus (that is the operator's merge, Article II.3)",
]
