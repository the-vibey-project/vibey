# vibey-gh owns provenance and release automation for this repository — the same tooling the
# *loop runners and vibey-skills used as standalone repositories before they were absorbed into
# this workspace (src/vibey_runners/*, src/vibey_tools/*; ADR-0021). The checklist that shaped
# this file is the one those adoptions debugged the hard way.

[fingerprint]
sources = [
  "src/**/*.py",
  "tests/**/*.py",
  "scripts/**/*.py",
  ".github/workflows/*.yml",
]

[version]
files         = ["pyproject.toml", "src/vibey/__init__.py"]
content_paths = ["src/vibey/"]
code_paths    = ["src/vibey/"]

[branches]
integration = "develop"
release     = "main"

[merge_train]
owner           = "adammatthewsteinberger"
trusted_authors = ["adammatthewsteinberger", "claude[bot]", "github-actions[bot]", "vibey[bot]"]

[install]
# This repository vendors the tooling at src/vibey_tools/gh. Declared rather than
# discovered: a workflow that searched the tree for a pyproject declaring
# `name = "vibey-gh"` would read a pull request's own files and install what it found.
self_source = "src/vibey_tools/gh"
# Pin every rendered template to the version that rendered it. Unpinned, a runner adopts
# whatever is newest -- the failure mode that took vibey-skills' CI red for two days.
pin_version = true
# github-release.yml: the immutable tag and GitHub Release for every version promoted to
# main. Releases stopped at v0.1.2 when release-please was retired (#77) and nothing took
# over the tagging; the book and the paper are attached to each Release from here on.
workflows = ["merge-train.yml", "promote-to-main.yml", "provenance.yml", "release-surfaces.yml", "pr-automation.yml", "automation-bootstrap.yml", "github-release.yml"]

# Declared here rather than clicked, per ADR-0018. `vibey-gh` has reconciled both of these
# from configuration since 1.x and vibey-skills has used them for months; this repository,
# which now CONTAINS vibey-gh, had neither -- its branch protection and its profile were
# settings-page state with no history, no review and no way to restore them.
#
# These values are the live configuration as it stood on 2026-09-15, transcribed rather
# than invented. Reconciling them is therefore a no-op; the point is that from here a
# change to them is a pull request.
[repository_profile]
description = "A queue-based, six-phase conductor for autonomous software delivery on top of the *loop runners — spec interview → design → build → review → deploy. PostgreSQL-backed."
topics = [
  "agents", "ai-agents", "autonomous-agents", "claude", "claude-code", "cli",
  "delivery-automation", "devtools", "gemini", "gpt", "llm", "mit-license",
  "orchestration", "postgresql", "python",
]

[rulesets]
enabled = true

# `gates` is the whole 7-gate sweep in one job, which is why one check covers it. Bypass is
# OrganizationAdmin plus RepositoryRole:5 (admin): the merge train needs a seat that can
# land a green PR, and a ruleset the automation cannot satisfy is a ruleset somebody
# switches off.
[rulesets.integration]
required_checks  = ["gates"]
required_approvals = 1
bypass_actors    = ["OrganizationAdmin", "RepositoryRole:5"]

# The queue exists because a green pull request is not a green merge: its checks ran
# against the base as it stood then, and nothing between that base and develop's tip was
# ever built with it. `strict_required_status_checks_policy` already refuses to merge a
# stale branch, so without a queue that proof is bought by hand, one rebase at a time,
# with the base moving underneath -- which is how twelve open pull requests came to have
# ten unmergeable. SQUASH because feature pull requests squash into develop (ADR-0028);
# ALLGREEN because a group that merges on its head alone can land a member that was never
# green. Takes effect when the operator runs `vibey-gh reconcile` (ADR-0036).
[rulesets.integration.merge_queue]
enabled = true

# main additionally pins the lock: every other CI job `needs` the uv-lock job, so a release
# branch that drifts there is a release branch whose gates never ran.
[rulesets.release]
required_checks  = ["gates", "uv.lock is in sync with pyproject.toml"]
required_approvals = 1
bypass_actors    = ["OrganizationAdmin", "RepositoryRole:5"]

# Declared and off, rather than absent. Promotion is one controlled rebase of develop into
# main, so a queue here would batch a group of one and add its wait to every release for
# no proof it does not already have. Written down so the next person sees a decision
# rather than an oversight, and so turning it on is one word. REBASE is the default here
# because that is how promotion merges -- wrong the moment `enabled` flips, if left unsaid.
[rulesets.release.merge_queue]
enabled = false

[pr_automation]
# The review, repair and conflict jobs load this tree's own vibey-skills marketplace, read
# from the trusted default-branch checkout. It used to be cloned from
# github.com/the-vibey-project/vibey-skills, which the monorepo absorption retired; that
# clone 404'd and failed every review with no verdict (ADR-0017: the family's own copy).
plugin_marketplaces = ["src/vibey_tools/skills"]
plugins = [
  "quality-engineering@vibey-skills",
  "security-principles@vibey-skills",
  "engineering-process@vibey-skills",
  "software-architecture@vibey-skills",
]
# This repository's real PR-triggered workflows. The default set names "Docs", which
# nothing here answers to -- a gate waiting on a scan that can never complete never posts.
scan_workflows = ["CI", "Provenance"]

[pr_automation.fallback]
# Reviews with a local model when the paid path returns NO VERDICT AT ALL. It never
# overrides a review that ran, `trusted_only` keeps fork PRs off the self-hosted runner,
# and the verdict is labelled as the degraded path.
enabled = true
runner_label = "vibey-local-vibey"
trusted_only = true

[issue_automation]
# The issue path's counterpart, sharing the fallback runner and model: an exhausted API
# key degrades to one bounded triage comment instead of silence.
fallback_enabled = true

[marketplace]
# The one Claude Code marketplace `/plugin marketplace add the-vibey-project/vibey` reads.
# Rendered by `vibey-gh marketplace` from the workspace members' own manifests (ADR-0034);
# `check` reports drift. The name is the root's own — `<plugin>@vibey` — because Claude
# Code registers one marketplace per name per user and the PyPI-packaged vibey-skills
# still ships its manifest as `vibey-skills`.
name = "vibey"
members = ["src/vibey_tools/skills", "src/vibey_tools/gh"]

[documentation]
# Governance in plain sight (sub-doctrine 7.b): the canon is published on every channel site,
# in the book, and linked from every page, from its single source in the absorbed vibey-gh.
governance_source = "src/vibey_tools/gh/docs"
corpus_index = "src/vibey_tools/gh/corpus-index.json"
# The research paper and the architecture pages carry LaTeX; render it on the site.
math = true
# The named author of the published paper, the book and every page's metadata. Unset, the
# exporters fall back to the GitHub owner and the paper's byline reads "the-vibey-project".
author = "Adam Matthew Steinberger"
# The living-roadmap doctrine (Doctrine 11, src/vibey_tools/gh/docs/doctrines.md) defaults
# require_roadmap to true.
# The operator has twice declined roadmap drafts for this repository and owns the decision on its shape; the check stays off until they write the roadmap they want.
# The exact-head review still judges roadmap liveness on every head.
require_roadmap = false
# The doctrine's end results, published on the docs site itself.
generate_book = true
generate_paper = true

# The full documentation contract is a separate project; off until it is satisfied.
enabled = false
# GA4 measurement id for the published docs site, rendered into release-surfaces.yml as
# GA_ID. Public by nature -- it ships in the page source of every site using it.
google_analytics_id = "G-DMYG7PHCQP"
