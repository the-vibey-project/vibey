site_name: vibey
site_description: >-
  A queue-based, six-phase conductor for autonomous software delivery on top of the *loop
  runners — spec interview, design, build, review, deploy. PostgreSQL-backed.
site_url: https://the-vibey-project.github.io/vibey/
repo_url: https://github.com/the-vibey-project/vibey
repo_name: the-vibey-project/vibey
edit_uri: edit/main/docs/

# ProperDocs, matching the rest of the family. `theme: mkdocs` because ProperDocs ships
# its own theme package; the styling lives in stylesheets/vibey.css.
theme: mkdocs

extra_css:
  - stylesheets/vibey.css
extra_javascript:
  - javascripts/channel.js

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

# docs/plans is working material, not documentation: superseded planning notes whose
# claims drift from the code. Publishing them would present drafts as reference.
exclude_docs: |
  plans/**

# ADRs legitimately reference the excluded plans; those links resolve on GitHub, and
# failing the build over a deliberate exclusion would just re-publish the drafts.
validation:
  omitted_files: ignore
  absolute_links: ignore

nav:
  - Home: index.md
  - Guides:
      - VS Code extension: guides/vscode-extension.md
      - Kubernetes: guides/kubernetes.md
      - Greeter live demo: guides/greeter-live-demo.md
      - Local models on Ollama: guides/local-models-ollama.md
      - Convergence-Driven Development: guides/convergence-driven-development.md
      - What gets published: guides/ledger-publication.md
      - Continuous delivery estimate: guides/delivery-estimate.md
      - Self-hosted sovereign surfaces: guides/self-hosted-surfaces.md
      - The Sabbath: guides/sabbath.md
  - Current estimate: estimate.md
