#
# The recorded exceptions to "no in-process test waits on the real clock for more than 0.05s"
# (tests/meta/test_no_real_sleeps_in_process.py). Each entry is the `time.sleep(<literal>)` and
# `asyncio.sleep(<literal>)` calls in one scope, keyed `"file::enclosing function"` (module level:
# `file::<module>`), with a `count` and the reason the wait is real. Keying by function means an
# edit above a sleep disturbs nothing. Counts can only fall: lower or delete an entry in the same
# change that removes a sleep, because a recorded count above what is there fails the guard.
#
# Measured 2026-11-11 by AST walk, after the sleeps over one second that sat in-process beside a
# code seam were injected (tests/cli/test_driver_cli.py now moves the driver clock;
# tests/application/test_bounded_preflight.py waits on an Event that never fires; and
# tests/cli/test_early_signals.py waits on the drain Event instead of a fixed 0.1s). The textual
# `sleep(` hits are mostly subprocess script text (inside string literals, which an AST walk
# never sees), fake-clock calls and waits of 0.05s or less.
#
# Remaining by directory: infrastructure 11, meta 5, cli 3, system 3 (total 22).

