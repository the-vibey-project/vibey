#
# The recorded exceptions to "no in-process test waits on the real clock for more than 0.05s"
# (tests/meta/test_no_real_sleeps_in_process.py). Each entry is a `time.sleep(<literal>)` or
# `asyncio.sleep(<literal>)` call keyed `"file:line"` with the reason the wait is real. The list
# can only shrink: delete an entry in the same change that removes its sleep, because a stale or
# moved entry fails the guard (and so does editing a file above a recorded line, which moves it).
#
# Measured 2026-11-11 by AST walk, after the sleeps over one second that sat in-process beside a
# code seam were injected (tests/cli/test_driver_cli.py now moves the driver clock;
# tests/application/test_bounded_preflight.py waits on an Event that never fires). The textual
# `sleep(` hits are mostly subprocess script text (inside string literals, which an AST walk
# never sees), fake-clock calls and waits of 0.05s or less.
#
# Remaining by directory: infrastructure 11, meta 5, cli 4, system 3 (total 23).

