# Time limit for every job outside ci.yml, and the ratchet on the ones still without one.
# Checked in both directions by tests/meta/test_every_workflow_job_has_a_timeout.py: a limit
# listed here that the workflow does not carry fails, and so does a listed job that no longer
# exists. ci.yml has its own file, tests/meta/ci_job_limits.toml, and its own test.
#
# THE RULE (the same as ci_job_limits.toml)
#   limit = roundup5(max(2 x p90 minutes of the job's SLOWEST matrix cell, 10))
#   never below 15 for a job that runs a real build or test suite, and never within 50% of the
#   observed maximum. Where a job's own design waits longer than anything in the sample (a poll
#   for an index or a Release), the limit clears the designed worst case, and says so.
#   A job with no history is basis = "unmeasured" at 30 (default_timeout_minutes). Seven jobs
#   below are in that state: four that only run git and gh calls (30), and three that hand a
#   task to a model agent with --max-turns 80 to 120 (120, the allowance the repository's own
#   pr_af.timeout_minutes gives its model review: 30 could kill a healthy agent run).
#
# THE MEASUREMENT
#   Per-job durations are completed_at - started_at (queue wait excluded, because it does not
#   count toward a timeout), read with GET-only `gh api` calls on 2026-11-16: for each workflow,
#   the 20 most recent completed runs (fewer exist for minimum-specs, review-canary and
#   autonomy-scorecard: 6, 6 and 5), every job in them that concluded success or failure. `n`
#   below is the number of samples of the job; it is below 20 for a job that only runs on some
#   branches or events. With n under 10 the p90 is, in effect, the maximum. Failed runs are
#   included, none ran longer than the passing ones. Minutes are rounded to two decimals.
#   scripts/ci_cost_baseline.py reports wall time per workflow, not per job, so it could not
#   set these; the read was a throwaway script, not committed.
#
#   The managed workflows (the 29 jobs rendered from src/vibey_tools/gh/vibey_gh/templates/
#   workflows/) were read the same way, also on 2026-11-16, in a second pass. For the nine
#   workflows below the 20 newest runs hold every job at least 17 times and are used as they
#   are: branch-health, changelog, conventional-commits, merge-train, promote-to-main,
#   provenance, repository-profile, ruleset-drift, skip-markers. For pr-review, pr-evaluate,
#   release-surfaces and github-release most jobs run on only some events, so the read is the
#   300 most recent runs (since 2026-10-05, 2026-10-23 for pr-review, 2026-11-03 for pr-evaluate).
#   automation-bootstrap has no run at all, ever. Where a job is in the sample under a matrix
#   or a branch name ("GitHub Package (develop)", "(main)") the slowest cell is the one listed.
#   Failed runs are included here too, and one job's failures ran LONGER than its passes:
#   pr-review.yml.review-sovereign (see its entry).
#
# THE CEILING
#   `ceiling` is the count of jobs still without a limit. It is 0: the hand-written workflows
#   carry theirs in the file, and the managed ones carry theirs in the template they are rendered
#   from (src/vibey_tools/gh/vibey_gh/templates/workflows/, then `vibey-gh install` in the
#   repository root and in src/vibey_tools/gh). A job that is a reusable-workflow call (`uses:`
#   at job level) is exempt.
#
# Each entry: timeout_minutes (what the workflow must say) and basis (measured | unmeasured |
# kept), with the evidence beside it.

# Used for a job that has no entry. A floor for a future job, not a limit anything relies on.
default_timeout_minutes = 30

# Jobs still without a limit.
ceiling = 0

