[jobs."pr-review.yml.review-sovereign"]
# n=124 p90=160.52 max=162.12 (300 runs), "Sovereign diff review". 2 x p90 = 321.0, so 325; 325
# is 2.0 x the maximum. A model job, and the slow one: its passes take 2 to 3 minutes, and its
# failures ran 160 minutes (the step "Review with the local model", 2h38m on one job, ending in
# `local-review` exit 1: the model busy, then the retry). So p90 is the failures' time, by
# design: the lane waits up to slot_wait_seconds (900) for the model, runs each of up to
# max_chunks (6) parts under a deadline scaled to its size (about 20 minutes at the default
# window), and retries a busy model once. A healthy 6-part review is about 2 hours, a busy-model
# chain about 5, and 325 clears both while still ending a job the runner would otherwise hold
# for GitHub's 360. A limit lower than 245 (1.5 x max) would cut reviews that already finish.
timeout_minutes = 325
basis = "measured"

