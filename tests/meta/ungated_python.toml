#
# Tracked Python that is not both ruff-checked (as `ruff check --show-files .` lists it) and
# mypy-checked, by prefix, and why
# (tests/meta/test_every_python_file_is_gated.py). The list can only shrink: a prefix that matches
# no tracked file, or only files that are now gated, fails; CEILING, a constant in the census
# test (not here, so this file cannot move its own limit), must equal the number of entries.
# Bringing a tree under a gate (add it to `[[tool.vibey.static_gates]]` or to a tenant's `static`
# command in .github/ci-matrices.toml) removes its entry in the same change.
#
# A prefix ends in `/` or is exactly one tracked file; a reason is at least 20 characters. A new
# directory under `tests/` fails the census until it is written down here.
#
# Measured 2026-11-12 against ruff's own file list: 1248 tracked files fell outside every gate.

