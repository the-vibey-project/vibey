# Source: vibey/templates/worker.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibey-vibey-worker
  labels:
    app.kubernetes.io/name: vibey
    app.kubernetes.io/instance: vibey
    app.kubernetes.io/version: "0.1.2"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: vibey-0.3.0
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vibey
      app.kubernetes.io/instance: vibey
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vibey
        app.kubernetes.io/instance: vibey
        app.kubernetes.io/version: "0.1.2"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: vibey-0.3.0
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: vibey-vibey
      # Long enough for an engine session to finish its current turn.
      # Cutting a session mid-turn is not merely wasteful: the work is
      # already paid for, and the ledger would carry a turn with no
      # verdict.
      terminationGracePeriodSeconds: 7200
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      initContainers:
        # The `migrate` init container (or, on a single-DSN install, the
        # worker itself) applies migrations at startup, but it cannot
        # do that against a database that is not accepting connections
        # yet. Waiting here keeps the failure mode "pod pending" rather
        # than "CrashLoopBackOff with a stack trace".
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h vibey-vibey-postgres -U vibey -d vibey; do
                echo "waiting for postgres..."
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
        - name: migrate
          image: "vibey:dev"
          imagePullPolicy: Never
          args: ["migrate"]
          env:
            - name: VIBEY_PG_MIGRATE_URL
              valueFrom:
                secretKeyRef:
                  name: vibey-vibey-dsn
                  key: migrate-dsn
            - name: VIBEY_PG_URL
              valueFrom:
                secretKeyRef:
                  name: vibey-vibey-dsn
                  key: dsn
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
      containers:
        - name: worker
          image: "vibey:dev"
          imagePullPolicy: Never
          args:
            - worker
            - --provider
            - "scripted"
            - -j
            - "2"
            # A worker that exits when no project exists restart-loops
            # until a human creates one, and the crash counter makes a
            # healthy deployment look broken.
            - --wait-for-project
            - "15"
          env:
            - name: VIBEY_PG_URL
              valueFrom:
                secretKeyRef:
                  name: vibey-vibey-dsn
                  key: dsn
          volumeMounts:
            - name: worktrees
              mountPath: /work
          workingDir: /work
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: worktrees
          persistentVolumeClaim:
            claimName: vibey-vibey-worktrees

---
# Source: vibey/templates/postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vibey-vibey-postgres
  labels:
    app.kubernetes.io/name: vibey
    app.kubernetes.io/instance: vibey
    app.kubernetes.io/version: "0.1.2"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: vibey-0.3.0
spec:
  serviceName: vibey-vibey-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vibey
      app.kubernetes.io/instance: vibey
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vibey
        app.kubernetes.io/instance: vibey
        app.kubernetes.io/version: "0.1.2"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: vibey-0.3.0
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          # scram-sha-256 and nothing else (sub-doctrine 10.j, ADR-0061): the rules
          # come from the declared file above, and every password is stored as a
          # SCRAM verifier.
          args:
            - "-c"
            - "hba_file=/etc/postgresql/vibey/pg_hba.conf"
            - "-c"
            - "password_encryption=scram-sha-256"
          ports:
            - containerPort: 5432
              name: postgres
          env:
            # A fresh data directory's own pg_hba.conf says the same, so nothing
            # it holds would admit anyone another way.
            - name: POSTGRES_INITDB_ARGS
              value: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
            - name: POSTGRES_HOST_AUTH_METHOD
              value: scram-sha-256
            - name: POSTGRES_DB
              value: vibey
            - name: POSTGRES_USER
              value: vibey
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vibey-vibey-dsn
                  key: password
            - name: VIBEY_DB_PASSWORD_PLANE
              valueFrom:
                secretKeyRef:
                  name: vibey-vibey-dsn
                  key: db-password-plane
            - name: VIBEY_DB_PASSWORD_INFISICAL
              valueFrom:
                secretKeyRef:
                  name: vibey-vibey-dsn
                  key: db-password-infisical
            # The default mount point is the volume root; initdb refuses a
            # non-empty directory, and a PVC arrives with lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: hba
              mountPath: /etc/postgresql/vibey
              readOnly: true
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          # Every start, not only the first: an install from before each surface had a
          # role of its own gets them here (ADR-0055). The container is not Running,
          # and so not Ready, until this returns.
          lifecycle:
            postStart:
              exec:
                command: ["sh", "/docker-entrypoint-initdb.d/01-init-additional-databases.sh", "--wait"]
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "vibey", "-d", "vibey"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "vibey", "-d", "vibey"]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: hba
          configMap:
            name: vibey-vibey-postgres-hba
        - name: init-scripts
          configMap:
            name: vibey-vibey-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi
