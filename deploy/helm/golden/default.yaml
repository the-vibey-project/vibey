# Source: vibey/templates/postgres.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: vibey-vibey-postgres-init
  labels:
    app.kubernetes.io/name: vibey
    app.kubernetes.io/instance: vibey
    app.kubernetes.io/version: "0.1.2"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: vibey-0.3.0
data:
  01-init-additional-databases.sh: |
    #!/bin/sh
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        SELECT 'CREATE DATABASE plane' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'plane')\gexec
        GRANT ALL PRIVILEGES ON DATABASE plane TO $POSTGRES_USER;
    EOSQL
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        SELECT 'CREATE DATABASE infisical' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'infisical')\gexec
        GRANT ALL PRIVILEGES ON DATABASE infisical TO $POSTGRES_USER;
    EOSQL

