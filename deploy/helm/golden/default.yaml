# Source: vibey/templates/docs.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibey-vibey-bookstack
  labels:
    app.kubernetes.io/name: vibey
    app.kubernetes.io/instance: vibey
    app.kubernetes.io/version: "0.1.2"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: vibey-0.3.0
    app.kubernetes.io/component: bookstack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vibey
      app.kubernetes.io/instance: vibey
      app.kubernetes.io/component: bookstack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vibey
        app.kubernetes.io/instance: vibey
        app.kubernetes.io/version: "0.1.2"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: vibey-0.3.0
        app.kubernetes.io/component: bookstack
    spec:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      containers:
        - name: bookstack
          image: linuxserver/bookstack:latest@sha256:189c796273469115cf810e53f450e15b93184018e4728cd65fcaef8aa93584bc
          env:
            # Without it the image's init prints "The application key is
            # missing, halting init!" and never starts nginx on :80.
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: vibey-vibey-bookstack-secret
                  key: app-key
            - name: DB_HOST
              value: "vibey-vibey-bookstack-mariadb:3306"
            - name: DB_DATABASE
              value: bookstack
            - name: DB_USERNAME
              value: bookstack
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vibey-vibey-bookstack-secret
                  key: db-password
            - name: APP_URL
              value: "http://vibey-vibey-bookstack:80"
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 20
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 20
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: vibey-vibey-bookstack-data

