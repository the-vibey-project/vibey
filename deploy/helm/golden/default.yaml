# Source: vibey/templates/docs.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibey-vibey-bookstack-mariadb
  labels:
    app.kubernetes.io/name: vibey
    app.kubernetes.io/instance: vibey
    app.kubernetes.io/version: "0.1.2"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: vibey-0.3.0
    app.kubernetes.io/component: bookstack-mariadb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vibey
      app.kubernetes.io/instance: vibey
      app.kubernetes.io/component: bookstack-mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vibey
        app.kubernetes.io/instance: vibey
        app.kubernetes.io/version: "0.1.2"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: vibey-0.3.0
        app.kubernetes.io/component: bookstack-mariadb
    spec:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      containers:
        - name: mariadb
          image: linuxserver/mariadb:latest@sha256:75ffa39d652653e73848328a667d169a20a1e084fd51a66c4be3eb754a2492c9
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vibey-vibey-bookstack-secret
                  key: db-root-password
            - name: MYSQL_DATABASE
              value: bookstack
            - name: MYSQL_USER
              value: bookstack
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vibey-vibey-bookstack-secret
                  key: db-password
          ports:
            - containerPort: 3306
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 10
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: vibey-vibey-bookstack-mariadb-data

