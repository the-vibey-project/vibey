# Source: vibey/templates/postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vibey-vibey-postgres
  labels:
    app.kubernetes.io/name: vibey
    app.kubernetes.io/instance: vibey
    app.kubernetes.io/version: "0.1.2"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: vibey-0.3.0
spec:
  serviceName: vibey-vibey-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vibey
      app.kubernetes.io/instance: vibey
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vibey
        app.kubernetes.io/instance: vibey
        app.kubernetes.io/version: "0.1.2"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: vibey-0.3.0
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: vibey
            - name: POSTGRES_USER
              value: vibey
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vibey-vibey-dsn
                  key: password
            # The default mount point is the volume root; initdb refuses a
            # non-empty directory, and a PVC arrives with lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "vibey", "-d", "vibey"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "vibey", "-d", "vibey"]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: init-scripts
          configMap:
            name: vibey-vibey-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi

