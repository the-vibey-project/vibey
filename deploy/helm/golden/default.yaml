apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibey-vibey-synapse
  labels:
    app.kubernetes.io/name: vibey
    app.kubernetes.io/instance: vibey
    app.kubernetes.io/version: "0.1.2"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: vibey-0.3.0
    app.kubernetes.io/component: synapse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vibey
      app.kubernetes.io/instance: vibey
      app.kubernetes.io/component: synapse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vibey
        app.kubernetes.io/instance: vibey
        app.kubernetes.io/version: "0.1.2"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: vibey-0.3.0
        app.kubernetes.io/component: synapse
    spec:
      initContainers:
        - name: init-synapse
          image: matrixdotorg/synapse:latest@sha256:7155ddc4835e5b8afa4e1598d92aa16ff1d03109f7d1cff61d493237d1210b1d
          command:
            - sh
            - -c
            - |
              if [ ! -f /data/homeserver.yaml ]; then
                # --open-private-ports: the generated listener otherwise binds
                # only ::1/127.0.0.1, which the kubelet's probes (and the
                # Service) cannot reach -- the pod runs but is never Ready.
                python -m synapse.app.homeserver \
                  --server-name cluster.local \
                  --report-stats no \
                  --config-path /data/homeserver.yaml \
                  --data-dir /data \
                  --open-private-ports \
                  --generate-config
                sed -i 's|filename: /homeserver.log|filename: /data/homeserver.log|' /data/*.log.config 2>/dev/null || true
                sed -i 's/handlers: \[buffer\]/handlers: [console]/' /data/*.log.config 2>/dev/null || true
                echo "registration_shared_secret: \"synapse-registration-shared-secret\"" >> /data/homeserver.yaml
                echo "enable_registration: true" >> /data/homeserver.yaml
                echo "enable_registration_without_verification: true" >> /data/homeserver.yaml
                chmod -R 777 /data
              fi
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: synapse
          image: matrixdotorg/synapse:latest@sha256:7155ddc4835e5b8afa4e1598d92aa16ff1d03109f7d1cff61d493237d1210b1d
          ports:
            - containerPort: 8008
          readinessProbe:
            tcpSocket:
              port: 8008
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 8008
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 10
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vibey-vibey-synapse-data

