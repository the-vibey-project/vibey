apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibey-vibey-plane-api
  labels:
    app.kubernetes.io/name: vibey
    app.kubernetes.io/instance: vibey
    app.kubernetes.io/version: "0.1.2"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: vibey-0.3.0
    app.kubernetes.io/component: plane-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vibey
      app.kubernetes.io/instance: vibey
      app.kubernetes.io/component: plane-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vibey
        app.kubernetes.io/instance: vibey
        app.kubernetes.io/version: "0.1.2"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: vibey-0.3.0
        app.kubernetes.io/component: plane-api
    spec:
      initContainers:
        # The API entrypoint's register_instance enqueues a Celery task on
        # every start, under `set -e`: an unreachable broker is exit 1, not a
        # retry. Waiting here keeps the failure mode "pod pending" rather than
        # "CrashLoopBackOff with a stack trace", and keeps kubelet backoff from
        # pushing the first Ready past the Deployment's progress deadline.
        - name: wait-for-broker
          image: makeplane/plane-backend:latest@sha256:a8b3ee5ad6a4f3d952d4537f679f5a684f6e54b0868f30db097ce8722676251f
          command:
            - python
            - -c
            - |
              import os, socket, time, urllib.parse
              url = urllib.parse.urlparse(os.environ["AMQP_URL"])
              while True:
                  try:
                      socket.create_connection((url.hostname, url.port or 5672), timeout=2).close()
                      break
                  except OSError:
                      print("waiting for broker...", flush=True)
                      time.sleep(2)
          env:
            - name: AMQP_URL
              valueFrom:
                secretKeyRef:
                  name: vibey-vibey-plane-secret
                  key: amqp-url
      containers:
        - name: plane-api
          image: makeplane/plane-backend:latest@sha256:a8b3ee5ad6a4f3d952d4537f679f5a684f6e54b0868f30db097ce8722676251f
          command: ["./bin/docker-entrypoint-api.sh"]
          env:
            - name: GUNICORN_WORKERS
              value: "1"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: vibey-vibey-plane-secret
                  key: secret-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vibey-vibey-plane-secret
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: vibey-vibey-plane-secret
                  key: redis-url
            - name: AMQP_URL
              valueFrom:
                secretKeyRef:
                  name: vibey-vibey-plane-secret
                  key: amqp-url
            - name: WEB_URL
              value: "http://vibey-vibey-plane-web:80"
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 10
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi

