          image: postgres:17-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h vibey-vibey-postgres -U vibey -d vibey; do
                echo "waiting for postgres..."
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
        - name: migrate
          image: "vibey:dev"
          imagePullPolicy: Never
          args: ["migrate"]
          env:
            - name: VIBEY_PG_MIGRATE_URL
              valueFrom:
