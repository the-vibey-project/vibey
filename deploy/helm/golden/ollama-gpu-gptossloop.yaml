apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibey-vibey-worker
  labels:
    app.kubernetes.io/name: vibey
    app.kubernetes.io/instance: vibey
    app.kubernetes.io/version: "0.1.2"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: vibey-0.3.0
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vibey
      app.kubernetes.io/instance: vibey
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vibey
        app.kubernetes.io/instance: vibey
        app.kubernetes.io/version: "0.1.2"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: vibey-0.3.0
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: vibey-vibey
      # Long enough for an engine session to finish its current turn.
      # Cutting a session mid-turn is not merely wasteful: the work is
      # already paid for, and the ledger would carry a turn with no
      # verdict.
      terminationGracePeriodSeconds: 7200
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      initContainers:
        # The `migrate` init container (or, on a single-DSN install, the
        # worker itself) applies migrations at startup, but it cannot
        # do that against a database that is not accepting connections
        # yet. Waiting here keeps the failure mode "pod pending" rather
        # than "CrashLoopBackOff with a stack trace".
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h vibey-vibey-postgres -U vibey -d vibey; do
                echo "waiting for postgres..."
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
        - name: migrate
          image: "vibey:dev"
          imagePullPolicy: Never
          args: ["migrate"]
          env:
            - name: VIBEY_PG_MIGRATE_URL
              valueFrom:
                secretKeyRef:
                  name: vibey-vibey-dsn
                  key: migrate-dsn
            - name: VIBEY_PG_URL
              valueFrom:
                secretKeyRef:
                  name: vibey-vibey-dsn
                  key: dsn
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
      containers:
        - name: worker
          image: "vibey:dev"
          imagePullPolicy: Never
          args:
            - worker
            - --provider
            - "gptossloop"
            - --engines
            - "gptossloop,qwenloop"
            - -j
            - "2"
            # A worker that exits when no project exists restart-loops
            # until a human creates one, and the crash counter makes a
            # healthy deployment look broken.
            - --wait-for-project
            - "15"
          env:
            - name: VIBEY_PG_URL
              valueFrom:
                secretKeyRef:
                  name: vibey-vibey-dsn
                  key: dsn
            # vibey's own sovereign providers want the server root.
            - name: VIBEY_OLLAMA_URL
              value: "http://vibey-vibey-ollama.vibey.svc.cluster.local:11434"
            - name: VIBEY_OLLAMA_MODEL
              value: "gpt-oss:20b"
            # gptossloop, the sovereign default engine and on without a switch
            # (ADR-0062): its openai-compat backend wants the OpenAI base URL, /v1
            # included; a base URL alone is what makes `auto` select it.
            - name: GPTOSSLOOP_BASE_URL
              value: "http://vibey-vibey-ollama.vibey.svc.cluster.local:11434/v1"
            - name: GPTOSSLOOP_MODEL
              value: "gpt-oss:20b"
            # qwenloop, the same runner on a Qwen model, opt-in (ADR-0062). The
            # one qwenloop switch that reaches a worker (ADR-0015): a project's
            # [features] table never makes it into the record.
            - name: QWENLOOP_BASE_URL
              value: "http://vibey-vibey-ollama.vibey.svc.cluster.local:11434/v1"
            - name: QWENLOOP_MODEL
              value: "qwen3:14b"
            - name: VIBEY_FEATURE_QWENLOOP
