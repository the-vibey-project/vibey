# Source: vibey/templates/ollama.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibey-vibey-ollama
  labels:
    app.kubernetes.io/name: vibey
    app.kubernetes.io/instance: vibey
    app.kubernetes.io/version: "0.1.2"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: vibey-0.3.0
    app.kubernetes.io/component: ollama
spec:
  # One server per release. The weights volume is ReadWriteOnce, so a
  # second replica could not mount it on another node, and a rolling update
  # would deadlock with the new pod waiting on the old pod's volume --
  # hence Recreate.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vibey
      app.kubernetes.io/instance: vibey
      app.kubernetes.io/component: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vibey
        app.kubernetes.io/instance: vibey
        app.kubernetes.io/version: "0.1.2"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: vibey-0.3.0
        app.kubernetes.io/component: ollama
    spec:
      # Not the chart-wide podSecurityContext. The ollama image runs as root
      # by default and writes its key pair and weights under $HOME/.ollama;
      # these values run it as a non-root uid instead, with HOME and the
      # model store both pointed at the volume below so that uid can write
      # them. Kept separate so a cluster that needs the image's own root
      # default can restore it here without loosening the worker.
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: ollama
          image: "ollama/ollama:0.34.2@sha256:da6e0dc5651df159e45686fd663c4dbe1624a52c44d7280eeac1551d8f865532"
          imagePullPolicy: IfNotPresent
          ports:
            # The image binds 0.0.0.0:11434 (its OLLAMA_HOST); the Service
            # port is what clients use and is configured separately.
            - containerPort: 11434
              name: http
          env:
            - name: HOME
              value: /ollama
            - name: OLLAMA_MODELS
              value: /ollama/models
            # qwenloop runs a 32K context. Ollama's own default window is a
            # fraction of that and truncates longer prompts without saying so.
            - name: OLLAMA_CONTEXT_LENGTH
              value: "32768"
          volumeMounts:
            - name: data
              mountPath: /ollama
          # /api/version answers without touching a model, so neither probe
          # loads gigabytes of weights or waits behind a running generation.
          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
          resources:
            limits:
              memory: 24Gi
              nvidia.com/gpu: 1
            requests:
              cpu: "2"
              memory: 16Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vibey-vibey-ollama


