            - name: VIBEY_TRACKER_URL
              value: "http://vibey-vibey-plane-api.vibey.svc.cluster.local:8000"
            - name: VIBEY_TRACKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vibey-vibey-plane-token
                  key: token
                  optional: true
            - name: VIBEY_TRACKER_WORKSPACE_SLUG
              value: "vibey"
            - name: VIBEY_TRACKER_PROJECT_ID
