# Source: vibey/templates/ollama.yaml
apiVersion: batch/v1
kind: Job
metadata:
  # Named after its own pod template (see vibey.ollamaPullTemplate), and
  # truncated so the hash always survives inside the 63-character limit.
  name: vibey-vibey-ollama-pull-8975829cb8
  labels:
    app.kubernetes.io/name: vibey
    app.kubernetes.io/instance: vibey
    app.kubernetes.io/version: "0.1.2"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: vibey-0.3.0
    app.kubernetes.io/component: ollama-pull
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vibey
        app.kubernetes.io/instance: vibey
        app.kubernetes.io/component: ollama-pull
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: pull
          image: "ollama/ollama:0.34.2@sha256:da6e0dc5651df159e45686fd663c4dbe1624a52c44d7280eeac1551d8f865532"
          imagePullPolicy: IfNotPresent
          # The ollama image has no curl. Its own CLI is the client instead:
          # `ollama pull` POSTs /api/pull to the server named by OLLAMA_HOST and
          # streams progress, and the weights land on the server's volume, not
          # here. The model reaches the shell as an environment variable, never
          # spliced into the script, so a value cannot become a command.
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              # The Job and the server start together. A pull against a server
              # that is not listening yet is an attempt burned for nothing.
              until ollama list >/dev/null 2>&1; do
                echo "waiting for ollama at $OLLAMA_HOST"
                sleep 5
              done
              ollama pull "$OLLAMA_PULL_MODEL"
              # qwenloop's Qwen model, beside the default (ADR-0062).
              exec ollama pull "$OLLAMA_PULL_QWEN_MODEL"
          env:
            - name: OLLAMA_HOST
              value: "http://vibey-vibey-ollama.vibey.svc.cluster.local:11434"
            - name: OLLAMA_PULL_MODEL
              value: "gpt-oss:20b"
            - name: OLLAMA_PULL_QWEN_MODEL
              value: "qwen3:14b"
            # The client never needs a home of its own; point it somewhere a
            # non-root uid can write rather than at an unwritable "/".
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi


