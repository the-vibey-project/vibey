  # Disabled by default; when enabled, manifests are rendered for UI surfaces.
  enabled: false
  ingressClassName: ""
  issuer: ""

backup:
  # Upstream integration for Velero BackupStorageLocation and Schedule.
  # Disabled by default; points to in-cluster Garage S3 when enabled.
  enabled: false
  schedule: "0 2 * * *"
