        tag: "4.14.2"
        digest: "sha256:8e4fed8ed79cf6d7903e0c2538d4c422b79cc8537798420a23518dcc79156821"
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi

  # 13. Forge: Gitea
  gitea:
    enabled: true
    image:
      repository: gitea/gitea
      tag: latest
      digest: "sha256:87a67ee09d3ae0d1df5fda5dcda3e2a1f9236a45b0a59025d6e00e46adc43bef"
