# Default values target a local minikube install with an in-cluster
# PostgreSQL. There are no per-cloud presets yet: for a managed database
# set postgres.enabled=false and dsn.existingSecret. Nothing here assumes
# a managed service.

image:
  repository: vibey
  tag: dev
  # Never for a locally-built image: minikube's daemon already has it, and
  # Always would send kubelet hunting a registry that has never seen it.
  pullPolicy: Never

worker:
  replicas: 1
  # Engine sessions run for minutes to hours. Scale-in must not sever one
  # mid-turn: the pod stops claiming immediately, then drains.
  terminationGracePeriodSeconds: 7200
  parallelism: 2
  # DESIGN/decompose provider: scripted, claudeloop, or qwenloop. qwenloop
  # is the sovereign path; with ollama.enabled it talks to the in-cluster
  # server below.
  provider: scripted
  # Comma-separated engine allow-list (--engines); empty means all. Naming
  # qwenloop needs the qwenloop feature switched on (ollama.qwenloopFeature,
  # or VIBEY_FEATURE_QWENLOOP in extraEnv).
  engines: ""
  # A worker without --project silently binds to whichever project was
  # created last; in a cluster that is a footgun, so the chart requires it
  # to be set explicitly.
  project: ""
  # Poll instead of exiting when no project exists yet. A Deployment is
  # long-lived: exiting is a restart loop, not a useful error.
  waitForProjectSeconds: 15
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  worktrees:
    size: 5Gi
    storageClass: ""
  # The queue reaper (ADR-0056). The worker runs it when idle, at most once per
  # intervalSeconds: expired leases are requeued, or parked with a gate once their
  # attempts are spent; ready work nobody takes is surfaced; on the broker, vibey's
  # policy is reconciled onto the queues it owns and each dead letter on one becomes
  # a parked job. Rendered into VIBEY_QUEUE_REAP_*; see [queue.reap] in
  # docs/reference/configuration.md for what each key means.
  queueReap:
    enabled: true
    intervalSeconds: 60
    leaseGraceSeconds: 0
    staleReadySeconds: 900
    deadLetterMinDepth: 1
    deadLetterPeekLimit: 100
    ownedQueuePattern: "^vibey\\."
    deadLetterQueuePattern: "(\\.dlq|\\.dead)$"
    policyName: vibey-reap
    policyPriority: 0
    # At least the longest job lease (two hours for BUILD), with room.
    consumerTimeoutSeconds: 21600
    deliveryLimit: 20
  # Additional environment for the worker container, as Kubernetes EnvVar
  # objects -- for instance VIBEY_OLLAMA_TIMEOUT, VIBEY_EVIDENCE_DIR, or an
  # external Ollama endpoint when ollama.enabled is false. Appended after
  # everything the chart sets itself.
  extraEnv: []

postgres:
  # Toggle off and point dsn.existingSecret at a managed instance
  # (CloudNativePG, RDS, Cloud SQL, Azure Flexible Server).
  enabled: true
  image: postgres:17-alpine
  database: vibey
  # The owner (ADR-0055): the server's bootstrap role, which runs migrations and
  # owns every table. Its DSN reaches only the `migrate` init container.
  user: vibey
  # Dev-only default; cloud presets require existingSecret instead.
  password: vibey
  # The application role: what the worker, the operator and the KEDA scaler
  # connect as. It can read and append to the ledger and nothing more, and owns
  # nothing. `vibey migrate` creates it on first use and grants it exactly the
  # declared privileges on every rollout.
  appRole:
    name: vibey_app
    # Dev-only default; cloud presets require existingSecret instead.
    password: vibey_app
  storage: 8Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  additionalDatabases:
    - plane
    - infisical

# Suffix for fully-qualified in-cluster DNS names. Only ever needs
# changing on a cluster built with a non-default domain (kubeadm's
# --service-dns-domain); the DSN is qualified with it so readers outside
# this namespace -- KEDA's operator, notably -- can resolve Postgres.
clusterDomain: cluster.local

dsn:
  # When set, this Secret's keys supply the DSNs and the built-in postgres
  # block is ignored.
  existingSecret: ""
  # The application role's DSN: VIBEY_PG_URL for every workload.
  existingSecretKey: dsn
  # The owner's DSN: VIBEY_PG_MIGRATE_URL, for the `migrate` init container
  # only. Empty makes a single-DSN install, where the worker migrates as the one
  # role and `vibey doctor` fails the ledger-guard check until the roles are
  # split (docs/reference/configuration.md#database-roles).
  existingSecretMigrateKey: migrate-dsn

engineAuth:
  # Interactive subscription login does not exist in a cluster, so engines
  # authenticate by API key. Keys are read from a Secret, never values in
  # this file.
  existingSecret: ""
  keys: []
  # - name: ANTHROPIC_API_KEY
  #   key: anthropic

operator:
  # The kopf operator reconciling VibeyProject custom resources. Off by
  # default: it is a cluster-scoped controller, and a chart that installs
  # one without being asked is a surprise.
  enabled: false
  # Leave empty to watch cluster-wide.
  watchNamespace: ""
  # The CRD is a cluster-scoped object shared by every release. Turn this
  # off when a second release installs into the same cluster, or when the
  # CRD is applied out-of-band by whoever owns cluster-level resources.
  installCRD: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

ollama:
  # An in-cluster Ollama server for the sovereign path (sub-doctrine 8.a,
  # ADR-0015, ADR-0027). When enabled, the chart runs it with a volume for
  # its weights, pulls `model` onto that volume with a Job, and points the
  # worker at it: VIBEY_OLLAMA_URL/VIBEY_OLLAMA_MODEL for vibey's own
  # sovereign providers, QWENLOOP_BASE_URL/QWENLOOP_MODEL for qwenloop's
  # OpenAI-compatible backend. Off by default: a 20B model wants a node with
  # the memory (and ideally the GPU) to hold it, and a default install
  # should not assume one.
  enabled: false
  image:
    repository: ollama/ollama
    # Pinned twice over: the tag is for the reader, the digest (the
    # multi-arch index, amd64 + arm64) is what is actually pulled. Bump
    # both together; an empty digest falls back to the tag alone.
    tag: "0.34.2"
    digest: "sha256:da6e0dc5651df159e45686fd663c4dbe1624a52c44d7280eeac1551d8f865532"
    pullPolicy: IfNotPresent
  # The model the pull Job fetches and the worker is told to use: this era's
  # default free model (sub-doctrine 8.d), GPT-OSS 20B -- the one vibey and
  # qwenloop already default to, so a stock worker and a stock qwenloop agree
  # without further configuration.
  model: gpt-oss:20b
  # OLLAMA_CONTEXT_LENGTH. qwenloop runs a 32K context and Ollama's default
  # window is far smaller; empty leaves Ollama's own default in place.
  contextLength: 32768
  service:
    port: 11434
  storage:
    # gpt-oss:20b is 13.8 GB on disk (MXFP4); this leaves room for a second model.
    size: 30Gi
    storageClass: ""
  # gpt-oss:20b at a 32K context: its weights plus KV cache. Measured 13.1 GB
  # resident on 2026-09-22 (Ollama, even at its full 131K window: its
  # sliding-window layers keep the cache small). Lower these only together
  # with a smaller model or context.
  resources:
    requests:
      cpu: "2"
      memory: 16Gi
    limits:
      memory: 24Gi
  gpu:
    # Adds `<resourceName>: <count>` to the container's limits. Pair it with
    # nodeSelector/tolerations for the GPU pool, and runtimeClassName where
    # the cluster needs one (e.g. "nvidia").
    enabled: false
    resourceName: nvidia.com/gpu
    count: 1
  runtimeClassName: ""
  # Additional server environment as EnvVar objects, e.g. OLLAMA_NUM_PARALLEL
  # or OLLAMA_KEEP_ALIVE.
  extraEnv: []
  # Its own security context, not the chart-wide one below. The image runs
  # as root by default; the chart runs it as uid 10001 instead, with HOME
  # and OLLAMA_MODELS on the weights volume so that uid can write there.
  # Setting runAsUser 0 and runAsNonRoot false restores the image default
  # here without loosening the worker.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: ["ALL"]
  pull:
    # A Job that waits for the server, then `ollama pull`s `model` onto its
    # volume. Idempotent: layers already on the volume are not fetched again.
    enabled: true
    backoffLimit: 6
    # Ceiling for waiting plus downloading; null removes it.
    activeDeadlineSeconds: 3600
    # null keeps the finished Job (and its log) until the next upgrade.
    ttlSecondsAfterFinished: null
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
  # Also switch on the qwenloop feature in the worker
  # (VIBEY_FEATURE_QWENLOOP=1, ADR-0015): qwenloop becomes the BUILD
  # standby and `worker.engines: qwenloop` is accepted. false runs Ollama
  # for vibey's sovereign DESIGN provider only.
  qwenloopFeature: true
  nodeSelector: {}
  tolerations: []
  affinity: {}

keda:
  # Off by default: KEDA is a cluster-wide operator that may not be
  # installed. The ScaledObject is inert without it.
  enabled: false
  minReplicas: 0
  maxReplicas: 4
  pollingInterval: 15
  cooldownPeriod: 300

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}

surfaces:
  # Master toggle for all 18 sovereign operational surfaces (ADR-0042, ADR-0043).
  # Enabled by default: all operational dependencies run in-cluster on sovereign defaults.
  enabled: true

  # 1. Tracker: Plane
  plane:
    enabled: true
    backend:
      image:
        repository: makeplane/plane-backend
        tag: latest
        digest: "sha256:a8b3ee5ad6a4f3d952d4537f679f5a684f6e54b0868f30db097ce8722676251f"
    frontend:
      image:
        repository: makeplane/plane-frontend
        tag: latest
        digest: "sha256:30734d16d457d2e2f942debeba0bb4721ff70388f970257cfd7f11e02082aaa5"
    workspaceSlug: "vibey"
    projectId: "00000000-0000-0000-0000-000000000000"
    secretKey: "plane-insecure-secret-key-change-in-prod"
    # Celery broker for the API, worker and beat. Empty means the in-cluster
    # RabbitMQ (surfaces.rabbitmq); set it to use an external broker. The API
    # enqueues a task on every start, so Plane cannot run without one.
    amqpUrl: ""
    storage:
      size: 5Gi
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

  # 2. Docs: BookStack + MariaDB
  bookstack:
    enabled: true
    # Laravel APP_KEY: "base64:" + 32 random bytes. BookStack halts init
    # without one. Dev-only default (it decodes to its own warning); override
    # it for any real install -- generate one with
    # `docker run --rm --entrypoint /bin/bash lscr.io/linuxserver/bookstack appkey`.
    appKey: "base64:dmliZXktYm9va3N0YWNrLWluc2VjdXJlLWRldi1rZXk="
    image:
      repository: linuxserver/bookstack
      tag: latest
      digest: "sha256:189c796273469115cf810e53f450e15b93184018e4728cd65fcaef8aa93584bc"
    mariadb:
      image:
        repository: linuxserver/mariadb
        tag: latest
        digest: "sha256:75ffa39d652653e73848328a667d169a20a1e084fd51a66c4be3eb754a2492c9"
      database: bookstack
      user: bookstack
      password: bookstackpassword
      rootPassword: mariadbrootpassword
      storage:
        size: 5Gi
        storageClass: ""
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    appUrl: ""
    bookId: 1
    storage:
      size: 5Gi
      storageClass: ""
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

  # 3. Secrets: OpenBao
  openbao:
    enabled: true
    image:
      repository: openbao/openbao
      tag: latest
      digest: "sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641"
    rootToken: "root"
    storage:
      size: 2Gi
      storageClass: ""
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

  # 4. Files: Nextcloud
  nextcloud:
    enabled: true
    image:
      repository: nextcloud
      tag: latest
      digest: "sha256:1468bb3c8bdcfb2d301cc885daa36ead108c0589984991320c5fb66754fbfba6"
    adminUser: admin
    adminPassword: adminpassword
    storage:
      size: 10Gi
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

  # 5. Email: Postfix
  postfix:
    enabled: true
    image:
      repository: boky/postfix
      tag: latest
      digest: "sha256:aafc772384232497bed875e1eb66b4d3e54ba1ebc86e2e185a6dc1dbc48182ef"
    username: vibey
    password: postfixpassword
    domain: cluster.local
    storage:
      size: 2Gi
      storageClass: ""
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

  # 6. SMS: Kannel (AMD64 only)
  kannel:
    enabled: true
    image:
      repository: cyrenity/kannel
      tag: 1.4.5-alpine
      digest: "sha256:d1cbb3fc4f2f2bdd424721d2d3dad16f4dc1bbe204ade9bb39bb7d4ea667225d"
    username: kannel
    password: kannelpassword
    adminPassword: adminsecret
    sender: "vibey"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

  # 7. Messaging: Synapse
  synapse:
    enabled: true
    image:
      repository: matrixdotorg/synapse
      tag: latest
      digest: "sha256:7155ddc4835e5b8afa4e1598d92aa16ff1d03109f7d1cff61d493237d1210b1d"
    serverName: cluster.local
    reportStats: "no"
    registrationSharedSecret: "synapse-registration-shared-secret"
    adminToken: "synapse-admin-access-token"
    roomId: "!general:cluster.local"
    storage:
      size: 5Gi
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

  # 8. ConfigStore: Infisical
  infisical:
    enabled: true
    image:
      repository: infisical/infisical
      tag: latest
      digest: "sha256:3365445909bebd6fa36b5ddba3262da47384652f893585a7b39a8d5ba2681827"
    encryptionKey: "0123456789abcdef0123456789abcdef"
    authSecret: "infisical-auth-secret-key-32chars"
    projectId: "vibey"
    environment: "dev"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

  # 9. Cache: Redis
  redis:
    enabled: true
    image:
      repository: redis
      tag: 8-alpine
      digest: "sha256:ba6e394f6acc2a695ef1b6944f161b9ca813711739be68319fa0db3470673f1d"
    storage:
      size: 2Gi
      storageClass: ""
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

  # 10. Bus: RabbitMQ
  rabbitmq:
    enabled: true
    image:
      repository: rabbitmq
      tag: 4-management-alpine
      digest: "sha256:b839b492a91788a1d9406ef3ec0e1d8a8448032c48148a54a9e0c68ed66cde9b"
    username: vibey
    password: rabbitmqpassword
    # How long any consumer on this broker -- vibey's or Plane's Celery workers -- may
    # hold an unacknowledged delivery before the broker closes its channel and
    # requeues everything on it (ADR-0056, condition (a)). Declared here rather than
    # left to the image's default, and set to that default (30 minutes) so Plane keeps
    # the behaviour it was built against. vibey's own queues get their own, longer
    # bound through the reaper's policy (worker.queueReap.consumerTimeoutSeconds).
    consumerTimeoutMs: 1800000
    storage:
      size: 2Gi
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi

  # 11. Blob: Garage (S3 API)
  garage:
    enabled: true
    image:
      repository: dxflrs/garage
      tag: 58c21846ae80f27ecce9dd0af2ed964e964e9db0
      digest: "sha256:c483e2d04c21224456358aeb0a9cbf6859b0d2fafe24d6214c5b80658a840579"
    accessKey: "GK000000000000000000000000"
    secretKey: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    region: "us-east-1"
    rpcSecret: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    storage:
      metaSize: 2Gi
      dataSize: 10Gi
      storageClass: ""
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

  # 12. SIEM: Wazuh (AMD64 only)
  wazuh:
    enabled: true
    manager:
      image:
        repository: wazuh/wazuh-manager
        tag: "4.14.2"
        digest: "sha256:c5b9d21e82c26494ec48505fdc033cdd79eb76cf5b230de736c7dcbe42f1b01a"
      storage:
        size: 5Gi
        storageClass: ""
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    indexer:
      image:
        repository: wazuh/wazuh-indexer
        tag: "4.14.2"
        digest: "sha256:da4ec16be8dde44c14313db24d534479694533cdd0a36a527a9f3e5779d70db3"
      storage:
        size: 5Gi
        storageClass: ""
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 1Gi
    dashboard:
      image:
