# Default values target a local minikube install with an in-cluster
# PostgreSQL. There are no per-cloud presets yet: for a managed database
# set postgres.enabled=false and dsn.existingSecret. Nothing here assumes
# a managed service.

image:
  repository: vibey
  tag: dev
  # Never for a locally-built image: minikube's daemon already has it, and
  # Always would send kubelet hunting a registry that has never seen it.
  pullPolicy: Never

worker:
  replicas: 1
  # Engine sessions run for minutes to hours. Scale-in must not sever one
  # mid-turn: the pod stops claiming immediately, then drains.
  terminationGracePeriodSeconds: 7200
  parallelism: 2
  provider: scripted
  engines: ""
  # A worker without --project silently binds to whichever project was
  # created last; in a cluster that is a footgun, so the chart requires it
  # to be set explicitly.
  project: ""
  # Poll instead of exiting when no project exists yet. A Deployment is
  # long-lived: exiting is a restart loop, not a useful error.
  waitForProjectSeconds: 15
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  worktrees:
    size: 5Gi
    storageClass: ""

postgres:
  # Toggle off and point dsn.existingSecret at a managed instance
  # (CloudNativePG, RDS, Cloud SQL, Azure Flexible Server).
  enabled: true
  image: postgres:17-alpine
  database: vibey
  user: vibey
  # Dev-only default; cloud presets require existingSecret instead.
  password: vibey
  storage: 8Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

# Suffix for fully-qualified in-cluster DNS names. Only ever needs
# changing on a cluster built with a non-default domain (kubeadm's
# --service-dns-domain); the DSN is qualified with it so readers outside
# this namespace -- KEDA's operator, notably -- can resolve Postgres.
clusterDomain: cluster.local

dsn:
  # When set, this Secret's key supplies VIBEY_PG_URL and the built-in
  # postgres block is ignored.
  existingSecret: ""
  existingSecretKey: dsn

engineAuth:
  # Interactive subscription login does not exist in a cluster, so engines
  # authenticate by API key. Keys are read from a Secret, never values in
  # this file.
  existingSecret: ""
  keys: []
  # - name: ANTHROPIC_API_KEY
  #   key: anthropic

operator:
  # The kopf operator reconciling VibeyProject custom resources. Off by
  # default: it is a cluster-scoped controller, and a chart that installs
  # one without being asked is a surprise.
  enabled: false
  # Leave empty to watch cluster-wide.
  watchNamespace: ""
  # The CRD is a cluster-scoped object shared by every release. Turn this
  # off when a second release installs into the same cluster, or when the
  # CRD is applied out-of-band by whoever owns cluster-level resources.
  installCRD: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

keda:
  # Off by default: KEDA is a cluster-wide operator that may not be
  # installed. The ScaledObject is inert without it.
  enabled: false
  minReplicas: 0
  maxReplicas: 4
  pollingInterval: 15
  cooldownPeriod: 300

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
