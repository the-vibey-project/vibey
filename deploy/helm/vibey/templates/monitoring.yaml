{{- if and .Values.surfaces.enabled .Values.surfaces.monitoring.enabled }}
{{- $fullName := include "vibey.fullname" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-prometheus-config
  labels: {{- include "vibey.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-grafana-datasources
  labels: {{- include "vibey.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://{{ $fullName }}-prometheus:9090
        isDefault: true
      - name: Loki
        type: loki
        access: proxy
        url: http://{{ $fullName }}-loki:3100
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullName }}-prometheus-data
  labels: {{- include "vibey.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.surfaces.monitoring.prometheus.storage.storageClass }}
  storageClassName: {{ .Values.surfaces.monitoring.prometheus.storage.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.surfaces.monitoring.prometheus.storage.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullName }}-grafana-data
  labels: {{- include "vibey.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.surfaces.monitoring.grafana.storage.storageClass }}
  storageClassName: {{ .Values.surfaces.monitoring.grafana.storage.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.surfaces.monitoring.grafana.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-prometheus
  labels: {{- include "vibey.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "vibey.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-grafana
  labels: {{- include "vibey.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "vibey.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-prometheus
  labels: {{- include "vibey.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "vibey.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels: {{- include "vibey.labels" . | nindent 8 }}
        app.kubernetes.io/component: prometheus
    spec:
      containers:
        - name: prometheus
          image: {{ include "vibey.image" .Values.surfaces.monitoring.prometheus.image }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - containerPort: 9090
          readinessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 20
            periodSeconds: 20
          resources: {{- toYaml .Values.surfaces.monitoring.prometheus.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: {{ $fullName }}-prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ $fullName }}-prometheus-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-grafana
  labels: {{- include "vibey.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "vibey.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels: {{- include "vibey.labels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
    spec:
      containers:
        - name: grafana
          image: {{ include "vibey.image" .Values.surfaces.monitoring.grafana.image }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.surfaces.monitoring.grafana.adminUser | quote }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.surfaces.monitoring.grafana.adminPassword | quote }}
          ports:
            - containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources: {{- toYaml .Values.surfaces.monitoring.grafana.resources | nindent 12 }}
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap:
            name: {{ $fullName }}-grafana-datasources
        - name: data
          persistentVolumeClaim:
            claimName: {{ $fullName }}-grafana-data
---
apiVersion: vibey.dev/v1alpha1
kind: VibeySurface
metadata:
  name: {{ $fullName }}-monitoring
  labels: {{- include "vibey.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
spec:
  surface: monitoring
  components:
    - deployment: {{ $fullName }}-prometheus
    - deployment: {{ $fullName }}-grafana
{{- end }}
