{{- if or .Values.operator.enabled (and .Values.surfaces .Values.surfaces.enabled) }}
{{- if .Values.operator.installCRD }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vibeysurfaces.vibey.dev
  labels: {{- include "vibey.labels" . | nindent 4 }}
  annotations:
    # Keep the CRD when the release goes: custom resources outlive the
    # operator that reconciles them, and deleting the definition deletes
    # every VibeySurface with it.
    "helm.sh/resource-policy": keep
spec:
  group: vibey.dev
  scope: Namespaced
  names:
    kind: VibeySurface
    listKind: VibeySurfaceList
    plural: vibeysurfaces
    singular: vibeysurface
    shortNames: [vs]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Surface
          type: string
          jsonPath: .status.surface
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [components]
              properties:
                surface:
                  type: string
                  description: Canonical surface name (e.g. tracker, docs, secrets).
                components:
                  type: array
                  description: Deployments observed to evaluate surface health.
                  items:
                    type: object
                    required: [deployment]
                    properties:
                      deployment:
                        type: string
                        description: Name of the Deployment in the same namespace.
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                surface:
                  type: string
                components:
                  type: array
                  items:
                    type: object
                    properties:
                      deployment:
                        type: string
                      available:
                        type: integer
                      desired:
                        type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
{{- end }}
{{- end }}
