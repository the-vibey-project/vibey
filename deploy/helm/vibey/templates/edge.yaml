{{- if .Values.edge.enabled }}
{{- $fullName := include "vibey.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-edge
  labels: {{- include "vibey.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.edge.issuer }}
    cert-manager.io/cluster-issuer: {{ .Values.edge.issuer | quote }}
    {{- end }}
spec:
  {{- if .Values.edge.ingressClassName }}
  ingressClassName: {{ .Values.edge.ingressClassName }}
  {{- end }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-plane-web
                port:
                  number: 80
{{- end }}
