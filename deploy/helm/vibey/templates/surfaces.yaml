{{- /* -------------------------------------------------------------------------- */}}
{{- /* 11. Loki (Logs)                                                            */}}
{{- /* -------------------------------------------------------------------------- */}}
{{- if .Values.surfaces.loki.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-loki-config
  labels: {{- include "vibey.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
data:
  local-config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2020-10-24
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullName }}-loki-data
  labels: {{- include "vibey.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.surfaces.loki.storage.storageClass }}
  storageClassName: {{ .Values.surfaces.loki.storage.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.surfaces.loki.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-loki
  labels: {{- include "vibey.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3100
      targetPort: 3100
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "vibey.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: loki
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-loki
  labels: {{- include "vibey.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "vibey.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: loki
  template:
    metadata:
      labels: {{- include "vibey.labels" . | nindent 8 }}
        app.kubernetes.io/component: loki
    spec:
      containers:
        - name: loki
          image: {{ include "vibey.image" .Values.surfaces.loki.image }}
          args:
            - -config.file=/etc/loki/local-config.yaml
          ports:
            - containerPort: 3100
          readinessProbe:
            tcpSocket:
              port: 3100
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3100
            initialDelaySeconds: 20
            periodSeconds: 20
          resources: {{- toYaml .Values.surfaces.loki.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/loki/local-config.yaml
              subPath: local-config.yaml
            - name: data
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: {{ $fullName }}-loki-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ $fullName }}-loki-data
---
apiVersion: vibey.dev/v1alpha1
kind: VibeySurface
metadata:
  name: {{ $fullName }}-logs
  labels: {{- include "vibey.labels" . | nindent 4 }}
    app.kubernetes.io/component: logs
spec:
  surface: logs
  components:
    - deployment: {{ $fullName }}-loki
---
{{- end }}

