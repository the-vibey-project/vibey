{{- /* -------------------------------------------------------------------------- */}}
{{- /* 10. Keycloak (Identity)                                                    */}}
{{- /* -------------------------------------------------------------------------- */}}
{{- if .Values.surfaces.keycloak.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-keycloak
  labels: {{- include "vibey.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
type: Opaque
stringData:
  admin-user: {{ .Values.surfaces.keycloak.adminUser }}
  admin-password: {{ .Values.surfaces.keycloak.adminPassword }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-keycloak
  labels: {{- include "vibey.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "vibey.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: keycloak
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-keycloak
  labels: {{- include "vibey.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "vibey.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: keycloak
  template:
    metadata:
      labels: {{- include "vibey.labels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak
    spec:
      containers:
        - name: keycloak
          image: {{ include "vibey.image" .Values.surfaces.keycloak.image }}
          args:
            - start-dev
            - --http-port=8080
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}-keycloak
                  key: admin-user
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}-keycloak
                  key: admin-password
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources: {{- toYaml .Values.surfaces.keycloak.resources | nindent 12 }}
