{{- $fullName := include "vibey.fullname" . }}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vibey.serviceAccountName" . }}
  labels: {{- include "vibey.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-worker
  labels:
    {{- include "vibey.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "vibey.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "vibey.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "vibey.serviceAccountName" . }}
      # Long enough for an engine session to finish its current turn.
      # Cutting a session mid-turn is not merely wasteful: the work is
      # already paid for, and the ledger would carry a turn with no
      # verdict.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- $migrate := include "vibey.migrateInitContainer" . }}
      {{- if or .Values.postgres.enabled $migrate }}
      initContainers:
      {{- if .Values.postgres.enabled }}
        # The `migrate` init container (or, on a single-DSN install, the
        # worker itself) applies migrations at startup, but it cannot
        # do that against a database that is not accepting connections
        # yet. Waiting here keeps the failure mode "pod pending" rather
        # than "CrashLoopBackOff with a stack trace".
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ $fullName }}-postgres -U {{ .Values.postgres.user }} -d {{ .Values.postgres.database }}; do
                echo "waiting for postgres..."
                sleep 2
              done
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
      {{- end }}
      {{- with $migrate }}
      {{- . | trim | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - worker
            {{- if .Values.worker.project }}
            {{- /* Validates the value; the KEDA scaler interpolates it into SQL. */}}
            {{- $_ := include "vibey.workerProjectHex" . }}
            - --project
            - {{ .Values.worker.project | quote }}
            {{- end }}
            - --provider
            - {{ .Values.worker.provider | quote }}
            {{- if .Values.worker.engines }}
            - --engines
            - {{ .Values.worker.engines | quote }}
            {{- end }}
            - -j
            - {{ .Values.worker.parallelism | quote }}
            {{- if .Values.worker.waitForProjectSeconds }}
            # A worker that exits when no project exists restart-loops
            # until a human creates one, and the crash counter makes a
            # healthy deployment look broken.
            - --wait-for-project
            - {{ .Values.worker.waitForProjectSeconds | quote }}
            {{- end }}
          env:
            - name: VIBEY_PG_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "vibey.dsnSecretName" . }}
                  key: {{ include "vibey.dsnSecretKey" . }}
            {{- range .Values.engineAuth.keys }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.engineAuth.existingSecret }}
                  key: {{ .key }}
            {{- end }}
            {{- if .Values.ollama.enabled }}
            {{- $ollamaURL := include "vibey.ollamaURL" . }}
            # vibey's own sovereign providers want the server root.
            - name: VIBEY_OLLAMA_URL
              value: {{ $ollamaURL | quote }}
            - name: VIBEY_OLLAMA_MODEL
              value: {{ .Values.ollama.model | quote }}
            # qwenloop's openai-compat backend wants the OpenAI base URL, /v1
            # included; a base URL alone is what makes `auto` select it.
            - name: QWENLOOP_BASE_URL
              value: {{ printf "%s/v1" $ollamaURL | quote }}
            - name: QWENLOOP_MODEL
              value: {{ .Values.ollama.model | quote }}
            {{- if .Values.ollama.qwenloopFeature }}
            # The one qwenloop switch that reaches a worker (ADR-0015): a
            # project's [features] table never makes it into the record.
            - name: VIBEY_FEATURE_QWENLOOP
              value: "1"
            {{- end }}
            {{- end }}
            {{- if and .Values.surfaces .Values.surfaces.enabled }}
            {{- if .Values.surfaces.plane.enabled }}
            - name: VIBEY_TRACKER_URL
              value: {{ include "vibey.surfaceURL" (dict "root" . "name" "plane-api" "port" 8000) | quote }}
            - name: VIBEY_TRACKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}-plane-token
                  key: token
                  optional: true
            - name: VIBEY_TRACKER_WORKSPACE_SLUG
              value: {{ .Values.surfaces.plane.workspaceSlug | quote }}
            - name: VIBEY_TRACKER_PROJECT_ID
              value: {{ .Values.surfaces.plane.projectId | quote }}
            {{- end }}
            {{- if .Values.surfaces.bookstack.enabled }}
            - name: VIBEY_DOCS_URL
              value: {{ include "vibey.surfaceURL" (dict "root" . "name" "bookstack" "port" 80) | quote }}
            - name: VIBEY_DOCS_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}-bookstack-token
                  key: token-id
                  optional: true
            - name: VIBEY_DOCS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}-bookstack-token
                  key: token-secret
                  optional: true
            - name: VIBEY_DOCS_BOOK_ID
              value: {{ .Values.surfaces.bookstack.bookId | quote }}
            {{- end }}
            {{- if .Values.surfaces.openbao.enabled }}
            - name: VIBEY_SECRETS_URL
              value: {{ include "vibey.surfaceURL" (dict "root" . "name" "openbao" "port" 8200) | quote }}
            - name: VIBEY_SECRETS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}-openbao
                  key: root-token
            {{- end }}
            {{- if .Values.surfaces.nextcloud.enabled }}
            - name: VIBEY_FILES_URL
              value: {{ include "vibey.surfaceURL" (dict "root" . "name" "nextcloud" "port" 80) | quote }}
            - name: VIBEY_FILES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}-nextcloud
                  key: username
            - name: VIBEY_FILES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}-nextcloud
                  key: password
            {{- end }}
            {{- if .Values.surfaces.postfix.enabled }}
            - name: VIBEY_EMAIL_SMTP_HOST
              value: {{ printf "%s-postfix.%s.svc.%s" $fullName .Release.Namespace .Values.clusterDomain | quote }}
            - name: VIBEY_EMAIL_SMTP_PORT
              value: "587"
            - name: VIBEY_EMAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}-postfix
                  key: username
            - name: VIBEY_EMAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}-postfix
                  key: password
            - name: VIBEY_EMAIL_FROM
              value: {{ printf "vibey@%s" .Values.surfaces.postfix.domain | quote }}
            {{- end }}
            {{- if .Values.surfaces.kannel.enabled }}
            - name: VIBEY_SMS_URL
              value: {{ printf "%s/cgi-bin/sendsms" (include "vibey.surfaceURL" (dict "root" . "name" "kannel" "port" 13013)) | quote }}
            - name: VIBEY_SMS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}-kannel
                  key: username
            - name: VIBEY_SMS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}-kannel
                  key: password
            - name: VIBEY_SMS_SENDER
              value: {{ .Values.surfaces.kannel.sender | quote }}
            {{- end }}
            {{- if .Values.surfaces.synapse.enabled }}
            - name: VIBEY_MESSAGING_URL
              value: {{ include "vibey.surfaceURL" (dict "root" . "name" "synapse" "port" 8008) | quote }}
            - name: VIBEY_MESSAGING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}-synapse
                  key: access-token
            - name: VIBEY_MESSAGING_ROOM_ID
              value: {{ .Values.surfaces.synapse.roomId | quote }}
            {{- end }}
            {{- if .Values.surfaces.infisical.enabled }}
            - name: VIBEY_CONFIG_STORE_URL
              value: {{ include "vibey.surfaceURL" (dict "root" . "name" "infisical" "port" 8080) | quote }}
            - name: VIBEY_CONFIG_STORE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}-infisical-token
                  key: machine-token
                  optional: true
            - name: VIBEY_CONFIG_STORE_PROJECT_ID
              value: {{ .Values.surfaces.infisical.projectId | quote }}
            - name: VIBEY_CONFIG_STORE_ENVIRONMENT
              value: {{ .Values.surfaces.infisical.environment | quote }}
            {{- end }}
            {{- if .Values.surfaces.redis.enabled }}
            - name: VIBEY_CACHE_URL
              value: {{ printf "redis://%s-redis.%s.svc.%s:6379/0" $fullName .Release.Namespace .Values.clusterDomain | quote }}
            {{- end }}
            {{- if .Values.surfaces.rabbitmq.enabled }}
            - name: VIBEY_BUS_URL
              value: {{ include "vibey.surfaceURL" (dict "root" . "name" "rabbitmq" "port" 15672) | quote }}
            - name: VIBEY_BUS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}-rabbitmq
                  key: username
            - name: VIBEY_BUS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}-rabbitmq
                  key: password
            {{- end }}
            {{- if .Values.surfaces.garage.enabled }}
            - name: VIBEY_BLOB_URL
              value: {{ include "vibey.surfaceURL" (dict "root" . "name" "garage" "port" 3900) | quote }}
            - name: VIBEY_BLOB_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}-garage
                  key: access-key
            - name: VIBEY_BLOB_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}-garage
                  key: secret-key
            - name: VIBEY_BLOB_REGION
              value: {{ .Values.surfaces.garage.region | quote }}
            {{- end }}
            {{- if .Values.surfaces.wazuh.enabled }}
            - name: VIBEY_SIEM_URL
              value: {{ include "vibey.surfaceURL" (dict "root" . "name" "wazuh-indexer" "port" 9200) | quote }}
            - name: VIBEY_SIEM_INDEX
              value: "vibey-audit"
            {{- end }}
            {{- end }}
            {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: worktrees
              mountPath: /work
          workingDir: /work
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        - name: worktrees
          persistentVolumeClaim:
            claimName: {{ $fullName }}-worktrees
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullName }}-worktrees
  labels: {{- include "vibey.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.worker.worktrees.storageClass }}
  storageClassName: {{ .Values.worker.worktrees.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.worker.worktrees.size }}
